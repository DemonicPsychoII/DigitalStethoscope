# Debug profile: build-firmware.ps1 -Profile debug merges this file over prj.conf.
# Release builds and CI use prj.conf alone.

# Runtime filters start at INF by default, so LOG_DBG output stays hidden even
# when a module compiles it in. Start at DBG so boot-time debug messages appear.
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4

# Source-level stepping in GDB and Zephyr thread awareness in OpenOCD.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# Find faults close to their cause.
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y

# Execution cycles per thread in the shell command "kernel thread list".
CONFIG_THREAD_RUNTIME_STATS=y
