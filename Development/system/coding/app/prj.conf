# Flash image size and octal PSRAM for the ESP32-S3 N16R8 module.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Serial Zephyr shell with help and completion; disable credential history and raw memory access.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HISTORY=n
CONFIG_DEVMEM_SHELL=n

# Kernel and device shell commands for inspecting threads and hardware.
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Wi-Fi driver and network management for station and hotspot operations.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

# IPv4 sockets, TCP and UDP; DHCP client for the station and DHCP server for the phone.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Place Wi-Fi allocation buffers in PSRAM to reserve internal RAM for audio.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# Keep direct network shell commands disabled so they cannot bypass application ownership.
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n

# Flash partitions, Zephyr Memory Storage and settings for persistent named records.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=n

# Deferred Zephyr logging through the shell, with runtime filtering and printk capture.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

# Thread names, monitoring and initialized stacks for kernel-shell stack inspection.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
