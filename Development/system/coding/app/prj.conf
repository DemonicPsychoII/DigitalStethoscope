# Flash image size and octal PSRAM for the ESP32-S3 N16R8 module.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Serial Zephyr shell with help and completion; disable credential history and raw memory access.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HISTORY=n
CONFIG_DEVMEM_SHELL=n

# Kernel and device shell commands for inspecting threads and hardware.
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Wi-Fi driver and network management for station and hotspot operations.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

# IPv4 sockets, TCP and UDP; DHCP client for the station and DHCP server for the phone.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Place Wi-Fi allocation buffers in PSRAM to reserve internal RAM for audio.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# Keep direct network shell commands disabled so they cannot bypass application ownership.
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n

# Flash partitions, Zephyr Memory Storage and settings for persistent named records.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=n

# HTTP/1.1 setup server with bounded client buffers, connections and idle lifetime.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=5

# Network connection pools and poll descriptors for HTTP clients and both DHCP roles.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_ZVFS_POLL_MAX=12

# Deferred Zephyr logging through the shell, with runtime filtering and printk capture.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

# Thread names, monitoring and initialized stacks for kernel-shell stack inspection.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# SNTP client with uncertainty reporting for time synchronization over Wi-Fi.
CONFIG_SNTP=y
CONFIG_SNTP_UNCERTAINTY=y
# DNS resolver for the time server name; DHCPv4 supplies the DNS server.
CONFIG_DNS_RESOLVER=y
# Lets the SNTP request's send time out, so cancellation stays within its bound.
CONFIG_NET_CONTEXT_SNDTIMEO=y

# TLS 1.3 client for the provisioned server (design/COMMUNICATION/secure-transport.md). mbedTLS runs
# over a non-blocking TCP socket, because Zephyr's TLS sockets block the whole handshake.
# Heap and record sizes are proposed values pending target measurement (TICKET-213).
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=8192
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_PSA_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
# RSA server certificates, such as the local HAPI deployment's: RSA-PSS in TLS 1.3, PKCS#1 v1.5 certificate signatures.
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# mbedTLS 4 lists RSA certificate OIDs only with RSA key-pair support, which key import selects.
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_ALG_RSA_OAEP=y
CONFIG_MBEDTLS_X509_RSASSA_PSS_SUPPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y

# Keep internal RAM for audio: the mbedTLS heap lives in PSRAM, next to the Wi-Fi buffers; large
# network buffers use EXT_RAM_BSS_ATTR. Thread stacks stay internal, because flash writes disable
# the PSRAM cache.
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
