# N16R8 module: flash image header and octal PSRAM driver match the overlay.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Serial diagnostics and the transport for future application commands.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# Provisioning commands can contain credentials; do not retain command history.
CONFIG_SHELL_HISTORY=n
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Raw memory access is not needed for the application command interface.
CONFIG_DEVMEM_SHELL=n

# Keep log formatting off application threads and preserve the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

# Enable thread and stack inspection through the kernel shell.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
