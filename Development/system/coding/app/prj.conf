# N16R8 module: flash image header and octal PSRAM driver match the overlay.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Serial diagnostics and the transport for future application commands.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# Provisioning commands can contain credentials; do not retain command history.
CONFIG_SHELL_HISTORY=n
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Wi-Fi station with DHCP; L1_WIFI and L1_PORTAL need the network stack.
# WIFI depends on NETWORKING; without it Kconfig silently drops both symbols.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# The event handler reads the connect status and scan results from callback->info.
CONFIG_NET_MGMT_EVENT_INFO=y

# Each scan result is one event; the default queue drops some of them.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Wi-Fi buffers in PSRAM keep internal RAM for audio. In the 50 KB internal
# heap, a laptop on the setup hotspot caused "memory allocation failed".
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# Bring-up diagnostics: wifi scan/connect/status, net iface, net ping.
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n

# The joined network persists in storage_partition as one record (wifi/network).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=n

# Setup hotspot: access point and station at the same time, with a DHCP
# server for the phone; the station can scan and join while it is open.
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Setup page. HTTP/1.1 is enough for one page and a few small requests.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
# Phone browsers send long header lines.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
# Browsers open several keep-alive connections; with 3 slots a new one waits
# until an idle one times out, which delays the page.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=5

# Sockets: HTTP listener and 8 clients, DHCP server and client. The defaults
# (6 contexts, 4 connections) are too few; contexts also set the descriptor count.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
# The HTTP server polls its eventfd, listener and 8 clients in one call.
CONFIG_ZVFS_POLL_MAX=12

# Raw memory access is not needed for the application command interface.
CONFIG_DEVMEM_SHELL=n

# Keep log formatting off application threads and preserve the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

# Enable thread and stack inspection through the kernel shell.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
