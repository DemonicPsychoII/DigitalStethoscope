# --- Subsystems ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_PWM=y

# --- Logging / console ---
# Deferred logging keeps console formatting off the audio and input paths.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# --- Runtime ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_THREAD_NAME=y

# Always-on stack safety and inspectability. qc.conf adds periodic reporting.
# ESP32-S3 Xtensa reports ARCH_HAS_STACK_PROTECTION=n in this Zephyr revision.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# --- XPT2046 resistive touch (verify symbol name for your Zephyr version) ---
CONFIG_INPUT_XPT2046=y
# Warnings here can saturate the 115200 console faster than it can drain.
CONFIG_INPUT_LOG_LEVEL_ERR=y

# N16R8: clips/fixtures in external RAM; DMA remains internal.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_FPU=y
# Preserve DSP registers when Wi-Fi/driver threads or interrupts preempt audio.
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=768
# Hold a complete fixture-upload command while the DSP runs.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_ARGC_MAX=12
CONFIG_SHELL_HISTORY=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
