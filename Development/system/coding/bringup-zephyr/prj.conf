# --- Subsystems ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_PWM=y

# --- Logging / console ---
# Immediate mode during bring-up: deferred logging needs a low-priority worker
# thread, which a misbehaving driver thread can starve.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# --- Runtime ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- XPT2046 resistive touch (verify symbol name for your Zephyr version) ---
CONFIG_INPUT_XPT2046=y
# Warnings here can saturate the 115200 console faster than it can drain.
CONFIG_INPUT_LOG_LEVEL_ERR=y
