# --- Subsystems ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_PWM=y

# --- Logging / console ---
# Immediate mode during bring-up: deferred logging needs a low-priority worker
# thread, which a misbehaving driver thread can starve.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# --- Runtime ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_THREAD_NAME=y

# Always-on stack safety and inspectability. qc.conf adds periodic reporting.
# ESP32-S3 Xtensa reports ARCH_HAS_STACK_PROTECTION=n in this Zephyr revision.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# --- XPT2046 resistive touch (verify symbol name for your Zephyr version) ---
CONFIG_INPUT_XPT2046=y
# Warnings here can saturate the 115200 console faster than it can drain.
CONFIG_INPUT_LOG_LEVEL_ERR=y
