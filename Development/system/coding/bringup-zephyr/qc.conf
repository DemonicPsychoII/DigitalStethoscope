# Build with: west build --pristine ... -- -DEXTRA_CONF_FILE=qc.conf
# Periodic high-water marks under the combined hardware workload.
# Hardware stack protection is unavailable on ESP32-S3 Xtensa
# (ARCH_HAS_STACK_PROTECTION=n); prj.conf enables STACK_SENTINEL instead.
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
CONFIG_THREAD_ANALYZER_STACK_SAFETY=y
