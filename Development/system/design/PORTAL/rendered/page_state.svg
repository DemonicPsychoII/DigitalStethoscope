sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="152.7588" x="1358.6304" y="914.3962">scan failure), then teardown</text></g><g class="legend" data-source-line="61"><rect fill="none" height="101.6439" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="813.3077" x="20.8333" y="989.5752"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="398.1222" x="32.2917" y="1016.3859">The page polls /status once per second, one poll outstanding.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="790.391" x="32.2917" y="1036.0677">A poll failure also replaces an open form with guidance; the next successful poll (selecting, connect_failed) restores the list.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="770.6665" x="32.2917" y="1055.7495">Start from CONTROL publishes closing from any status without a notice delay. Accepting Connect, Rescan or Cancel sets</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="775.651" x="32.2917" y="1075.4313">connecting, scanning or closing at once, before COMMUNICATION reads the request; Activity keeps the status and cause.</text></g><?plantuml-src ZLPDRnit4BtlhvYa5xjOVyY7rB610euA0mOSkx2SKnGKrEv8sfWYjoJNiX3ultU6v59SsKvp4IJnlPatd-GxjyGLGhMPQRCethL6B5O2fDZepe5TeHDA5FQXKQqmOWLsAMgzRjG2va9Qp4vgd8jEkakjt8qWYnEXx0HDCyymCr4zB8pkL3tMKXluxNWsEXwTlcubGl03rlC_CiY5CNeT3yN7sMarqEU4G_XHmATTLwFHwFJa0nreKwCPyfyBrpX9cj5rBRHYWMSm8oyMpO7KbP3msE0Q7j7Opa95ueoM4ertrzbYsTG8k6hTXWAmbMbQrsXL547D-q_1L32orshZX3nSkfNSVm_2GdzCgYFXIZaqedBD8tgIzRZyNyBsODbODrKAtLgR1rl27IaGgeInK1LAi1oJvryJS4kRQxEQAeiIAuSrH7v9qLjBtsfFkIJGbZBhx6QghhMegG5Ac90RvR-DDVadOMeH0Y8SiRx-_WqE3lxqF-7CfnKaaU48MaeV20UQ91BI8nZA4XbAnsSGj76lKQcguEAVkMWarkTJ5Ns2qWvEdfx8gC7lZDSALcWjUIFBtk0Bovmog9P2BR3snDg8TOxckA5NqEU6a1US_SPnT1wIMUQ6UmCHhSMeKjPIVELK3SCZErmUUC3Mv