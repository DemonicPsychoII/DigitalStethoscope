5" font-weight="bold" lengthAdjust="spacing" textLength="263.3057" x="510.081" y="1687.1175">[link in the driver's error state (rejects STOP)]</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg24"><polygon fill="#A9B8CA" points="711.1145,1737.0687,721.5312,1741.2354,711.1145,1745.402,715.2812,1741.2354" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="717.3645" y1="1741.2354" y2="1741.2354"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="94.6289" x="513.385" y="1730.2327">trigger DROP only</text></g><path d="M728.125,1758.9437 L728.125,1821.4437 A4.1667,4.1667 0 0 0 732.2917,1825.6104 L982.2917,1825.6104 A4.1667,4.1667 0 0 0 986.4583,1821.4437 L986.4583,1765.1937 L976.0417,1754.777 L732.2917,1754.777 A4.1667,4.1667 0 0 0 728.125,1758.9437" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M976.0417,1754.777 L976.0417,1763.1104 A2.0833,2.0833 0 0 0 978.125,1765.1937 L986.4583,1765.1937 L976.0417,1754.777" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.6724" x="739.5833" y="1778.3529">Example: RX overran. The block the driver</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="181.2378" x="739.5833" y="1795.223">held at the error may stay in use;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="130.7983" x="739.5833" y="1812.0931">restart required anyway.</text><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg25"><polygon fill="#A9B8CA" points="899.884,1884.9609,910.3007,1889.1276,899.884,1893.2943,904.0507,1889.1276" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="906.134" y1="1889.1276" y2="1889.1276"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="118.3105" x="513.385" y="1861.2549">link not in error state:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="129.1138" x="513.385" y="1878.125">STOP, wait 8 ms, DROP</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg26"><polygon fill="#A9B8CA" points="340.0411,1926.8311,329.6244,1930.9977,340.0411,1935.1644,335.8744,1930.9977" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="333.7911" x2="499.8433" y1="1930.9977" y2="1930.9977"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="26.9531" x="351.4994" y="1919.9951">done</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg27"><polygon fill="#A9B8CA" points="143.6381,1968.7012,133.2214,1972.8678,143.6381,1977.0345,139.4714,1972.8678" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="137.3881" x2="327.5411" y1="1972.8678" y2="1972.8678"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="160.9863" x="155.0964" y="1961.8652">fault event with the failed link</text></g><path d="M425,1990.5762 L425,2053.0762 A4.1667,4.1667 0 0 0 429.1667,2057.2428 L983.3333,2057.2428 A4.1667,4.1667 0 0 0 987.5,2053.0762 L987.5,1996.8262 L977.0833,1986.4095 L429.1667,1986.4095 A4.1667,4.1667 0 0 0 425,1990.5762" fill="#3A3320" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M977.0833,1986.4095 L977.0833,1994.7428 A2.0833,2.0833 0 0 0 979.1667,1996.8262 L987.5,1996.8262 L977.0833,1986.4095" fill="#3A3320" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="42.6636" x="536.6608" y="2009.9854">unclear</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="287.5854" x="579.3243" y="2009.9854">: the decision of 10 November discards both queues</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="328.2837" x="536.6608" y="2026.8555">at once on a fault; this mechanism still waits 8 ms on a link</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="284.8145" x="536.6608" y="2043.7256">that is not in the error state. Needs Nico's decision.</text><?plantuml-src bLRRJXj947ttLrIIXpN8GRvaWJLY9JRafh0uQno91oIhFLEsUvdfddJtuBLM-VSztJs-OWEBX6ovJjrEdQgPLsxAELCo7sapgRqgZ9ZaWZ8nrwKZcxCJIjJilLI5C28dEnMfdaareR78BAzPKXwBCdCVjNBN0X5lXB8tREHu3JCIoVt4w5AbxtMc3RrfZbhDrkdkA1M4ZpaTdwn1BepHiyeeVXkT9cBR-9ItvHybguJftnfz4yR9H1P2kJ-sAskVTDhlMfiORL8sbVsuTT8v5HlsnsdfIexvIYhUwVe9-OhzbiyiODaHDFfj5zmQjN_jT6e_T_HQ9KhdtkdJXbEx9Th7QovAkq3Dll2qizx7HVwiEUaogC21dmO-T452fHIc2nML3Z9I91AZhILea4IPIas9pWkjM3bBzPIjd2XEAUTaAfIqUOF6HaCaHZwm8QjBWq4Qy0H17jIArIZezLLx-BvtFUZthbwJi8YhdD7P8yp5zyillJiLaxkfZnNmuOSjT6lufNqJhCv0t8KsRXCXsxPP5NUdSedUYYcQeVvjy3ASC6oN0V38ixNqlBnuJuFRLQ9SkigdvaTIH59hj6YAtlvUiTUD9ghV3tCx-N40J3G0iQmPAAGRMe-iUyZA0jX6aO0YnrXEIiFRmCtIjf2PnhpVaPCvOv25aNcO4D5pGMP6Ge1MPf00ZJATtD-fkaWIBXo4C9l206v8sbMwjE5LIw4VJdqILkbpRJaZ9nDyknbSz0VFjhQD3bk2twQEz7XxIBv9b1YmD9Dk2k4JvuMR4zQnPEo0p6mZuAocYXolV70rbiQwezX3IED7Y8qPQSJ9fBgtYqQtoLmJ0MGwx7-u-Nur6FQ-1jnI1Gl9T1TXrhN2kEWaGffOv9w1LIgoVgbNXJrHa0-6L1xsP3a1Y95IFTu9Ve0C5XFr_xNpywYAg31JAdiMhWVOo_rzYGnxUKmvkKTExMzzWTb1LqOugHMTdoyMwLgRN6JXEkrR9sHvsJRfulbbMkcez-r_Y2w0dzMSnr76BfxJo99KTFddHRYgi70t0FktL9I0IGUxq_YqaRU6rwrXLnhbhN6WEeGhjCwEw2-FIZqgXCUPnApyyXLuOU1qIxTxXJCJI7rAEKw3c-cgLCn8wjI-cCFBFjgjZmrpR1XTXIOENapiTeJ1an6gseEkgBaW00INM1fyX4NmDDcpEvNf2HOfnoDBk6HQU-cYxjmBNHJhQnhM8Chter-IBkXMRtjVGPJrEuDIV3D-FruaM7zTmiPNZl4fz8ibngkKyNi9tTKD_yq9TE95jkEEFpaahR9vSDcKyERZaCBVXt-4LshNJrFZP-Guei5IpglwAloKivI42uPORoxclkPvDPcp2WXome4nU2MIU6RW9izdOduKp6kQtV7