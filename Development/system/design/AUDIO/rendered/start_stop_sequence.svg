2="part1" id="msg12"><polygon fill="#A9B8CA" points="143.6381,908.8379,133.2214,913.0046,143.6381,917.1712,139.4714,913.0046" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="137.3881" x2="327.5411" y1="913.0046" y2="913.0046"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="131.7871" x="155.0964" y="902.002">start failure (fault event)</text></g><rect fill="#ADAFAE" height="3.125" rx="4.1667" ry="4.1667" style="stroke:#ADAFAE;stroke-width:1.0417;" width="1208.5083" x="10.4167" y="963.1063"/><line style="stroke:#ADAFAE;stroke-width:1.0417;" x1="10.4167" x2="1218.925" y1="963.1063" y2="963.1063"/><line style="stroke:#ADAFAE;stroke-width:1.0417;" x1="10.4167" x2="1218.925" y1="966.2313" y2="966.2313"/><rect fill="#ADAFAE" height="35.6201" rx="4.1667" ry="4.1667" style="stroke:#ADAFAE;stroke-width:2.0833;" width="414.7949" x="407.2734" y="946.3379"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="386.0474" x="418.7317" y="968.8721">block loop runs; the command queue is checked once per iteration</text><path d="M35.4167,999.6663 L160.3434,999.6663 L160.3434,1018.6198 L149.9268,1029.0365 L31.25,1029.0365 L31.25,1003.833 A4.1667,4.1667 0 0 1 35.4167,999.6663" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><rect fill="none" height="573.8851" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="1177.2583" x="31.25" y="999.6663"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="71.8018" x="52.0833" y="1019.0755">Normal Stop</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg13"><polygon fill="#A9B8CA" points="316.0828,1058.4066,326.4994,1062.5732,316.0828,1066.7399,320.2494,1062.5732" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="132.1798" x2="322.3328" y1="1062.5732" y2="1062.5732"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="78.6743" x="144.6798" y="1051.5706">Stop (k_msgq)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg14"><polygon fill="#A9B8CA" points="488.385,1100.2767,498.8017,1104.4434,488.385,1108.61,492.5517,1104.4434" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="328.5828" x2="494.635" y1="1104.4434" y2="1104.4434"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="54.6875" x="341.0828" y="1093.4408">i2s_stop()</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg15"><polygon fill="#A9B8CA" points="711.1145,1142.1468,721.5312,1146.3135,711.1145,1150.4801,715.2812,1146.3135" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="717.3645" y1="1146.3135" y2="1146.3135"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="67.1753" x="513.385" y="1135.3109">trigger STOP</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg16"><polygon fill="#A9B8CA" points="899.884,1184.0169,910.3007,1188.1836,899.884,1192.3503,904.0507,1188.1836" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="906.134" y1="1188.1836" y2="1188.1836"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="67.1753" x="513.385" y="1177.181">trigger STOP</text></g><path d="M916.6667,1205.8919 L916.6667,1268.3919 A4.1667,4.1667 0 0 0 920.8333,1272.5586 L1193.75,1272.5586 A4.1667,4.1667 0 0 0 1197.9167,1268.3919 L1197.9167,1212.1419 L1187.5,1201.7253 L920.8333,1201.7253 A4.1667,4.1667 0 0 0 916.6667,1205.8919" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1187.5,1201.7253 L1187.5,1210.0586 A2.0833,2.0833 0 0 0 1189.5833,1212.1419 L1197.9167,1212.1419 L1187.5,1201.7253" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="207.2266" x="928.125" y="1225.3011">STOP lets the block in DMA complete:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="205.4321" x="928.125" y="1242.1712">RX puts it into its queue, TX returns it</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="249.1333" x="928.125" y="1259.0413">to the pool. Queued TX blocks are not played.</text><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg17"><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="544.635" y1="1311.9141" y2="1311.9141"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="544.635" x2="544.635" y1="1311.9141" y2="1325.4557"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="501.9267" x2="544.635" y1="1325.4557" y2="1325.4557"/><polygon fill="#A9B8CA" points="512.3433,1321.2891,501.9267,1325.4557,512.3433,1329.6224,508.1767,1325.4557" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="160.5347" x="513.385" y="1300.9115">wait 8 ms (two block periods)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg18"><polygon fill="#A9B8CA" points="711.1145,1363.1592,721.5312,1367.3258,711.1145,1371.4925,715.2812,1367.3258" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="717.3645" y1="1367.3258" y2="1367.3258"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="184.9976" x="513.385" y="1356.3232">trigger DROP (frees the RX queue)</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg19"><polygon fill="#A9B8CA" points="899.884,1405.0293,910.3007,1409.196,899.884,1413.3626,904.0507,1409.196" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="906.134" y1="1409.196" y2="1409.196"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="183.5083" x="513.385" y="1398.1934">trigger DROP (frees the TX queue)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg20"><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="500.885" x2="544.635" y1="1467.9362" y2="1467.9362"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="544.635" x2="544.635" y1="1467.9362" y2="1481.4779"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="501.9267" x2="544.635" y1="1481.4779" y2="1481.4779"/><polygon fill="#A9B8CA" points="512.3433,1477.3112,501.9267,1481.4779,512.3433,1485.6445,508.1767,1481.4779" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="197.7295" x="513.385" y="1440.0635">check 0 blocks in use in both pools;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="83.6426" x="513.385" y="1456.9336">log a mismatch</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg21"><polygon fill="#A9B8CA" points="340.0411,1519.1813,329.6244,1523.348,340.0411,1527.5146,335.8744,1523.348" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="333.7911" x2="499.8433" y1="1523.348" y2="1523.348"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="89.9292" x="351.4994" y="1512.3454">I2S_RESULT_OK</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg22"><polygon fill="#A9B8CA" points="143.6381,1561.0514,133.2214,1565.2181,