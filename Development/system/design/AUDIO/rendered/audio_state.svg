<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1904px;height:1025px;background:#0B1018;" width="1904.167px" height="1025px" viewBox="0 0 1904 1025" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1904.167" height="1025" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="26"><rect x="598.154" y="20.833" width="706.704" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="604.404" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="694.204" font-weight="700">L2_AUDIO states and the system states they correspond to</text></g><g class="entity" data-qualified-name="Initializing" id="ent0001" data-source-line="28"><rect x="1502.647" y="161.751" width="96.135" height="60.848" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="1502.647" y1="185.506" x2="1598.782" y2="185.506" style="stroke:#61738A;stroke-width:1.042;"/><text x="1521.403" y="177.596" fill="#CDD5D5" font-size="11.458" textLength="58.623">Initializing</text><text x="1507.856" y="201.35" fill="#CDD5D5" font-size="11.458" textLength="69.931">i2s_initialize</text><text x="1507.856" y="214.689" fill="#CDD5D5" font-size="11.458" textLength="75.302">system: Boot</text></g><g class="entity" data-qualified-name="Stopped" id="ent0002" data-source-line="29"><rect x="802.647" y="277.376" width="340.067" height="60.848" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="802.647" y1="301.131" x2="1142.714" y2="301.131" style="stroke:#61738A;stroke-width:1.042;"/><text x="948.857" y="293.221" fill="#CDD5D5" font-size="11.458" textLength="47.646">Stopped</text><text x="807.856" y="316.975" fill="#CDD5D5" font-size="11.458" textLength="262.143">no stream; output silent; waits for commands</text><text x="807.856" y="330.314" fill="#CDD5D5" font-size="11.458" textLength="319.233">system: Idle, Portal, Analysing, Sending, ReportingError</text></g><g class="entity" data-qualified-name="Starting" id="ent0003" data-source-line="30"><rect x="805.772" y="393.001" width="333.778" height="74.186" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="805.772" y1="416.756" x2="1139.55" y2="416.756" style="stroke:#61738A;stroke-width:1.042;"/><text x="949.806" y="408.846" fill="#CDD5D5" font-size="11.458" textLength="45.71">Starting</text><text x="810.981" y="432.6" fill="#CDD5D5" font-size="11.458" textLength="173.649">i2s_start: configure both links,</text><text x="810.981" y="445.939" fill="#CDD5D5" font-size="11.458" textLength="242.869">prime 4 silent TX blocks, start RX, then TX</text><text x="810.981" y="459.277" fill="#CDD5D5" font-size="11.458" textLength="312.945">system: still Idle (Listening starts at the started event)</text></g><g class="entity" data-qualified-name="Running" id="ent0004" data-source-line="31"><rect x="653.168" y="548.21" width="350.898" height="60.848" fill="#10302B" style="stroke:#52C7B4;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="653.168" y1="571.965" x2="1004.066" y2="571.965" style="stroke:#52C7B4;stroke-width:1.042;"/><text x="804.884" y="564.054" fill="#CDD5D5" font-size="11.458" textLength="47.467">Running</text><text x="658.376" y="587.809" fill="#CDD5D5" font-size="11.458" textLength="276.225">block loop, one iteration per 4 ms, ≤ 3 ms (P02)</text><text x="658.376" y="601.147" fill="#CDD5D5" font-size="11.458" textLength="330.065">system: Listening, Measuring (cross-module design: Live)</text></g><g class="entity" data-qualified-name="Stopping" id="ent0005" data-source-line="32"><rect x="590.668" y="689.876" width="193.005" height="74.186" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="590.668" y1="713.631" x2="783.673" y2="713.631" style="stroke:#61738A;stroke-width:1.042;"/><text x="661.649" y="705.721" fill="#CDD5D5" font-size="11.458" textLength="51.042">Stopping</text><text x="595.876" y="729.475" fill="#CDD5D5" font-size="11.458" textLength="144.41">i2s_stop (Stop sequence)</text><text x="595.876" y="742.814" fill="#CDD5D5" font-size="11.458" textLength="142.401">system: Listening → Idle,</text><text x="595.876" y="756.152" fill="#CDD5D5" font-size="11.458" textLength="172.172">Measuring → Idle or Analysing</text></g><g class="entity" data-qualified-name="Fault" id="ent0006" data-source-line="33"><rect x="944.314" y="833.626" width="362.815" height="60.848" fill="#2A1714" style="stroke:#F08A7C;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="944.314" y1="857.381" x2="1307.129" y2="857.381" style="stroke:#F08A7C;stroke-width:1.042;"/><text x="1111.446" y="849.471" fill="#CDD5D5" font-size="11.458" textLength="28.551">Fault</text><text x="949.522" y="873.225" fill="#CDD5D5" font-size="11.458" textLength="206.451">both links dropped; waits for restart</text><text x="949.522" y="886.564" fill="#CDD5D5" font-size="11.458" textLength="341.982">system: Muted (cross-module design: Error, audio affected)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="34"><ellipse cx="1550.564" cy="91.96" rx="10.417" ry="10.417" fill="#93C" style="stroke:#55B2DE;stroke-width:1.042;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0019" data-source-line="45"><ellipse cx="981.814" cy="975.293" rx="11.458" ry="11.458" fill="none" style="stroke:#93C;stroke-width:1.042;"/><ellipse cx="981.814" cy="975.293" rx="6.25" ry="6.25" fill="none" style="stroke:#93C;stroke-width:1.042;"/></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="47"><path d="M1105.251,953.418 L1105.251,999.154 A4.167,4.167 0 0 0 1109.418,1003.32 L1431.737,1003.32 A4.167,4.167 0 0 0 1435.903,999.154 L1435.903,959.668 L1425.487,949.251 L1273.967,949.251 L1233.603,894.229 L1265.634,949.251 L1109.418,949.251 A4.167,4.167 0 0 0 1105.251,953.418" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><path d="M1425.487,949.251 L1425.487,957.585 A2.083,2.083 0 0 0 1427.57,959.668 L1435.903,959.668 L1425.487,949.251" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><text x="1111.501" y="966.062" fill="#E6EDF7" font-size="12.5" textLength="182.129">No automatic stream restart.</text><text x="1111.501" y="980.613" fill="#E6EDF7" font-size="12.5" textLength="308.777">The device is halted: every input, including Start,</text><text x="1111.501" y="995.164" fill="#E6EDF7" font-size="12.5" textLength="144.305">is blocked until restart.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="52"><path d="M141.71,540.918 L141.71,615.755 A4.167,4.167 0 0 0 145.876,619.922 L630.207,619.922 A4.167,4.167 0 0 0 634.373,615.755 L634.373,582.585 L652.818,578.418 L634.373,574.251 L634.373,547.168 L623.957,536.751 L145.876,536.751 A4.167,4.167 0 0 0 141.71,540.918" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><path d="M623.957,536.751 L623.957,545.085 A2.083,2.083 0 0 0 626.04,547.168 L634.373,547.168 L623.957,536.751" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><text x="147.96" y="553.562" fill="#E6EDF7" font-size="12.5" textLength="303.723">Non-audio restart-required error during listening</text><text x="147.96" y="568.113" fill="#E6EDF7" font-size="12.5" textLength="360.162">(SESSION_CONTEXT_CHANGE, CONTROL_INPUT_FAILURE,</text><text x="147.96" y="582.664" fill="#E6EDF7" font-size="12.5" textLength="470.789">HEART_RATE_WORKER_STALL, SETTINGS_SAVE_FAILURE): L2_AUDIO keeps</text><text x="147.96" y="597.215" fill="#E6EDF7" font-size="12.5" textLength="299.054">running. The error is latched silently and shown</text><text x="147.96" y="611.766" fill="#E6EDF7" font-size="12.5" textLength="141.431">after the manual Stop.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="59"><path d="M1158.376,414.355 L1158.376,425.814 L1139.197,429.98 L1158.376,434.147 L1158.376,445.54 A4.167,4.167 0 0 0 1162.543,449.707 L1486.705,449.707 A4.167,4.167 0 0 0 1490.872,445.54 L1490.872,420.605 L1480.455,410.189 L1162.543,410.189 A4.167,4.167 0 0 0 1158.376,414.355" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><path d="M1480.455,410.189 L1480.455,418.522 A2.083,2.083 0 0 0 1482.538,420.605 L1490.872,420.605 L1480.455,410.189" style="stroke:#61738A;stroke-width:1.042;" fill="#1B2533"/><text x="1164.626" y="427" fill="#E6EDF7" font-size="12.5" textLength="310.62">The system stays in Idle after the Start command</text><text x="1164.626" y="441.551" fill="#E6EDF7" font-size="12.5" textLength="261.395">and enters Listening at the started event.</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-link-type="dependency"><polygon points="1550.564,161.366,1554.731,151.991,1550.564,156.158,1546.397,151.991,1550.564,161.366" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1550.564,106.836 C1550.564,120.331 1550.564,137.767 1550.564,156.158" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="1552.647" y="138.979" fill="#E6EDF7" font-size="12.5" textLength="28.131">boot</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="1121.017,277.363,1131.019,279.645,1126.127,276.359,1129.413,271.468,1121.017,277.363" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1502.268,202.487 C1419.361,218.769 1251.869,251.664 1126.127,276.359" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="1298.481" y="254.604" fill="#E6EDF7" font-size="12.5" textLength="269.617">both I2S controllers ready, links configured</text></g><g class="link" data-entity-