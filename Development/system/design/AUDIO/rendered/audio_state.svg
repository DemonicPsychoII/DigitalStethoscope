<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1138.5417px" preserveAspectRatio="none" style="width:1442px;height:1138px;background:#0B1018;" version="1.1" viewBox="0 0 1442 1138" width="1442.7083px" zoomAndPan="magnify"><title>L2_AUDIO states and the system states they correspond to (design, not implemented)</title><defs/><g><rect fill="#0B1018" height="1138.5417" style="stroke:none;stroke-width:1.0417;" width="1442.7083" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="855.1717" x="183.0912" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="832.255" x="194.5496" y="54.2236">L2_AUDIO states and the system states they correspond to (design, not implemented)</text></g><g class="entity" data-qualified-name="Initializing" id="ent0002"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="97.169" x="1115.1042" y="189.5752"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="1115.1042" x2="1212.2732" y1="225.8728" y2="225.8728"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="49.4141" x="1138.9816" y="212.0544">Initializing</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="62.0026" x="1125.5208" y="248.3521">i2s_initialize</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="65.919" x="1125.5208" y="263.8163">system: Boot</text></g><g class="entity" data-qualified-name="Stopped" id="ent0003"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="306.7871" x="517.1875" y="346.8669"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="517.1875" x2="823.9746" y1="383.1645" y2="383.1645"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="41.6372" x="649.7625" y="369.3461">Stopped</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="228.6072" x="527.6042" y="405.6437">no stream; output silent; waits for commands</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="275.5371" x="527.6042" y="421.108">system: Idle, Portal, Analysing, Sending, ReportingError</text></g><g class="entity" data-qualified-name="Starting" id="ent0004"><rect fill="#273241" height="103.5238" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="242.7144" x="549.4792" y="504.1585"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="549.4792" x2="792.1936" y1="540.4561" y2="540.4561"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="38.8957" x="651.3885" y="526.6378">Starting</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="152.8748" x="559.8958" y="562.9354">i2s_start: configure both links,</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="211.4644" x="559.8958" y="578.3997">prime 4 silent TX blocks, start RX, then TX</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="79.4139" x="559.8958" y="593.8639">system: unclear</text></g><g class="entity" data-qualified-name="Running" id="ent0005"><rect fill="#10302B" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#52C7B4;stroke-width:1.0417;" width="285.7615" x="405.2083" y="692.7002"/><line style="stroke:#52C7B4;stroke-width:1.0417;" x1="405.2083" x2="690.9698" y1="728.9978" y2="728.9978"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="527.9531" y="715.1794">Running</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="245.5037" x="415.625" y="751.4771">block loop, one iteration per 4 ms, &#8804; 3 ms (P02)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="254.5115" x="415.625" y="766.9413">system: Listening, Measuring (shared design: Live)</text></g><g class="entity" data-qualified-name="Stopping" id="ent0006"><rect fill="#273241" height="103.5238" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="183.4534" x="16.6667" y="883.3252"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="16.6667" x2="200.12" y1="919.6228" y2="919.6228"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="43.9311" x="86.4278" y="905.8044">Stopping</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="128.6153" x="27.0833" y="942.1021">i2s_stop (Stop sequence)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="127.7313" x="27.0833" y="957.5663">system: Listening &#8594; Idle,</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="152.2034" x="27.0833" y="973.0306">Measuring &#8594; Idle or Analysing</text></g><g class="entity" data-qualified-name="Fault" id="ent0007"><rect fill="#2A1714" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#F08A7C;stroke-width:1.0417;" width="295.575" x="743.75" y="890.6169"/><line style="stroke:#F08A7C;stroke-width:1.0417;" x1="743.75" x2="1039.325" y1="926.9145" y2="926.9145"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="24.2483" x="879.4134" y="913.0961">Fault</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="200.9237" x="754.1667" y="949.3937">both links stopped; waits for commands</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="264.325" x="754.1667" y="964.858">system: Muted (shared design: Error, audio affected)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="34" id="ent0002"><ellipse cx="1163.5417" cy="106.2419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="44" id="ent0013"><ellipse cx="761.4583" cy="1090.096" fill="none" rx="11.4583" ry="11.4583" style="stroke:#9933CC;stroke-width:1.0417;"/><ellipse cx="761.4583" cy="1090.096" fill="none" rx="6.25" ry="6.25" style="stroke:#9933CC;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="46" id="ent0003"><path d="M842.1875,1059.3669 L842.1875,1122.4772 A4.1667,4.1667 0 0 0 846.3542,1126.6439 L1197.3511,1126.6439 A4.1667,4.1667 0 0 0 1201.5177,1122.4772 L1201.5177,1065.6169 L1191.1011,1055.2002 L1026.5577,1055.2002 L982.6587,979.33 L1018.2244,1055.2002 L846.3542,1055.2002 A4.1667,4.1667 0 0 0 842.1875,1059.3669" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1191.1011,1055.2002 L1191.1011,1063.5335 A2.0833,2.0833 0 0 0 1193.1844,1065.6169 L1201.5177,1065.6169 L1191.1011,1055.2002" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="306.5674" x="853.6458" y="1078.776">No automatic stream restart (decision of 11 November).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.1909" x="853.6458" y="1095.6462">L2_CONTROL blocks Start while system Muted.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="327.0386" x="853.6458" y="1112.5163">What L2_AUDIO does with a Start received in Fault: unclear.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="51" id="ent0006"><path d="M70.3125,696.8669 L70.3125,776.8473 A4.1667,4.1667 0 0 0 74.4792,781.014 L381.8481,781.014 A4.1667,4.1667 0 0 0 386.0148,776.8473 L386.0148,741.1377 L405.1044,736.971 L386.0148,732.8044 L386.0148,703.1169 L375.5981,692.7002 L74.4792,692.7002 A4.1667,4.1667 0 0 0 70.3125,696.8669" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M375.5981,692.7002 L375.5981,701.0335 A2.0833,2.0833 0 0 0 377.6815,703.1169 L386.0148,703.1169 L375.5981,692.7002" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="42.6636" x="81.7708" y="716.276">unclear</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.1885" x="124.4344" y="716.276">: non-audio halting fault (system Muted,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="283.4106" x="81.7708" y="733.1462">for example SESSION_CONTEXT_CHANGE). Whether</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="280.1392" x="81.7708" y="750.0163">L2_CONTROL then sends Stop (to Stopping) or how</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.6084" x="81.7708" y="766.8864">the output is muted is not documented for AUDIO.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="57" id="ent0009"><path d="M810.9375,532.8044 L810.9375,551.5544 L792.4357,555.721 L810.9375,559.8877 L810.9375,579.0446 A4.1667,4.1667 0 0 0 815.1042,583.2113 L1105.6763,583.2113 A4.1667,4.1667 0 0 0 1109.8429,579.0446 L1109.8429,539.0544 L1099.4263,528.6377 L815.1042,528.6377 A4.1667,4.1667 0 0 0 810.9375,53