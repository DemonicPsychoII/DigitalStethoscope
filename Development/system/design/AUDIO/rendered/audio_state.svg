<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1904px;height:1052px;background:#0B1018;" width="1904.167px" height="1052.083px" viewBox="0 0 1904 1052" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1904.167" height="1052.083" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="26"><rect x="597.856" y="20.833" width="706.704" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="604.106" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="694.204" font-weight="700">L2_AUDIO states and the system states they correspond to</text></g><g class="entity" data-qualified-name="Initializing" id="ent0001" data-source-line="28"><rect x="1502.052" y="161.751" width="96.135" height="60.848" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="1502.052" y1="185.506" x2="1598.187" y2="185.506" style="stroke:#61738A;stroke-width:1.042;"/><text x="1520.808" y="177.596" fill="#CDD5D5" font-size="11.458" textLength="58.623">Initializing</text><text x="1507.261" y="201.35" fill="#CDD5D5" font-size="11.458" textLength="69.931">i2s_initialize</text><text x="1507.261" y="214.689" fill="#CDD5D5" font-size="11.458" textLength="75.302">system: Boot</text></g><g class="entity" data-qualified-name="Stopped" id="ent0002" data-source-line="29"><rect x="799.969" y="277.376" width="343.709" height="74.186" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="799.969" y1="301.131" x2="1143.678" y2="301.131" style="stroke:#61738A;stroke-width:1.042;"/><text x="948" y="293.221" fill="#CDD5D5" font-size="11.458" textLength="47.646">Stopped</text><text x="805.177" y="316.975" fill="#CDD5D5" font-size="11.458" textLength="262.143">no stream; output silent; waits for commands</text><text x="805.177" y="330.314" fill="#CDD5D5" font-size="11.458" textLength="322.875">system: Idle, Portal, Analysing, Sending, ReportingError,</text><text x="805.177" y="343.652" fill="#CDD5D5" font-size="11.458" textLength="168.277">Muted after a non-audio fault</text></g><g class="entity" data-qualified-name="Starting" id="ent0003" data-source-line="30"><rect x="805.177" y="406.543" width="333.778" height="74.186" fill="#273241" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="805.177" y1="430.298" x2="1138.955" y2="430.298" style="stroke:#61738A;stroke-width:1.042;"/><text x="949.211" y="422.387" fill="#CDD5D5" font-size="11.458" textLength="45.71">Starting</text><text x="810.386" y="446.142" fill="#CDD5D5" font-size="11.458" textLength="173.649">i2s_start: configure both links,</text><text x="810.386" y="459.48" fill="#CDD5D5" font-size="11.458" textLength="242.869">prime 4 silent TX blocks, start RX, then TX</text><text x="810.386" y="472.819" fill="#CDD5D5" font-size="11.458" textLength="312.945">system: still Idle (Listening starts at the started event)</text></g><g class="entity" data-qualified-name="Running" id="ent0004" data-source-line="31"><rect x="652.573" y="561.751" width="350.898" height="60.848" fill="#10302B" style="stroke:#52C7B4;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="652.573" y1="585.506" x2="1003.471" y2="585.506" style="stroke:#52C7B4;stroke-width:1.042;"/><text x="804.289" y="577.596" fill="#CDD5D5" font-size="11.458" textLength="47.467">Running</text><text x="657.781" y="601.35" fill="#CDD5D5" font-size="11.458" textLength="276.225">block loop, one iteration per 4 ms, ≤ 3 ms (P02)</text><text x="657.781" y="614.689" fill="#CDD5D5" font-size="11.458" textLength="330.065">system: Listening, Measuring (cross-module design: Live)</text></g><g class="entity" data-qualified-name="Stopping" id="ent0005" data-source-line="32"><rect x="590.073" y="703.418" width="193.00