ze="11.4583" lengthAdjust="spacing" textLength="200.9237" x="904.4868" y="966.0604">both links stopped; waits for commands</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="264.325" x="904.4868" y="981.5247">system: Muted (shared design: Error, audio affected)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="34" id="ent0002"><ellipse cx="1309.6952" cy="106.2419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="44" id="ent0013"><ellipse cx="911.7785" cy="1106.7627" fill="none" rx="11.4583" ry="11.4583" style="stroke:#9933CC;stroke-width:1.0417;"/><ellipse cx="911.7785" cy="1106.7627" fill="none" rx="6.25" ry="6.25" style="stroke:#9933CC;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="46" id="ent0003"><path d="M1002.9243,1076.0335 L1002.9243,1139.1439 A4.1667,4.1667 0 0 0 1007.091,1143.3105 L1337.6167,1143.3105 A4.1667,4.1667 0 0 0 1341.7834,1139.1439 L1341.7834,1082.2835 L1331.3667,1071.8669 L1176.8779,1071.8669 L1132.9789,995.9967 L1168.5445,1071.8669 L1007.091,1071.8669 A4.1667,4.1667 0 0 0 1002.9243,1076.0335" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1331.3667,1071.8669 L1331.3667,1080.2002 A2.0833,2.0833 0 0 0 1333.45,1082.2835 L1341.7834,1082.2835 L1331.3667,1071.8669" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="306.5674" x="1014.3827" y="1095.4427">No automatic stream restart (decision of 11 November).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="265.3442" x="1014.3827" y="1112.3128">The device is halted: every input, including Start,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" t