</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="82.373" x="755.4246" y="663.3545">/ started event</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#A9B8CA" points="956.6187,1071.5948,966.3836,1068.4486,960.5001,1068.1218,960.8269,1062.2383,956.6187,1071.5948" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M918.4107,607.4076 C956.7498,627.7828 993.5089,655.5213 1016.2156,692.7002 C1033.2303,720.5593 1033.5721,956.1508 1021.4239,986.4502 C1008.0892,1019.7092 986.2592,1045.0736 961.2764,1067.4272" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="99.5972" x="1123.3384" y="837.1094">a link fails to start</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="270.0928" x="1038.0906" y="853.9795">/ i2s_start drops both links, start failure reported</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk9"><polygon fill="#A9B8CA" points="486.7367,883.2904,490.0506,873.5812,486.2722,878.1029,481.7505,874.3245,486.7367,883.2904" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M523.1987,789.6281 C513.5192,797.2844 504.9745,806.2282 498.5073,816.6585 C486.392,836.1982 484.2118,855.0957 486.1793,877.0654" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="234.8999" x="505.7989" y="845.4427">Stop command, checked once per iteration</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="dependency" id="lnk10"><polygon fill="#A9B8CA" points="614.3772,406.3386,604.502,403.5576,609.2225,407.0846,605.6956,411.8051,614.3772,406.3386" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M405.6056,919.