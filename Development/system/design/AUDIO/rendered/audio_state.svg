<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1312.5px" preserveAspectRatio="none" style="width:1612px;height:1312px;background:#0B1018;" version="1.1" viewBox="0 0 1612 1312" width="1612.5px" zoomAndPan="magnify"><title>L2_AUDIO states and the system states they correspond to</title><defs/><g><rect fill="#0B1018" height="1312.5" style="stroke:none;stroke-width:1.0417;" width="1612.5" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="595.5485" x="362.382" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="572.6318" x="373.8403" y="54.2236">L2_AUDIO states and the system states they correspond to</text></g><g class="entity" data-qualified-name="Initializing" id="ent0002"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="97.169" x="1243.8198" y="189.5752"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="1243.8198" x2="1340.9888" y1="225.8728" y2="225.8728"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="49.4141" x="1267.6972" y="212.0544">Initializing</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="62.0026" x="1254.2364" y="248.3521">i2s_initialize</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="65.919" x="1254.2364" y="263.8163">system: Boot</text></g><g class="entity" data-qualified-name="Stopped" id="ent0003"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="306.7871" x="614.6531" y="346.8669"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="614.6531" x2="921.4402" y1="383.1645" y2="383.1645"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="41.6372" x="747.2281" y="369.3461">Stopped</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="228.6072" x="625.0698" y="405.6437">no stream; output silent; waits for commands</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="275.5371" x="625.0698" y="421.108">system: Idle, Portal, Analysing, Sending, ReportingError</text></g><g class="entity" data-qualified-name="Starting" id="ent0004"><rect fill="#273241" height="103.5238" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="303.5645" x="616.7364" y="504.1585"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="616.7364" x2="920.3009" y1="540.4561" y2="540.4561"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="38.8957" x="749.0708" y="526.6378">Starting</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="152.8748" x="627.1531" y="562.9354">i2s_start: configure both links,</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="211.4644" x="627.1531" y="578.3997">prime 4 silent TX blocks, start RX, then TX</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="272.3145" x="627.1531" y="593.8639">system: still Idle (Listening starts at the started event)</text></g><g class="entity" data-qualified-name="Running" id="ent0005"><rect fill="#10302B" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#52C7B4;stroke-width:1.0417;" width="285.7615" x="494.3406" y="701.0335"/><line style="stroke:#52C7B4;stroke-width:1.0417;" x1="494.3406" x2="780.1021" y1="737.3311" y2="737.3311"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="617.0854" y="723.5128">Running</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="245.5037" x="504.7573" y="759.8104">block loop, one iteration per 4 ms, &#8804; 3 ms (P02)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="254.5115" x="504.7573" y="775.2747">system: Listening, Measuring (shared design: Live)</text></g><g class="entity" data-qualified-name="Stopping" id="ent0006"><rect fill="#273241" height="103.5238" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="183.4534" x="405.7989" y="883.3252"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="405.7989" x2="589.2523" y1="919.6228" y2="919.6228"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="43.9311" x="475.5601" y="905.8044">Stopping</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="128.6153" x="416.2156" y="942.1021">i2s_stop (Stop sequence)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="127.7313" x="416.2156" y="957.5663">system: Listening &#8594; Idle,</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="152.2034" x="416.2156" y="973.0306">Measuring &#8594; Idle or Analysing</text></g><g class="entity" data-qualified-name="Fault" id="ent0007"><rect fill="#2A1714" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#F08A7C;stroke-width:1.0417;" width="295.575" x="750.5906" y="1071.8669"/><line style="stroke:#F08A7C;stroke-width:1.0417;" x1="750.5906" x2="1046.1656" y1="1108.1645" y2="1108.1645"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="24.2483" x="886.254" y="1094.3461">Fault</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="179.1595" x="761.0073" y="1130.6437">both links dropped; waits for restart</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="264.325" x="761.0073" y="1146.108">system: Muted (shared design: Error, audio affected)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="34" id="ent0002"><ellipse cx="1292.2573" cy="106.2419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="45" id="ent0014"><ellipse cx="768.2989" cy="1264.0544" fill="none" rx="11.4583" ry="11.4583" style="stroke:#9933CC;stroke-width:1.0417;"/><ellipse cx="768.2989" cy="1264.0544" fill="none" rx="6.25" ry="6.25" style="stroke:#9933CC;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="47" id="ent0003"><path d="M859.4448,1233.3252 L859.4448,1296.4355 A4.1667,4.1667 0 0 0 863.6114,1300.6022 L1194.1372,1300.6022 A4.1667,4.1667 0 0 0 1198.3038,1296.4355 L1198.3038,1239.5752 L1187.8872,1229.1585 L1033.7317,1229.1585 L996.5033,1160.4147 L1025.3983,1229.1585 L863.6114,1229.1585 A4.1667,4.1667 0 0 0 859.4448,1233.3252" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1187.8872,1229.1585 L1187.8872,1237.4919 A2.0833,2.0833 0 0 0 1189.9705,1239.5752 L1198.3038,1239.5752 L1187.8872,1229.1585" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="306.5674" x="870.9031" y="1252.7344">No automatic stream restart (decision of 11 November).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="265.3442" x="870.9031" y="1269.6045">The device is halted: every input, including Start,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" t