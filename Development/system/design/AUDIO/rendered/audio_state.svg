<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1138.5417px" preserveAspectRatio="none" style="width:1528px;height:1138px;background:#0B1018;" version="1.1" viewBox="0 0 1528 1138" width="1528.125px" zoomAndPan="magnify"><title>L2_AUDIO states and the system states they correspond to (design, not implemented)</title><defs/><g><rect fill="#0B1018" height="1138.5417" style="stroke:none;stroke-width:1.0417;" width="1528.125" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="855.1717" x="223.7162" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="832.255" x="235.1746" y="54.2236">L2_AUDIO states and the system states they correspond to (design, not implemented)</text></g><g class="entity" data-qualified-name="Initializing" id="ent0002"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="97.169" x="1196.3542" y="189.5752"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="1196.3542" x2="1293.5232" y1="225.8728" y2="225.8728"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="49.4141" x="1220.2316" y="212.0544">Initializing</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="62.0026" x="1206.7708" y="248.3521">i2s_initialize</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="65.919" x="1206.7708" y="263.8163">system: Boot</text></g><g class="entity" data-qualified-name="Stopped" id="ent0003"><rect fill="#273241" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="306.7871" x="550.5208" y="346.8669"/><li