"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="549.8281" y="715.1794">Running</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="245.5037" x="437.5" y="751.4771">block loop, one iteration per 4 ms, &#8804; 3 ms (P02)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="254.5115" x="437.5" y="766.9413">system: Listening, Measuring (shared design: Live)</text></g><g class="entity" data-qualified-name="Stopping" id="ent0006"><rect fill="#273241" height="103.5238" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="183.4534" x="16.6667" y="883.3252"/><line style="stroke:#61738A;stroke-width:1.0417;" x1="16.6667" x2="200.12" y1="919.6228" y2="919.6228"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="43.9311" x="86.4278" y="905.8044">Stopping</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="128.6153" x="27.0833" y="942.1021">i2s_stop (Stop sequence)</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="127.7313" x="27.0833" y="957.5663">system: Listening &#8594; Idle,</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="152.2034" x="27.0833" y="973.0306">Measuring &#8594; Idle or Analysing</text></g><g class="entity" data-qualified-name="Fault" id="ent0007"><rect fill="#2A1714" height="88.0595" rx="4.1667" ry="4.1667" style="stroke:#F08A7C;stroke-width:1.0417;" width="295.575" x="829.1667" y="890.6169"/><line style="stroke:#F08A7C;stroke-width:1.0417;" x1="829.1667" x2="1124.7416" y1="926.9145" y2="926.9145"/><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="24.2483" x="964.83" y="913.0961">Fault</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="200.9237" x="839.5833" y="949.3937">both links stopped; waits for commands</text><text fill="#CDD5D5" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="264.325" x="839.5833" y="964.858">system: Muted (shared design: Error, audio affected)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="34" id="ent0002"><ellipse cx="1244.7917" cy="106.2419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="44" id="ent0013"><ellipse cx="846.875" cy="1090.096" fill="none" rx="11.4583" ry="11.4583" style="stroke:#9933CC;stroke-width:1.0417;"/><ellipse cx="846.875" cy="1090.096" fill="none" rx="6.25" ry="6.25" style="stroke:#9933CC;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="46" id="ent0003"><path d="M938.0208,1059.3669 L938.0208,1122.4772 A4.1667,4.1667 0 0 0 942.1875,1126.6439 L1272.7132,1126.6439 A4.1667,4.1667 0 0 0 1276.8799,1122.4772 L1276.8799,1065.6169 L1266.4632,1055.2002 L1111.9744,1055.2002 L1068.0754,979.33 L1103.641,1055.2002 L942.1875,1055.2002 A4.1667,4.1667 0 0 0 938.0208,1059.3669" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1266.4632,1055.2002 L1266.4632,1063.5335 A2.0833,2.0833 0 0 0 1268.5465,1065.6169 L1276.8799,1065.6169 L1266.4632,1055.2002" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="306.5674" x="949.4792" y="1078.776">No automatic stream restart (decision of 11 November).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="265.3442" x="949.4792" y="1095.6462">The device is halted: every input, including Start,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="274.353" x="949.4792" y="1112.5163">is blocked until restart (decision of 13 November).</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="51" id="ent0006"><path d="M62.5,696.8669 L62.5,776.8473 A4.1667,4.1667 0 0 0 66.6667,781.014 L404.0283,781.014 A4.1667,4.1667 0 0 0 408.195,776.8473 L408.195,741.1377 L427.0703,736.971 L408.195,732.8044 L408.195,703.1169 L397.7783,692.7002 L66.6667,692.7002 A4.1667,4.1667 0 0 0 62.5,696.8669" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M397.7783,692.7002 L397.7783,701.0335 A2.0833,2.0833 0 0 0 399.8617,703.1169 L408.195,703.1169 L397.7783,692.7002" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="210.4126" x="73.9583" y="716.276">Non-audio halting fault during listening</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="313.4033" x="73.9583" y="733.1462">(for example SESSION_CONTEXT_CHANGE): AUDIO keeps</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="255.8472" x="73.9583" y="750.0163">running; the error is latched silently and shown</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="271.3623" x="73.9583" y="766.8864">after the manual Stop (decision of 13 November).</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="57" id="ent0009"><path d="M874.4792,532.8044 L874.4792,551.5544 L855.9428,555.721 L874.4792,559.8877 L874.4792,579.0446 A4.1667,4.1667 0 0 0 878.6458,583.2113 L1168.986,583.2113 A4.1667,4.1667 0 0 0 1173.1527,579.0446 L1173.1527,539.0544 L1162.736,528.6377 L878.6458,528.6377 A4.1667,4.1667 0 0 0 874.4792,532.8044" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1162.736,528.6377 L1162.736,536.971 A2.0833,2.0833 0 0 0 11