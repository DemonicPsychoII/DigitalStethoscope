l="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="104.3701" x="367.5334" y="165.6413">Right slot, 32 bits</text><rect fill="#10302B" height="27.2868" style="stroke:none;stroke-width:2.0833;" width="326.2858" x="32.2917" y="174.5605"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="308.374" x="41.2476" y="192.9281">bits 31&#8230;8: 24-bit sample, two's complement, MSB first</text><rect fill="#2A1714" height="27.2868" style="stroke:none;stroke-width:2.0833;" width="176.1637" x="358.5775" y="174.5605"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.252" x="367.5334" y="192.9281">not driven by the microphone</text><rect fill="#2A1714" height="27.2868" style="stroke:none;stroke-width:2.0833;" width="326.2858" x="32.2917" y="201.8473"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="188.501" x="41.2476" y="220.2148">bits 7&#8230;0: not driven after the LSB</text><rect fill="#2A1714" height="27.2868" style="stroke:none;stroke-width:2.0833;" width="176.1637" x="358.5775" y="201.8473"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="104.0894" x="367.5334" y="220.2148">ignored by the loop</text><line style="stroke:#61738A;stroke-width:2.0833;" x1="32.2917" x2="534.7412" y1="147.2738" y2="147.2738"/><line style="stroke:#61738A;stroke-width:2.0833;" x1="32.2917" x2="534.7412" y1="174.5605" y2="174.5605"/><line style="stroke:#61738A;stroke-width:2.0833;" x1="32.2917" x2="534.7412" y1="201.8473" y2="201.8473"/><line style="stroke:#61738A;stroke-width:2.0833;" x1="32.2917" x2="534.7412" y1="229.1341" y2="229.1341"/><line style="stroke:#61738A;stroke-width:2.0833;" x1="32.2917" x2="32.2917" y1="147.2738" y2="229.1341"/><line style="stroke:#61738A;stroke-width:2.0833;" x1="358.5775" x2="358.5775" y1="147.2738" y2="229.1341"/