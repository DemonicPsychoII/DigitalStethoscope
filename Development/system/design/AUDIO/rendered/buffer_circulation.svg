ill="#E6EDF7" font-size="12.5" textLength="66.632" font-weight="700">returns it</text><text x="1091.439" y="349.298" fill="#E6EDF7" font-size="12.5" textLength="26.52">with</text><text x="1020.833" y="363.849" fill="#E6EDF7" font-size="12.5" textLength="161.285">i2s_releaseReceivedBlock</text><text x="1020.833" y="378.4" fill="#E6EDF7" font-size="12.5" textLength="180.542">before requesting a TX block</text></g><!--entity transmitPool--><g class="entity" data-qualified-name="transmitSide.transmitPool" id="ent0007" data-source-line="32"><rect x="41.667" y="120.085" width="149.697" height="49.935" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="52.083" y="142.104" fill="#E6EDF7" font-size="12.5" textLength="79.742">TX pool, free</text><text x="52.083" y="156.655" fill="#E6EDF7" font-size="12.5" textLength="128.864">L1_I2S, internal RAM</text></g><!--entity transmitThread--><g class="entity" data-qualified-name="transmitSide.transmitThread" id="ent0008" data-source-line="33"><rect x="410.417" y="139.876" width="100.692" height="64.486" fill="#10302B" style="stroke:#52C7B4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="432.491" y="161.896" fill="#E6EDF7" font-size="12.5" textLength="56.543" font-style="italic">«thread»</text><text x="420.833" y="176.447" fill="#E6EDF7" font-size="12.5" textLength="79.858">audio thread</text><text x="420.833" y="190.997" fill="#E6EDF7" font-size="12.5" textLength="70.398">fills 1 block</text></g><!--entity transmitQueue--><g class="entity" data-qualified-name="transmitSide.transmitQueue" id="ent0009" data-source-line="34"><rect x="684.896" y="139.876" width="165.645" height="64.486" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="741.684" y="161.896" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="695.313" y="176.447" fill="#E6EDF7" font-size="12.5" textLength="129.944">i2s1 driver TX queue</text><text x="695.313" y="190.997" fill="#E6EDF7" font-size="12.5" textLength="144.812">3 queued after priming</text></g><!--entity transmitDMA--><g class="entity" data-qualified-name="transmitSide.transmitDMA" id="ent0010" data-source-line="35"><rect x="1040.104" y="114.876" width="141.439" height="93.587" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="1084.789" y="136.896" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="1050.521" y="151.447" fill="#E6EDF7" font-size="12.5" textLength="58.826">i2s1 DMA</text><text x="1050.521" y="165.997" fill="#E6EDF7" font-size="12.5" textLength="120.605">plays 1 block, 4 ms</text><text x="1050.521" y="180.548" fill="#E6EDF7" font-size="12.5" textLength="98.56" font-weight="700">driver returns</text><text x="1050.521" y="195.099" fill="#E6EDF7" font-size="12.5" textLength="103.717">the played block</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-link-type="dependency"><polygon points="395.58,337.974,386.638,332.945,390.395,337.484,385.855,341.241,395.58,337.974" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M191.958,318.758 C252.696,324.49 332.527,332.023 390.395,337.484" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="217.708" y="317.104" fill="#E6EDF7" font-size="12.5" textLength="152.417">driver takes a free block</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="677.954,347.735,668.651,343.409,672.746,347.646,668.509,351.741,677.954,347.735" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M526.223,345.141 C570.308,345.895 624.182,346.816 672.746,347.646" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="554.688" y="341.062" fill="#E6EDF7" font-size="12.5" textLength="95