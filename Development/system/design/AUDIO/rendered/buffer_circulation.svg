ll="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="82.3853" x="669.7917" y="427.8239">normally empty</text></g><!--entity receiveThread--><g class="entity" data-qualified-name="receiveSide.receiveThread" data-source-line="29" id="ent0006"><rect fill="#10302B" height="142.8874" rx="4.1667" ry="4.1667" style="stroke:#52C7B4;stroke-width:2.0833;" width="186.7798" x="970.8333" y="308.846"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="44.9219" x="1041.7623" y="337.6302">&#171;thread&#187;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="68.6279" x="986.4583" y="364.917">audio thread</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="64.1602" x="986.4583" y="381.7871">1 block lent</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="52.9297" x="986.4583" y="398.6572">returns it</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="21.9604" x="1043.1356" y="398.6572">with</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="142.5415" x="986.4583" y="415.5273">i2s_releaseReceivedBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.5298" x="986.4583" y="432.3975">before requesting a TX block</text></g><!--entity transmitPool--><g class="entity" data-qualified-name="transmitSide.transmitPool" data-source-line="32" id="ent0008"><rect fill="#273241" height="64.9902" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;" width="146.8628" x="33.3333" y="132.2835"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="68.6523" x="48.9583" y="161.0677">TX pool, free</text><text fill