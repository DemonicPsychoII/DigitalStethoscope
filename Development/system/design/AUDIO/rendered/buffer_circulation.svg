<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="617.7083px" preserveAspectRatio="none" style="width:1177px;height:617px;background:#0B1018;" version="1.1" viewBox="0 0 1177 617" width="1177.0833px" zoomAndPan="magnify"><title>Who holds each 512-byte block, and how it returns to its pool (design, not implemented)</title><defs/><g><rect fill="#0B1018" height="617.7083" style="stroke:none;stroke-width:1.0417;" width="1177.0833" x="0" y="0"/><g class="title" data-source-line="23"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="877.2054" x="144.7306" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="854.2887" x="156.189" y="54.2236">Who holds each 512-byte block, and how it returns to its pool (design, not implemented)</text></g><!--cluster receiveSide--><g class="cluster" data-qualified-name="receiveSide" data-source-line="25" id="ent0002"><rect fill="#273241" height="190.625" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;" width="1140.625" x="25" y="269.7835"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="72.3267" x="559.1492" y="290.2344">RX: 5 blocks</text></g><!--cluster transmitSide--><g class="cluster" data-qualified-name="transmitSide" data-source-line="31" id="ent0007"><rect fill="#273241" height="173.9583" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;" width="1116.6667" x="25" y="87.4919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="70.8374" x="547.9146" y="107.9427">TX: 5 blocks</text></g><!--entity receivePool--><g class="entity" data-qualified-name="receiveSide.receivePool" data-source-line="26" id="ent0003"><rec