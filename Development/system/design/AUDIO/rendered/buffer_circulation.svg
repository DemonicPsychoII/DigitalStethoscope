<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1241px;height:557px;background:#0B1018;" width="1241.667px" height="557.292px" viewBox="0 0 1241 557" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1241.667" height="557.292" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="23"><rect x="250.281" y="20.833" width="739.022" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="256.531" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="726.522" font-weight="700">Who holds each 512-byte block, and how it returns to its pool</text></g><!--cluster receiveSide--><g class="cluster" data-qualified-name="receiveSide" id="ent0001" data-source-line="25"><rect x="25" y="241.96" width="1203.125" height="166.667" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="583.24" y="255.646" fill="#E6EDF7" font-size="12.5" textLength="86.646" font-weight="700">RX: 5 blocks</text></g><!--cluster transmitSide--><g class="cluster" data-qualified-name="transmitSide" id="ent0006" data-source-line="31"><rect x="25" y="73.21" width="1173.438" height="152.083" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="568.945" y="86.896" fill="#E6EDF7" font-size="12.5" textLength="85.547" font-weight="700">TX: 5 blocks</text></g><!--entity receivePool--><g class="entity" data-qualified-name="receiveSide.receivePool" id="ent0002" data-source-line="26"><rect x="41.667" y="286.751" width="149.697" height="49.935" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="52.083" y="308.771" fill="#E6EDF7" font-size="12.5" textLength="80.792">RX pool, free</text><text x="52.083" y="323.322" fill="#E6EDF7" font-size="12.5" textLength="128.864">L1_I2S, internal RAM</text></g><!--entity receiveDMA--><g class="entity" data-qualified-name="receiveSide.receiveDMA" id="ent0003" data-source-line="27"><rect x="395.833" y="311.751" width="129.793" height="64.486" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="434.695" y="333.771" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="406.25" y="348.322" fill="#E6EDF7" font-size="12.5" textLength="58.826">i2s0 DMA</text><text x="406.25" y="362.872" fill="#E6EDF7" font-size="12.5" textLength="108.96">fills 1 block, 4 ms</text></g><!--entity receiveQueue--><g class="entity" data-qualified-name="receiveSide.receiveQueue" id="ent0004" data-source-line="28"><rect x="678.125" y="309.668" width="179.085" height="79.036" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="741.633" y="331.687" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="688.542" y="346.238" fill="#E6EDF7" font-size="12.5" textLength="130.994">i2s0 driver RX queue</text><text x="688.542" y="360.789" fill="#E6EDF7" font-size="12.5" textLength="158.252">up to 3 completed blocks</text><text x="688.542" y="375.34" fill="#E6EDF7" font-size="12.5" textLength="98.962">normally empty</text></g><!--entity receiveThread--><g class="entity" data-qualified-name="receiveSide.receiveThread" id="ent0005" data-source-line="29"><rect x="1010.417" y="283.626" width="201.375" height="108.138" fill="#10302B" style="stroke:#52C7B4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="1082.833" y="305.646" fill="#E6EDF7" font-size="12.5" textLength="56.543" font-style="italic">«thread»</text><text x="1020.833" y="320.197" fill="#E6EDF7" font-size="12.5" textLength="79.858">audio thread</text><text x="1020.833" y="334.747" fill="#E6EDF7" font-size="12.5" textLength="73.053">1 block lent</text><text x="1020.833" y="349.298" fill="#E6EDF7" font-size="12.5" textLength="66.632" font-weight="700">returns it</text><text x="1091.439" y="349.298" fill="#E6EDF7" font-size="12.5" textLength="26.52">with</text><text x="1020.833" y="363.849" fill="#E6EDF7" font-size="12.5" textLength="161.285">i2s_releaseReceivedBlock</text><text x="1020.833" y="378.4" fill="#E6EDF7" font-size="12.5" textLength="180.542">before requesting a TX block</text></g><!--entity transmitPool--><g class="entity" data-qualified-name="transmitSide.transmitPool" id="ent0007" data-source-line="32"><rect x="41.667" y="120.085" width="149.697" height="49.935" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="52.083" y="142.104" fill="#E6EDF7" font-size="12.5" textLength="79.742">TX pool, free</text><text x="52.083" y="156.655" fill="#E6EDF7" font-size="12.5" textLength="128.864">L1_I2S, internal RAM</text></g><!--entity transmitThread--><g class="entity" data-qualified-name="transmitSide.transmitThread" id="ent0008" data-source-line="33"><rect x="410.417" y="139.876" width="100.692" height="64.486" fill="#10302B" style="stroke:#52C7B4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="432.491" y="161.896" fill="#E6EDF7" font-size="12.5" textLength="56.543" font-style="italic">«thread»</text><text x="420.833" y="176.447" fill="#E6EDF7" font-size="12.5" textLength="79.858">audio thread</text><text x="420.833" y="190.997" fill="#E6EDF7" font-size="12.5" textLength="70.398">fills 1 block</text></g><!--entity transmitQueue--><g class="entity" data-qualified-name="transmitSide.transmitQueue" id="ent0009" data-source-line="34"><rect x="684.896" y="139.876" width="165.645" height="64.486" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="741.684" y="161.896" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="695.313" y="176.447" fill="#E6EDF7" font-size="12.5" textLength="129.944">i2s1 driver TX queue</text><text x="695.313" y="190.997" fill="#E6EDF7" font-size="12.5" textLength="144.812">3 queued after priming</text></g><!--entity transmitDMA--><g class="entity" data-qualified-name="transmitSide.transmitDMA" id="ent0010" data-source-line="35"><rect x="1040.104" y="114.876" width="141.439" height="93.587" fill="#182436" style="stroke:#78B0E4;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="1084.789" y="136.896" fill="#E6EDF7" font-size="12.5" textLength="52.069" font-style="italic">«driver»</text><text x="1050.521" y="151.447" fill="#E6EDF7" font-size="12.5" textLength="58.826">i2s1 DMA</text><text x="1050.521" y="165.997" fill="#E6EDF7" font-size="12.5" textLength="120.605">plays 1 block, 4 ms</text><text x="1050.521" y="180.548" fill="#E6EDF7" font-size="12.5" textLength="98.56" font-weight="700">driver returns</text><text x="1050.521" y="195.099" fill="#E6EDF7" font-size="12.5" textLength="103.717">the played block</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-link-type="dependency"><polygon points="395.58,337.974,386.638,332.945,390.395,337.484,385.855,341.241,395.58,337.974" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M191.958,318.758 C252.696,324.49 332.527,332.023 390.395,337.484" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="217.708" y="317.104" fill="#E6EDF7" font-size="12.5" textLength="152.417">driver takes a free block</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="677.954,347.735,668.651,343.409,672.746,347.646,668.509,351.741,677.954,347.735" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M526.223,345.141 C570.308,345.895 624.182,346.816 672.746,347.646" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="554.688" y="341.062" fill="#E6EDF7" font-size="12.5" textLength="95.526">block complete</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="1010.164,341.143,1000.654,337.293,1004.958,341.318,1000.934,345.622,1010.164,341.143" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M857.491,346.271 C904.28,344.699 956.63,342.941 1004.958,341.318" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="882.292" y="336.896" fill="#E6EDF7" font-size="12.5" textLength="103.949">i2s_receiveBlock</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk14" data-link-type="dependency"><polygon points="192.003,300.843,201.757,304.025,197.184,300.308,200.901,295.736,192.003,300.843" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M197.184,300.308 C203.403,299.666 204.421,299.654 210.417,299.251 C284.324,294.291 303.009,299.171 377.083,299.251 C590.51,299.483 644.394,285.279 857.292,300.293 C908.041,303.872 964.047,311.777 1010.402,319.411" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk15" data-link-type="dependency"><polygon points="410.093,168.226,401.076,163.333,404.901,167.815,400.419,171.64,410.093,168.226" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M191.958,150.961 C258.003,156.189 347.563,163.277 404.901,167.815" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="212.5" y="149.396" fill="#E6EDF7" font-size="12.5" textLength="162.793">i2s_allocateTransmitBlock</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk16" data-link-type="dependency"><polygon points="684.614,172.168,675.239,168.001,679.406,172.168,675.239,176.335,684.614,172.168" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M511.611,172.168 C558.404,172.168 624.19,172.168 679.406,172.168" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="546.875" y="168.146" fill="#E6EDF7" font-size="12.5" textLength="110.681">i2s_transmitBlock</text></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" id="lnk17" data-link-type="dependency"><polygon points="1039.983,163.886,1030.485,160.007,1034.777,164.045,1030.739,168.337,1039.983,163.886" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M850.897,169.66 C908.664,167.896 979.928,165.72 1034.777,164.045" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="878.125" y="161.896" fill="#E6EDF7" font-size="12.5" textLength="112.012">next block to play</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk18" data-link-type="dependency"><polygon points="191.991,133.304,201.775,136.391,197.166,132.719,200.838,128.111,191.991,133.304" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M197.166,132.719 C203.387,132.016 204.415,131.996 210.417,131.543 C299.371,124.829 650.682,120.117 857.292,130.501 C919.299,133.618 989.331,142.726 1039.902,150.311" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="legend" data-source-line="45"><rect x="187.862" y="437.793" width="863.859" height="97.38" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="194.112" y="457.58" fill="#E6EDF7" font-size="14.583" textLength="851.359">RX reserve: 3 queued blocks × 4 ms = 12 ms. No free block when the DMA needs one: RX error state, stream stops.</text><text x="194.112" y="474.555" fill="#E6EDF7" font-size="14.583" textLength="839.197">TX reserve: 3 queued blocks × 4 ms = 12 ms. Empty queue when a block completes: TX error state, stream stops.</text><text x="194.112" y="491.531" fill="#E6EDF7" font-size="14.583" textLength="849.885">RX starts before TX, so in normal operation the TX queue can briefly hold 4 blocks and all 5 TX blocks can be in use.</text><text x="194.112" y="508.507" fill="#E6EDF7" font-size="14.583" textLength="836.413">Stop: STOP lets each DMA block finish and return (RX into its queue, TX to its pool); DROP then frees both queues.</text><text x="194.112" y="525.483" fill="#E6EDF7" font-size="14.583" textLength="770.396">Block = 64 frames × 2 slots × 4 bytes. Pools fixed at build time in internal DMA-capable RAM; no PSRAM.</text></g><?plantuml-src bLPHRzis47xNhxYsBvrX1vRin9wR1aZM5IZGTbbiO7amK53IoI8YaHf9rJM6_exzeFsn7KKffXGlw9xi-8xVVNVVyMDUc1nBXEGGIxKBNbIAxKe61Jl8se0kqJ310lt0HSKKAq7dB9LxBdQGiKAZ5qanOtLXtajXFZD2N3EXrwXuvkN4B7dOALcBz1TPI0Mlfd4u3PUdKTeKlC0qMtWfrqh9VHjaFyVBX0s3pvrMc51BkmBXhm1kXdoYnIoQXnIGAaNL_dWHBcPB5i1Js270vQN95RBqwWfUXTFPD8fxK7xuF4eMyVm4GghuLrGDmZAQpou62CVmOXbFSHvyzveJqfpkAuoZyzdiX_lw7XXkQ4H_v19oMQGQa2Kvd8VH93vGYRYGoSCOc4Wfl0TkQAocLaA3aVINXahA8YWmC_O7nNUvWPJRqNCfWgC4B-_kLt3kuFHBODhAWzJWcgTD8z3BRM37a2d4hVWOVlaGhSV0XK4bM05trvzyY5jBeGV08ps5Tv-kjoBZHQ4XxFgOGzchJZbmdFG941S2OlHdZJMHgIlRw0mIMLO56apRdhP2I5MoeZW0bfKv-5L-jqV_imwhKox1xSjMj5IXG66sOZJgnitDQ0HxRlAj869V51R8DDwv0kcDFRCLCMPI8O4JMMtitMMmkNU8Fg5DKmoEMqfxu37Q3BKoYgvuoSqfiJO_A5Q7yLIj_W1wYlLEFcKzr2lizDeywZLpNr9W6H62Il6IvjB3VLwU1hRPfOgySh1BLg6sP2lKQBGLPBHWaxlbw5KRh5mp-6wBOJAvybTprVLZs0Dg4jFEs646NfftolMoQfUeMzAW5_NIsv6kmErKyzkD3z-mkfnC-WS2Nym6Rw2H0wJR81DcSDC67V8WrJ_TiRU7pSb3nmxyUQv0u3VJDatNqmw_pz6su9qWnzeXULeiZP4b2KuNNA56zHLNyBWoxWR0FtytMiDR22FwF8FFqXC2zZaAi99R9WAHF5GAWY58f3TAWJOqWp5zKB_qhXfPwJCgkVa_9N-rdkAIN44sa5YlBE2p1OaGHHIPTkiJctjA8XiNuBmBP8MAMUTk-kak4IHCGAmuPcHkzf4WRYrF-owGokGMdSrebuqMjTPewww9m0hMczzkoTLC-yBOORaECYwupXieTuVWDJ4b_t0FJ4DXRF6z5-UdD_3kZl2C7ONLGbifSvVSDDki3StlOavn-Y-bcMa4kf2c7QzztsYoTZqqaVXcFO9sgERKeE5bqy6ZYn7TIS8g5fCbaAEzeOd1xPg-dGMqHswR_WK0?></g></svg>