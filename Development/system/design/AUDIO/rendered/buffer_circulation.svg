<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1241px;height:523px;background:#0B1018;" width="1241.667px" height="523.958px" viewBox="0 0 1241 523" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1241.667" height="523.958" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="23"><rect x="250.281" y="20.833" width="739.022" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="256.531" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="726.522" font-weight="700">Who holds each 512-byte block, and how it returns to its pool</text></g><!--cluster receiveSide--><g class="cluster" data-qualified-name="receiveSide" id="ent0001" data-source-line="25"><rect x="25" y="241.96" width="1203.125" height="166.667" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="583.24" y="255.646" fill="#E6EDF7" font-size="12.5" textLength="86.646" font-weight="700">RX: 5 blocks</text></g><!--cluster transmitSide--><g class="cluster" data-qualified-name="transmitSide" id="ent0006" data-source-line="31"><rect x="25" y="73.21" width="1173.438" height="152.083" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="568.945" y="86.896" fill="#E6EDF7" font-size="12.5" textLength="85.547" font-weight="700">TX: 5 blocks</text></g><!--entity receivePool--><g class="entity" data-qualified-name="receiveSide.receivePool" id="ent0002" data-source-line="26"><rect x="41.667" y="286.751" width="149.697" height="49.935" fill="#273241" style="stroke:#61738A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="52.083" y="308.771" fill="#E6EDF7" font-size="12.5" textLength="80.792">RX pool, free</text><text x="52.083" y="323.322" fill="#E6EDF7" f