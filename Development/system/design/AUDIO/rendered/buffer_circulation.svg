th d="M489.7339,199.9919 C536.3402,199.9919 600.8533,199.9919 654.9272,199.9919" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="98.1201" x="530.2083" y="189.1927">i2s_transmitBlock</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk18"><polygon fill="#A9B8CA" points="994.6314,191.7813,985.127,187.9191,989.4258,191.9492,985.3957,196.2481,994.6314,191.7813" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M817.0405,197.51 C871.0459,195.7679 936.3746,193.6606 988.3847,191.9828" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="95.3613" x="850" y="182.9427">next block to play</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0011" data-link-type="dependency" id="lnk19"><polygon fill="#A9B8CA" points="180.6155,143.6771,190.6252,145.926,185.7229,142.6565,188.9923,137.7542,180.6155,143.6771" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M186.7444,142.4524 C192.9111,141.2202 192.9545,141.3928 198.9583,140.6169 C268.2892,131.657 286.343,140.3833 356.25,140.6169 C564.1239,141.3113 616.4575,131.2753 823.9583,143.7419 C881.1673,147.179 895.8458,147.2788 952.0833,158.3252 C966.0237,161.0634 980.7648,164.6865 994.7902,168.493" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="legend" data-source-line="45"><rect fill="none" height="121.3257" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="769.7856" x="198.4406" y="472.9085"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="746.8689" x="209.8989" y="499.7192">RX reserve: 3 queued blocks &#215; 4 ms = 12 ms. No free block when the DMA needs one: RX error state, stream stops.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="731.7444" x="209.8989" y="519.401">TX reserve: 3 queued blocks &#215; 4 ms = 12 ms. Empty queue when a block completes: TX error state, stream stops.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="742.3971" x="209.8989" y="539.0828">RX starts before TX, so in normal operation the TX queue can briefly hold 4 blocks and all 5 TX blocks can be in use.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="733.0831" x="209.8989" y="558.7646">Stop: STOP lets each DMA block finish and return (RX into its queue, TX to its pool); DROP then frees both queues.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="676.0885" x="209.8989" y="578.4465">Block = 64 frames &#215; 2 slots &#215; 4 bytes. Pools fixed at build time in internal DMA-capable RAM; no PSRAM.</text></g><?plantuml-src bLPHRzis47xNhxYsBwrX1vRin9wR1KZM5HYmTbbiO7amK53IoI8YaHf9rJM6_exzeFwn7aKffXGlw9xi-8xVVTzznsDUc1nBXEGGIxKBNbIAxKe61Jl8se0kqJ310lt0HSKKAq7dB9LxBdQGiKAZ5qanOtLXtajXFZ92N3EXrwXuvkN4B7dOALcBz1TPI0Mlfd4u3PUdKTeKlC0qMtWfrqh9VHjaFyNBX0s3pvrMc92aNO7mJm0tGpxHOXRDGmf8bQ9gVxm85xCb2-0fx13WyjBa2bbwTGMlmkbi6iKzA3zy7YMBU7u28LNyCwe6OHdDPnS3X6DuiOodE0--UkA4DATrXN5qFflziAwlWU66MlHNBY6NHQe1MPB3UHXDuWELY0kPF8o1YPJ2U-26scfg9JGOINzfgAGiu7MAck_4sD82NbO53PemcBu92ioCJLLybnj8kJM5In4SpNbvTx-2SrT8lmIchN58qjSyRIH2BxSfE8PC8Mx5x-6dtwBr63WLKu8LS7VzmOUufTm-08_q5DvzkDwAZ1U5Xh1JE8UoLvrouEZ12H0N0cBqTuqraQahAtG6YRGD8FMjfgqGKfMiA0w0PMKEVfK_xT7_hCFgb4jmaxGLBLKegBLRCHfrHd0p6i6UctmhYDWdXGKoZNUkG7fZpsn5Z9bKIE14LXjxgnbixXsYJsZJ58FZ_DA4U8msGw-CeijVSdFAhCqFcjLXF7Mhtu2UOxsJJraF_GexlpQFVitSbnHOHeIWKhoallHmdxUdWMrcgQ8jEfWbwr1RiZLgDDeAMi5WaxlXw5KRZ5pJ-6wAOJAvyaTprUanx04rcMbxx303ByqxvRIisY7gXZJeHRtqjgKhS3FL_7RZmpUiBYUJ_e70DxF16tZa0Easo8GPtBH1Xpn8zKztxErXS_BGKO7VpnK8_69QqNGzRVFx7Aq4xmHjh1tIjekbCR8am-c2AzIeFkCA7aV6tG3uzc_ZDVmCOKIVP_1HUaR0FaS1rdBBH