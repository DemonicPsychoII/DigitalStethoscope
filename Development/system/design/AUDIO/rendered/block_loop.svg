<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2459.375px" preserveAspectRatio="none" style="width:730px;height:2459px;background:#0B1018;" version="1.1" viewBox="0 0 730 2459" width="730.2083px" zoomAndPan="magnify"><title>L2_AUDIO block loop: one iteration per 4 ms block</title><defs/><g><rect fill="#0B1018" height="2459.375" style="stroke:none;stroke-width:1.0417;" width="730.2083" x="0" y="0"/><g class="title" data-source-line="18"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="509.4279" x="109.0444" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="486.5112" x="120.5027" y="54.2236">L2_AUDIO block loop: one iteration per 4 ms block</text></g><ellipse cx="186.8327" cy="93.7419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="211.4543" x="81.1056" y="124.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="188.5376" x="92.5639" y="149.6094">Start command from L2_CONTROL</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="253.6051" x="60.0301" y="185.612"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="48.4375" x="71.4884" y="210.2295">i2s_start</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6885" x="71.4884" y="227.0996">prime 4 silent TX blocks, start RX, then TX</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="162.9679" x="105.3487" y="322.9492"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="140.0513" x="116.807" y="347.5667">i2s_start drops both links</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="245.6217" x="64.0218" y="383.5693"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.7051" x="75.4801" y="408.1868">start failure (fault event) to L2_CONTROL</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="102.7873" x="135.439" y="450.2869"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="79.8706" x="146.8974" y="474.9044">wait for restart</text><ellipse cx="186.8327" cy="522.3653" fill="none" rx="11.4583" ry="11.4583" style="stroke:#55B2DE;stroke-width:1.0417;"/><ellipse cx="186.8327" cy="522.3653" fill="none" rx="6.25" ry="6.25" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="#273241" points="151.6744,263.269,221.991,263.269,234.491,276.9124,221.991,290.5558,151.6744,290.5558,139.1744,276.9124,151.6744,263.269" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="56.1646" x="196.2077" y="308.9233">a link fails</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="59.8999" x="156.8827" y="281.6366">start result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="15.979" x="239.6993" y="267.9932">OK</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="185.966" x="93.8497" y="577.5736"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="163.0493" x="105.308" y="602.1912">started event to L2_CONTROL</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="350.7487" x="11.4583" y="684.0271"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="22.9167" y="708.6446">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="91.626" x="54.9601" y="708.6446">i2s_receiveBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="327.832" x="22.9167" y="725.5147">waits for the next completed RX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="124.2472" x="124.7091" y="821.3643"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="101.3306" x="136.1674" y="845.9819">microphone failure</text><ellipse cx="186.8327" cy="897.4569" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,893.9738 L185.2865,893.9738 L185.2865,896.7082 L188.7533,896.7082 L188.7533,897.5545 L185.2865,897.5545 L185.2865,901.6235 L184.2122,901.6235 L184.2122,893.0461 L189.4694,893.0461 L189.4694,893.9738 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,761.6842,207.5134,761.6842,220.0134,775.3276,207.5134,788.9709,166.1519,788.9709,153.6519,775.3276,166.1519,761.6842" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="118.7988" x="196.2077" y="807.3385">timeout or driver error</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="780.0517">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="94.6167" x="225.2218" y="766.4083">OK: RX block lent</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="336.4787" x="18.5933" y="951.6235"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.585" x="30.0517" y="976.241">take the left slot (even index) of each of the 64 frames</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="313.562" x="30.0517" y="993.1112">into the 64-entry mono working buffer (low 8 bits cleared)</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="180.1921" x="96.7367" y="1029.1138"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="151.9165" x="108.195" y="1053.7313">i2s_releaseReceivedBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="157.2754" x="108.195" y="1070.6014">RX block back to the RX pool</text><path d="M347.4264,1096.1873 L347.4264,1153.0477 L326.593,1157.2144 L347.4264,1161.381 L347.4264,1218.2414 A0,0 0 0 0 347.4264,1218.2414 L691.0583,1218.2414 A0,0 0 0 0 691.0583,1218.2414 L691.0583,1106.604 L680.6417,1096.1873 L347.4264,1096.1873 A0,0 0 0 0 347.4264,1096.1873" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M680.6417,1096.1873 L680.6417,1106.604 L691.0583,1106.604 L680.6417,1096.1873" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="268.6523" x="358.8847" y="1119.7632">Processing budget (P02): from the received block</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.3403" x="358.8847" y="1136.6333">to the queued TX block at most 3 ms of the 4 ms period;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="173.9746" x="358.8847" y="1153.5034">the receive wait is not part of it.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="193.4814" x="358.8847" y="1170.3735">No lock is held across a block wait.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="280.603" x="358.8847" y="1187.2437">The thread holds at most one RX and one TX block:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="207.9346" x="358.8847" y="1204.1138">RX is returned before TX is requested.</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="279.5207" x="47.0723" y="1128.8859"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="134.0576" x="58.5307" y="1153.5034">process the mono buffer</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.604" x="58.5307" y="1170.3735">this step: copy; later listening filter and volume</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="276.1271" x="48.7691" y="1239.0747"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="60.2275" y="1263.6922">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="143.2983" x="92.2709" y="1263.6922">i2s_allocateTransmitBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.2104" x="60.2275" y="1280.5623">waits for a free TX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="95.5363" x="139.0645" y="1387.3108"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6196" x="150.5229" y="1411.9283">output failure</text><ellipse cx="186.8327" cy="1463.4033" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,1459.9202 L185.2865,1459.9202 L185.2865,1462.6546 L188.7533,1462.6546 L188.7533,1463.501 L185.2865,1463.501 L185.2865,1467.57 L184.2122,1467.57 L184.2122,1458.9925 L189.4694,1458.9925 L189.4694,1459.9202 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,1327.6306,207.5134,1327.6306,220.0134,1341.274,207.5134,1354.9174,166.1519,1354.9174,153.6519,1341.274,166.1519,1327.6306" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="41.4307" x="196.2077" y="1373.2849">timeout</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="1345.9981">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="95.874" x="225.2218" y="1332.3547">OK: TX block held</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="305.9977" x="33.8338" y="1517.57"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="283.0811" x="45.2922" y="1542.1875">write each mono sample into both slots of its frame</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="191.154" x="91.2557" y="1578.1901"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="104.7607" x="102.714" y="1602.8076">i2s_transmitBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="168.2373" x="102.714" y="1619.6777">ownership passes to the driver</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="240.6291" x="66.5181" y="1715.5273"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.7124" x="77.9765" y="1740.1449">L1_I2S returns the block to the TX pool,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="100.5737" x="77.9765" y="1757.015">then output failure</text><ellipse cx="186.8327" cy="1803.4342" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,1799.9512 L185.2865,1799.9512 L185.2865,1802.6855 L188.7533,1802.6855 L188.7533,1803.5319 L185.2865,1803.5319 L185.2865,1807.6009 L184.2122,1807.6009 L184.2122,1799.0234 L189.4694,1799.0234 L189.4694,1799.9512 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,1655.8472,207.5134,1655.8472,220.0134,1669.4906,207.5134,1683.134,166.1519,1683.134,153.6519,1669.4906,166.1519,1655.8472" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="33.9355" x="196.2077" y="1701.5015">failure</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="1674.2147">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="15.979" x="225.2218" y="1660.5713">OK</text><rect fill="#4A3A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="281.0832" x="46.2911" y="1857.6009"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="74.939" x="57.7494" y="1882.2184">STOP CHECK</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="179.48" x="136.436" y="1882.2184">command queue, without waiting</text><polygon fill="#273241" points="186.8327,638.