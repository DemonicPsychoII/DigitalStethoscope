<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2144.7917px" preserveAspectRatio="none" style="width:730px;height:2144px;background:#0B1018;" version="1.1" viewBox="0 0 730 2144" width="730.2083px" zoomAndPan="magnify"><title>L2_AUDIO block loop: one iteration per 4 ms block</title><defs/><g><rect fill="#0B1018" height="2144.7917" style="stroke:none;stroke-width:1.0417;" width="730.2083" x="0" y="0"/><g class="title" data-source-line="18"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="509.4279" x="109.0444" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="486.5112" x="120.5027" y="54.2236">L2_AUDIO block loop: one iteration per 4 ms block</text></g><ellipse cx="186.8327" cy="93.7419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="211.4543" x="81.1056" y="124.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="188.5376" x="92.5639" y="149.6094">Start command from L2_CONTROL</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="253.6051" x="60.0301" y="185.612"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="48.4375" x="71.4884" y="210.2295">i2s_start</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6885" x="71.4884" y="227.0996">prime 4 silent TX blocks, start RX, then TX</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="185.966" x="93.8497" y="263.1022"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="163.0493" x="105.308" y="287.7197">started event to L2_CONTROL</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="350.7487" x="11.4583" y="369.5557"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="22.9167" y="394.1732">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="91.626" x="54.9601" y="394.1732">i2s_receiveBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="327.832" x="22.9167" y="411.0433">waits for the next completed RX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="124.2472" x="124.7091" y="506.8929"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="101.3306" x="136.1674" y="531.5104">microphone failure</text><ellipse cx="186.8327" cy="582.9854" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,579.5024 L185.2865,579.5024 L185.2865,582.2367 L188.7533,582.2367 L188.7533,583.0831 L185.2865,583.0831 L185.2865,587.1521 L184.2122,587.1521 L184.2122,578.5746 L189.4694,578.5746 L189.4694,579.5024 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,447.2127,207.5134,447.2127,220.0134,460.8561,207.5134,474.4995,166.1519,474.4995,153.6519,460.8561,166.1519,447.2127" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="118.7988" x="196.2077" y="492.867">timeout or driver error</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="465.5802">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="94.6167" x="225.2218" y="451.9368">OK: RX block lent</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="336.4787" x="18.5933" y="637.1521"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.585" x="30.0517" y="661.7696">take the left slot (even index) of each of the 64 frames</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="313.562" x="30.0517" y="678.6397">into the 64-entry mono working buffer (low 8 bits cleared)</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="180.1921" x="96.7367" y="714.6423"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="151.9165" x="108.195" y="739.2598">i2s_releaseReceivedBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="157.2754" x="108.195" y="756.13">RX block back to the RX pool</text><path d="M347.4264,781.7159 L347.4264,838.5763 L326.593,842.7429 L347.4264,846.9096 L347.4264,903.7699 A0,0 0 0 0 347.4264,903.7699 L691.0583,903.7699 A0,0 0 0 0 691.0583,903.7699 L691.0583,792.1326 L680.6417,781.7159 L347.4264,781.7159 A0,0 0 0 0 347.4264,781.7159" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M680.6417,781.7159 L680.6417,792.1326 L691.0583,792.1326 L680.6417,781.7159" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="268.6523" x="358.8847" y="805.2917">Processing budget (P02): from the received block</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.3403" x="358.8847" y="822.1619">to the queued TX block at most 3 ms of the 4 ms period;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="173.9746" x="358.8847" y="839.032">the receive wait is not part of it.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="193.4814" x="358.8847" y="855.9021">No lock is held across a block wait.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="280.603" x="358.8847" y="872.7722">The thread holds at most one RX and one TX block:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="207.9346" x="358.8847" y="889.6423">RX is returned before TX is requested.</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="279.5207" x="47.0723" y="814.4145"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="134.0576" x="58.5307" y="839.032">process the mono buffer</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.604" x="58.5307" y="855.9021">this step: copy; later listening filter and volume</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="276.1271" x="48.7691" y="924.6033"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="60.2275" y="949.2208">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="143.2983" x="92.2709" y="949.2208">i2s_allocateTransmitBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.2104" x="60.2275" y="966.0909">waits for a free TX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="95.5363" x="139.0645" y="1072.8394"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6196" x="150.5229" y="1097.4569">output failure</text><ellipse cx="186.8327" cy="1148.9319" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,1145.4488 L185.2865,1145.4488 L185.2865,1148.1832 L188.7533,1148.1832 L188.7533,1149.0295 L185.2865,1149.0295 L185.2865,1153.0986 L184.2122,1153.0986 L184.2122,1144.5211 L189.4694,1144.5211 L189.4694,1145.4488 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,1013.1592,207.5134,1013.1592,220.0134,1026.8026,207.5134,1040.446,166.1519,1040.446,153.6519,1026.8026,166.1519,1013.1592" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="41.4307" x="196.2077" y="1058.8135">timeout</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="1031.5267">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="95.874" x="225.2218" y="1017.8833">OK: TX block held</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="305.9977" x="33.8338" y="1203.0986"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="283.0811" x="45.2922" y="1227.7161">write each mono sample into both slots of its frame</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="191.154" x="91.2557" y="1263.7187"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="104.7607" x="102.714" y="1288.3362">i2s_transmitBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="168.2373" x="102.714" y="1305.2063">ownership passes to the driver</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="240.6291" x="66.5181" y="1401.0559"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.7124" x="77.9765" y="1425.6734">L1_I2S returns the block to the TX pool,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="100.5737" x="77.9765" y="1442.5435">then output failure</text><ellipse cx="186.8327" cy="1488.9628" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M189.4694,1485.4797 L185.2865,1485.4797 L185.2865,1488.2141 L188.7533,1488.2141 L188.7533,1489.0605 L185.2865,1489.0605 L185.2865,1493.1295 L184.2122,1493.1295 L184.2122,1484.552 L189.4694,1484.552 L189.4694,1485.4797 Z " fill="#E6EDF7"/><polygon fill="#273241" points="166.1519,1341.3757,207.5134,1341.3757,220.0134,1355.0191,207.5134,1368.6625,166.1519,1368.6625,153.6519,1355.0191,166.1519,1341.3757" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="33.9355" x="196.2077" y="1387.03">failure</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="171.3603" y="1359.7432">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="15.979" x="225.2218" y="1346.0999">OK</text><rect fill="#4A3A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="281.0832" x="46.2911" y="1543.1295"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="74.939" x="57.7494" y="1567.747">STOP CHECK</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" len