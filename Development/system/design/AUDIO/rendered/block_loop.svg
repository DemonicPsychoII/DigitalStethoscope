<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2144.7917px" preserveAspectRatio="none" style="width:813px;height:2144px;background:#0B1018;" version="1.1" viewBox="0 0 813 2144" width="813.5417px" zoomAndPan="magnify"><title>L2_AUDIO block loop: one iteration per 4 ms block (design, not implemented)</title><defs/><g><rect fill="#0B1018" height="2144.7917" style="stroke:none;stroke-width:1.0417;" width="813.5417" x="0" y="0"/><g class="title" data-source-line="18"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="769.0511" x="20.8333" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="746.1344" x="32.2917" y="54.2236">L2_AUDIO block loop: one iteration per 4 ms block (design, not implemented)</text></g><ellipse cx="228.4332" cy="93.7419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="211.4543" x="122.7061" y="124.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="188.5376" x="134.1644" y="149.6094">Start command from L2_CONTROL</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="253.6051" x="101.6307" y="185.612"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="48.4375" x="113.089" y="210.2295">i2s_start</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6885" x="113.089" y="227.0996">prime 4 silent TX blocks, start RX, then TX</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="185.966" x="135.4502" y="263.1022"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="163.0493" x="146.9086" y="287.7197">started event to L2_CONTROL</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="350.7487" x="53.0589" y="369.5557"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="64.5172" y="394.1732">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="91.626" x="96.5607" y="394.1732">i2s_receiveBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="327.832" x="64.5172" y="411.0433">waits for the next completed RX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="124.2472" x="166.3096" y="506.8929"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="101.3306" x="177.7679" y="531.5104">microphone failure</text><ellipse cx="228.4332" cy="582.9854" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M231.0699,579.5024 L226.887,579.5024 L226.887,582.2367 L230.3538,582.2367 L230.3538,583.0831 L226.887,583.0831 L226.887,587.1521 L225.8128,587.1521 L225.8128,578.5746 L231.0699,578.5746 L231.0699,579.5024 Z " fill="#E6EDF7"/><polygon fill="#273241" points="207.7525,447.2127,249.114,447.2127,261.614,460.8561,249.114,474.4995,207.7525,474.4995,195.2525,460.8561,207.7525,447.2127" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="118.7988" x="237.8082" y="492.867">timeout or driver error</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="212.9608" y="465.5802">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="94.6167" x="266.8223" y="451.9368">OK: RX block lent</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="336.4787" x="60.1939" y="637.1521"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.585" x="71.6522" y="661.7696">take the left slot (even index) of each of the 64 frames</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="313.562" x="71.6522" y="678.6397">into the 64-entry mono working buffer (low 8 bits cleared)</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="180.1921" x="138.3372" y="714.6423"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="151.9165" x="149.7955" y="739.2598">i2s_releaseReceivedBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="157.2754" x="149.7955" y="756.13">RX block back to the RX pool</text><path d="M389.0269,781.7159 L389.0269,838.5763 L368.1936,842.7429 L389.0269,846.9096 L389.0269,903.7699 A0,0 0 0 0 389.0269,903.7699 L732.6589,903.7699 A0,0 0 0 0 732.6589,903.7699 L732.6589,792.1326 L722.2422,781.7159 L389.0269,781.7159 A0,0 0 0 0 389.0269,781.7159" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M722.2422,781.7159 L722.2422,792.1326 L732.6589,792.1326 L722.2422,781.7159" fill="#1B2533" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="268.6523" x="400.4852" y="805.2917">Processing budget (P02): from the received block</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.3403" x="400.4852" y="822.1619">to the queued TX block at most 3 ms of the 4 ms period;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="173.9746" x="400.4852" y="839.032">the receive wait is not part of it.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="193.4814" x="400.4852" y="855.9021">No lock is held across a block wait.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="280.603" x="400.4852" y="872.7722">The thread holds at most one RX and one TX block:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="207.9346" x="400.4852" y="889.6423">RX is returned before TX is requested.</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="279.5207" x="88.6729" y="814.4145"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="134.0576" x="100.1312" y="839.032">process the mono buffer</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.604" x="100.1312" y="855.9021">this step: copy; later listening filter and volume</text><rect fill="#345E87" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="276.1271" x="90.3697" y="924.6033"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="28.2959" x="101.828" y="949.2208">WAIT</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="143.2983" x="133.8715" y="949.2208">i2s_allocateTransmitBlock</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.2104" x="101.828" y="966.0909">waits for a free TX block, at most 20 ms (P11)</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="95.5363" x="180.6651" y="1072.8394"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6196" x="192.1234" y="1097.4569">output failure</text><ellipse cx="228.4332" cy="1148.9319" fill="none" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><path d="M231.0699,1145.4488 L226.887,1145.4488 L226.887,1148.1832 L230.3538,1148.1832 L230.3538,1149.0295 L226.887,1149.0295 L226.887,1153.0986 L225.8128,1153.0986 L225.8128,1144.5211 L231.0699,1144.5211 L231.0699,1145.4488 Z " fill="#E6EDF7"/><polygon fill="#273241" points="207.7525,1013.1592,249.114,1013.1592,261.614,1026.8026,249.114,1040.446,207.7525,1040.446,195.2525,1026.8026,207.7525,1013.1592" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="41.4307" x="237.8082" y="1058.8135">timeout</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="212.9608" y="1031.5267">result</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="95.874" x="266.8223" y="1017.8833">OK: TX block held</text><rect fill="#273241" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="305.9977" x="75.4344" y="1203.0986"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="283.0811" x="86.8927" y="1227.7161">write each mono sample into both slots of its frame</text><rect fill="#273241" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:1.0417;" width="191.154" x="132.8562" y="1263.7187"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="104.7607" x="144.3146" y="1288.3362">i2s_transmitBlock</text><text fil