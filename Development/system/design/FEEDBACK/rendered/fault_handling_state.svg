2.5212">/ halt, every input blocked</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" data-link-type="dependency" id="lnk20"><polygon fill="#A9B8CA" points="1600.8872,358.1353,1596.0445,349.0909,1596.7758,354.9379,1590.9288,355.6693,1600.8872,358.1353" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1569.6261,258.4571 C1566.542,277.3456 1564.5709,306.0366 1575,328.1169 C1580.6404,340.0586 1585.7298,346.3479 1595.9535,354.2985" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="123.291" x="1600.5168" y="300.651">non-audio halting error</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="159.7412" x="1582.2917" y="317.5212">while listening / latch silently</text></g><g class="link" data-entity-1="ent0013" data-entity-2="ent0011" data-link-type="dependency" id="lnk21"><polygon fill="#A9B8CA" points="1756.144,513.3128,1747.1105,508.4499,1750.9505,512.9194,1746.481,516.7594,1756.144,513.3128" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1621.6738,400.2152 C1609.7207,421.8617 1596.1788,456.2042 1614.5833,478.1169 C1632.6162,499.5871 1694.2941,508.6276 1749.9118,512.8407" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="69.1406" x="1687.5366" y="450.651">manual Stop</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="200.4639" x="1621.875" y="467.5212">[cleared by short press] / show error</text></g><g class="link" data-entity-1="ent0013" data-entity-2="ent0012" data-link-type="dependency" id="lnk22"><polygon fill="#A9B8CA" points="1378.5373,496.5149,1384.3059,488.0311,1379.4642,491.3897,1376.1056,486.5481,1378.5373,496.5149" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1593.8087,400.0017 C1576.8031,407.4444 1556.5802,415.2048 1537.5,419.7835 C1510.3955,426.2879 1435.065,413.8361 1412.5,430.2002 C1391.1364,445.693 1383.3236,470.0499 1379.6496,490.3647" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="69.1406" x="1472.3429" y="450.651">manual Stop</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="174.2432" x="1419.7917" y="467.5212">[cleared by restart] / show error</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0010" data-link-type="dependency" id="lnk23"><polygon fill="#A9B8CA" points="1622.2072,244.2015,1630.9721,249.5334,1627.3727,244.8679,1632.0383,241.2686,1622.2072,244.2015" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1883.617,496.7806 C1915.4067,481.0478 1954.2033,455.7032 1972.9167,419.7835 C1987.89,391.0426 1992.0798,373.0014 1972.9167,346.8669 C1931.2724,290.0727 1725.2169,257.4901 1628.4058,245.0012" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="97.8638" x="1995.0765" y="375.651">acknowledgement</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="102.6001" x="1992.7083" y="392.5212">/ no Start, no retry</text></g><g class="legend" data-source-line="59"><rect fill="none" height="160.6893" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="923.4802" x="20.8333" y="559.3669"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="805.0171" x="32.2917" y="586.1776">The regions are coupled only by the catalogue error event and the acknowledgement; recovery success does not acknowledge.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="878.7313" x="32.2917" y="605.8594">Green: implemented at integration 994ce24 (COMMUNICATION keeps an internal log-once flag per episode; it reports no catalogue code).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="900.5636" x="32.2917" y="625.5412">Grey: documented, not implemented. CONTROL handles only the long press; there is no red LED driver and no short-press acknowledgement.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="669.7795" x="32.2917" y="645.223">Recovery episode: start cancellation alone raises no error; Wi-Fi and delivery errors have no episode rule.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="731.5308" x="32.2917" y="664.9048">Indication: several errors show the highest priority, then the first latched. With a short-press-clearable error shown,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="810.8276" x="32.2917" y="684.5866">the first short press acknowledges it; later presses Start and Stop (13 November). Errors during listening are shown after Stop.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="772.1049" x="32.2917" y="704.2684">Admission: acknowledgement never starts, retries or changes an active workflow. Restart = reset button or power off/on.</text></g><?plantuml-src hLRVRzis47xNNt7jNjh1JkgaQrEdA-0wJX4iTGOdRHxI8A35aqs49ZMIYc4C-zzt92LPakDY3tkonJj-lFlkvmktn1L2kfbhiqXUv8OjLWmas-Z2WLsXOuebzb6ed1cs0hjaNA-5Ma36fCM6X6F62kdEjN9JHeZNJDbhD29hwCnP-hWmkb1yhAKsyCkR-U3DuEHvb585to7FtZTKHiReTIba7-OdQSi-nnp2tmbyxZur60nEZjwHG1kEfds_g_tnerZbadXH3lcdJtGvEvuVyTRb7PtVidbsyXmMrscnLJjwVtpqTj21Qgky6xm_9gH_4YUSH3ZtZC2IAIw9-24OJFKJcaqFXE8YPKve1II5jJQFcTHhO7mbh0t71i6YvuPeCRYWCvii1KV0LUusnBTDZSWzH994ybxEIdp0N5ZDSGZNazdtoUnXV3MTJiOt5rVJX_FHnUMtsIGyUpRvVZ6UFCmcNowkRsQZbbmhkNa9p48DskMDObM-EtfYGhAvn72X_ghbtnIhpYhJWcRZF86xN--Xt__Kl5x_3O8coX1o4yd