ecovery success does not acknowledge.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="878.7313" x="32.2917" y="478.776">Green: implemented at integration 994ce24 (COMMUNICATION keeps an internal log-once flag per episode; it reports no catalogue code).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="900.5636" x="32.2917" y="498.4578">Grey: documented, not implemented. CONTROL handles only the long press; there is no red LED driver and no short-press acknowledgement.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="669.7795" x="32.2917" y="518.1396">Recovery episode: start cancellation alone raises no error; Wi-Fi and delivery errors have no episode rule.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="715.2527" x="32.2917" y="537.8215">Indication: several errors show the highest priority, then the first latched. Acknowledgement versus Start or Stop</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="512.8235" x="32.2917" y="557.5033">while an offline-permitting error is latched is not determined (see the catalogue).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="772.1049" x="32.2917" y="577.1851">Admission: acknowledgement never starts, retries or changes an active workflow. Restart = reset button or power off/on.</text></g><?plantuml-src ZLRVRzis47xNNt7jNjh1JkkaQrEd2-0wJX0iTGOxRH_I8A35aqo49ZMIYc4C-zztf2XPifEYJnPvn_lntNTtVk6Mk498DmjjykH5OLY-OY3PHfSEx0eTKoon3q8LpB0Ls2NZUYrK3XcJ5biIZXahfJlNoaqPMPmpPUTeHDRIMR3q8JUwL7oifJRmszl5uEtW-6ahKGNV8yy-j5H6nkXr5BAFY-Eq4vzZ3k7V13xlkXeC1iU7xqcW3KVJVR-h_UcJM1MIS54E-UafFSwE5eUyytXFvuziaHq_POlhjDog7NuuEdmts37LLNa_-714blvBd70IuTmZ0akck2JWXs0mrOzeDZqGYekKEQ4La1JMsZnaKg-1yPMmDbmR18iU6uB5O4vtDba