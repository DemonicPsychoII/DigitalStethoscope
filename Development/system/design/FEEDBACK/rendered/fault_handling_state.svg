edgement; recovery success does not acknowledge.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="669.7795" x="32.2917" y="452.7344">Recovery episode: start cancellation alone raises no error; Wi-Fi and delivery errors have no episode rule.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="715.2527" x="32.2917" y="472.4162">Indication: several errors show the highest priority, then the first latched. Acknowledgement versus Start or Stop</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="512.8235" x="32.2917" y="492.098">while an offline-permitting error is latched is not determined (see the catalogue).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="772.1049" x="32.2917" y="511.7798">Admission: acknowledgement never starts, retries or changes an active workflow. Restart = reset button or power off/on.</text></g><?plantuml-src ZLLHRzis47xNhxXsB-bW9yqUkYp51hYEKWGDx45EcuSq26ZnP1EXI8saR1Z3_lkE52LBTbBqoJBl-DtTTn_lthWrbWZvRgdDAdbJ6ROg6KYsqxK3Mw9ZYYNsMQYA6LQ2NJEkjqAje63IOi_2iM2rTDTQkHaZn0LJTe5653sV9SkVLqRNYa-rr0P-URyyVtz-yJ9ATC4Fo8lVUouJO_Gs6jaVoujya9zZ3k7V13uTXZe_Fx_uxGCPjE5eXlV_Ivnm4k7QnuOrKrnIYPTWCDSRDBiH2CL5pfpG2iWAMssU2wctm7Wfh0t71i6Ypu8ICBYYCvki1KV0id8xgipcHbGU8acQDDzc4H-m4bPpl8H5cdrBiwVfV3PBftStyzdJzUJczckMXh1NwRURQVgKfPzl5dVPP63NIkxU0hFGWH8BCSvamuHaIud1eVlNsRygrfwrgGJFtda23xy-mdZyL_zwznaCVPHBg4n3XkU6gFQCM1V_5-Hclwipa7e5EQijZiZXdngj8-cvV9qCm8x1MUrqILWvNNDKwW3GCp42fSasVWLjyWCiM-Sv8WzmaGn0nUr01BNAIIOhvAITjfitUtC82oS6EInhv-ZaDhrw5pZjUUqRDDE096j3xqjlLV2RIcIcSqY3DS0Y3_RRvhlpMFYRb9SJaWgXG-EY7C9tvzwsCUA7dt0GFOWHIeyHaJKsINrN3_JY8FUUlg2Tpz8uts5h7_iGmrW_WnGp9PJsqZ2LzWNskl9WqT3HQ22fHzyjWjhPbgGXOfFZPJzpe0cXz5OYNs5eTffby-nfClqoczzJkpwdLr18Paa-1tMzM6eFsOEH_B0eC7SzWTmVJuqJUkbtsVosqSQaEzzBO-73G8Mc5Cx5tl_T_ZlmMagTFoCVaQQvq53MxOLFZQ5pZ_zVa4kqnFBsSkc5x3w71kBW