1.4027 1556.5802,389.1631 1537.5,393.7419 C1510.3955,400.2463 1435.065,387.7944 1412.5,404.1585 C1391.1364,419.6514 1383.3236,444.0082 1379.6496,464.323" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="69.1406" x="1472.3429" y="424.6094">manual Stop</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="174.2432" x="1419.7917" y="441.4795">[cleared by restart] / show error</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0010" data-link-type="dependency" id="lnk23"><polygon fill="#A9B8CA" points="1622.2072,218.1599,1630.9721,223.4917,1627.3727,218.8262,1632.0383,215.2269,1622.2072,218.1599" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1883.617,470.739 C1915.4067,455.0061 1954.2033,429.6616 1972.9167,393.7419 C1987.89,365.001 1992.0798,346.9597 1972.9167,320.8252 C1931.2724,264.031 1725.2169,231.4484 1628.4058,218.9595" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="97.8638" x="1995.0765" y="349.6094">acknowledgement</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="102.6001" x="1992.7083" y="366.4795">/ no Start, no retry</text></g><g class="legend" data-source-line="55"><rect fill="none" height="121.3257" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="827.9338" x="20.8333" y="533.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="805.0171" x="32.2917" y="560.1359">The regions are coupled only by the catalogue error event and the acknowledgement; recovery success does not acknowledge.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="669.7795" x="32.2917" y="579.8177">Recovery episode: start cancellation alone raises no error; Wi-Fi and delivery errors have no episode rule.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="731.5308" x="32.2917" y="599.4995">Indication: several errors show the highest priority, then the first latched. With a short-press-clearable error shown,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="711.7778" x="32.2917" y="619.1813">the first short press acknowledges it; later presses Start and Stop. Errors during listening are shown after Stop.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="772.1049" x="32.2917" y="638.8631">Admission: acknowledgement never starts, retries or changes an active workflow. Restart = reset button or power off/on.</text></g><?plantuml-src hLPBRnit4BxlhvYabxIGxBY7r5NG0egz3emQSY4vyS4n36evAn6co2t9jI0K_UyTFlObMK4FFMd56Nxp-cQ6RzmQDmZ5RgdDAdjJ6RRQC91ifsi7TeEEAPRPPw4gPjW6x9fnlHLg1IMJ5diIZYMhfRlIoiqO8IwOiWiqekpfB5dnl3AwLln2IstWX_VBi_Tdvw-Z91NyWBpyfQSoDKPlav3zkZml1luvvX3-pk3JlgcpixFpdp-GG1kEPdZ_dym99n6kl6rOCyKbXJW1WuL-GRCRWL1S5Cm9hO2aiDNckPHw2unlXBNXs21Oz5wG0mPNT6QpjU08kAdSZYApXH6LXyYowERRUS87h8JL72UmoETVy_dJnUribb_SNT_EdgwcrpTVvdamUvb_lRx8d-Rvv-l5tNmwa6ibTs-1MMX1AGl9plI52ScM4eD2-w-LVr6iEMjS2PgzymmUVdg4yVZt_lNsCmZwA1EeJ4o6pmsbscV4klI_93NxJPs2r2ieM6rnH0f_rMWTKSyLwsm0TWZEQgStX5NGDKUX3W1z9aQWDCd6Hz2cty6oTL4WyW2NaW6ek1sGe5O5qMI5dBZJLFEw4mUpyCuWXsNj79tSv9S_XfpsjBe2pJGWqTfGV-cj2deN4fbf5V8W3R38W_mcVhSQ2t-J_792KY1qQ5oYG_XkrPio9lpm4mwI1cM4t6EKo1gZKz_K0tKS55xJ1xJpNXhdAspjOnzYQEk_82LF2QMvD7IbwS1ULHui6ZeQ3IZrwAj5K3lR96c867sSz3q7cX1ARoNo5OPYv_FvxVnfUl77xFQUolKvluHICalqsOlhrL1xo1wCw8TbYONh4UJ-S6gyeqw_cz_UH6vCs_EE6Wjl1Yeq6-5SglsVpRyzhQNKnJFo4N6Q2msRkhdmAGfQzVJ_5ReaIGgllN299LKG-GGavHoLtm053McXg6d3nKQZOrZFo_PpAA2qtOlnbHX1hEd1e4YiEGq3rzkCWJrZvKQWovB6D6sQwEdGHXFX13HjE9FQw-48YIDxTDKEzb58dc_v5oO5fnmSCP0IzHqx3SN_3nin_3OhQoOf3nWQX3PWtJ9W7wWf3a4ehSOHnj_sEK