<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1068px;height:860px;background:#0B1018;" width="1068.75px" height="860.417px" viewBox="0 0 1068 860" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1068.75" height="860.417" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="8"><rect x="287.509" y="20.833" width="491.829" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="293.759" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="479.329" font-weight="700">Where is each Observation input frozen?</text></g><!--entity live--><g class="entity" data-qualified-name="live" id="ent0001" data-source-line="10"><rect x="500.871" y="81.543" width="322.274" height="79.036" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="511.288" y="103.562" fill="#E6EDF7" font-size="12.5" textLength="164.404">Mutable inputs (live state)</text><text x="511.288" y="118.113" fill="#E6EDF7" font-size="12.5" textLength="301.44">switch / filter, Heart / Lung, point, configuration,</text><text x="511.288" y="132.664" fill="#E6EDF7" font-size="12.5" textLength="298.065">pending examination request, server Device id,</text><text x="511.288" y="147.215" fill="#E6EDF7" font-size="12.5" textLength="222.522">SNTP clock anchors, BPM estimates</text></g><!--entity admission--><g class="entity" data-qualified-name="admission" id="ent0002" data-source-line="11"><rect x="303.996" y="198.21" width="328.121" height="64.486" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="314.413" y="220.229" fill="#E6EDF7" font-size="12.5" textLength="220.77">Session admission (accepted Start)</text><text x="314.413" y="234.78" fill="#E6EDF7" font-size="12.5" textLength="221.362">copy point, configuration, filter IDs,</text><text x="314.413" y="249.331" fill="#E6EDF7" font-size="12.5" textLength="307.288">examination identity / supplied patient reference</text></g><!--entity result--><g class="entity" data-qualified-name="result" id="ent0003" data-source-line="12"><rect x="240.975" y="300.293" width="454.397" height="79.036" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="251.392" y="322.312" fill="#E6EDF7" font-size="12.5" textLength="433.563">Finalized result (Finalizing): frozen context + this session's estimates</text><text x="251.392" y="336.863" fill="#E6EDF7" font-size="12.5" textLength="234.418">kind: heart rate or poor-signal report,</text><text x="251.392" y="351.414" fill="#E6EDF7" font-size="12.5" textLength="202.441">BPM value + declared precision,</text><text x="251.392" y="365.965" fill="#E6EDF7" font-size="12.5" textLength="185.187">monotonic measurement end</text></g><!--entity job--><g class="entity" data-qualified-name="job" id="ent0004" data-source-line="13"><rect x="400.871" y="416.96" width="390.609" height="79.036" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="411.288" y="438.979" fill="#E6EDF7" font-size="12.5" textLength="345.05">Admitted job: L2_CONTROL submits the finalized result</text><text x="411.288" y="453.53" fill="#E6EDF7" font-size="12.5" textLength="267.188">copy of the result; freeze server Device id;</text><text x="411.288" y="468.081" fill="#E6EDF7" font-size="12.5" textLength="276.678">freeze UTC measurement end if a qualifying</text><text x="411.288" y="482.631" fill="#E6EDF7" font-size="12.5" textLength="369.775">anchor already maps it (dashed: read once from live state)</text></g><!--entity setup--><g class="entity" data-qualified-name="setup" id="ent0005" data-source-line="14"><rect x="293.58" y="533.626" width="383.993" height="64.486" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="303.996" y="555.646" fill="#E6EDF7" font-size="12.5" textLength="363.159">First delivery connection setup (only if UTC end still open)</text><text x="303.996" y="570.197" fill="#E6EDF7" font-size="12.5" textLength="247.644">its SNTP exchange supplies the anchor;</text><text x="303.996" y="584.747" fill="#E6EDF7" font-size="12.5" textLength="203.107">freeze UTC end once if still open</text></g><!--entity bytes--><g class="entity" data-qualified-name="bytes" id="ent0006" data-source-line="15"><rect x="450.35" y="635.71" width="291.927" height="64.486" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="460.767" y="657.729" fill="#E6EDF7" font-size="12.5" textLength="236.328">Serialize once before the first request</text><text x="460.767" y="672.28" fill="#E6EDF7" font-size="12.5" textLength="271.094">Observation body + If-None-Exist condition</text><text x="460.767" y="686.831" fill="#E6EDF7" font-size="12.5" textLength="207.593">(identifier = Device id : UTC end)</text></g><!--entity retries--><g class="entity" data-qualified-name="retries" id="ent0007" data-source-line="16"><rect x="470.663" y="737.793" width="251.204" height="49.935" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="481.08" y="759.812" fill="#E6EDF7" font-size="12.5" textLength="122.565">Attempts 1..4 (P13)</text><text x="481.08" y="774.363" fill="#E6EDF7" font-size="12.5" textLength="230.371">every retry sends the identical bytes</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="524.712,198.087,534.932,197.191,529.268,195.564,530.895,189.9,524.712,198.087" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M592.134,160.751 C570.003,173.007 550.366,183.881 529.268,195.564" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="468.059,300.041,472.225,290.666,468.059,294.832,463.892,290.666,468.059,300.041" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M468.059,262.865 C468.059,274.493 468.059,282.616 468.059,294.832" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="597.234,300.124,607.428,298.976,601.726,297.489,603.212,291.787,597.234,300.124" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M665.654,160.941 C666.61,191.577 663.058,233.852 640.975,262.793 C629.338,278.045 618.482,287.662 601.726,297.489" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="552.851,416.749,548.641,407.393,548.969,413.277,543.085,413.605,552.851,416.749" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M511.436,379.711 C524.794,391.657 535.614,401.333 548.969,413.277" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="671.803,416.872,681.755,414.383,675.907,413.665,676.624,407.816,671.803,416.872" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M682.483,161.127 C707.304,213.656 741.274,308.75 704.517,379.46 C696.886,394.139 689.082,403.37 675.907,413.665" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.292,7.292;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="517.964,533.591,527.591,530.046,521.699,529.961,521.784,524.069,517.964,533.591" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M556.321,496.319 C543.719,508.564 533.694,518.306 521.699,529.961" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk14" data-link-type="dependency"><polygon points="653.949,635.679,663.925,633.286,658.083,632.512,658.857,626.671,653.949,635.679" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M657.805,496.518 C669.545,507.031 680.212,519.48 686.809,533.626 C698.94,559.641 699.575,572.501 686.809,598.21 C679.431,613.067 671.272,622.41 658.083,632.512" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk15" data-link-type="dependency"><polygon points="561.673,635.705,557.521,626.323,557.813,632.208,551.927,632.5,561.673,635.705" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M520.401,598.326 C533.556,610.24 544.669,620.305 557.813,632.208" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk16" data-link-type="dependency"><polygon points="596.184,737.726,600.35,728.351,596.184,732.518,592.017,728.351,596.184,737.726" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M596.184,700.43 C596.184,712.617 596.184,721.142 596.184,732.518" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/></g><g class="legend" data-source-line="26"><rect x="20.833" y="808.626" width="1025.18" height="29.476" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="828.413" fill="#E6EDF7" font-size="14.583" textLength="1012.68">After its freeze point a value is never read again f