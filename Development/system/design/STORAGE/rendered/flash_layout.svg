<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1015px;height:819px;background:#0B1018;" width="1015.625px" height="819.792px" viewBox="0 0 1015 819" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1015.625" height="819.792" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="23"><rect x="95.043" y="20.833" width="824.288" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="101.293" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="811.788" font-weight="700">16 MB flash: whole map and the enlarged settings/server-profile end</text></g><!--cluster Whole--><g class="cluster" data-qualified-name="Whole" id="ent0001" data-source-line="25"><rect x="65.52" y="73.21" width="419.792" height="301.042" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="73.637" y="86.896" fill="#E6EDF7" font-size="12.5" textLength="403.558" font-weight="700">Whole flash, 0x000000 to 0xFFFFFF (16 MB, not to scale)</text></g><!--cluster Zoom--><g class="cluster" data-qualified-name="Zoom" id="ent0005" data-source-line="31"><rect x="514.479" y="251.335" width="447.917" height="453.125" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="622.391" y="265.021" fill="#E6EDF7" font-size="12.5" textLength="232.092" font-weight="700">Enlarged: 0xE80000 to 0xFFFFFF</text></g><!--entity Application--><g class="entity" data-qualified-name="Whole.Application" id="ent0002" data-source-line="26"><rect x="144.166" y="114.876" width="310.964" height="108.138" fill="#1F2F45" style="stroke:#6F9FD8;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="154.583" y="136.896" fill="#E6EDF7" font-size="12.5" textLength="225.208">0x000000 to 0xE7FFFF  (14848 KiB)</text><text x="154.583" y="151.447" fill="#E6EDF7" font-size="12.5"> </text><text x="154.583" y="165.997" fill="#E6EDF7" font-size="12.5" textLength="200.891">slot0_partition, label application</text><text x="154.583" y="180.548" fill="#E6EDF7" font-size="12.5" textLength="258.972">also boot_partition, zephyr,code-partition</text><text x="154.583" y="195.099" fill="#E6EDF7" font-size="12.5" textLength="290.131">Simple Boot image: header, loaded segments,</text><text x="154.583" y="209.65" fill="#E6EDF7" font-size="12.5" textLength="179.547">flash-mapped code and data</text></g><!--entity End--><g class="entity" data-qualified-name="Whole.End" id="ent0003" data-source-line="27"><rect x="146.249" y="293.001" width="306.844" height="64.486" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="156.666" y="315.021" fill="#E6EDF7" font-size="12.5" textLength="215.729">0xE80000 to 0xFFFFFF  (1536 KiB)</text><text x="156.666" y="329.572" fill="#E6EDF7" font-size="12.5" textLength="286.011">settings, server profile and their growth room</text><text x="156.666" y="344.122" fill="#E6EDF7" font-size="12.5" textLength="132.819">enlarged on the right</text></g><!--entity Settings--><g class="entity" data-qualified-name="Zoom.Settings" id="ent0006" data-source-line="32"><rect x="566.562" y="293.001" width="347.475" height="64.486" fill="#1F3B2D" style="stroke:#5FBF8A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="576.979" y="315.021" fill="#E6EDF7" font-size="12.5" textLength="209.845">0xE80000 to 0xEAFFFF  (192 KiB)</text><text x="576.979" y="329.572" fill="#E6EDF7" font-size="12.5" textLength="196.423">storage_partition, label storage</text><text x="576.979" y="344.122" fill="#E6EDF7" font-size="12.5" textLength="326.642">settings (ZMS): wifi/network, fhir/device-registration</text></g><!--entity SettingsGrowth--><g class="entity" data-qualified-name="Zoom.SettingsGrowth" id="ent0007" data-source-line="33"><rect x="531.666" y="402.376" width="413.851" height="64.486" fill="#0B1018" style="stroke:#61738A;stroke-width:2.083;stroke-dasharray:7.292,7.292;" rx="4.167" ry="4.167"/><text x="542.083" y="424.396" fill="#B8C4D4" font-size="12.5" textLength="209.106">0xEB0000 to 0xEFFFFF  (320 KiB)</text><text x="542.083" y="438.947" fill="#B8C4D4" font-size="12.5" textLength="159.07">unassigned, not reserved</text><text x="542.083" y="453.497" fill="#B8C4D4" font-size="12.5" textLength="393.018">settings can grow to 512 KiB without moving the server profile</text></g><!--entity Profile--><g class="entity" data-qualified-name="Zoom.Profile" id="ent0008" data-source-line="34"><rect x="558.749" y="505.501" width="359.023" height="79.036" fill="#3A2A45" style="stroke:#B48EAD;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="569.166" y="527.521" fill="#E6EDF7" font-size="12.5" textLength="207.831">0xF00000 to 0xF2FFFF  (192 KiB)</text><text x="569.166" y="542.072" fill="#E6EDF7" font-size="12.5" textLength="338.19">server_profile_partition, label server-profile, read-only</text><text x="569.166" y="556.622" fill="#E6EDF7" font-size="12.5" textLength="300.342">fixed start 0xF00000 for every firmware version</text><text x="569.166" y="571.173" fill="#E6EDF7" font-size="12.5" textLength="260.333">server profile image: at most 8,465 bytes</text></g><!--entity ProfileGrowth--><g class="entity" data-qualified-name="Zoom.ProfileGrowth" id="ent0009" data-source-line="35"><rect x="539.999" y="623.21" width="397.06" height="64.486" fill="#0B1018" style="stroke:#61738A;stroke-width:2.083;stroke-dasharray:7.292,7.292;" rx="4.167" ry="4.167"/><text x="550.416" y="645.229" fill="#B8C4D4" font-size="12.5" textLength="207.068">0xF30000 to 0xFFFFFF  (832 KiB)</text><text x="550.416" y="659.78" fill="#B8C4D4" font-size="12.5" textLength="159.07">unassigned, not reserved</text><text x="550.416" y="674.331" fill="#B8C4D4" font-size="12.5" textLength="376.227">the server profile can grow to 1 MB without moving settings</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="514.306,325.293,504.931,321.126,509.097,325.293,504.931,329.46,514.306,325.293" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M453.66,325.293 C470.428,325.293 486.227,325.293 499.588,325.293 C502.929,325.293 506.117,325.293 509.129,325.293 C510.636,325.293 512.098,325.293 513.514,325.293 C513.691,325.293 513.867,325.293 514.043,325.293 C514.131,325.293 509.01,325.293 509.097,325.293" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="464.739" y="318.146" fill="#E6EDF7" font-size="12.5" textLength="55.444">enlarged</text></g><g class="legend" data-source-line="43"><rect x="20.833" y="733.626" width="972.707" height="63.428" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="753.413" fill="#E6EDF7" font-size="14.583" textLength="510.523">Both region starts are aligned to the 4 KiB erase sector and to 64 KiB.</text><text x="27.083" y="770.389" fill="#E6EDF7" font-size="14.583" textLength="960.207">The limits of each growth area follow from the fixed starts: settings end before 0xF00000 and the server profile ends within 16 MB.</text><text x="27.083" y="787.365" fill="#E6EDF7" font-size="14.583" textLength="515.316">The server profile start is fixed, and the largest image fits its partition.</text></g><?plantuml-src XLLTR-Cs47pNhzYxlbm0-UBlACOXG5maVIYkAE021Quk3fIuaeXGf44oyVcA--zTKX-MP1Sr42GHHyFTcTdrErTYXP2TKcsAwDt1iA9Y8Db9lpgm5JgcM6HVX3emmogm9UFwA5G1EPCMUoSSS_OgtRDMxZT6Z3kcx0wDo7kOb6KlXT6lYl-ifJRmqpITJMV9TPO6Wcla-LqFycYCFZQ7x3vDidvz1ZEgk908_qIm7LytcysI-PeEjE5eXXnZzATFx72G8cDEQFNmG2_dytov6hnyWLddzpbFhd1PT8vKipNH8ftp4L4ViChJFBbMqS7eN4Zqc0MRiujgUkVfCa76ht2yAcQjA1Ho3siC6D8C8UlPtS9Nqtao1f1yIxviENRk9744uSoMoACVKIauWdLeKBlJ0ICd75arMyFdBUIIK1iubfeULUm0J76WT08goKo175gDRYsQDpIJfbq2y2WwE__-pq0H-6AOVfk63pXDVp-73tm8LyQWjFFFRSOathm