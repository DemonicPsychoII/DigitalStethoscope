<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="912.5px" preserveAspectRatio="none" style="width:882px;height:912px;background:#0B1018;" version="1.1" viewBox="0 0 882 912" width="882.2917px" zoomAndPan="magnify"><title>16 MB flash: whole map and the enlarged settings/server-profile end</title><defs/><g><rect fill="#0B1018" height="912.5" style="stroke:none;stroke-width:1.0417;" width="882.2917" x="0" y="0"/><g class="title" data-source-line="23"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="691.4347" x="94.0531" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="668.5181" x="105.5115" y="54.2236">16 MB flash: whole map and the enlarged settings/server-profile end</text></g><!--cluster Whole--><g class="cluster" data-qualified-name="Whole" data-source-line="25" id="ent0002"><rect fill="#111826" height="328.125" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="361.4583" x="59.5622" y="87.4919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="334.6069" x="72.9879" y="107.9427">Whole flash, 0x000000 to 0xFFFFFF (16 MB, not to scale)</text></g><!--cluster Zoom--><g class="cluster" data-qualified-name="Zoom" data-source-line="31" id="ent0006"><rect fill="#111826" height="508.3333" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="389.5833" x="454.3538" y="286.4502"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="189.856" x="554.2175" y="306.901">Enlarged: 0xE80000 to 0xFFFFFF</text></g><!--entity Application--><g class="entity" data-qualified-name="Whole.Application" data-source-line="26" id="ent0003"><rect fill="#1F2F45" height="132.4707" rx="4.1667" ry="4.1667" style="stroke:#6F9FD8;stroke-width:2.0833;" width="284.8877" x="101.7497" y="126.0335"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="202.3193" x="117.3747" y="154.8177">0x000000 to 0xE7FFFF  (14848 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="3.4729" x="117.3747" y="171.6878">&#160;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="175.6958" x="117.3747" y="188.5579">slot0_partition, label application</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.8882" x="117.3747" y="205.4281">also boot_partition, zephyr,code-partition</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.6377" x="117.3747" y="222.2982">Simple Boot image: header, loaded segments,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="156.2622" x="117.3747" y="239.1683">flash-mapped code and data</text></g><!--entity End--><g class="entity" data-qualified-name="Whole.End" data-source-line="27" id="ent0004"><rect fill="#111826" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="276.8799" x="105.3955" y="324.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="191.8213" x="121.0205" y="353.776">0xE80000 to 0xFFFFFF  (1536 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.6299" x="121.0205" y="370.6462">settings, server profile and their growth room</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="113.0737" x="121.0205" y="387.5163">enlarged on the right</text></g><!--entity Settings--><g class="entity" data-qualified-name="Zoom.Settings" data-source-line="32" id="ent0007"><rect fill="#1F3B2D" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#5FBF8A;stroke-width:2.0833;" width="317.0898" x="498.1038" y="324.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="186.3281" x="513.7288" y="353.776">0xE80000 to 0xEAFFFF  (192 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="170.4834" x="513.7288" y="370.6462">storage_partition, label storage</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="285.8398" x="513.7288" y="387.5163">settings (ZMS): wifi/network, fhir/device-registration</text></g><!--entity SettingsGrowth--><g class="entity" data-qualified-name="Zoom.SettingsGrowth" data-source-line="33" id="ent0008"><rect fill="#0B1018" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;stroke-dasharray:7.2917,7.2917;" width="371.521" x="463.208" y="445.8252"/><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="185.5713" x="478.833" y="474.6094">0xEB0000 to 0xEFFFFF  (320 KiB)</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="138.2935" x="478.833" y="491.4795">unassigned, not reserved</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="340.271" x="478.833" y="508.3496">settings can grow to 512 KiB without moving the server profile</text></g><!--entity Profile--><g class="entity" data-qualified-name="Zoom.Profile" data-source-line="34" id="ent0009"><rect fill="#3A2A45" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#B48EAD;stroke-width:2.0833;" width="321.7773" x="488.208" y="566.6585"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="184.8267" x="503.833" y="595.4427">0xF00000 to 0xF2FFFF  (192 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="290.5273" x="503.833" y="612.3128">server_profile_partition, label server-profile, read-only</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.4106" x="503.833" y="629.1829">fixed start 0xF00000 for every firmware version</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="227.71" x="503.833" y="646.0531">server profile image: at most 8,465 bytes</text></g><!--entity ProfileGrowth--><g class="entity" data-qualified-name="Zoom.ProfileGrowth" data-source-line="35" id="ent0010"><rect fill="#0B1018" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;stroke-dasharray:7.2917,7.2917;" width="356.0425" x="471.0205" y="704.1585"/><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="183.3252" x="486.6455" y="732.9427">0xF30000 to 0xFFFFFF  (832 KiB)</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="138.2935" x="486.6455" y="749.8128">unassigned, not reserved</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="324.7925" x="486.6455" y="766.6829">the server profile can grow to 1 MB without moving settings</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk14"><polygon fill="#A9B8CA" points="454.3311,366.1377,444.9561,361.971,449.1228,366.1377,444.9561,370.3044,454.3311,366.1377" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M382.5739,366.1377 C399.7494,366.1377 416.1184,366.1377 430.0002,366.1377 C436.9411,366.1377 443.2602,366.1377 448.7473,366.1377 C450.1191,366.1377 451.4389,366.1377 452.7035,366.1377 C453.0196,366.1377 453.3323,366.1377 453.6414,366.1377 C453.796,366.1377 453.9497,366.1377 454.1026,366.1377 C454.179,366.1377 448.0052,366.1377 448.0811,366.1377" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="46.9238" x="399.1455" y="352.2135">enlarged</text></g><g class="legend" data-source-line="43"><rect fill="none" height="81.9621" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="837.8743" x="20.8333" y="807.2835"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="450.8443" x="32.2917" y="834.0942">Both region starts are aligned to the 4 KiB erase sector and to 64 KiB.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="814.9577" x="32.2917" y="853.776">The limits of each growth area follow from the fixed starts: settings end before 0xF00000, the server profile ends within 16 MB;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="631.6549" x="32.2917" y="873.4578">A build check requires this, the fixed server profile start and that the largest image fits its partition.</text></g><?plantuml-src XLLTZzis47pNhzYaBpb0pldxT6vmmBdmzI58KS050YGk0afSISHHf4hIvxX5_dkNbEoJP1SrODWMbxExCxFhDwx42Y4xfjeKqPlQiA9Y8DbHxntO2XrJBBBFGjNCi0fioRW-25L0pgJ5pWd7dEsbUzBA_SO8SSkKtQ8HUIScPTbpOVHUyL-qr0P-6gUJyIIvZjA6u19vVjS9UJH67zf3TfycMRS-WnbLN4Y4Vo9O3zDD9fDakgG3RJYQFiOm-iC7LjTIPCm9hHuUw78-pUUBtkMBc6L-d_Fa2fP5vuWrsm3DqYaV07K35dcQ9zSggetEXKGVCsDJTb5DvpoT9yZu5OozOjQAGY7tOQq0VPX-o79oD_FLd3KP1X1zSpu_OMpTKU8WX3DR8ez-HANW2DQXGUsEDKPEE99gieHFQyWbHQtWK6fwLB4QcE90xWHKafa2EPmukhLeNj2CsdOfW4VHg_9lFmU8W1V3-FiulC1f-luKNl0kf8n1QUUVsun9l7aBp49pbypJmUj3REu2167Cata27yNwPgTsoahjnj_8XTGJkI6c6KfHGiSWEqKZeo7LsdNZ_iQwF9euqnn7vySxjHLLJSdN50sYOWMke2H5qH2ofazFHr6XSZRUgT3hY4YhwRb72kHnvbXewl6r21XuTj3e9hdWYXfTp9PjdoS9OcWqW9C6hLZ20Bdju4emMbSxTTQECdijZIXA5shQa6YzmaPVoHqSrP-qODGedF_eoRffiLPmhSu0-eMINeZNZTqyddgwdvvQSfgM7bvArnwyDWtlldpQtf15