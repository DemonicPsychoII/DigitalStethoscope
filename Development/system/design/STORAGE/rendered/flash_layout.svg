<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="945.8333px" preserveAspectRatio="none" style="width:911px;height:945px;background:#0B1018;" version="1.1" viewBox="0 0 911 945" width="911.4583px" zoomAndPan="magnify"><title>16 MB flash: whole map and the enlarged settings/server-profile end</title><defs/><g><rect fill="#0B1018" height="945.8333" style="stroke:none;stroke-width:1.0417;" width="911.4583" x="0" y="0"/><g class="title" data-source-line="23"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="691.4347" x="108.7433" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="668.5181" x="120.2016" y="54.2236">16 MB flash: whole map and the enlarged settings/server-profile end</text></g><!--cluster Whole--><g class="cluster" data-qualified-name="Whole" data-source-line="25" id="ent0002"><rect fill="#111826" height="353.125" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="361.4583" x="76.3357" y="87.4919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="334.6069" x="89.7614" y="107.9427">Whole flash, 0x000000 to 0xFFFFFF (16 MB, not to scale)</text></g><!--cluster Zoom--><g class="cluster" data-qualified-name="Zoom" data-source-line="31" id="ent0006"><rect fill="#111826" height="525" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="389.5833" x="466.9607" y="303.1169"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="189.856" x="566.8243" y="323.5677">Enlarged: 0xE80000 to 0xFFFFFF</text></g><!--entity Application--><g class="entity" data-qualified-name="Whole.Application" data-source-line="26" id="ent0003"><rect fill="#1F2F45" height="149.3408" rx="4.1667" ry="4.1667" style="stroke:#6F9FD8;stroke-width:2.0833;" width="308.1543" x="102.3773" y="126.0335"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="202.3193" x="118.0023" y="154.8177">0x000000 to 0xE7FFFF  (14848 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="3.4729" x="118.0023" y="171.6878">&#160;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="175.6958" x="118.0023" y="188.5579">slot0_partition, label application</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.8882" x="118.0023" y="205.4281">also boot_partition, zephyr,code-partition</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.6377" x="118.0023" y="222.2982">Simple Boot image: header, loaded segments,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="156.2622" x="118.0023" y="239.1683">flash-mapped code and data</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="276.9043" x="118.0023" y="256.0384">observed image 2 November 2026: about 656 KiB</text></g><!--entity End--><g class="entity" data-qualified-name="Whole.End" data-source-line="27" id="ent0004"><rect fill="#111826" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:2.0833;" width="276.8799" x="118.0023" y="349.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="191.8213" x="133.6273" y="378.776">0xE80000 to 0xFFFFFF  (1536 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.6299" x="133.6273" y="395.6462">settings, server profile and their growth room</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="113.0737" x="133.6273" y="412.5163">enlarged on the right</text></g><!--entity Settings--><g class="entity" data-qualified-name="Zoom.Settings" data-source-line="32" id="ent0007"><rect fill="#1F3B2D" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#5FBF8A;stroke-width:2.0833;" width="317.0898" x="510.7107" y="341.6585"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="186.3281" x="526.3357" y="370.4427">0xE80000 to 0xEAFFFF  (192 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="170.4834" x="526.3357" y="387.3128">storage_partition, label storage</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="285.8398" x="526.3357" y="404.1829">settings (ZMS): wifi/network, fhir/device-registration</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="125.5615" x="526.3357" y="421.0531">about 0.6 KiB live data</text></g><!--entity SettingsGrowth--><g class="entity" data-qualified-name="Zoom.SettingsGrowth" data-source-line="33" id="ent0008"><rect fill="#0B1018" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;stroke-dasharray:7.2917,7.2917;" width="371.521" x="475.8148" y="479.1585"/><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="185.5713" x="491.4398" y="507.9427">0xEB0000 to 0xEFFFFF  (320 KiB)</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="138.2935" x="491.4398" y="524.8128">unassigned, not reserved</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="340.271" x="491.4398" y="541.6829">settings can grow to 512 KiB without moving the server profile</text></g><!--entity Profile--><g class="entity" data-qualified-name="Zoom.Profile" data-source-line="34" id="ent0009"><rect fill="#3A2A45" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#B48EAD;stroke-width:2.0833;" width="321.7773" x="500.8148" y="599.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="184.8267" x="516.4398" y="628.776">0xF00000 to 0xF2FFFF  (192 KiB)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="290.5273" x="516.4398" y="645.6462">server_profile_partition, label server-profile, read-only</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.4106" x="516.4398" y="662.5163">fixed start 0xF00000 for every firmware version</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="227.71" x="516.4398" y="679.3864">server profile image: at most 8,465 bytes</text></g><!--entity ProfileGrowth--><g class="entity" data-qualified-name="Zoom.ProfileGrowth" data-source-line="35" id="ent0010"><rect fill="#0B1018" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;stroke-dasharray:7.2917,7.2917;" width="356.0425" x="483.6273" y="737.4919"/><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="183.3252" x="499.2523" y="766.276">0xF30000 to 0xFFFFFF  (832 KiB)</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="138.2935" x="499.2523" y="783.1462">unassigned, not reserved</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="324.7925" x="499.2523" y="800.0163">the server profile can grow to 1 MB without moving settings</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk14"><polygon fill="#A9B8CA" points="466.938,391.1377,457.563,386.971,461.7296,391.1377,457.563,395.3044,466.938,391.1377" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M395.1807,391.1377 C412.3562,391.1377 428.7252,391.1377 442.607,391.1377 C449.5479,391.1377 455.867,391.1377 461.3542,391.1377 C462.7259,391.1377 464.0458,391.1377 465.3103,391.1377 C465.6264,391.1377 465.9391,391.1377 466.2483,391.1377 C466.4028,391.1377 466.5565,391.1377 466.7094,391.1377 C466.7858,391.1377 460.612,391.1377 460.688,391.1377" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="46.9238" x="411.7523" y="377.2135">enlarged</text></g><g class="legend" data-source-line="43"><rect fill="none" height="81.9621" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="867.2546" x="20.8333" y="840.6169"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="844.338" x="32.2917" y="867.4276">Values from boards/flash-layout.dtsi at integration 994ce24. Both region starts are aligned to the 4 KiB erase sector and to 64 KiB.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="814.9577" x="32.2917" y="887.1094">The limits of each growth area follow from the fixed starts: settings end before 0xF00000, the server profile ends within 16 MB;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="708.2458" x="32.2917" y="906.7912">storage.c build assertions enforce this, the fixed server profile start and that the largest image fits its partition.</text></g><?plantuml-src XLRlZ-8s4FsUlsBk-kLM2Yo47ylIqqgxrMu_L7UgHDLALwgJ4qyIQnqRsGQELlU_T-maR1AeYeG0U_myyzwy2UzSYHL2TagrAQ9tEyEAYe5a9xrtO2jqJB78lWgrOuPLO4l6zL6e0d8cBNPsEEPiBzsBLkup8yGDKtQ3HkITc9HbhuNHUyL_qb8R-66IJYVJrNMK9WINoFExJiYZCVhORBBxT9LrypEOKSQ5HFWdWgVXTTFfT9KiQKCRZgQFCOp--97jTb9ap0cj7XxeS9xayqNly4NCCh_F-UeAbaNdY3LR0ytIX0-0kW6BFCrNrpBQ6PqBYJvcnX9saKrdFvslaF4h67l5h1M5Gkx36W7wCFsGvVHkvhCv