<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:935px;height:802px;background:#0B1018;" width="935.417px" height="802.083px" viewBox="0 0 935 802" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="935.417" height="802.083" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="23"><rect x="54.523" y="20.833" width="824.288" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="60.773" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="811.788" font-weight="700">16 MB flash: whole map and the enlarged settings/server-profile end</text></g><!--cluster Whole--><g class="cluster" data-qualified-name="Whole" id="ent0001" data-source-line="25"><rect x="25" y="73.21" width="419.792" height="301.042" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="33.117" y="86.896" fill="#E6EDF7" font-size="12.5" textLength="403.558" font-weight="700">Whole flash, 0x000000 to 0xFFFFFF (16 MB, not to scale)</text></g><!--cluster Zoom--><g class="cluster" data-qualified-name="Zoom" id="ent0005" data-source-line="31"><rect x="473.958" y="251.335" width="447.917" height="453.125" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="581.871" y="265.021" fill="#E6EDF7" font-size="12.5" textLength="232.092" font-weight="700">Enlarged: 0xE80000 to 0xFFFFFF</text></g><!--entity Application--><g class="entity" data-qualified-name="Whole.Application" id="ent0002" data-source-line="26"><rect x="103.646" y="114.876" width="310.964" height="108.138" fill="#1F2F45" style="stroke:#6F9FD8;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="114.063" y="136.896" fill="#E6EDF7" font-size="12.5" textLength="225.208">0x000000 to 0xE7FFFF  (14848 KiB)</text><text x="114.063" y="151.447" fill="#E6EDF7" font-size="12.5"> </text><text x="114.063" y="165.997" fill="#E6EDF7" font-size="12.5" textLength="200.891">slot0_partition, label application</text><text x="114.063" y="180.548" fill="#E6EDF7" font-size="12.5" textLength="258.972">also boot_partition, zephyr,code-partition</text><text x="114.063" y="195.099" fill="#E6EDF7" font-size="12.5" textLength="290.131">Simple Boot image: header, loaded segments,</text><text x="114.063" y="209.65" fill="#E6EDF7" font-size="12.5" textLength="179.547">flash-mapped code and data</text></g><!--entity End--><g class="entity" data-qualified-name="Whole.End" id="ent0003" data-source-line="27"><rect x="105.729" y="293.001" width="306.844" height="64.486" fill="#111826" style="stroke:#A9B8CA;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="116.146" y="315.021" fill="#E6EDF7" font-size="12.5" textLength="215.729">0xE80000 to 0xFFFFFF  (1536 KiB)</text><text x="116.146" y="329.572" fill="#E6EDF7" font-size="12.5" textLength="286.011">settings, server profile and their growth room</text><text x="116.146" y="344.122" fill="#E6EDF7" font-size="12.5" textLength="132.819">enlarged on the right</text></g><!--entity Settings--><g class="entity" data-qualified-name="Zoom.Settings" id="ent0006" data-source-line="32"><rect x="526.042" y="293.001" width="347.475" height="64.486" fill="#1F3B2D" style="stroke:#5FBF8A;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="536.458" y="315.021" fill="#E6EDF7" font-size="12.5" textLength="209.845">0xE80000 to 0xEAFFFF  (192 KiB)</text><text x="536.458" y="329.572" fill="#E6EDF7" font-size="12.5" textLength="196.423">storage_partition, label storage</text><text x="536.458" y="344.122" fill="#E6EDF7" font-size="12.5" textLength="326.642">settings (ZMS): wifi/network, fhir/device-registration</text></g><!--entity SettingsGrowth--><g class="entity" data-qualified-name="Zoom.SettingsGrowth" id="ent0007" data-source-line="33"><rect x="491.146" y="402.376" width="413.851" height="64.486" fill="#0B1018" style="stroke:#61738A;stroke-width:2.083;stroke-dasharray:7.292,7.292;" rx="4.167" ry="4.167"/><text x="501.563" y="424.396" fill="#B8C4D4" font-size="12.5" textLength="209.106">0xEB0000 to 0xEFFFFF  (320 KiB)</text><text x="501.563" y="438.947" fill="#B8C4D4" font-size="12.5" textLength="159.07">unassigned, not reserved</text><text x="501.563" y="453.497" fill="#B8C4D4" font-size="12.5" textLength="393.018">settings can grow to 512 KiB without moving the server profile</text></g><!--entity Profile--><g class="entity" data-qualified-name="Zoom.Profile" id="ent0008" data-source-line="34"><rect x="518.229" y="505.501" width="359.023" height="79.036" fill="#3A2A45" style="stroke:#B48EAD;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="528.646" y="527.521" fill="#E6EDF7" font-size="12.5" textLength="207.831">0xF00000 to 0xF2FFFF  (192 KiB)</text><text x="528.646" y="542.072" fill="#E6EDF7" font-size="12.5" textLength="338.19">server_profile_partition, label server-profile, read-only</text><text x="528.646" y="556.622" fill="#E6EDF7" font-size="12.5" textLength="300.342">fixed start 0xF00000 for every firmware version</text><text x="528.646" y="571.173" fill="#E6EDF7" font-size="12.5" textLength="260.333">server profile image: at most 8,465 bytes</text></g><!--entity ProfileGrowth--><g class="entity" data-qualified-name="Zoom.ProfileGrowth" id="ent0009" data-source-line="35"><rect x="499.479" y="623.21" width="397.06" height="64.486" fill="#0B1018" style="stroke:#61738A;stroke-width:2.083;stroke-dasharray:7.292,7.292;" rx="4.167" ry="4.167"/><text x="509.896" y="645.229" fill="#B8C4D4" font-size="12.5" textLength="207.068">0xF30000 to 0xFFFFFF  (832 KiB)</text><text x="509.896" y="659.78" fill="#B8C4D4" font-size="12.5" textLength="159.07">unassigned, not reserved</text><text x="509.896" y="674.331" fill="#B8C4D4" font-size="12.5" textLength="376.227">the server profile can grow to 1 MB without moving settings</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="473.785,325.293,464.41,321.126,468.577,325.293,464.41,329.46,473.785,325.293" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M413.14,325.293 C429.907,325.293 445.707,325.293 459.068,325.293 C462.409,325.293 465.597,325.293 468.609,325.293 C470.116,325.293 471.578,325.293 472.994,325.293 C473.171,325.293 473.347,325.293 473.523,325.293 C473.61,325.293 468.49,325.293 468.577,325.293" style="stroke:#A9B8CA;stroke-width:3.125;" fill="none"/><text x="424.219" y="318.146" fill="#E6EDF7" font-size="12.5" textLength="55.444">enlarged</text></g><g class="legend" data-source-line="43"><rect x="20.833" y="733.626" width="470.358" height="46.452" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="753.413" fill="#E6EDF7" font-size="14.583" textLength="457.858">Solid boxes are partitions; dashed boxes are unassigned flash.</text><text x="27.083" y="770.389" fill="#E6EDF7" font-size="14.583" textLength="447.191">The right group enlarges the last 1536 KiB of the whole map.</text></g><?plantuml-src XLLDR-Cs4BthLynkBnj0slWxIhe841TE3yKM2xX0WQsB1IKE9I8IAP1q7BVO_xuZMf8bsKLziSDvV7mpRsRopkLO8gJ7H9iiU5SPbfKC2dRKUmUsHCSK2-oBL1Kph0IRCwuFKcKWM66n5-4esBvmprgvtnanRfcoMpHIz309Iryoe_UA_w8BRU2dIJATJEFhB0q4LyZ5NG_oP8m-D45sdyHfNv_1b1Hd1SA_0Qp7pqsdqtYsee0s7CsGOup-z8bLLI5JvgHMZuzqMSp4OZcuV85PYNl1uojS5fsZgjaJqJoPyH5H7x0KYOYlAQgC5hB06ZDdCtQXfXTF5Z4oVeLZhvYrCbF8QrXZm91c25bDx-QrciwJCO3Aj-2BbcFhZWME89pP77dmFSWbHx0E3Mfth31mqf5LqnLyNeCe2FK0XrpJKSagO8e3TIUWAfZ9a4DRerkBvXLDrAHB01u4P-VV_-afF5y8axU9_u3JzFlPV-23Vp84fLrzRbDMuCrxO1PETwbvUdn3YisTfo2EHRo8uJUvljcfdRA5TfDlr8MK4tL3I3EKO06z1jaf6XaDYTQkZ_i7g_nembHpZBhZdThAigB7ruG6MR8C7o0dHz4GiwRlkXnPYShPSATyhX4LhQBpciaNZpF7V59FPn4mwjbHefluebQKw7A-Ql9iBGZXv06q7ZHcIGFKRGUNWz6wtAdEEtgvzjB8B7TUquPC6mYB_gBkuAZ-fWMZ8X__Fh1rqt0zm3MTdlGhFNfXNX-xUMfpk