xtLength="245.6421" x="33.3333" y="216.8864">certificate rules 1 to 5, rule 4 on the PC date</text><rect fill="#3B2A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="168.4733" x="87.2009" y="312.5692"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="145.5566" x="98.6593" y="337.1867">Exit 1, key and rule named</text><polygon fill="#273241" points="99.469,252.889,243.4062,252.889,255.9062,266.5324,243.4062,280.1758,99.469,280.1758,86.969,266.5324,99.469,252.889" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="180.8126" y="298.5433">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="133.5205" x="104.6773" y="271.2565">file and certificate valid?</text><rect fill="#111826" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="236.3444" x="53.2654" y="396.106"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="156.5308" x="64.7237" y="420.7235">2. Image construction (build)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="213.4277" x="64.7237" y="437.5936">fields, CRC-32, size within the partition</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="169.9829" x="64.7237" y="454.4637">taken from the build devicetree</text><rect fill="#3B2A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="147.7214" x="97.5769" y="550.1465"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="124.8047" x="109.0352" y="574.764">Rejected before writing</text><polygon fill="#273241" points="100.9583,490.4663,241.9169,490.4663,254.4169,504.1097,241.9169,517.7531,100.9583,517.7531,88.4583,504.1097,100.9583,490.4663" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="180.8126" y="536.1206">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="130.542" x="106.1666" y="508.8338">image fits the partition?</text><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="232.3771" x="55.249" y="633.6833"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="209.4604" x="66.7074" y="658.3008">Flash command writes only the image,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="172.9614" x="66.7074" y="675.1709">esptool verifies the written data</text><line style="stroke:#61738A;stroke-width:2.0833;" x1="15.625" x2="15.625" y1="84.3669" y2="2161.3078"/><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="243.632" x="354.2379" y="711.1735"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="184.5459" x="365.6962" y="735.791">3. L1_STORAGE structural checks</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="220.7153" x="365.6962" y="752.6611">erased, magic, version, lengths, CRC-32</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="244.8161" x="353.6458" y="848.3439"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="135.5591" x="365.1042" y="872.9614">Missing or invalid image:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.9844" x="365.1042" y="889.8315">secure transport unavailable,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="221.8994" x="365.1042" y="906.7017">Wi-Fi setup and offline listening continue</text><polygon fill="#273241" points="404.8238,788.6637,547.2839,788.6637,559.7839,802.3071,547.2839,815.9505,404.8238,815.9505,392.3238,802.3071,404.8238,788.6637" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="485.4289" y="834.318">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="132.0435" x="410.0321" y="807.0313">image structurally valid?</text><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="248.9299" x="351.5889" y="965.6209"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.0132" x="363.0473" y="990.2384">4. L2_COMMUNICATION keep-alive check</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="187.2437" x="363.0473" y="1007.1086">server keep-alive must exceed 5 s</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="244.8161" x="353.6458" y="1102.7913"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="180.2246" x="365.1042" y="1127.4089">Invalid configuration, rule logged:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.9844" x="365.1042" y="1144.279">secure transport unavailable,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="221.8994" x="365.1042" y="1161.1491">Wi-Fi setup and offline listening continue</text><polygon fill="#273241" points="411.0555,1043.1112,541.0522,1043.1112,553.5522,1056.7546,541.0522,1070.3979,411.0555,1070.3979,398.