<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2330.2083px" preserveAspectRatio="none" style="width:1043px;height:2330px;background:#0B1018;" version="1.1" viewBox="0 0 1043 2330" width="1043.75px" zoomAndPan="magnify"><title>Server profile: which check runs where, when, and what a failure does</title><defs><linearGradient id="g1acoasiw5ptdb0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><rect fill="#0B1018" height="2330.2083" style="stroke:none;stroke-width:1.0417;" width="1043.75" x="0" y="0"/><g class="title" data-source-line="17"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="696.8058" x="172.2422" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="673.8892" x="183.7006" y="54.2236">Server profile: which check runs where, when, and what a failure does</text></g><rect fill="url(#g1acoasiw5ptdb0)" height="27.2868" style="stroke:url(#g1acoasiw5ptdb0);stroke-width:1.0417;" width="1010.0403" x="15.625" y="84.3669"/><ellipse cx="171.4376" cy="127.2786" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/><rect fill="#111826" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="299.1252" x="21.875" y="158.5286"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="141.2964" x="33.3333" y="183.1462">1. Input validation (check)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="276.2085" x="33.3333" y="200.0163">TOML format 1, known keys, canonical HTTPS URL</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.6421" x="33.3333" y="216.8864">certificate rules 1 to 5, rule 4 on the PC date</text><rect fill="#3B2A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="168.4733" x="87.2009" y="312.5692"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="145.5566" x="98.6593" y="337.1867">Exit 1, key and rule named</text><polygon fill="#273241" points="99.469,252.889,243.4062,252.889,255.9062,266.5324,243.4062,280.1758,99.469,280.1758,86.969,266.5324,99.469,252.889" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="180.8126" y="298.5433">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="133.5205" x="104.6773" y="271.2565">file and certificate valid?</text><rect fill="#111826" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="236.3444" x="53.2654" y="396.106"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="156.5308" x="64.7237" y="420.7235">2. Image construction (build)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="213.4277" x="64.7237" y="437.5936">fields, CRC-32, size within the partition</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="169.9829" x="64.7237" y="454.4637">taken from the build devicetree</text><rect fill="#3B2A1A" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="147.7214" x="97.5769" y="550.1465"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="124.8047" x="109.0352" y="574.764">Rejected before writing</text><polygon fill="#273241" points="100.9583,490.4663,241.9169,490.4663,254.4169,504.1097,241.9169,517.7531,100.9583,517.7531,88.4583,504.1097,100.9583,490.4663" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="180.8126" y="536.1206">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="130.542" x="106.1666" y="508.8338">image fits the partition?</text><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="232.3771" x="55.249" y="633.6833"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="209.4604" x="66.7074" y="658.3008">Flash command writes only the image,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="172.9614" x="66.7074" y="675.1709">esptool verifies the written data</text><line style="stroke:#61738A;stroke-width:2.0833;" x1="15.625" x2="15.625" y1="84.3669" y2="2195.048"/><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="243.632" x="354.2379" y="711.1735"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="184.5459" x="365.6962" y="735.791">3. L1_STORAGE structural checks</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="220.7153" x="365.6962" y="752.6611">erased, magic, version, lengths, CRC-32</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="244.8161" x="353.6458" y="848.3439"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="135.5591" x="365.1042" y="872.9614">Missing or invalid image:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.9844" x="365.1042" y="889.8315">secure transport unavailable,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="221.8994" x="365.1042" y="906.7017">Wi-Fi setup and offline listening continue</text><polygon fill="#273241" points="404.8238,788.6637,547.2839,788.6637,559.7839,802.3071,547.2839,815.9505,404.8238,815.9505,392.3238,802.3071,404.8238,788.6637" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="485.4289" y="834.318">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="132.0435" x="410.0321" y="807.0313">image structurally valid?</text><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="248.9299" x="351.5889" y="965.6209"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.0132" x="363.0473" y="990.2384">4. L2_COMMUNICATION keep-alive check</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="187.2437" x="363.0473" y="1007.1086">server keep-alive must exceed 5 s</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="244.8161" x="353.6458" y="1102.7913"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="180.2246" x="365.1042" y="1127.4089">Invalid configuration, rule logged:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.9844" x="365.1042" y="1144.279">secure transport unavailable,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="221.8994" x="365.1042" y="1161.1491">Wi-Fi setup and offline listening continue</text><polygon fill="#273241" points="411.0555,1043.1112,541.0522,1043.1112,553.5522,1056.7546,541.0522,1070.3979,411.0555,1070.3979,398.5555,1056.7546,411.0555,1043.1112" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="485.4289" y="1088.7655">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="119.5801" x="416.2638" y="1061.4787">keep-alive above 5 s?</text><rect fill="#111826" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="289.2741" x="331.4168" y="1220.0684"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="232.4463" x="342.8752" y="1244.6859">5. L1_WIFI endpoint and certificate checks</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="243.1396" x="342.8752" y="1261.556">usable URL, exactly one parsable certificate,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="266.3574" x="342.8752" y="1278.4261">Subject Alternative Name matching the host type</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="244.8161" x="353.6458" y="1374.1089"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="180.2246" x="365.1042" y="1398.7264">Invalid configuration, rule logged:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="158.9844" x="365.1042" y="1415.5965">secure transport unavailable,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="221.8994" x="365.1042" y="1432.4666">Wi-Fi setup and offline listening continue</text><polygon fill="#273241" points="417.9342,1314.4287,534.1736,1314.4287,546.6736,1328.0721,534.1736,1341.7155,417.9342,1341.7155,405.4342,1328.0721,417.9342,1314.4287" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="485.4289" y="1360.083">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="105.8228" x="423.1425" y="1332.7962">configuration valid?</text><line style="stroke:#61738A;stroke-width:2.0833;" x1="325.1668" x2="325.1668" y1="84.3669" y2="2195.048"/><rect fill="#111826" height="39.7868" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="199.4181" x="712.4593" y="1491.3859"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="176.5015" x="723.9176" y="1516.0034">SNTP exchange inside the setup</text><rect fill="#111826" height="56.6569" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="288.2609" x="668.0379" y="1552.006"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="257.4463" x="679.4963" y="1576.6235">6. L2_COMMUNICATION pre-handshake validity</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="265.3442" x="679.4963" y="1593.4937">certificate validity against the prepared UTC time</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="354.4963" x="634.9202" y="1689.1764"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="109.0698" x="646.3786" y="1713.7939">No ClientHello sent.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="331.5796" x="646.3786" y="1730.6641">Idle preparation: SERVER_CONNECTION_FAILURE, later retry.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="203.0151" x="646.3786" y="1747.5342">Delivery: terminal DELIVERY_FAILURE</text><polygon fill="#273241" points="757.4178,1629.4963,866.9189,1629.4963,879.4189,1643.1396,866.9189,1656.783,757.4178,1656.783,744.9178,1643.1396,757.4178,1629.4963" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="13.4766" x="821.5434" y="1675.1506">no</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="99.0845" x="762.6261" y="1647.8638">valid at that time?</text><rect fill="#111826" height="90.3971" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="269.1203" x="677.6082" y="1806.4535"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="246.2036" x="689.0666" y="1831.071">7. L1_WIFI handshake verification (mbedTLS)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="210.9497" x="689.0666" y="1847.9411">TLS 1.3, verification required, only this</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="239.4043" x="689.0666" y="1864.8112">certificate trusted; Key Usage and Extended</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="199.9878" x="689.0666" y="1881.6813">Key Usage (rule 5); peer dates again</text><rect fill="#3B2A1A" height="73.527" rx="4.1667" ry="4.1667" style="stroke:#A9B8CA;stroke-width:1.0417;" width="354.4963" x="634.9202" y="1977.3641"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="91.6016" x="646.3786" y="2001.9816">Connection fails.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="331.5796" x="646.3786" y="2018.8517">Idle preparation: SERVER_CONNECTION_FAILURE, later retry.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="203.0151" x="646.3786" y="2035.7218">Delivery: terminal DELIVE