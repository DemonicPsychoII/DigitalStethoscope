<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1225px;height:495px;background:#0B1018;" width="1225px" height="495.833px" viewBox="0 0 1225 495" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1225" height="495.833" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="9"><rect x="20.833" y="20.833" width="1181.578" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="1169.078" font-weight="700">Generic SNTP exchange: which clock supplies each timestamp (RFC 4330 sec. 4-5, RFC 5905 sec. 8)</text></g><g class="participant-lifeline" data-qualified-name="Client" data-entity-uid="part1" id="part1-lifeline" data-source-line="10"><g><title>Client</title><rect x="411.041" y="146.061" width="8.333" height="262.207" fill="#000" fill-opacity="0"/><line x1="414.687" y1="146.061" x2="414.687" y2="408.268" style="stroke:#555;stroke-width:1.042;stroke-dasharray:5.208,5.208;"/></g></g><g class="participant-lifeline" data-qualified-name="Server" data-entity-uid="part2" id="part2-lifeline" data-source-line="11"><g><title>Server</title><rect x="812.011" y="146.061" width="8.333" height="262.207" fill="#000" fill-opacity="0"/><line x1="815.657" y1="146.061" x2="815.657" y2="408.268" style="stroke:#555;stroke-width:1.042;stroke-dasharray:5.208,5.208;"/></g></g><g class="participant participant-head" data-qualified-name="Client" data-entity-uid="part1" id="part1-head" data-source-line="10"><rect x="353.771" y="79.46" width="121.83" height="60.352" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="396.593" y="106.687" fill="#0B1018" font-size="12.5" textLength="36.188">Client</text><text x="374.605" y="121.238" fill="#0B1018" font-size="12.5" textLength="80.164">(client clock)</text></g><g class="participant participant-head" data-qualified-name="Server" data-entity-uid="part2" id="part2-head" data-source-line="11"><rect x="752.124" y="79.46" width="127.067" height="60.352" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="795.161" y="106.687" fill="#0B1018" font-size="12.5" textLength="40.991">Server</text><text x="772.957" y="121.238" fill="#0B1018" font-size="12.5" textLength="85.4">(server clock)</text></g><g class="participant participant-tail" data-qualified-name="Client" data-entity-uid="part1" id="part1-tail" data-source-line="10"><rect x="353.771" y="413.477" width="121.83" height="60.352" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="396.593" y="440.704" fill="#0B1018" font-size="12.5" textLength="36.188">Client</text><text x="374.605" y="455.255" fill="#0B1018" font-size="12.5" textLength="80.164">(client clock)</text></g><g class="participant participant-tail" data-qualified-name="Server" data-entity-uid="part2" id="part2-tail" data-source-line="11"><rect x="752.124" y="413.477" width="127.067" height="60.352" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="795.161" y="440.704" fill="#0B1018" font-size="12.5" textLength="40.991">Server</text><text x="772.957" y="455.255" fill="#0B1018" font-size="12.5" textLength="85.4">(server clock)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="12"><polygon points="803.157,171.029,813.574,175.195,803.157,179.362,807.324,175.195" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.687" y1="175.195" x2="809.407" y2="175.195" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="421.978" y="170.164" fill="#E6EDF7" font-size="12.5" textLength="303.674">request; Transmit Timestamp = T1 (client clock)</text></g><path d="M703.944,192.904 L703.944,208.529 A4.167,4.167 0 0 0 708.111,212.695 L922.694,212.695 A4.167,4.167 0 0 0 926.861,208.529 L926.861,199.154 L916.444,188.737 L708.111,188.737 A4.167,4.167 0 0 0 703.944,192.904" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M916.444,188.737 L916.444,197.07 A2.083,2.083 0 0 0 918.528,199.154 L926.861,199.154 L916.444,188.737" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="710.194" y="205.548" fill="#E6EDF7" font-size="12.5" textLength="201.55">T2 = receive time (server clock)</text><path d="M700.578,228.288 L700.578,243.913 A4.167,4.167 0 0 0 704.745,248.079 L925.578,248.079 A4.167,4.167 0 0 0 929.745,243.913 L929.745,234.538 L919.328,224.121 L704.745,224.121 A4.167,4.167 0 0 0 700.578,228.288" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M919.328,224.121 L919.328,232.454 A2.083,2.083 0 0 0 921.412,234.538 L929.745,234.538 L919.328,224.121" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="706.828" y="240.932" fill="#E6EDF7" font-size="12.5" textLength="208.282">T3 = transmit time (server clock)</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg2" data-source-line="15"><polygon points="426.145,270.931,415.728,275.098,426.145,279.264,421.978,275.098" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="419.895" y1="275.098" x2="814.615" y2="275.098" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="432.395" y="270.066" fill="#E6EDF7" font-size="12.5" textLength="375.97">reply: Originate = T1 (copied), Receive = T2, Transmit = T3</text></g><path d="M293.55,292.806 L293.55,308.431 A4.167,4.167 0 0 0 297.717,312.598 L531.05,312.598 A4.167,4.167 0 0 0 535.217,308.431 L535.217,299.056 L524.8,288.639 L297.717,288.639 A4.167,4.167 0 0 0 293.55,292.806" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M524.8,288.639 L524.8,296.973 A2.083,2.083 0 0 0 526.883,299.056 L535.217,299.056 L524.8,288.639" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="299.8" y="305.45" fill="#E6EDF7" font-size="12.5" textLength="220.398">T4 = destination time (client clock)</text><path d="M316.004,328.19 L316.004,387.565 A4.167,4.167 0 0 0 320.171,391.732 L909.754,391.732 A4.167,4.167 0 0 0 913.921,387.565 L913.921,334.44 L903.504,324.023 L320.171,324.023 A4.167,4.167 0 0 0 316.004,328.19" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M903.504,324.023 L903.504,332.357 A2.083,2.083 0 0 0 905.587,334.44 L913.921,334.44 L903.504,324.023" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="380.043" y="340.835" fill="#E6EDF7" font-size="12.5" textLength="253.76">Round-trip delay d = (T4 - T1) - (T3 - T2)</text><text x="380.043" y="355.385" fill="#E6EDF7" font-size="12.5" textLength="255.841">Clock offset t = ((T2 - T1) + (T3 - T4)) / 2</text><text x="380.043" y="369.936" fill="#E6EDF7" font-size="12.5" textLength="357.245">T1 needs no synchronized client clock (RFC 4330 sec. 5).</text><text x="380.043" y="384.487" fill="#E6EDF7" font-size="12.5" textLength="460.883">Without authentication the reply is not authenticated (RFC 4330 sec. 11).</text><?plantuml-src TLFBRjim4BphAxRfHKBjrC_MST42WO7qr3I81VII2qsj9CBIKYMfkCxNTsdHZXmu5u7QdHdEh5OVN8arWjnlj2aYkrNK22DgiAN8z4vH0RceBFOw6UQYhToT9dSlcBeMPDTeLDx3R8JS5aQtbArqfGry76t6e_7Yiag0u1VCygyzoAqnUXUQucQpaABl3_-sI19_eRMYmDjA5GGLvgw7UH36AQaQGVrxWXMdN8Nm4ucjIrZVfm-0_sGfgC0bx4ebIv2LbbkmRTDK2YsWu9fJDLedwWRYnxiLpARJ4NkHrp0RpWVWI_ERqRmhBPAeURK0LokM8VT4iJmSElta2eI5hdKEvw4-es6uFHpwyAuLTImO_WW5M8BnSx7k6wI6lqkj7AGdnzyX7SFvvH5fXw0zzoIHJXXfKA9wnaDUE7TmaJDbZZjUUOaKeEmrkFPUcsg_XDz65Oe4QmQ3kb6O9JpDu87Bay5h87wTzZoSvD8PjpBEwiMKfc3ZlRmTRt2S9JpwTHqweneMgSGUCfQBMNJ8hX9-nXoIpvCaOgxV39td5ZcjnyKyjGxuwGYS9GbyXadaGn5YPe4qs3t9qcXIBvX1tzhRVPedrn7yKQxKhGFHyczAl1eXM8dTy41vqRC-oxvH6ezP2YdpIFmF?></g></svg>