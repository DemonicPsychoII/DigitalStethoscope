t="spacing" textLength="34.7168" x="1161.7167" y="1583.1543">AUDIO</text></g><path d="M15.625,178.3203 L15.625,224.1536 A4.1667,4.1667 0 0 0 19.7917,228.3203 L302.0833,228.3203 A4.1667,4.1667 0 0 0 306.25,224.1536 L306.25,184.5703 L295.8333,174.1536 L19.7917,174.1536 A4.1667,4.1667 0 0 0 15.625,178.3203" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M295.8333,174.1536 L295.8333,182.487 A2.0833,2.0833 0 0 0 297.9167,184.5703 L306.25,184.5703 L295.8333,174.1536" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="259.1309" x="27.0833" y="197.7295">Start during Analysing: Busy, nothing cancelled.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.1221" x="27.0833" y="214.5996">Start during Sending: cancels the delivery job.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#A9B8CA" points="483.0302,280.1758,493.4469,284.3424,483.0302,288.5091,487.1969,284.3424" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="160.7239" x2="489.2802" y1="284.3424" y2="284.3424"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.3896" x="173.2239" y="256.4697">Start: communication_postEvent(LISTENING_STARTED)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.2612" x="173.2239" y="273.3398">withdraws the network lease</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2"><polygon fill="#A9B8CA" points="483.0302,338.916,493.4469,343.0827,483.0302,347.2493,487.1969,343.0827" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="160.7239" x2="489.2802" y1="343.0827" y2="343.0827"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.1577" x="173.2239" y="315.21">communication_waitForWiFiStop(timeout)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.3843" x="173.2239" y="332.0801">CONTROL sends no other event during the wait</text></g><path d="M500,360.791 L500,406.6243 A4.1667,4.1667 0 0 0 504.1667,410.791 L831.25,410.791 A4.1667,4.1667 0 0 0 835.4167,406.6243 L835.4167,367.041 L825,356.6243 L504.1667,356.6243 A4.1667,4.1667 0 0 0 500,360.791" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M825,356.6243 L825,364.9577 A2.0833,2.0833 0 0 0 827.0833,367.041 L835.4167,367.041 L825,356.6243" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="290.6006" x="511.4583" y="380.2002">Seen at the next event check; 200 ms is a candidate</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="303.7842" x="511.4583" y="397.0703">check interval, not a bound on teardown or flash writes.</text><path d="M386.7859,423.6979 L712.1643,423.6979 L712.1643,442.6514 L701.7476,453.068 L382.6192,453.068 L382.6192,427.8646 A4.1667,4.1667 0 0 1 386.7859,423.6979" fill="#555555"/><rect fill="none" height="194.9707" rx="4.1667" ry="4.1667" style="stroke:#2A9FD6;stroke-width:1.0417;" width="594.9239" x="382.6192" y="423.6979"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="272.2534" x="403.4526" y="443.1071">Cancel the operation in progress, once (in-line)</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3"><polygon fill="#A9B8CA" points="778.6031,499.3083,789.0198,503.4749,778.6031,507.6416,782.7698,503.4749" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="495.5302" x2="784.8531" y1="503.4749" y2="503.4749"/