xtLength="34.7168" x="1201.3" y="1811.8652">AUDIO</text></g><path d="M126.0417,178.3203 L126.0417,240.8203 A4.1667,4.1667 0 0 0 130.2083,244.987 L1286.4583,244.987 A4.1667,4.1667 0 0 0 1290.625,240.8203 L1290.625,184.5703 L1280.2083,174.1536 L130.2083,174.1536 A4.1667,4.1667 0 0 0 126.0417,178.3203" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1280.2083,174.1536 L1280.2083,182.487 A2.0833,2.0833 0 0 0 1282.2917,184.5703 L1290.625,184.5703 L1280.2083,174.1536" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="417.2974" x="461.911" y="197.7295">Implemented in COMMUNICATION, WIFI, PORTAL and STORAGE at 994ce24.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="473.3276" x="461.911" y="214.5996">Documented, not implemented: CONTROL sends no Start/Stop yet, never waits for the</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="484.0698" x="461.911" y="231.4697">release and AUDIO admission is not integrated (CONTROL posts only the setup request).</text><path d="M15.625,260.1807 L15.625,306.014 A4.1667,4.1667 0 0 0 19.7917,310.1807 L381.25,310.1807 A4.1667,4.1667 0 0 0 385.4167,306.014 L385.4167,266.4307 L375,256.014 L19.7917,256.014 A4.1667,4.1667 0 0 0 15.625,260.1807" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M375,256.014 L375,264.3473 A2.0833,2.0833 0 0 0 377.0833,266.4307 L385.4167,266.4307 L375,256.014" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="337.7686" x="27.0833" y="279.5898">Start during Analysing: Busy, nothing cancelled (documented).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.0352" x="27.0833" y="296.46">Start during Sending: cancels the delivery job (accepted).</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#A9B8CA" points="522.6135,362.0361,533.0302,366.2028,522.6135,370.3695,526.7802,366.2028" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="200.3072" x2="528.8635" y1="366.2028" y2="366.2028"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.3896" x="212.8072" y="338.3301">Start: communication_postEvent(LISTENING_STARTED)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.2612" x="212.8072" y="355.2002">withdraws the network lease</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2"><polygon fill="#A9B8CA" points="522.6135,420.7764,533.0302,424.943,522.6135,429.1097,526.7802,424.943" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="200.3072" x2="528.8635" y1="424.943" y2="424.943"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.1577" x="212.8072" y="397.0703">communication_waitForWiFiStop(timeout)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.3843" x="212.8072" y="413.9404">CONTROL sends no other event during the wait</text></g><path d="M539.5833,442.6514 L539.5833,488.4847 A4.1667,4.1667 0 0 0 543.75,492.6514 L870.8333,492.6514 A4.1667,4.1667 0 0 0 875,488.4847 L875,448.9014 L864.5833,438.4847 L543.75,438.4847 A4.1667,4.1667 0 0 0 539.5833,442.6514" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M864.5833,438.4847 L864.5833,446.818 A2.0833,2.0833 0 0 0 866.6667,448.9014 L875,448.9014 L864.5833,438.4847" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="290.6006" x="551.0417" y="462.0605">Seen at the next event check; 200 ms is a candidate</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="303.7842" x="551.0417" y="478.9307">check interval, not a bound on teardown or flash writes.</text><path d="M426.3692,505.5583 L751.7476,505.5583 L751.7476,524.5117 L741.331,534.9284 L422.2026,534.9284 L422.2026,509.7249 A4.1667,4.1667 0 0 1 426.3692,505.5583" fill="#555555"/><rect fill="none" height="194.9707" rx="4.1667" ry="4.1667" style="stroke:#2A9FD6;stroke-width:1.0417;" width="594.9239" x="422.2026" y="505.5583"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="272.2534" x="443.0359" y="524.9674">Cancel the operation in progress, once (in-line)</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3"><polygon fill="#A9B8CA" points="818.1864,581.1686,828.6031,585.3353,818.1864,589.502,822.3531,585.3353" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="535.1135" x2="824.4364" y1="585.3353" y2="585.3353"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.1758" x="547.6135" y="557.4626">cancel scan, disconnect join, cancel SNTP</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="260.1563" x="547.6135" y="574.3327">or cancel TLS setup/exchange (1 s stop bound)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4"><polygon fill="#A9B8CA" points="546.5719,623.0387,536.1552,627.2054,546.5719,631.3721,542.4052,627.2054" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="540.3219" x2="829.6448" y1="627.2054" y2="627.2054"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="144.2749" x="558.0302" y="616.2028">released, or not confirmed</text></g><path d="M654.1667,644.9137 L654.1667,690.7471 A4.1667,4.1667 0 0 0 658.3333,694.9137 L1002.0833,694.9137 A4.1667,4.1667 0 0 0 1006.25,690.7471 L1006.25,651.1637 L995.8333,640.7471 L658.3333,640.7471 A4.1667,4.1667 0 0 0 654.1667,644.9137" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M995.8333,640.7471 L995.8333,649.0804 A2.0833,2.0833 0 0 0 997.9167,651.1637 L1006.25,651.1637 L995.8333,640.7471" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="318.8232" x="665.625" y="664.3229">Stale completions rejected: SNTP, TLS and DNS check the</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="320.2515" x="665.625" y="681.193">operation generation; scan results are no longer accepted.</text><path d="M426.3692,715.1123 L498.1344,715.1123 L498.1344,734.0658 L487.7177,744.4824 L422.2026,744.4824 L422.2026,719.279 A4.1667,4.1667 0 0 1 426.3692,715.1123" fill="#555555"/><rect fill="none" height="164.7624" rx="4.1667" ry="4.1667" style="stroke:#2A9FD6;stroke-width:1.0417;" width="999.1353" x="422.2026" y="715.1123"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="18.6401" x="443.0359" y="734.5215">opt</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="152.0386" x="518.9677" y="735.5632">[Settings commit pending]</text><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg5"><polygon fill="#A9B8CA" points="1089.7847,802.3844,1100.2014,806.5511,1089.7847,810.7178,1093.9514,806.5511" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="535.1135" x2="1096.0347" y1="806.5511" y2="806.5511"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" le