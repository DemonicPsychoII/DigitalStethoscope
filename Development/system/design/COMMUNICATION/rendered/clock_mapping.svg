-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="253.0762" x="389.0869" y="130.6437">listening: monotonic duration, never relabelled</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="1704.1667" y1="196.4355" y2="196.4355"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="176.3794" x="20.8333" y="214.8031">Case 1: anchor before the end</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="128.3691" x="20.8333" y="231.6732">qualifies at admission</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="203.4627" y1="241.6341" y2="241.6341"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="203.4627" x2="213.8794" y1="241.6341" y2="196.4355"/><polygon fill="none" points="28.125,246.8424,203.125,246.8424,215.625,259.3424,203.125,271.8424,28.125,271.8424,15.625,259.3424" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="228.125,246.8424,803.125,246.8424,815.625,259.3424,803.125,271.8424,228.125,271.8424,215.625,259.3424" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="828.125,246.8424,1003.125,246.8424,1015.625,259.3424,1003.125,271.8424,828.125,271.8424,815.625,259.3424" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="1028.125,246.8424,1698.9583,246.8424,1698.9583,271.8424,1028.125,271.8424,1015.625,259.3424" style="stroke:none;stroke-width:1.0417;"/><path d="M1698.9583,246.8424 L1028.125,246.8424 L1015.625,259.3424 L1028.125,271.8424 L1698.9583,271.8424" fill="none" style="stroke:#55B2DE;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="157.7515" x="36.7493" y="264.0666">Idle setup applies anchor A</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="150.1221" x="440.564" y="264.0666">A within 12.5 h of the end</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="114.2334" x="858.5083" y="264.0666">freeze at admission</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="226.9775" x="1033.3333" y="264.0666">frozen: same UTC end, Device id, bytes</text><path d="M1682.2917,277.0508 L1682.2917,365.3646 L2121.4193,365.3646 L2121.4193,287.4674 L2111.0026,277.0508 L1682.2917,277.0508" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2111.0026,277.0508 L2111.0026,287.4674 L2121.4193,287.4674 L2111.0026,277.0508" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="406.8359" x="1693.75" y="300.6266">UTC end = anchor UTC + (measurement end - anchor monotonic time).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="382.1045" x="1693.75" y="317.4967">An anchor qualifies only if |measurement end - anchor| &lt;= 12.5 h,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="381.9702" x="1693.75" y="334.3669">that is (1 s - 100 ms) / 20 ppm; it may lie before or after the end.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="130.6152" x="1693.75" y="351.237">Case 3 sends nothing.</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="1704.1667" y1="380.9896" y2="380.9896"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="164.9048" x="20.8333" y="399.3571">Case 2: no qualifying anchor</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="74.939" x="20.8333" y="416.2272">at admission</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="191.9881" y1="426.1882" y2="426.1882"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="191.9881" x2="202.4048" y1="426.1882" y2="380.9896"/><polygon fill="none" points="28.125,431.3965,803.125,431.3965,815.625,443.8965,803.125,456.3965,28.125,456.3965,15.625,443.8965" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="828.125,431.3965,1069.7917,431.3965,1082.2917,443.8965,1069.7917,456.3965,828.125,456.3965,815.625,443.8965" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="1094.7917,431.3965,1269.7917,431.3965,1282.2917,443.8965,1269.7917,456.3965,1094.7917,456.3965,1082.2917,443.8965" style="stroke:#55B2DE;stroke-width:1.0417;"/><polygon fill="none" points="1294.7917,431.3965,1698.9583,431.3965,1698.9583,456.3965,1294.7917,456.3965,1282.2917,443.8965" style="stroke:none;stroke-width:1.0417;"/><path d="M1698.9583,431.3965 L1294.7917,431.3965 L1282.2917,443.8965 L1294.7917,456.3965 L1698.9583,456.3965" fill="none" style="stroke:#55B2DE;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="243.5547" x="293.8477" y="448.6206">anchor A older than 12.5 h before the end</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="137.6343" x="880.1412" y="448.6206">delivery SNTP: anchor B</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="151.1597" x="1106.7118" y="448.6206">freeze before first request</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="226.9775" x="1300" y="448.6206">frozen: same UTC end, Device id, bytes</text><line style="stroke:#