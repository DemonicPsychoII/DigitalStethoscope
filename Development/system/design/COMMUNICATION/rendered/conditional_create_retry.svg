th:3.125;"/><text x="217.447" y="234.65" fill="#E6EDF7" font-size="12.5" textLength="187.524">attempt 1: POST /Observation</text><text x="217.447" y="249.2" fill="#E6EDF7" font-size="12.5" textLength="477.374">If-None-Exist: identifier=urn%3Astethoscope%3Ameasurement|&lt;identifier></text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="28"><polygon points="1118.78,279.199,1129.196,283.366,1118.78,287.533,1122.946,283.366" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="712.53" y1="283.366" x2="1125.03" y2="283.366" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="719.821" y="278.335" fill="#E6EDF7" font-size="12.5" textLength="47.791">request</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3" data-source-line="29"><line x1="1131.28" y1="312.5" x2="1175.03" y2="312.5" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="1175.03" y1="312.5" x2="1175.03" y2="326.042" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="1132.321" y1="326.042" x2="1175.03" y2="326.042" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="1142.738,321.875,1132.321,326.042,1142.738,330.208,1138.571,326.042" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1138.571" y="307.469" fill="#E6EDF7" font-size="12.5" textLength="269">no match: create and commit the resource</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4" data-source-line="30"><line x1="719.821" y1="349.967" x2="730.238" y2="360.384" style="stroke:#A9B8CA;stroke-width:2.083;"/><line x1="719.821" y1="360.384" x2="730.238" y2="349.967" style="stroke:#A9B8CA;stroke-width:2.083;"/><line x1="725.03" y1="355.176" x2="1130.238" y2="355.176" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="730.238" y="350.144" fill="#E6EDF7" font-size="12.5" textLength="271.075">201 Created (lost: reset or receipt timeout)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="31"><polygon points="221.614,380.143,211.197,384.31,221.614,388.477,217.447,384.31" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.364" y1="384.31" x2="711.488" y2="384.31" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="227.864" y="379.279" fill="#E6EDF7" font-size="12.5" textLength="125.604">no complete receipt</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg6" data-source-line="32"><line x1="210.155" y1="427.995" x2="253.905" y2="427.995" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="253.905" y1="427.995" x2="253.905" y2="441.536" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="211.197" y1="441.536" x2="253.905" y2="441.536" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="221.614,437.37,211.197,441.536,221.614,445.703,217.447,441.536" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.447" y="408.413" fill="#E6EDF7" font-size="12.5" textLength="277.374">lost receipt is retryable; cancel and quiesce,</text><text x="217.447" y="422.963" fill="#E6EDF7" font-size="12.5" textLength="193.036">then 2 s gap if budget remains</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg7" data-source-line="33"><polygon points="700.03,481.055,710.446,485.221,700.03,489.388,704.196,485.221" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="210.155" y1="485.221" x2="706.28" y2="485.221" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="217.447" y="465.639" fill="#E6EDF7" font-size="12.5" textLength="351.263">attempt 2: new connection setup (SNTP, DNS, TCP, TLS)</text><text x="217.447" y="480.19" fill="#E6EDF7" font-size="12.5" textLength="306.525">then identical POST, identical identifier and body</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg8" data-source-line="34"><polygon points="1118.78,510.189,1129.196,514.355,1118.78,518.522,1122.946,514.355" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="712.53" y1="514.355" x2="1125.03" y2="514.355" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="719.821" y="509.324" fill="#E6EDF7" font-size="12.5" textLength="47.791">request</text></g><path d="M197.655,526.855 L259.059,526.855 L259.059,533.073 L248.642,543.49 L193.489,543.49 L193.489,531.022 A4.167,4.167 0 0 1 197.655,526.855" fill="#1B2533"/><rect x="193.489" y="526.855" width="1300.354" height="342.318" fill="none" style="stroke:#61738A;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="209.114" y="539.5" fill="#E6EDF7" font-size="12.5" textLength="18.695" font-weight="700">alt</text><text x="274.684" y="540.542" fill="#E6EDF7" font-size="12.5" textLength="148.248" font-weight="700">[One existing match]</text><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg9" data-source-line="36"><line x1="1131.28" y1="574.707" x2="1175.03" y2="574.707" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="1175.03" y1="574.707" x2="1175.03" y2="588.249" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="1132.321" y1="588.249" x2="1175.03" y2="588.249" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="1142.738,584.082,1132.321,588.249,1142.738,592.415,1138.571,588.249" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1138.571" y="569.676" fill="#E6EDF7" font-size="12.5" textLength="338.605">search finds the committed resource; nothing created</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg10" data-source-line="37"><polygon points="723.988,613.216,713.571,617.383,723.988,621.549,719.821,617.383" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="717.738" y1="617.383" x2="1130.238" y2="617.383" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="730.238" y="612.351" fill="#E6EDF7" font-size="12.5" textLength="45.868">200 OK</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg11" data-source-line="38"><polygon points="221.614,642.35,211.197,646.517,221.614,650.684,217.447,646.517" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.364" y1="646.517" x2="711.488" y2="646.517" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="227.864" y="641.486" fill="#E6EDF7" font-size="12.5" textLength="205.566">receipt: result Sent, no readback</text></g><line x1="193.489" y1="655.892" x2="1493.843" y2="655.892" style="stroke:#61738A;stroke-width:1.042;stroke-dasharray:2.083,2.083;"/><text x="198.697" y="669.578" fill="#E6EDF7" font-size="12.5" textLength="140.436" font-weight="700">[Terminal rejection]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg12" data-source-line="40"><polygon points="723.988,706.836,713.571,711.003,723.988,715.169,719.821,711.003" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="717.738" y1="711.003" x2="1130.238" y2="711.003" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="730.238" y="691.42" fill="#E6EDF7" font-size="12.5" textLength="354.547">412 (multiple matches), unsupported conditional create,</text><text x="730.238" y="705.971" fill="#E6EDF7" font-size="12.5" textLength="393.75">authentication or configuration error, other non-success status</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg13" data-source-line="41"><polygon points="221.614,735.97,211.197,740.137,221.614,744.303,217.447,740.137" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.364" y1="740.137" x2="711.488" y2="740.137" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="227.864" y="735.105" fill="#E6EDF7" font-size="12.5" textLength="326.599">terminal: no further attempt, no unconditional POST</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg14" data-source-line="42"><line x1="210.155" y1="769.271" x2="253.905" y2="769.271" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="253.905" y1="769.271" x2="253.905" y2="782.813" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="211.197" y1="782.813" x2="253.905" y2="782.813" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="221.614,778.646,211.197,782.813,221.614,786.979,217.447,782.813" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.447" y="764.24" fill="#E6EDF7" font-size="12.5" textLength="233.282">DELIVERY_FAILURE; result visibly lost</text></g><line x1="193.489" y1="792.188" x2="1493.843" y2="792.188" style="stroke:#61738A;stroke-width:1.042;stroke-dasharray:2.083,2.083;"/><text x="198.697" y="805.874" fill="#E6EDF7" font-size="12.5" textLength="570.337" font-weight="700">[Retryable failure (5xx, timeout, lost receipt) until attempts or deadline run out]</text><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg15" data-source-line="44"><line x1="210.155" y1="847.298" x2="253.905" y2="847.298" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="253.905" y1="847.298" x2="253.905" y2="860.84" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="211.197" y1="860.84" x2="253.905" y2="860.84" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="221.614,856.673,211.197,860.84,221.614,865.007,217.447,860.84" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-