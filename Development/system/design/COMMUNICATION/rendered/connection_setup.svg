="978.823" y="79.46" width="117.796" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="999.656" y="106.687" fill="#0B1018" font-size="12.5" textLength="76.129">pool.ntp.org</text></g><g class="participant participant-head" data-qualified-name="Server" data-entity-uid="part5" id="part5-head" data-source-line="14"><rect x="1190.369" y="79.46" width="125.352" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1211.202" y="106.687" fill="#0B1018" font-size="12.5" textLength="83.685">HTTPS server</text></g><g class="participant participant-tail" data-qualified-name="COMMUNICATION" data-entity-uid="part1" id="part1-tail" data-source-line="10"><rect x="160.925" y="719.368" width="172.947" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="181.759" y="746.596" fill="#0B1018" font-size="12.5" textLength="131.281">L2_COMMUNICATION</text></g><g class="participant participant-tail" data-qualified-name="WIFI" data-entity-uid="part2" id="part2-tail" data-source-line="11"><rect x="578.326" y="719.368" width="89.756" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="599.16" y="746.596" fill="#0B1018" font-size="12.5" textLength="48.09">L1_WIFI</text></g><g class="participant participant-tail" data-qualified-name="DNS" data-entity-uid="part3" id="part3-tail" data-source-line="12"><rect x="761.833" y="719.368" width="123.24" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="782.666" y="746.596" fill="#0B1018" font-size="12.5" textLength="81.573">DNS resolver</text></g><g class="participant participant-tail" data-qualified-name="NTP" data-entity-uid="part4" id="part4-tail" data-source-line="13"><rect x="978.823" y="719.368" width="117.796" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="999.656" y="746.596" fill="#0B1018" font-size="12.5" textLength="76.129">pool.ntp.org</text></g><g class="participant participant-tail" data-qualified-name="Server" data-entity-uid="part5" id="part5-tail" data-source-line="14"><rect x="1190.369" y="719.368" width="125.352" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1211.202" y="746.596" fill="#0B1018" font-size="12.5" textLength="83.685">HTTPS server</text></g><path d="M20.833,149.219 L20.833,194.01 A4.167,4.167 0 0 0 25,198.177 L469.792,198.177 A4.167,4.167 0 0 0 473.958,194.01 L473.958,155.469 L463.542,145.052 L25,145.052 A4.167,4.167 0 0 0 20.833,149.219" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M463.542,145.052 L463.542,153.385 A2.083,2.083 0 0 0 465.625,155.469 L473.958,155.469 L463.542,145.052" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="27.083" y="161.863" fill="#E6EDF7" font-size="12.5" textLength="283.112">One monotonic deadline for the whole setup:</text><text x="27.083" y="176.414" fill="#E6EDF7" font-size="12.5" textLength="343.231">Idle preparation 10 s (P26), delivery attempt 3 s (P13).</text><text x="27.083" y="190.965" fill="#E6EDF7" font-size="12.5" textLength="431.256">Waits of at most 200 ms only let Start be seen; they never extend it.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="20"><polygon points="610.705,220.964,621.121,225.13,610.705,229.297,614.871,225.13" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="225.13" x2="616.955" y2="225.13" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="220.099" fill="#E6EDF7" font-size="12.5" textLength="210.461">start time synchronization (SNTP)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="21"><polygon points="810.953,250.098,821.369,254.264,810.953,258.431,815.119,254.264" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.205" y1="254.264" x2="817.203" y2="254.264" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="630.496" y="249.233" fill="#E6EDF7" font-size="12.5" textLength="165.955">resolve pool.ntp.org (IPv4)</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg3" data-source-line="22"><polygon points="1025.221,279.232,1035.637,283.398,1025.221,287.565,1029.387,283.398" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.205" y1="283.398" x2="1031.471" y2="283.398" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="630.496" y="278.367" fill="#E6EDF7" font-size="12.5" textLength="244.403">one SNTP request, UDP/123; no resend</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg4" data-source-line="23"><polygon points="634.663,308.366,624.246,312.533,634.663,316.699,630.496,312.533" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="628.413" y1="312.533" x2="1036.679" y2="312.533" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="640.913" y="307.501" fill="#E6EDF7" font-size="12.5" textLength="31.635">reply</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="24"><polygon points="258.857,337.5,248.441,341.667,258.857,345.833,254.691,341.667" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.607" y1="341.667" x2="622.163" y2="341.667" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="265.107" y="336.635" fill="#E6EDF7" font-size="12.5" textLength="350.806">normalized sample (reject leap 3, stratum outside 1-15)</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg6" data-source-line="25"><line x1="247.399" y1="385.352" x2="291.149" y2="385.352" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="291.149" y1="385.352" x2="291.149" y2="398.893" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="248.441" y1="398.893" x2="291.149" y2="398.893" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="258.857,394.727,248.441,398.893,258.857,403.06,254.691,398.893" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="254.691" y="365.769" fill="#E6EDF7" font-size="12.5" textLength="171.234">uncertainty above 100 ms?</text><text x="254.691" y="380.32" fill="#E6EDF7" font-size="12.5" textLength="217.865">yes: fail before the clock is applied</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg7" data-source-line="26"><polygon points="610.705,423.861,621.121,428.027,610.705,432.194,614.871,428.027" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="428.027" x2="616.955" y2="428.027" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="422.996" fill="#E6EDF7" font-size="12.5" textLength="251.544">apply clock: new UTC/monotonic anchor</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg8" data-source-line="27"><line x1="247.399" y1="471.712" x2="291.149" y2="471.712" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="291.149" y1="471.712" x2="291.149" y2="485.254" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="248.441" y1="485.254" x2="291.149" y2="485.254" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="258.857,481.087,248.441,485.254,258.857,489.421,254.691,485.254" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="254.691" y="452.13" fill="#E6EDF7" font-size="12.5" textLength="279.694">server certificate valid at the new UTC time?</text><text x="254.691" y="466.681" fill="#E6EDF7" font-size="12.5" textLength="186.035">no: fail before any ClientHello</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg9" data-source-line="28"><polygon points="610.705,510.221,621.121,514.388,610.705,518.555,614.871,514.388" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="514.388" x2="616.955" y2="514.388" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="509.357" fill="#E6EDF7" font-size="12.5" textLength="147.76">start secure connection</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg10" data-source-line="29"><polygon points="810.953,539.355,821.369,543.522,810.953,547.689,815.119,543.522" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.205" y1="543.522" x2="817.203" y2="543.522" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="630.496" y="538.491" fill="#E6EDF7" font-size="12.5" textLength="148.492">resolve server endpoint</text></g><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg11" data-source-line="30"><polygon points="1240.545,568.49,1250.961,572.656,1240.545,576.823,1244.711,572.656" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.205" y1="572.656" x2="1246.795" y2="572.656" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="630.496" y="567.625" fill="#E6EDF7" font-size="12.5" textLength="314.471">TCP connect, TLS 1.3 handshake (ClientHello first)</text></g><g class="message" data-entity-1="part5" data-entity-2="part2" id="msg12" data-source-line="31"><polygon points="634.663,597.624,624.246,601.79,634.663,605.957,630.496,601.79" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="628.413" y1="601.79" x2="1252.003" y2="601.79" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="640.913" y="596.759" fill="#E6EDF7" font-size="12.5" textLength="259.052">verified server: certificate, name, validity</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg13" data-source-line="32"><polygon points="258.857,626.758,248.441,630.924,258.857,635.091,254.691,630.924" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.607" y1="630.924" x2="622.163" y2="630.924" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="265.107" y="625.893" fill="#E6EDF7" font-size="12.5" textLength="303.497">verified connection, retained as reuse candidate</text></g><path d="M136.366,648.633 L136.366,693.424 A4.167,4.167 0 0 0 140.532,697.591 L1359.282,697.591 A4.167,4.167 0 0 0 1363.449,693.424 L1363.449,654.883 L1353.032,644.466 L140.532,644.466 A4.167,4.167 0 0 0 136.366,648.633" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M1353.032,644.466 L1353.032,652.799 A2.083,2.083 0 0 0 1355.116,654.883 L1363.449,654.883 L1353.032,644.466" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="404.522" y="661.277" fill="#E6EDF7" font-size="12.5" textLength="590.186">Any failure (DNS, SNTP, clock, TCP, TLS, deadline) fails the whole setup: Idle retries after 60 s,</text><text x="404.522" y="675.828" fill="#E6EDF7" font-size="12.5" textLength="682.025">delivery follows P13. No separate SNTP schedule, refresh timer or expiry: a reused connection runs no SNTP.</text><text x="404.522" y="690.379" fill="#E6EDF7" font-size="12.5" textLength="424.567">Cancellation has its own 1 s stop bound (P23) outside this deadline.</text><?plantuml-src XLNlRzis4Fskl-BMVR41nRNYBUjSO4NWegY1nZ5W1_aoeA2bayM59ZMIYgV-zNka_4DEb_LJ5Dxn-Dwxk-UVVCKxfhpT6BjDt9FKjR1YHwuIXTbBlQLIACUzIC6bQ9J_PBHV25nT2UrMR6NPozc8_6bhJQEBcL76qi_ZJJREtlrtbKCAtt1H_jPBkRNMx0z1yVlcNIxw-FZlXdNET-oSsFAjabjDY