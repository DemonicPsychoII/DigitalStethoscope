<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="912.5px" preserveAspectRatio="none" style="width:1218px;height:912px;background:#0B1018;" version="1.1" viewBox="0 0 1218 912" width="1218.75px" zoomAndPan="magnify"><title>What runs inside one connection setup, and under which deadline?</title><defs/><g><rect fill="#0B1018" height="912.5" style="stroke:none;stroke-width:1.0417;" width="1218.75" x="0" y="0"/><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="670.6624" x="275.4862" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="647.7458" x="286.9446" y="54.2236">What runs inside one connection setup, and under which deadline?</text><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="COMMUNICATION" id="part1-lifeline"><g><title>COMMUNICATION</title><rect fill="#000000" fill-opacity="0.00000" height="734.2773" width="8.3333" x="214.9943" y="126.237"/><line style="stroke:#555555;stroke-width:1.0417;stroke-dasharray:5.2083,5.2083;" x1="218.75" x2="218.75" y1="126.237" y2="860.5143"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="WIFI" id="part2-lifeline"><g><title>WIFI</title><rect fill="#000000" fill-opacity="0.00000" height="734.2773" width="8.3333" x="556.7342" y="126.237"/><line style="stroke:#555555;stroke-width:1.0417;stroke-dasharray:5.2083,5.2083;" x1="559.9528" x2="559.9528" y1="126.237" y2="860.5143"/></g></g><g class="participant-lifeline" data-entity-uid="part3" data-qualified-name="DNS" id="part3-lifeline"><g><title>DNS resolver</title><rect fill="#000000" fill-opacity="0.00000" height="734.2773" width="8.3333" x="734.7046" y="126.237"/><line style="stroke:#555555;stroke-width:1.0417;stroke-dasharray:5.2083,5.2083;" x1="738.7166" x2="738.7166" y1="126.237" y2="860.5143"/></g></g><g class="participant-lifeline" data-entity-uid="part4" data-qualified-name="NTP" id="part4-lifeline"><g><title>pool.ntp.org</title><rect fill="#000000" fill-opacity="0.00000" height="734.2773" width="8.3333" x="921.6003" y="126.237"/><line style="stroke:#555555;stroke-width:1.0417;stroke-dasharray:5.2083,5.2083;" x1="925.4842" x2="925.4842" y1="126.237" y2="860.5143"/></g></g><g class="participant-lifeline" data-entity-uid="part5" data-qualified-name="Server" id="part5-lifeline"><g><title>HTTPS server</title><rect fill="#000000" fill-opacity="0.00000" height="734.2773" width="8.3333" x="1109.259" y="126.237"/><line style="stroke:#555555;stroke-width:1.0417;stroke-dasharray:5.2083,5.2083;" x1="1112.5081" x2="1112.5081" y1="126.237" y2="860.5143"/></g></g><g class="participant participant-head" data-entity-uid="part1" data-qualified-name="COMMUNICATION" id="part1-head"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="121.6553" x="158.3333" y="83.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="96.6553" x="170.8333" y="108.9844">COMMUNICATION</text></g><g class="participant participant-tail" data-entity-uid="part1" data-qualified-name="COMMUNICATION" id="part1-tail"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="121.6553" x="158.3333" y="859.4727"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="96.6553" x="170.8333" y="885.1318">COMMUNICATION</text></g><g class="participant participant-head" data-entity-uid="part2" data-qualified-name="WIFI" id="part2-head"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="47.7295" x="537.0361" y="83.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="22.7295" x="549.5361" y="108.9844">WIFI</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="WIFI" id="part2-tail"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="47.7295" x="537.0361" y="859.4727"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="22.7295" x="549.5361" y="885.1318">WIFI</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="DNS" id="part3-head"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="96.1426" x="690.8" y="83.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="71.1426" x="703.3" y="108.9844">DNS resolver</text></g><g class="participant participant-tail" data-entity-uid="part3" data-qualified-name="DNS" id="part3-tail"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="96.1426" x="690.8" y="859.4727"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="71.1426" x="703.3" y="885.1318">DNS resolver</text></g><g class="participant participant-head" data-entity-uid="part4" data-qualified-name="NTP" id="part4-head"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="90.1489" x="880.6925" y="83.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="65.1489" x="893.1925" y="108.9844">pool.ntp.org</text></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="NTP" id="part4-tail"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="90.1489" x="880.6925" y="859.4727"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="65.1489" x="893.1925" y="885.1318">pool.ntp.org</text></g><g class="participant participant-head" data-entity-uid="part5" data-qualified-name="Server" id="part5-head"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="97.6685" x="1064.5915" y="83.3252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6685" x="1077.0915" y="108.9844">HTTPS server</text></g><g class="participant participant-tail" data-entity-uid="part5" data-qualified-name="Server" id="part5-tail"><rect fill="#2A9FD6" height="41.8701" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="97.6685" x="1064.5915" y="859.4727"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6685" x="1077.0915" y="885.1318">HTTPS server</text></g><path d="M15.625,146.0286 L15.625,208.5286 A4.1667,4.1667 0 0 0 19.7917,212.6953 L419.7917,212.6953 A4.1667,4.1667 0 0 0 423.9583,208.5286 L423.9583,152.2786 L413.5417,141.862 L19.7917,141.862 A4.1667,4.1667 0 0 0 15.625,146.0286" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M413.5417,141.862 L413.5417,150.1953 A2.0833,2.0833 0 0 0 415.625,152.2786 L423.9583,152.2786 L413.5417,141.862" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.3613" x="27.0833" y="165.4378">One monotonic deadline for the whole setup:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="300.8667" x="27.0833" y="182.3079">Idle preparation 10 s (P26), delivery attempt 3 s (P13).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.2329" x="27.0833" y="199.1781">Waits of at most 200 ms only let Start be seen; they never extend it.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#A9B8CA" points="548.4009,247.8841,558.8175,252.0508,548.4009,256.2174,552.5675,252.0508" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="219.161" x2="554.6509" y1="252.0508" y2="252.0508"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="181.25" x="231.661" y="241.0482">start time synchronization (SNTP)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#A9B8CA" points="726.3713,289.7542,736.7879,293.9209,726.3713,298.0876,730.5379,293.9209" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="560.9009" x2="732.6213" y1="293.9209" y2="293.9209"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="142.5537" x="573.4009" y="282.9183">resolve pool.ntp.org (IPv4)</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg3"><polygon fill="#A9B8CA" points="913.267,331.6243,923.6837,335.791,913.267,339.9577,917.4337,335.791" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="560.9009" x2="919.517" y1="335.791" y2="335.791"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="220.2271" x="573.4009" y="324.7884">one SNTP request, UDP/123; no resend</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg4"><polygon fill="#A9B8CA" points="572.3592,373.4945,561.9425,377.6611,572.3592,381.8278,568.1925,377.6611" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="566.1092" x2="924.7253" y1="377.6611" y2="377.6611"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="25.708" x="583.8175" y="366.6585">reply</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5"><polygon fill="#A9B8CA" points="230.6193,432.2347,220.2026,436.4014,230.6193,440.568,226.4526,436.4014" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="224.3693" x2="559.8592" y1="436.4014" y2="436.4014"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="306.3232" x="242.0776" y="408.5286">normalized sample (reject leap 3, stratum outside 1-15,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="146.5576" x="242.0776" y="425.3988">uncertainty above 100 ms)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg6"><polygon fill="#A9B8CA" points="548.4009,474.1048,558.8175,478.2715,548.4009,482.4382,552.5675,478.2715" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="219.161" x2="554.6509" y1="478.2715" y2="478.2715"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="219.2017" x="231.661" y="467.2689">apply clock: new UTC/monotonic anchor</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg7"><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="219.161" x2="262.911" y1="537.0117" y2="537.0117"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="262.911" x2="262.911" y1="537.0117" y2="550.5534"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="220.2026" x2="262.911" y1="550.5534" y2="550.5534"/><polygon fill="#A9B8CA" points="230.6193,546.3867,220.2026,550.5534,230.6193,554.7201,226.4526,550.5534" style="stroke:#A9B8CA;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="241.1377" x="231.661" y="509.139">server certificate valid at the new UTC time?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="160.9863" x="231.661" y="526.0091">no: fail before any ClientHello</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg8"><polygon fill="#A9B8CA" points="548.4009,588.2568,558.8175,592.4235,548.4009,596.5902,552.5675,592.4235" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="219.161" x2="554.6509" y1="592.4235" y2="592.4235"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="128.7964" x="231.661" y="581.4209">start secure connection</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg9"><polygon fill="#A9B8CA" points="726.3713,630.127,736.7879,634.2936,726.3713,638.4603,730.5379,634.2936" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="560.9009" x2="732.6213" y1="634.2936" y2="634.2936"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="127.5391" x="573.4009" y="623.291">resolve server endpoint</text></g><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg10"><polygon fill="#A9B8CA" points="1100.9257,671.9971,1111.3424,676.1637,1100.9257,680.3304,1105.0924,676.1637" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;" x1="560.9009" x2="1107.1757" y1="676.1637" y2="676.1637"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="276.6357" x="573.4009" y="665.1611">TCP connect, TLS 1.3 handshake (ClientHello first)</text></g><g class="message" data-entity-1="part5" data-entity-2="part2" id="msg11"><polygon fill="#A9B8CA" points="572.3592,713.8672,561.9425,718.0339,572.3592,722.2005,568.1925,718.0339" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="566.1092" x2="1112.384" y1="718.0339" y2="718.0339"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="220.6543" x="583.8175" y="707.0313">verified server: certificate, name, validity</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg12"><polygon fill="#A9B8CA" points="230.6193,755.7373,220.2026,759.904,230.6193,764.0706,226.4526,759.904" style="stroke:#A9B8CA;stroke-width:1.0417;"/><line style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="224.3693" x2="559.8592" y1="759.904" y2="759.904"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="263.3179" x="242.0776" y="748.9014">verified connection, retained as reuse candidate</text></g><path d="M125,777.6123 L125,840.1123 A4.1667,4.1667 0 0 0 129.1667,844.279 L1202.0833,844.279 A4.1667,4.1667 0 0 0 1206.25,840.1123 L1206.25,783.8623 L1195.8333,773.4456 L129.1667,773.4456 A4.1667,4.1667 0 0 0 125,777.6123" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1195.8333,773.4456 L1195.8333,781.779 A2.0833,2.0833 0 0 0 1197.9167,783.8623 L1206.25,783.8623 L1195.8333,773.4456" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="519.5679" x="363.383" y="797.0215">Any failure (DNS, SNTP, clock, TCP, TLS, deadline) fails the whole setup: Idle retries after 60 s,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="595.9106" x="363.383" y="813.8916">delivery follows P13. No separate SNTP schedule, refresh timer or expiry: a reused connection runs no SNTP.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="375.4395" x="363.383" y="830.7617">Cancellation has its own 1 s stop bound (P23) outside this deadline.</text><?plantuml-src XLLTRn9157tVNt6jBv1iAHIjIXDDWp6IM4e2JLzy6NRlicE7cNLcjaX_lMTcAIpLwXCmz-kSSpzu