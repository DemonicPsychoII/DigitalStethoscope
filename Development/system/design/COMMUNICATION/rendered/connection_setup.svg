ant-lifeline" data-qualified-name="NTP" data-entity-uid="part4" id="part4-lifeline" data-source-line="12"><g><title>pool.ntp.org</title><rect x="1033.172" y="131.51" width="8.333" height="539.974" fill="#000" fill-opacity="0"/><line x1="1036.817" y1="131.51" x2="1036.817" y2="671.484" style="stroke:#555;stroke-width:1.042;stroke-dasharray:5.208,5.208;"/></g></g><g class="participant-lifeline" data-qualified-name="Server" data-entity-uid="part5" id="part5-lifeline" data-source-line="13"><g><title>HTTPS server</title><rect x="1248.495" y="131.51" width="8.333" height="539.974" fill="#000" fill-opacity="0"/><line x1="1252.141" y1="131.51" x2="1252.141" y2="671.484" style="stroke:#555;stroke-width:1.042;stroke-dasharray:5.208,5.208;"/></g></g><g class="participant participant-head" data-qualified-name="COMMUNICATION" data-entity-uid="part1" id="part1-head" data-source-line="9"><rect x="160.925" y="79.46" width="172.947" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="181.759" y="106.687" fill="#E6EDF7" font-size="12.5" textLength="131.281">L2_COMMUNICATION</text></g><g class="participant participant-head" data-qualified-name="WIFI" data-entity-uid="part2" id="part2-head" data-source-line="10"><rect x="577.423" y="79.46" width="89.756" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="598.256" y="106.687" fill="#E6EDF7" font-size="12.5" textLength="48.09">L1_WIFI</text></g><g class="participant participant-head" data-qualified-name="DNS" data-entity-uid="part3" id="part3-head" data-source-line="11"><rect x="760.929" y="79.46" width="123.24" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="781.763" y="106.687" fill="#E6EDF7" font-size="12.5" textLength="81.573">DNS resolver</text></g><g class="participant participant-head" data-qualified-name="NTP" data-entity-uid="part4" id="part4-head" data-source-line="12"><rect x="977.92" y="79.46" width="117.796" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="998.753" y="106.687" fill="#E6EDF7" font-size="12.5" textLength="76.129">pool.ntp.org</text></g><g class="participant participant-head" data-qualified-name="Server" data-entity-uid="part5" id="part5-head" data-source-line="13"><rect x="1189.465" y="79.46" width="125.352" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1210.299" y="106.687" fill="#E6EDF7" font-size="12.5" textLength="83.685">HTTPS server</text></g><g class="participant participant-tail" data-qualified-name="COMMUNICATION" data-entity-uid="part1" id="part1-tail" data-source-line="9"><rect x="160.925" y="676.693" width="172.947" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="181.759" y="703.92" fill="#E6EDF7" font-size="12.5" textLength="131.281">L2_COMMUNICATION</text></g><g class="participant participant-tail" data-qualified-name="WIFI" data-entity-uid="part2" id="part2-tail" data-source-line="10"><rect x="577.423" y="676.693" width="89.756" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="598.256" y="703.92" fill="#E6EDF7" font-size="12.5" textLength="48.09">L1_WIFI</text></g><g class="participant participant-tail" data-qualified-name="DNS" data-entity-uid="part3" id="part3-tail" data-source-line="11"><rect x="760.929" y="676.693" width="123.24" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="781.763" y="703.92" fill="#E6EDF7" font-size="12.5" textLength="81.573">DNS resolver</text></g><g class="participant participant-tail" data-qualified-name="NTP" data-entity-uid="part4" id="part4-tail" data-source-line="12"><rect x="977.92" y="676.693" width="117.796" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="998.753" y="703.92" fill="#E6EDF7" font-size="12.5" textLength="76.129">pool.ntp.org</text></g><g class="participant participant-tail" data-qualified-name="Server" data-entity-uid="part5" id="part5-tail" data-source-line="13"><rect x="1189.465" y="676.693" width="125.352" height="45.801" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1210.299" y="703.92" fill="#E6EDF7" font-size="12.5" textLength="83.685">HTTPS server</text></g><path d="M20.833,149.219 L20.833,194.01 A4.167,4.167 0 0 0 25,198.177 L469.792,198.177 A4.167,4.167 0 0 0 473.958,194.01 L473.958,155.469 L463.542,145.052 L25,145.052 A4.167,4.167 0 0 0 20.833,149.219" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M463.542,145.052 L463.542,153.385 A2.083,2.083 0 0 0 465.625,155.469 L473.958,155.469 L463.542,145.052" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="27.083" y="161.863" fill="#E6EDF7" font-size="12.5" textLength="283.112">One monotonic deadline for the whole setup:</text><text x="27.083" y="176.414" fill="#E6EDF7" font-size="12.5" textLength="343.231">Idle preparation 10 s (P26), delivery attempt 3 s (P13).</text><text x="27.083" y="190.965" fill="#E6EDF7" font-size="12.5" textLength="431.256">Waits of at most 200 ms only let Start be seen; they never extend it.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="19"><polygon points="609.801,220.964,620.218,225.13,609.801,229.297,613.968,225.13" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="225.13" x2="616.051" y2="225.13" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="220.099" fill="#E6EDF7" font-size="12.5" textLength="210.461">start time synchronization (SNTP)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="20"><polygon points="810.049,250.098,820.466,254.264,810.049,258.431,814.216,254.264" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="622.301" y1="254.264" x2="816.299" y2="254.264" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="629.593" y="249.233" fill="#E6EDF7" font-size="12.5" textLength="165.955">resolve pool.ntp.org (IPv4)</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg3" data-source-line="21"><polygon points="1024.317,279.232,1034.734,283.398,1024.317,287.565,1028.484,283.398" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="622.301" y1="283.398" x2="1030.567" y2="283.398" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="629.593" y="278.367" fill="#E6EDF7" font-size="12.5" textLength="244.403">one SNTP request, UDP/123; no resend</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg4" data-source-line="22"><polygon points="633.76,308.366,623.343,312.533,633.76,316.699,629.593,312.533" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="627.51" y1="312.533" x2="1035.776" y2="312.533" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="640.01" y="307.501" fill="#E6EDF7" font-size="12.5" textLength="31.635">reply</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="23"><polygon points="258.857,352.051,248.441,356.217,258.857,360.384,254.691,356.217" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.607" y1="356.217" x2="621.26" y2="356.217" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="265.107" y="336.635" fill="#E6EDF7" font-size="12.5" textLength="349.902">normalized sample (reject leap 3, stratum outside 1-15,</text><text x="265.107" y="351.186" fill="#E6EDF7" font-size="12.5" textLength="169.476">uncertainty above 100 ms)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg6" data-source-line="24"><polygon points="609.801,381.185,620.218,385.352,609.801,389.518,613.968,385.352" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="385.352" x2="616.051" y2="385.352" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="380.32" fill="#E6EDF7" font-size="12.5" textLength="251.544">apply clock: new UTC/monotonic anchor</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg7" data-source-line="25"><line x1="247.399" y1="429.036" x2="291.149" y2="429.036" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="291.149" y1="429.036" x2="291.149" y2="442.578" style="stroke:#A9B8CA;stroke-width:3.125;"/><line x1="248.441" y1="442.578" x2="291.149" y2="442.578" style="stroke:#A9B8CA;stroke-width:3.125;"/><polygon points="258.857,438.411,248.441,442.578,258.857,446.745,254.691,442.578" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="254.691" y="409.454" fill="#E6EDF7" font-size="12.5" textLength="279.694">server certificate valid at the new UTC time?</text><text x="254.691" y="424.005" fill="#E6EDF7" font-size="12.5" textLength="186.035">no: fail before any ClientHello</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg8" data-source-line="26"><polygon points="609.801,467.546,620.218,471.712,609.801,475.879,613.968,471.712" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.399" y1="471.712" x2="616.051" y2="471.712" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="254.691" y="466.681" fill="#E6EDF7" font-size="12.5" textLength="147.76">start secure connection</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg9" data-source-line="27"><polygon points="810.049,496.68,820.466,500.846,810.049,505.013,814.216,500.846" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="622.301" y1="500.846" x2="816.299" y2="500.846" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="629.593" y="495.815" fill="#E6EDF7" font-size="12.5" textLength="148.492">resolve server endpoint</text></g><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg10" data-source-line="28"><polygon points="1239.641,525.814,1250.058,529.98,1239.641,534.147,1243.808,529.98" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="622.301" y1="529.98" x2="1245.891" y2="529.98" style="stroke:#A9B8CA;stroke-width:3.125;"/><text x="629.593" y="524.949" fill="#E6EDF7" font-size="12.5" textLength="314.471">TCP connect, TLS 1.3 handshake (ClientHello first)</text></g><g class="message" data-entity-1="part5" data-entity-2="part2" id="msg11" data-source-line="29"><polygon points="633.76,554.948,623.343,559.115,633.76,563.281,629.593,559.115" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="627.51" y1="559.115" x2="1251.1" y2="559.115" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="640.01" y="554.083" fill="#E6EDF7" font-size="12.5" textLength="259.052">verified server: certificate, name, validity</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg12" data-source-line="30"><polygon points="258.857,584.082,248.441,588.249,258.857,592.415,254.691,588.249" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.607" y1="588.249" x2="621.26" y2="588.249" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:2.083,2.083;"/><text x="265.107" y="583.217" fill="#E6EDF7" font-size="12.5" textLength="303.497">verified connection, retained as reuse candidate</text></g><path d="M136.366,605.957 L136.366,650.749 A4.167,4.167 0 0 0 140.532,654.915 L1358.241,654.915 A4.167,4.167 0 0 0 1362.407,650.749 L1362.407,612.207 L1351.991,601.79 L140.532,601.79 A4.167,4.167 0 0 0 136.366,605.957" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M1351.991,601.79 L1351.991,610.124 A2.083,2.083 0 0 0 1354.074,612.207 L1362.407,612.207 L1351.991,601.79" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="404.07" y="618.601" fill="#E6EDF7" font-size="12.5" textLength="590.186">Any failure (DNS, SNTP, clock, TCP, TLS, deadline) fails the whole setup: Idle retries after 60 s,</text><text x="404.07" y="633.152" fill="#E6EDF7" font-size="12.5" textLength="682.025">delivery follows P13. No separate SNTP schedule, refresh timer or expiry: a reused connection runs no SNTP.</text><text x="404.07" y="647.703" fill="#E6EDF7" font-size="12.5" textLength="424.567">Cancellation has its own 1 s stop bound (P23) outside this deadline.</text><?plantuml-src XLLTRzf857tthxXjNq1oA0xTR4kbhIAggaW9GO8eBv6gmRx6inbct9bnAFtrUsPCm2IRtQSuSp_FEVTUtlYADqpvRcNiEd4FKjV2YWsvIXHcA_MQIg4STom5bw9H_flHVYOGkX3QBTZAikEp4ld3sff65nEZZALtmrKsp3x-UvQz2rzmKVxPSRcqrcptHl5fzJ4NtVxuPyCwvsjsJgpvKicr9iMbJxpqYkck4fvienr9xMJ1P3HG6gqvzz9enFkcJadeWj0bMzfMCg_GbYYKrFmbGHalSraBxUdjrVcFoStrzUriEhbSJczcRqauEdbvvf_zk9j-cqQty75g_JfRa6Ldr2FRw8A7Ku_Q63NGlXv0bEWnMyvFFRulb_C5KDYd78lucMZZWHLVpzgZ6-3V69YDbla19vLW5oC0-0QiHLR62KqB_5DR3bn7kh8XEUhDpo_wAMALH84T2UzvKtiQHLiswWyIkXFIEp8bZ2ZdF9qFXxJ1YrOxwEDfuG63Lg4Mwy-XzeuqXuRvbsV88VqW2Ny3akG419tz5TcaCRcOnKlCdzlflB90zRjjjRS0MVqaEY8Wa3r-efkwn59lEd_ySFH463p3d8GC2C64EP_IxTVv--nyz1aTXJpeBGdsisCt84hjzddmUjhq675s8vJypGKviQb1RS_otnX4429g6gM00vwR3Pd6ns7Dph8_qdlTOC2j5r9xaBs2gj0XiDb_bHTHenFAbSaVK9UtTBkSl3_ABa2LiI-ZdtVSpXM5whAKkS1CFG914LGDqxBF70NuSg-r6UDCI0LPCK-CCZkQACdQVsUbpF-ew3XlR7SvNz5ktnJuhmqeENYram_7vMJ-b2MbvTM2ii68AgmuZja3IE-qHAMqplUJVMn7oyTmocIGAfh6NH9IqhXuQSk5zFyX-I7B4LKA845BF69TBJSEcD6SB93vjRr