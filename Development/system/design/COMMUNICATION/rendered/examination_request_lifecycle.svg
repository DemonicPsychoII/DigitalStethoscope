<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="782.2917px" preserveAspectRatio="none" style="width:1777px;height:782px;background:#0B1018;" version="1.1" viewBox="0 0 1777 782" width="1777.0833px" zoomAndPan="magnify"><title>Which examination context does an Observation carry? (documented; reception unimplemented)</title><defs/><g><rect fill="#0B1018" height="782.2917" style="stroke:none;stroke-width:1.0417;" width="1777.0833" x="0" y="0"/><g class="title" data-source-line="8"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="948.4741" x="408.5754" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="925.5575" x="420.0338" y="54.2236">Which examination context does an Observation carry? (documented; reception unimplemented)</text></g><!--cluster Slot--><g class="cluster" data-qualified-name="Slot" data-source-line="11" id="ent0003"><path d="M29.1667,238.5335 L589.5833,238.5335 A4.1667,4.1667 0 0 1 593.75,242.7002 L593.75,269.6228 L25,269.6228 L25,242.7002 A4.1667,4.1667 0 0 1 29.1667,238.5335" fill="#2A9FD6"/><rect fill="none" height="283.3333" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="568.75" x="25" y="238.5335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="25" x2="593.75" y1="269.6228" y2="269.6228"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.8044" x="243.4728" y="255.8044">Pending slot (one request)</text></g><!--cluster Session--><g class="cluster" data-qualified-name="Session" data-source-line="15" id="ent0006"><path d="M606.25,238.5335 L1345.8333,238.5335 A4.1667,4.1667 0 0 1 1350,242.7002 L1350,269.6228 L602.0833,269.6228 L602.0833,242.7002 A4.1667,4.1667 0 0 1 606.25,238.5335" fill="#2A9FD6"/><rect fill="none" height="283.3333" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="747.9167" x="602.0833" y="238.5335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="602.0833" x2="1350" y1="269.6228" y2="269.6228"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="80.0852" x="935.999" y="255.8044">Session context</text></g><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="256.4901" x="46.875" y="95.8252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="157.6528" x="57.2917" y="118.3044">OPEN: external request adapter</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="192.2068" x="57.2917" y="133.7687">protocol, acknowledgement, durability,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="235.6567" x="57.2917" y="149.233">cancellation/expiry; reception not implemented</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="205.2521" x="861.9792" y="609.3669"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="59.4849" x="872.3958" y="631.8461">Observation</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="184.4187" x="872.3958" y="647.3104">subject = supplied patient reference,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="164.5121" x="872.3958" y="662.7747">omitted when none was supplied</text><g class="start_entity" data-qualified-name=".start." data-source-line="23" id="ent0004"><ellipse cx="645.8333" cy="127.596" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="35" id="ent0003"><path d="M1358.3333,422.9085 L1358.3333,536.6292 A4.1667,4.1667 0 0 0 1362.5,540.7959 L1760.7259,540.7959 A4.1667,4.1667 0 0 0 1764.8926,536.6292 L1764.8926,429.1585 L1754.4759,418.7419 L1471.6355,418.7419 L852.0568,445.7329 L1463.3022,418.7419 L1362.5,418.7419 A4.1667,4.1667 0 0 0 1358.3333,422.9085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1754.4759,418.7419 L1754.4759,427.0752 A2.0833,2.0833 0 0 0 1756.5592,429.1585 L1764.8926,429.1585 L1754.4759,418.7419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="345.7153" x="1369.7917" y="442.3177">New external context cannot replace it or start a measurement;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.2676" x="1369.7917" y="459.1878">an attempted change follows SESSION_CONTEXT_CHANGE handling.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.7554" x="1369.7917" y="476.0579">A request arriving now becomes the pending offer for the next</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="334.9731" x="1369.7917" y="492.9281">examination; a later request never attaches to a running one.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.502" x="1369.7917" y="509.7982">No adapter network work while listening; an acknowledgement</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="289.3188" x="1369.7917" y="526.6683">may be queued for the next permitted network lease.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="43" id="ent0006"><path d="M757.2917,719.7835 L757.2917,766.0238 A4.1667,4.1667 0 0 0 761.4583,770.1904 L1167.9484,770.1904 A4.166