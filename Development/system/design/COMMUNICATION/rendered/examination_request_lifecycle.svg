<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="687.5px" preserveAspectRatio="none" style="width:1777px;height:687px;background:#0B1018;" version="1.1" viewBox="0 0 1777 687" width="1777.0833px" zoomAndPan="magnify"><title>Which examination context does an Observation carry?</title><defs/><g><rect fill="#0B1018" height="687.5" style="stroke:none;stroke-width:1.0417;" width="1777.0833" x="0" y="0"/><g class="title" data-source-line="8"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="550.8504" x="607.3873" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="527.9338" x="618.8456" y="54.2236">Which examination context does an Observation carry?</text></g><!--cluster Slot--><g class="cluster" data-qualified-name="Slot" data-source-line="11" id="ent0003"><path d="M29.1667,238.5335 L589.5833,238.5335 A4.1667,4.1667 0 0 1 593.75,242.7002 L593.75,269.6228 L25,269.6228 L25,242.7002 A4.1667,4.1667 0 0 1 29.1667,238.5335" fill="#2A9FD6"/><rect fill="none" height="283.3333" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="568.75" x="25" y="238.5335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="25" x2="593.75" y1="269.6228" y2="269.6228"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.8044" x="243.4728" y="255.8044">Pending slot (one request)</text></g><!--cluster Session--><g class="cluster" data-qualified-name="Session" data-source-line="15" id="ent0006"><path d="M606.25,238.5335 L1345.8333,238.5335 A4.1667,4.1667 0 0 1 1350,242.7002 L1350,269.6228 L602.0833,269.6228 L602.0833,242.7002 A4.1667,4.1667 0 0 1 606.25,238.5335" fill="#2A9FD6"/><rect fill="none" height="283.3333" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="747.9167" x="602.0833" y="238.5335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="602.0833" x2="1350" y1="269.6228" y2="269.6228"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="80.0852" x="935.999" y="255.8044">Session context</text></g><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="213.0402" x="68.2292" y="95.8252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="157.6528" x="78.6458" y="118.3044">OPEN: external request adapter</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="192.2068" x="78.6458" y="133.7687">protocol, acknowledgement, durability,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="94.4865" x="78.6458" y="149.233">cancellation/expiry</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="205.2521" x="861.9792" y="609.3669"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="59.4849" x="872.3958" y="631.8461">Observation</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="184.4187" x="872.3958" y="647.3104">subject = supplied patient reference,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="164.5121" x="872.3958" y="662.7747">omitted when none was supplied</text><g class="start_entity" data-qualified-name=".start." data-source-line="23" id="ent0004"><ellipse cx="645.8333" cy="127.596" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="35" id="ent0003"><path d="M1358.3333,422.9085 L1358.3333,536.6292 A4.1667,4.1667 0 0 0 1362.5,540.7959 L1760.7259,540.7959 A4.1667,4.1667 0 0 0 1764.8926,536.6292 L1764.8926,429.1585 L1754.4759,418.7419 L1471.6355,418.7419 L852.0568,445.7329 L1463.3022,418.7419 L1362.5,418.7419 A4.1667,4.1667 0 0 0 1358.3333,422.9085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1754.4759,418.7419 L1754.4759,427.0752 A2.0833,2.0833 0 0 0 1756.5592,429.1585 L1764.8926,429.1585 L1754.4759,418.7419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="345.7153" x="1369.7917" y="442.3177">New external context cannot replace it or start a measurement;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.2676" x="1369.7917" y="459.1878">an attempted change follows SESSION_CONTEXT_CHANGE handling.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.7554" x="1369.7917" y="476.0579">A request arriving now becomes the pending offer for the next</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="334.9731" x="1369.7917" y="492.9281">examination; a later request never attaches to a running one.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.502" x="1369.7917" y="509.7982">No adapter network work while listening; an acknowledgement</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="289.3188" x="1369.7917" y="526.6683">may be queued for the next permitted network lease.</text></g><rect fill="#2A9FD6" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="118.7663" x="216.6667" y="274.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="97.9329" x="227.0833" y="300.1556">No pending request</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="235.2183" x="33.3333" y="445.8252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="81.0028" x="43.75" y="468.3044">Pending request</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="214.385" x="43.75" y="483.7687">validated for this device and server binding</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="213.2212" x="43.75" y="499.233">request identity, optional patient reference</text><rect fill="#2A9FD6" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="77.1291" x="753.125" y="274.9919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="56.2958" x="763.5417" y="300.1556">No session</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="245.5017" x="684.375" y="445.8252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="103.4271" x="694.7917" y="468.3044">Examination session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="224.6684" x="694.7917" y="483.7687">request identity and patient reference copied</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="167.4886" x="694.7917" y="499.233">immutable until the session ends</text><rect fill="#2A9FD6" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="133.4137" x="1007.2917" y="453.6377"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="99.2981" x="1017.7083" y="476.1169">Standalone session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="112.5804" x="1017.7083" y="491.5812">no request: no subject</text><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk2"><polygon fill="#A9B8CA" points="145.2293,445.779,147.8988,435.8732,144.4253,440.6331,139.6654,437.1595,145.2293,445.779" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M161.1965,163.5514 C153.1219,184.5705 143.7243,212.6598 139.5833,238.5335 C127.8441,311.8834 137.0046,393.1366 144.2645,439.6039" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="146.875" y="300.651">valid offer</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="263.5855,274.5583,262.2171,264.3908,260.8543,270.1236,255.1215,268.7608,263.5855,274.5583" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M195.4473,163.9215 C215.8608,197.0672 243.2963,241.6145 260.308,269.2366" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="133.0688" x="242.7083" y="202.7344">wrong target, malformed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="116.8213" x="250.8321" y="219.6045">or oversized: rejected</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#A9B8CA" points="320.9465,274.861,331.2057,274.8677,325.7073,272.7488,327.8262,267.2504,320.9465,274.861" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M635.165,135.4542 C589.2179,155.8391 412.3851,234.2931 326.6595,272.3263" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#A9B8CA" points="149.3073,445.5824,153.506,436.2217,149.3251,440.3741,145.1727,436.1932,149.3073,445.5824" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M216.4525,310.4213 C202.8365,316.0967 189.6212,324.1111 180.2083,335.4085 C154.4616,366.3099 149.4374,407.6015 149.3287,439.3324" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="187.5" y="372.526">valid offer</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0005" data-link-type="dependency" id="lnk7"><polygon fill="#A9B8CA" points="268.9477,493.8929,279.0598,495.6239,273.9958,492.611,277.0087,487.5469,268.9477,493.8929" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M268.9477,465.4658 C280.304,468.3497 287.5,473.0876 287.5,479.6794 C287.5,486.2712 286.3617,489.4707 275.0054,492.3546" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="269.3481" x="302.2746" y="467.8385">newest wins: a newer offer replaces and drops it;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="284.314" x="294.7917" y="484.7087">duplicate of the same request: no new examination;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.7344" x="348.0815" y="501.5788">rejected Start consumes nothing</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#A9B8CA" points="274.2442,316.9704,268.9408,325.7526,273.5946,322.1381,277.2091,326.7919,274.2442,316.9704" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M203.4542,445.6823 C219.7567,433.1514 236.4437,417.5966 247.9167,399.9919 C264.6348,374.3387 270.7064,345.115 273.4647,323.1716" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.0801" x="279.1667" y="372.526">accepted local Start consumes it (removed at once)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk9"><polygon fill="#A9B8CA" points="773.9481,274.8501,770.8339,265.0749,770.4878,270.9573,764.6054,270.6113,773.9481,274.8501" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M656.0881,142.2576 C680.66,169.901 738.9915,235.524 769.7958,270.1788" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk10"><polygon fill="#A9B8CA" points="684.3602,446.3926,677.9792,438.3593,679.7436,443.9815,674.1214,445.7458,684.3602,446.3926" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M752.8645,300.6629 C710.0545,305.7469 645.2074,316.4076 630.2083,335.4085 C612.4235,357.9385 614.564,375.9262 630.2083,399.9919 C643.3174,420.1575 657.3775,432.3003 678.8202,443.4992" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="109.0698" x="645.1172" y="364.1927">accepted local Start</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="124.3042" x="637.5" y="381.0628">with a pending request</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" id="lnk11"><polygon fill="#A9B8CA" points="1073.394,453.3902,1077.206,443.8655,1073.1986,448.1856,1068.8785,444.1782,1073.394,453.3902" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M830.4058,297.2111 C894.9944,298.6372 1020.6141,305.3181 1051.0417,335.4085 C1067.291,351.4778 1071.7841,410.5112 1073.1595,447.1446" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" f