<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="643.75px" preserveAspectRatio="none" style="width:2017px;height:643px;background:#0B1018;" version="1.1" viewBox="0 0 2017 643" width="2017.7083px" zoomAndPan="magnify"><title>Which examination context does an Observation carry?</title><defs/><g><rect fill="#0B1018" height="643.75" style="stroke:none;stroke-width:1.0417;" width="2017.7083" x="0" y="0"/><g class="title" data-source-line="8"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="550.8504" x="731.8665" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="527.9338" x="743.3248" y="54.2236">Which examination context does an Observation carry?</text></g><!--cluster Slot--><g class="cluster" data-qualified-name="Slot" data-source-line="11" id="ent0003"><path d="M285.4167,158.846 L845.8333,158.846 A4.1667,4.1667 0 0 1 850,163.0127 L850,189.9353 L281.25,189.9353 L281.25,163.0127 A4.1667,4.1667 0 0 1 285.4167,158.846" fill="#2A9FD6"/><rect fill="none" height="319.2708" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="568.75" x="281.25" y="158.846"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="281.25" x2="850" y1="189.9353" y2="189.9353"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.8044" x="499.7228" y="176.1169">Pending slot (one request)</text></g><!--cluster Session--><g class="cluster" data-qualified-name="Session" data-source-line="15" id="ent0006"><path d="M862.5,158.846 L1586.4583,158.846 A4.1667,4.1667 0 0 1 1590.625,163.0127 L1590.625,189.9353 L858.3333,189.9353 L858.3333,163.0127 A4.1667,4.1667 0 0 1 862.5,158.846" fill="#2A9FD6"/><rect fill="none" height="319.2708" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="732.2917" x="858.3333" y="158.846"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="858.3333" x2="1590.625" y1="189.9353" y2="189.9353"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="80.0852" x="1184.4365" y="176.1169">Session context</text></g><rect fill="#2A9FD6" height="113.619" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="255.8411" x="16.6667" y="159.3669"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="157.6528" x="27.0833" y="181.8461">OPEN: external request adapter</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="192.2068" x="27.0833" y="197.3104">protocol, acknowledgement, durability,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="94.4865" x="27.0833" y="212.7747">cancellation/expiry</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="11.4583" x="27.0833" y="228.2389">&#8212;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="217.865" x="27.0833" y="243.7032">wrong target, malformed or oversized offers</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="235.0077" x="27.0833" y="259.1675">are rejected; the pending slot stays unchanged</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="205.2521" x="1106.7708" y="565.6169"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="59.4849" x="1117.1875" y="588.0961">Observation</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="184.4187" x="1117.1875" y="603.5604">subject = supplied patient reference,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="164.5121" x="1117.1875" y="619.0247">omitted when none was supplied</text><g class="start_entity" data-qualified-name=".start." data-source-line="22" id="ent0003"><ellipse cx="838.5417" cy="106.2419" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="34" id="ent0003"><path d="M1598.9583,379.1585 L1598.9583,492.8792 A4.1667,4.1667 0 0 0 1603.125,497.0459 L2001.3509,497.0459 A4.1667,4.1667 0 0 0 2005.5176,492.8792 L2005.5176,385.4085 L1995.1009,374.9919 L1712.2605,374.9919 L1103.5931,402.0174 L1703.9272,374.9919 L1603.125,374.9919 A4.1667,4.1667 0 0 0 1598.9583,379.1585" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1995.1009,374.9919 L1995.1009,383.3252 A2.0833,2.0833 0 0 0 1997.1842,385.4085 L2005.5176,385.4085 L1995.1009,374.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="345.7153" x="1610.4167" y="398.5677">New external context cannot replace it or start a measurement;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.2676" x="1610.4167" y="415.4378">an attempted change follows SESSION_CONTEXT_CHANGE handling.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.7554" x="1610.4167" y="432.3079">A request arriving now becomes the pending offer for the next</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="334.9731" x="1610.4167" y="449.1781">examination; a later request never attaches to a running one.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.502" x="1610.4167" y="466.0482">No adapter network work while listening; an acknowledgement</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="289.3188" x="1610.4167" y="482.9183">may be queued for the next permitted network lease.</text></g><rect fill="#2A9FD6" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="118.7663" x="439.5833" y="195.3044"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="97.9329" x="450" y="220.4681">No pending request</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="235.2183" x="289.5833" y="402.0752"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="81.0028" x="300" y="424.5544">Pending request</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="214.385" x="300" y="440.0187">validated for this device and server binding</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="213.2212" x="300" y="455.483">request identity, optional patient reference</text><rect fill="#2A9FD6" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="77.1291" x="1009.375" y="195.3044"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="56.2958" x="1019.7917" y="220.4681">No session</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="245.5017" x="939.5833" y="402.0752"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="103.4271" x="950" y="424.5544">Examination session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="224.6684" x="950" y="440.0187">request identity and patient reference copied</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="167.4886" x="950" y="455.483">immutable until the session ends</text><rect fill="#2A9FD6" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="133.4137" x="1247.9167" y="409.8877"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="99.2981" x="1258.3333" y="432.3669">Standalone session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="112.5804" x="1258.3333" y="447.8312">no request: no subject</text><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk2"><polygon fill="#A9B8CA" points="367.5595,401.9352,363.0033,392.7432,363.5505,398.6103,357.6834,399.1576,367.5595,401.9352" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M212.0511,272.962 C261.2681,313.7808 321.5685,363.7919 362.7487,397.9453" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="314.5833" y="328.776">valid offer</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="558.4325,196.5788,568.6223,197.7701,563.4054,195.0305,566.145,189.8135,558.4325,196.5788" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M828.0062,112.6471 C787.7605,125.1776 647.7745,168.7622 564.3999,194.7208" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk5"><polygon fill="#A9B8CA" points="399.9013,401.8414,402.4681,391.9085,399.0441,396.7041,394.2485,393.28,399.9013,401.8414" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M461.5971,237.0727 C441.859,249.8021 419.4684,268.3145 408.3333,291.6585 C391.7393,326.4471 393.829,365.4509 398.8726,395.6766" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="415.625" y="328.776">valid offer</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#A9B8CA" points="525.1977,450.1429,535.3098,451.8739,530.2458,448.861,533.2587,443.7969,525.1977,450.1429" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M525.1977,421.7158 C536.554,424.5997 543.75,429.3376 543.75,435.9294 C543.75,442.5212 542.6117,445.7207 531.2554,448.6046" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="269.3481" x="558.5246" y="424.0885">newest wins: a newer offer replaces and drops it;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="284.314" x="551.0417" y="440.9587">duplicate of the same request: no new examination;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.7344" x="604.3315" y="457.8288">rejected Start consumes nothing</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#A9B8CA" points="499.0482,237.0717,494.6804,246.3547,498.936,242.2788,503.0118,246.5343,499.0482,237.0717" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M443.4272,401.9104 C455.631,388.8547 468.1485,372.9713 476.0417,356.2419 C494.6262,316.8522 498.3112,271.2562 498.9135,243.3202" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.0801" x="502.0833" y="328.776">accepted local Start consumes it (removed at once)</text></g><g class="link" data-entity-1="ent0003" da