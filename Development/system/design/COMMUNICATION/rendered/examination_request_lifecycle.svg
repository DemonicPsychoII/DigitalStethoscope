th="72.056" height="41.667" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1153.125" y="200.093" fill="#E6EDF7" font-size="11.458" textLength="61.639">No session</text><rect x="1065.625" y="329.46" width="271.793" height="50.431" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1070.833" y="345.304" fill="#E6EDF7" font-size="11.458" textLength="117.677">Examination session</text><text x="1070.833" y="358.642" fill="#E6EDF7" font-size="11.458" textLength="261.376">request identity and patient reference copied</text><text x="1070.833" y="371.98" fill="#E6EDF7" font-size="11.458" textLength="190.517">immutable until the session ends</text><rect x="1410.938" y="333.626" width="139.088" height="41.667" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="1416.146" y="351.757" fill="#E6EDF7" font-size="11.458" textLength="110.907">Standalone session</text><text x="1416.146" y="365.096" fill="#E6EDF7" font-size="11.458" textLength="128.671">no request: no subject</text><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="415.947,329.319,409.501,321.338,411.311,326.946,405.704,328.756,415.947,329.319" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M204.832,221.24 C262.187,250.602 353.933,297.571 411.311,326.946" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.292,7.292;" fill="none"/><text x="331.771" y="268.146" fill="#E6EDF7" font-size="12.5" textLength="63.19">valid offer</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0003" id="lnk12" data-link-type="dependency"><polygon points="615.962,179.132,626.077,180.843,621.007,177.84,624.01,172.77,615.962,179.132" fill="#A9B8CA" style="stroke:#A9B8CA;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M933.823,97.759 C889.113,10