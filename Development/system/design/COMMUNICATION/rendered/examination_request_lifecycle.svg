ont-size="11.4583" lengthAdjust="spacing" textLength="56.2958" x="763.5417" y="300.1556">No session</text><rect fill="#2A9FD6" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="245.5017" x="684.375" y="445.8252"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="103.4271" x="694.7917" y="468.3044">Examination session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="224.6684" x="694.7917" y="483.7687">request identity and patient reference copied</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="167.4886" x="694.7917" y="499.233">immutable until the session ends</text><rect fill="#2A9FD6" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="133.4137" x="1007.2917" y="453.6377"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="99.2981" x="1017.7083" y="476.1169">Standalone session</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="112.5804" x="1017.7083" y="491.5812">no request: no subject</text><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk2"><polygon fill="#A9B8CA" points="145.2293,445.779,147.8988,435.8732,144.4253,440.6331,139.6654,437.1595,145.2293,445.779" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M161.1965,163.5514 C153.1219,184.5705 143.7243,212.6598 139.5833,238.5335 C127.8441,311.8834 137.0046,393.1366 144.2645,439.6039" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="146.875" y="300.651">valid offer</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="263.5855,274.5583,262.2171,264.3908,260.8543,270.1236,255.1215,268.7608,263.5855,274.5583" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M195.4473,163.9215 C215.8608,197.0672 243.2963,241.6145 260.308,269.2366" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="133.0688" x="242.7083" y="202.7344">wrong target, malformed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="116.8213" x="250.8321" y="219.6045">or oversized: rejected</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#A9B8CA" points="320.9465,274.861,331.2057,274.8677,325.7073,272.7488,327.8262,267.2504,320.9465,274.861" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M635.165,135.4542 C589.2179,155.8391 412.3851,234.2931 326.6595,272.3263" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#A9B8CA" points="149.3073,445.5824,153.506,436.2217,149.3251,440.3741,145.1727,436.1932,149.3073,445.5824" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M216.4525,310.4213 C202.8365,316.0967 189.6212,324.1111 180.2083,335.4085 C154.4616,366.3099 149.4374,407.6015 149.3287,439.3324" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="53.6621" x="187.5" y="372.526">valid offer</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0005" data-link-type="dependency" id="lnk7"><polygon fill="#A9B8CA" points="268.4977,493.8929,278.6114,495.6146,273.5446,492.6064,276.5529,487.5396,268.4977,493.8929" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M268.4977,465.4658 C279.8106,468.3497 286.9792,473.0876 286.9792,479.6794 C286.9792,486.2712 285.8669,489.4651 274.554,492.349" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="269.3481" x="301.7537" y="467.8385">newest wins: a newer offer replaces and drops it;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="284.314" x="294.2708" y="484.7087">duplicate of the same request: no new examination;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.7344" x="347.5606" y="501.5788">rejected Start consumes nothing</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#A9B8CA" points="274.2442,316.9704,268.9408,325.7526,273.5946,322.1381,277.2091,326.7919,274.2442,316.9704" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M203.4542,445.6823 C219.7567,433.1514 236.4437,417.5966 247.9167,399.9919 C264.6348,374.3387 270.7064,345.115 273.4647,323.1716" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.0801" x="279.1667" y="372.526">accepted local Start consumes it (removed at once)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk9"><polygon fill="#A9B8CA" points="773.9481,274.8501,770.8339,265.0749,770.4878,270.9573,764.6054,270.6113,773.9481,274.8501" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M656.0881,142.2576 C680.66,169.901 738.9915,235.524 769.7958,270.1788" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk10"><polygon fill="#A9B8CA" points="684.3602,446.3926,677.9792,438.3593,679.7436,443.9815,674.1214,445.7458,