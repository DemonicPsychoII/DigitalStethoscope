 pending request</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" data-link-type="dependency" id="lnk11"><polygon fill="#A9B8CA" points="1140.845,565.3419,1135.4936,556.5889,1136.5576,562.3846,1130.762,563.4487,1140.845,565.3419" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1073.5123,469.8572 C1082.7044,493.4683 1097.71,524.8756 1118.75,546.8669 C1125.2573,553.6683 1127.7153,556.2854 1135.7002,561.7932" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="115.5762" x="1126.0417" y="536.0677">result of this session</text></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" data-link-type="dependency" id="lnk12"><polygon fill="#A9B8CA" points="1238.0512,565.5332,1247.1705,560.8332,1241.3127,561.4725,1240.6734,555.6147,1238.0512,565.5332" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1301.8722,462.1613 C1290.0078,484.9349 1271.2922,519.0543 1252.0833,546.8669 C1247.7896,553.0837 1246.8369,554.5949 1241.965,560.6604" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="30.9448" x="1278.125" y="536.0677">result</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0007" data-link-type="dependency" id="lnk13"><polygon fill="#A9B8CA" points="1047.0517,237.0329,1042.5596,246.2564,1046.8695,242.2381,1050.8878,246.548,1047.0517,237.0329" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1055.5605,401.7527 C1052.9548,387.7742 1050.3006,371.2837 1048.9583,356.2419 C1045.1814,313.9175 1045.8867,270.3066 1046.833,243.2791" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.4194" x="1061.615" y="312.1094">session ends; cancellation, poor signal,</text><text fill="#E6EDF7" font-family="sans-serif" font