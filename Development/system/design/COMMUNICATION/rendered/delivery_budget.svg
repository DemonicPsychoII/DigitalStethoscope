h:1.0417;"/><polygon fill="#55B2DE" points="891.6667,234.7616,891.6667,226.4282,900,230.5949" style="stroke:#55B2DE;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="126.8311" x="394.9178" y="216.4673">deadline = Stop + 10 s</text><path d="M1963.5417,277.0508 L1963.5417,399.1048 L2361.7757,399.1048 L2361.7757,287.4674 L2351.359,277.0508 L1963.5417,277.0508" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2351.359,277.0508 L2351.359,287.4674 L2361.7757,287.4674 L2351.359,277.0508" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="299.0112" x="1975" y="300.6266">Yellow: 1 s cleanup reserve; red: past the deadline.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="283.7646" x="1975" y="317.4967">"receipt 1 s" = write request and receive receipt.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="361.2915" x="1975" y="334.3669">Attempts end 1 s before the deadline: setup and write+receipt</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="365.9424" x="1975" y="351.237">limits are truncated by the remaining budget. A second attempt</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="324.646" x="1975" y="368.1071">starts at 6 s and its setup is cut at 9 s: one full attempt</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="177.2827" x="1975" y="384.9772">plus one truncated attempt fit.</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="2057.2917" y1="414.7298" y2="414.7298"/><text 