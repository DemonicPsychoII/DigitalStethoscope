.5" font-weight="bold" lengthAdjust="spacing" textLength="54.9194" x="652.2278" y="150.9562">setup 3 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="62.1826" x="825.6795" y="150.9562">receipt 1 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="43.1641" x="968.0013" y="150.9562">gap 2 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="54.9194" x="1183.4778" y="150.9562">setup 3 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="62.1826" x="1356.9295" y="150.9562">receipt 1 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="43.1641" x="1499.2513" y="150.9562">gap 2 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="54.9194" x="1714.7278" y="150.9562">setup 3 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="62.1826" x="1888.1795" y="150.9562">receipt 1 s</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="2057.2917" y1="169.1488" y2="169.1488"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="124.7314" x="20.8333" y="187.5163">Example A: each step</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="97.1069" x="20.8333" y="204.3864">uses its full limit</text><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="10.4167" x2="151.8148" y1="214.3473" y2="214.3473"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="151.8148" x2="162.2314" y1="214.3473" y2="169.1488"/><polygon fill="none" points="28.