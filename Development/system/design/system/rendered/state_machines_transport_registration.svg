ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="767.7083" x="1493.75" y="115.6087"/><line style="stroke:#4AA3DF;stroke-width:1.0417;" x1="1493.75" x2="2261.4583" y1="146.698" y2="146.698"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="93.1213" x="1831.0435" y="132.8796">Device registration</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="64" id="ent0003"><path d="M931.7708,277.0671 L931.7708,323.3073 A4.1667,4.1667 0 0 0 935.9375,327.474 L1478.9388,327.474 A4.1667,4.1667 0 0 0 1483.1055,323.3073 L1483.1055,283.3171 L1472.6888,272.9004 L935.9375,272.9004 A4.1667,4.1667 0 0 0 931.7708,277.0671" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1472.6888,272.9004 L1472.6888,281.2337 A2.0833,2.0833 0 0 0 1474.7721,283.3171 L1483.1055,283.3171 L1472.6888,272.9004" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="477.3071" x="943.2292" y="296.4762">"Verified" means the last handshake verified the server with the clock of its own setup;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="519.043" x="943.2292" y="313.3464">it is not "link up". These facts stay separate on purpose: one "ready" flag would lose meaning.</text></g><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="193.7602" x="162.5" y="273.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="118.9585" x="172.9167" y="296.4213">Unavailable until restart</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="172.9268" x="172.9167" y="311.8856">ServerProfileState &#8800; CONFIGURED</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="272.0886" x="375.5208" y="273.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="75.0498" x="385.9375" y="296.4213">Unverified, due</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="251.2553" x="385.9375" y="311.8856">&#172;TransportIsVerified, NextPreparationTime passed</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="311.2864" x="602.6042" y="548.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="73.4833" x="613.0208" y="571.4213">Retry gap 60 s</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="168.1712" x="613.0208" y="586.8856">NextPreparationTime in the future</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="290.4531" x="613.0208" y="602.3499">SERVER_CONNECTION_FAILURE latched once per episode</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="328.2501" x="227.6042" y="412.4837"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="190.6403" x="238.0208" y="434.963">Preparing (10 s in Idle, 3 s in delivery)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="135.4747" x="238.0208" y="450.4272">TransportIsVerified := false</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="307.4168" x="238.0208" y="465.8915">close retained &#8594; SNTP &#8594; certificate dates &#8594; DNS, TCP, TLS</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="305.5237" x="33.8542" y="548.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="85.3333" x="44.2708" y="571.4213">Verified, retained</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="254.3549" x="44.2708" y="586.8856">TransportIsVerified &#8743; SecureConnectionIsRetained</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="284.6903" x="44.2708" y="602.3499">idle deadline = min(keep-alive &#8722; 5 s, anchor limit 12.5 h)</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="282.0587" x="134.8958" y="702.0671"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="77.1088" x="145.3125" y="724.5463">Verified, closed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="261.2254" x="145.3125" y="740.0106">TransportIsVerified &#8743; &#172;SecureConnectionIsRetained</text><g class="start_entity" data-qualified-name="Transport..start.Transport" data-source-line="34" id="ent0002"><ellipse cx="365.625" cy="176.0254" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="172.3094" x="1523.4375" y="273.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="118.9585" x="1533.8542" y="296.4213">Unavailable until restart</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="151.476" x="1533.8542" y="311.8856">RegistrationIsAvailable = false</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="262.1857" x="1714.5833" y="273.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="38.4369" x="1725" y="296.4213">Needed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="241.3523" x="1725" y="311.8856">&#172;RegistrationIsReady &#8743; &#172;RegistrationIsUnsaved</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="210.3658" x="1903.125" y="152.0671"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="58.1309" x="1913.5417" y="174.5463">Waiting gap</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="189.5325" x="1913.5417" y="190.0106">NextRegistrationTime: 60 s &#215; 2^(n&#8722;1)</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="189.4745" x="1860.4167" y="420.2962"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="72.5657" x="1870.8333" y="442.7755">Attempt (10 s)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="168.6412" x="1870.8333" y="458.2397">conditional POST Device, parse id</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="259.0525" x="1865.1042" y="556.7546"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="54.4607" x="1875.5208" y="579.2338">Id unsaved</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="238.2192" x="1875.5208" y="594.6981">RegistrationIsUnsaved; next attempt only saves</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="280.5593" x="1534.8958" y="702.0671"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="30.4362" x="1545.3125" y="724.5463">Ready</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="259.726" x="1545.3125" y="740.0106">RegistrationIsReady &#8594; DeliveryIsPossible published</text><g class="start_entity" data-qualified-name="Registration..start.Registration" data-source-line="51" id="ent0012"><ellipse cx="1528.125" cy="176.0254" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="279.046,273.7708,288.1503,269.0417,282.2946,269.6997,281.6366,263.844,279.046,273.7708" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M354.9018,189.3028 C345.8597,197.9967 332.6999,210.9658 321.875,222.9004 C306.9501,239.3553 294.9645,253.822 282.9443,268.8855" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="132.7881" x="329.1667" y="243.3512">invalid or missing profile</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="502.3716,273.8934,502.5015,263.635,500.3167,269.1075,494.8441,266.9228,502.3716,273.8934" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M376.2063,181.2466 C396.3716,185.7121 440.7835,197.8654 468.75,222.9004 C484.2057,236.7359 492.8844,251.7979 499.9057,268.1504" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="72.6685" x="500" y="243.3512">CONFIGURED</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk5"><polygon fill="#A9B8CA" points="401.8315,412.0387,408.9639,404.6644,403.6199,407.147,401.1372,401.803,401.8315,412.0387" style="stroke:#A9B8CA;stroke-width:1.0417;"/