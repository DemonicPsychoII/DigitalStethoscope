4.1667" x="389.5833" y="532.2754"/><line style="stroke:#4AA3DF;stroke-width:1.0417;" x1="389.5833" x2="893.75" y1="563.3647" y2="563.3647"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="154.9561" x="564.1886" y="549.5463">Acknowledgement to CONTROL</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="50" id="ent0003"><path d="M390.1042,219.7754 L390.1042,316.626 A4.1667,4.1667 0 0 0 394.2708,320.7926 L878.776,320.7926 A4.1667,4.1667 0 0 0 882.9427,316.626 L882.9427,226.0254 L872.526,215.6087 L394.2708,215.6087 A4.1667,4.1667 0 0 0 390.1042,219.7754" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M872.526,215.6087 L872.526,223.9421 A2.0833,2.0833 0 0 0 874.6094,226.0254 L882.9427,226.0254 L872.526,215.6087" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="434.8755" x="401.5625" y="239.1846">Stop order (communication_WorkList): time synchronization, secure connection,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="318.5547" x="401.5625" y="256.0547">scan, connect request, setup page, DHCP server, hotspot.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="408.374" x="401.5625" y="272.9248">A retained station association and a retained TLS connection are not work.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="48.0591" x="401.5625" y="289.7949">Unclear:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="369.7144" x="453.3691" y="289.7949">the design lists five setup services with one total stop bound (P23);</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="460.5469" x="401.5625" y="306.665">the implementation tracks seven bits and has no total cap. No total bound is drawn.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="57" id="ent0006"><path d="M902.6042,680.1921 L902.6042,726.4323 A4.1667,4.1667 0 0 0 906.7708,730.599 L1366.6423,730.599 A4.1667,4.1667 0 0 0 1370.8089,726.4323 L1370.8089,686.4421 L1360.3923,676.0254 L906.7708,676.0254 A4.1667,4.1667 0 0 0 902.6042,680.1921" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1360.3923,676.0254 L1360.3923,684.3587 A2.0833,2.0833 0 0 0 1362.4756,686.4421 L1370.8089,686.4421 L1360.3923,676.0254" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="417.8833" x="914.0625" y="699.6012">communication_waitForWiFiStop returns 0 only for ListeningIsRequested and</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="435.9131" x="914.0625" y="716.4714">State STOPPED or OFFLINE; otherwise it polls in 200 ms steps until its timeout.</text></g><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="78.4943" x="98.4375" y="242.1712"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="57.6609" x="108.8542" y="264.6505">Not running</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.2608" x="108.8542" y="280.1147">bit clear</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="226.3112" x="33.8542" y="406.2337"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="99.3093" x="44.2708" y="428.713">Accepted or running</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="137.0524" x="44.2708" y="444.1772">bit set before the start call,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="205.4779" x="44.2708" y="459.6415">so a partly started service is stopped too</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="216.0278" x="33.8542" y="555.1921"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="76.8738" x="44.2708" y="577.6713">Stop requested</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="195.1945" x="44.2708" y="593.1356">work-&gt;stop() with its own bounded wait</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="157.8857" x="214.5833" y="677.0671"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="77.3326" x="225" y="699.5463">Release proven</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="137.0524" x="225" y="715.0106">stop returned 0; bit cleared</text><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="110.5194" x="85.4167" y="677.0671"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="89.6861" x="95.8333" y="699.5463">Release unproven</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="61.79" x="95.8333" y="715.0106">bit stays set</text><g class="start_entity" data-qualified-name="Service..start.Service" data-source-line="33" id="ent0002"><ellipse cx="137.5" cy="162.4837" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="108