<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1322.9167px" preserveAspectRatio="none" style="width:981px;height:1322px;" version="1.1" viewBox="0 0 981 1322" width="981.25px" zoomAndPan="magnify"><title>Where is each Observation input frozen?</title><defs><linearGradient id="g1qt2mplh1iz0y0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="15"><rect fill="url(#g1qt2mplh1iz0y0)" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="413.2365" x="282.5277" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="390.3198" x="293.986" y="54.2236">Where is each Observation input frozen?</text></g><!--entity live--><g class="entity" data-qualified-name="live" data-source-line="17" id="ent0002"><rect fill="#444444" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="297.6196" x="468.3126" y="95.8252"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="142.7734" x="483.9376" y="124.6094">Mutable inputs (live state)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="266.3696" x="483.9376" y="141.4795">switch / filter, Heart / Lung, point, configuration,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.1035" x="483.9376" y="158.3496">pending examination request, server Device id,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="198.7549" x="483.9376" y="175.2197">SNTP clock anchors, BPM estimates</text></g><!--entity admission--><g class="entity" data-qualified-name="admission" data-source-line="18" id="ent0003"><rect fill="#273241" height="159.7575" rx="4.1667" ry="4.1667" style="stroke:#61738A;stroke-width:2.0833;" width="363.8184" x="224.0417" y="232.2835"/><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="77.3804" x="367.2607" y="261.0677">&#171;documented&#187;</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="194.9585" x="239.6667" y="288.3545">Session admission (accepted Start)</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="190.9668" x="239.6667" y="305.2246">copy point, configuration, filter IDs,</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="266.3086" x="239.6667" y="322.0947">examination identity / supplied patient reference</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="12.5" x="239.6667" y="338.9648">&#8212;</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="332.5684" x="239.6667" y="355.835">not produced: CONTROL session, point, BPM / filter / AUDIO</text><text fill="#B8C4D4" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="290.5396" x="239.6667" y="372.7051">are skeletons; examination reception unimplemented</text></g><!--entity result--><g class="entity" data-qualified-name="result" data-source-line="19" id="ent0004"><rect fill="#16324A" height="176.6276" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:2.0833;" width="408.2031" x="219.3542" y="429.1585"/><text fill="#2A9FD6" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="80.8716" x="383.02" y="457.9427">&#171;implemented&#187;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.9531" x="234.9792" y="485.2295">Finalized result (Finalizing): frozen context + this session's estimates</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="249.3774" x="234.9792" y="502.0996">implemented subset communication_delivery:</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="201.6846" x="234.9792" y="518.9697">kind: heart rate or poor-signal report,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="175.9888" x="234.9792" y="535.8398">BPM value + declared precision,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="160.0098" x="234.9792" y="552.71">monotonic measurement end</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="12.5" x="234.9792" y="569.5801">&#8212;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="264.0991" x="234.9792" y="586.4502">full MeasurementResult fields: documented only</text></g><!--entity job--><g class="entity" data-qualified-name="job" data-source-line="20" id="ent0005"><rect fill="#2B2F1D" height="126.0173" rx="4.1667" ry="4.1667" style="stroke:#B8A14A;stroke-width:2.0833;" width="361.2915" x="359.4584" y="643.7419"/><text fill="#E8DCA8" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="52.6611" x="513.7736" y="672.526">&#171;decided&#187;</text><text fill="#E8DCA8" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="330.0415" x="375.0834" y="699.8128">Admitted job: CONTROL calls communication_submitDelivery</text><text fill="#E8DCA8" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="229.9194" x="375.0834" y="716.6829">copy of the result; freeze server Device id;</text><text fill="#E8DCA8" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.9272" x="375.0834" y="733.5531">freeze UTC measurement end if a qualifying</text><text fill="#E8DCA8" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="319.7754" x="375.0834" y="750.4232">anchor already maps it (dashed: read once from live state)</text></g><!--entity setup--><g class="entity" data-qualified-name="setup" data-source-line="21" id="ent0006"><rect fill="#16324A" height="109.1471" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:2.0833;" width="344.0308" x="268.3126" y="807.2835"/><text fill="#2A9FD6" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="80.8716" x="399.8922" y="836.0677">&#171;implemented&#187;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="312.7808" x="283.9376" y="863.3545">First delivery connection setup (only if UTC end still open)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="216.9434" x="283.9376" y="880.2246">its SNTP exchange supplies the anchor;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.2461" x="283.9376" y="897.0947">freeze UTC end once if still open</text></g><!--entity bytes--><g class="entity" data-qualified-name="bytes" data-source-line="22" id="ent0007"><rect fill="#16324A" height="109.1471" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:2.0833;" width="262.6587" x="408.9376" y="954.1585"/><text fill="#2A9FD6" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="80.8716" x="499.8311" y="982.9427">&#171;implemented&#187;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="205.9204" x="424.5626" y="1010.2295">Serialize once before the first request</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="231.4087" x="424.5626" y="1027.0996">Observation body + If-None-Exist condition</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.002" x="424.5626" y="1043.9697">(identifier = Device id : UTC end)</text></g><!--entity retries--><g class="entity" data-qualified-name="retries" data-source-line="23" id="ent0008"><rect fill="#16324A" height="92.277" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:2.0833;" width="227.9541" x="426.1251" y="1101.0335"/><text fill="#2A9FD6" font-family="sans-serif" font-size="12.5" font-style="italic" lengthAdjust="spacing" textLength="80.8716" x="499.6663" y="1129.8177">&#171;implemented&#187;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="108.6426" x="441.7501" y="1157.1045">Attempts 1..4 (P13)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="196.7041" x="441.7501" y="1173.9746">every retry sends the identical bytes</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#2A9FD6" points="506.9355,232.2229,516.8929,229.7528,511.0456,229.0239,511.7745,223.1766,506.9355,232.2229" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M554.9701,194.8363 C539.8637,206.594 528.2578,215.6272 511.8676,228.3841" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="415.8981,428.9958,419.2369,419.2951,415.4469,423.8071,410.9349,420.017,415.8981,428.9958" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M412.6591,391.7475 C413.7199,403.9474 414.28,410.3876 415.3566,422.7693" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk11"><polygon fill="#2A9FD6" points="567.9434,429.0363,577.4618,425.2085,571.5699,425.298,571.4804,419.4061,567.9434,429.0363" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M624.505,194.9818 C629.7938,247.1297 630.9506,330.6463 596.4376,391.6585 C588.7775,405.2001 583.3283,413.1768 572.2952,424.5503" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk12"><polygon fill="#2A9FD6" points="501.4064,643.5672,499.9786,633.4079,498.6493,639.1485,492.9086,637.8192,501.4064,643.5672" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M478.2674,606.4829 C486.0822,619.0075 490.6746,626.3677 498.0979,638.2648" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#2A9FD6" points="614.0147,643.6377,623.1878,639.0435,617.323,639.615,616.7516,633.7502,614.0147,643.6377" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M632.1275,194.9215 C655.8443,281.3552 694.0881,465.946 637.0626,606.2419 C631.6161,619.6414 627.3712,627.3972 617.9847,638.8105" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;stroke-dasharray:7.2917,7.2917;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk14"><polygon fill="#2A9FD6" points="475.3735,807.0509,483.9883,801.4798,478.2214,802.6901,477.011,796.9232,475.3735,807.0509" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M499.5138,770.0862 C491.5109,782.3405 486.595,789.868 478.791,801.818" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk15"><polygon fill="#2A9FD6" points="599.3858,953.8226,608.4859,949.0856,602.6308,949.7487,601.9677,943.8936,599.3858,953.8226" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M601.2526,769.8898 C609.5202,781.5086 616.7578,794.1557 621.4376,807.2835 C637.7604,853.0722 638.7452,871.2329 621.4376,916.6585 C616.3807,929.9308 612.2995,937.6103 603.2798,948.9339" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk16"><polygon fill="#2A9FD6" points="502.9202,953.8443,501.021,943.7624,499.9603,949.5587,494.164,948.4981,502.9202,953.8443" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M477.4239,916.9278 C485.7534,928.9882 491.0376,936.6393 499.3684,948.7016" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk17"><polygon fill="#2A9FD6" points="540.1876,1100.7295,544.3542,1091.3545,540.1876,1095.5212,536.0209,1091.3545,540.1876,1100.7295" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M540.1876,1063.8196 C540.1876,1076.0371 540.1876,1082.645 540.1876,1094.4795" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="legend" data-source-line="33"><rect fill="#555555" height="101.6439" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="936.6252" x="20.8333" y="1197.9085"/><text fill="#ADAFAE" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="529.2582" x="32.2917" y="1224.7192">Blue = implemented in COMMUNICATION (host simulation; no CONTROL caller yet).</text><text fill="#ADAFAE" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="913.7085" x="32.2917" y="1244.401">Yellow = decided; COMMUNICATION change in a parallel PR (at 994ce24 both are read at the first successful freeze: job start or after a setup).</text><text fill="#ADAFAE" font-family="sans-serif" font-size="14.5833" lengthAdjust="spacing" textLength="244.9402" x="32.2917" y="1264.0828">Grey = documented, not implemented.</text><text fill="#ADAFAE" font-family="sans-serif" font-size=