<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="998.9583px" preserveAspectRatio="none" style="width:946px;height:998px;" version="1.1" viewBox="0 0 946 998" width="946.875px" zoomAndPan="magnify"><title>Where is each Observation input frozen?</title><defs><linearGradient id="gm9hqe4imi8610" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="7"><rect fill="url(#gm9hqe4imi8610)" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="413.2365" x="265.4877" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="390.3198" x="276.946" y="54.2236">Where is each Observation input frozen?</text></g><!--entity live--><g class="entity" data-qualified-name="live" data-source-line="9" id="ent0002"><rect fill="#444444" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="297.6196" x="443.4601" y="95.8252"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="142.7734" x="459.0851" y="124.6094">Mutable inputs (live state)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="266.3696" x="459.0851" y="141.4795">switch / filter, Heart / Lung, point, configuration,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.1035" x="459.0851" y="158.3496">pending examination request, server Device id,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="198.7549" x="459.0851" y="175.2197">SNTP clock anchors, BPM estimates</text></g><!--entity admission--><g class="entity" data-qualified-name="admission" data-source-line="10" id="ent0003"><rect fill="#444444" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="297.5586" x="265.3351" y="232.2835"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="194.9585" x="280.9601" y="261.0677">Session admission (accepted Start)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="190.9668" x="280.9601" y="277.9378">copy point, configuration, filter IDs,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="266.3086" x="280.9601" y="294.8079">examination identity / supplied patient reference</text></g><!--entity result--><g class="entity" data-qualified-name="result" data-source-line="11" id="ent0004"><rect fill="#444444" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="408.2031" x="210.1267" y="352.0752"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.9531" x="225.7517" y="380.8594">Finalized result (Finalizing): frozen context + this session's estimates</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="201.6846" x="225.7517" y="397.7295">kind: heart rate or poor-signal report,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="175.9888" x="225.7517" y="414.5996">BPM value + declared precision,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="160.0098" x="225.7517" y="431.4697">monotonic measurement end</text></g><!--entity job--><g class="entity" data-qualified-name="job" data-source-line="12" id="ent0005"><rect fill="#444444" height="98.7305" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="351.0254" x="355.4392" y="488.5335"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="280.603" x="371.0642" y="517.3177">Admitted job: CONTROL submits the finalized result</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="229.9194" x="371.0642" y="534.1878">copy of the result; freeze server Device id;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.9272" x="371.0642" y="551.0579">freeze UTC measurement end if a qualifying</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="319.7754" x="371.0642" y="567.9281">anchor already maps it (dashed: read once from live state)</text></g><!--entity setup--><g class="entity" data-qualified-name="setup" data-source-line="13" id="ent0006"><rect fill="#444444" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="344.0308" x="259.0851" y="624.9919"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="312.7808" x="274.7101" y="653.776">First delivery connection setup (only if UTC end still open)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="216.9434" x="274.7101" y="670.6462">its SNTP exchange supplies the anchor;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.2461" x="274.7101" y="687.5163">freeze UTC end once if still open</text></g><!--entity bytes--><g class="entity" data-qualified-name="bytes" data-source-line="14" id="ent0007"><rect fill="#444444" height="81.8604" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="262.6587" x="399.7101" y="744.7835"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="205.9204" x="415.3351" y="773.5677">Serialize once before the first request</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="231.4087" x="415.3351" y="790.4378">Observation body + If-None-Exist condition</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="177.002" x="415.3351" y="807.3079">(identifier = Device id : UTC end)</text></g><!--entity retries--><g class="entity" data-qualified-name="retries" data-source-line="15" id="ent0008"><rect fill="#444444" height="64.9902" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:2.0833;" width="227.9541" x="416.8976" y="864.5752"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="108.6426" x="432.5226" y="893.3594">Attempts 1..4 (P13)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="196.7041" x="432.5226" y="910.2295">every retry sends the identical bytes</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#2A9FD6" points="471.1516,232.1547,481.2113,230.1408,475.4032,229.1462,476.3978,223.3382,471.1516,232.1547" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M523.5506,195.077 C506.2225,207.3385 492.9196,216.7516 476.2536,228.5446" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="414.2934,351.8465,418.4601,342.4715,414.2934,346.6382,410.1267,342.4715,414.2934,351.8465" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M414.2934,314.6979 C414.2934,326.5133 414.2934,333.314 414.2934,345.5965" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk11"><polygon fill="#2A9FD6" points="534.8397,351.9422,544.897,349.9169,539.0879,348.929,540.0758,343.1198,534.8397,351.9422" style="stroke:#2A9