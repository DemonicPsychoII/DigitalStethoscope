<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="826.0417px" preserveAspectRatio="none" style="width:1505px;height:826px;background:#0B1018;" version="1.1" viewBox="0 0 1505 826" width="1505.2083px" zoomAndPan="magnify"><title>HTTP response reader: which parser events end one response?
(implemented; wifi_http.c, one wifi_http_reader per exchange, Zephyr http_parser callbacks)</title><defs/><g><rect fill="#0B1018" height="826.0417" style="stroke:none;stroke-width:1.0417;" width="1505.2083" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="79.1504" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="911.1613" x="197.8048" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="610.6974" x="348.0367" y="54.2236">HTTP response reader: which parser events end one response?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="888.2446" x="209.2631" y="82.3405">(implemented; wifi_http.c, one wifi_http_reader per exchange, Zephyr http_parser callbacks)</text></g><rect fill="#16324A" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="74.824" x="1197.9167" y="187.4837"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="53.9907" x="1208.3333" y="212.6475">Status line</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="118.3187" x="1048.9583" y="297.9004"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="67.2729" x="1059.375" y="320.3796">Header name</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="97.4854" x="1059.375" y="335.8439">headerNameLength</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="200.4517" x="940.625" y="435.4004"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="65.6616" x="951.0417" y="457.8796">Header value</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="179.6183" x="951.0417" y="473.3439">isInHeaderValue, isReadingLocation</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="175.7558" x="872.3958" y="572.9004"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="24.2594" x="882.8125" y="595.3796">Body</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="154.9225" x="882.8125" y="610.8439">bodyLength; drains on overflow</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="104.5797" x="882.8125" y="626.3082">(bodyHasOverflowed)</text><rect fill="#3A1D22" height="82.6904" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="244.5506" x="650.5208" y="729.1504"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="47.5901" x="660.9375" y="751.6296">Complete</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="138.6637" x="660.9375" y="767.0939">isComplete; parser paused;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="223.7172" x="660.9375" y="782.5582">keepsConnection = keep-alive &#8743; no overflow</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="161.0321" x="660.9375" y="798.0225">&#8743; no bytes behind the message</text><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="134.3201" x="1163.0208" y="744.2546"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="29.5074" x="1173.4375" y="766.7338">Failed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="113.4867" x="1173.4375" y="782.1981">failure (first error wins)</text><rect fill="#3A2A12" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E5A50A;stroke-width:1.0417;" width="147.6135" x="594.7917" y="580.7129"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="126.7802" x="605.2083" y="603.1921">Interim 1xx taken as final</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="125.4038" x="605.2083" y="618.6564">(H1, reproduced on host)</text><g class="start_entity" data-qualified-name=".start." data-source-line="34" id="ent0002"><ellipse cx="1235.4167" cy="134.3587" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="48" id="ent0003"><path d="M16.6667,730.1921 L16.6667,810.1725 A4.1667,4.1667 0 0 0 20.8333,814.3392 L626.7253,814.3392 A4.1667,4.1667 0 0 0 630.8919,810.1725 L630.8919,736.4421 L620.4753,726.0254 L420.7283,726.0254 L615.2546,632.8469 L412.3949,726.0254 L20.8333,726.0254 A4.1667,4.1667 0 0 0 16.6667,730.1921" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M620.4753,726.0254 L620.4753,734.3587 A2.0833,2.0833 0 0 0 622.5586,736.4421 L630.8919,736.4421 L620.4753,726.0254" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="581.9336" x="28.125" y="749.6012">Missing transition. A possible fix (not decided): for 1xx other than 101, reset and parse the next message.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="474.2798" x="28.125" y="766.4714">If the final response arrives in a later TLS record, the connection is kept with it unread,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="475.3296" x="28.125" y="783.3415">and the next exchange reads it as its own response. Triggered only by a server or proxy</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="439.3799" x="28.125" y="800.2116">(103 Early Hints, unsolicited 100 Continue); the device sends no Expect header.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="54" id="ent0006"><path d="M914.5833,755.7129 L914.5833,766.1296 L895.5363,770.2962 L914.5833,774.4629 L914.5833,785.083 A4.1667,4.1667 0 0 0 918.75,789.2497 L1139.1927,789.2497 A4.1667,4.1667 0 0 0 1143.3594,785.083 L1143.3594,761.9629 L1132.9427,751.5462 L918.75,751.5462 A4.1667,4.1667 0 0 0 914.5833,755.7129" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1132.9427,751.5462 L1132.9427,759.8796 A2.0833,2.0833 0 0 0 1135.026,761.9629 L1143.3594,761.9629 L1132.9427,751.5462" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="196.4844" x="926.0417" y="775.1221">Any further read returns -EBADMSG.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="1235.4167,187.2584,1239.5833,177.8834,1235.4167,182.05,1231.25,177.8834,1235.4167,187.2584" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1235.4167,149.0084 C1235.4167,159.3844 1235.4167,168.6124 1235.4167,181.0084" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="1136.7705,297.4934,1146.5377,294.3544,1140.6544,294.0233,1140.9855,288.1401,1136.7705,297.4934" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1212.9893,229.3963 C1191.7549,248.368 1164.4462,272.7668 1141.4312,293.3293" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-famil