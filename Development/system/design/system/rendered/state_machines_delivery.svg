<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="630.2083px" preserveAspectRatio="none" style="width:1675px;height:630px;background:#0B1018;" version="1.1" viewBox="0 0 1675 630" width="1675px" zoomAndPan="magnify"><title>Delivery job: when does an admitted job reach a terminal outcome?
(implemented; communication.c submitDelivery, runDelivery, attemptDelivery)</title><defs/><g><rect fill="#0B1018" height="630.2083" style="stroke:none;stroke-width:1.0417;" width="1675" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="79.1504" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="771.8384" x="450.2787" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="649.4548" x="511.4705" y="54.2236">Delivery job: when does an admitted job reach a terminal outcome?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="748.9217" x="461.7371" y="82.3405">(implemented; communication.c submitDelivery, runDelivery, attemptDelivery)</text></g><!--cluster Running--><g class="cluster" data-qualified-name="Running" data-source-line="30" id="ent0005"><path d="M1063.0208,123.9421 L1658.8542,123.9421 A4.1667,4.1667 0 0 1 1663.0208,128.1087 L1663.0208,155.0313 L1058.8542,155.0313 L1058.8542,128.1087 A4.1667,4.1667 0 0 1 1063.0208,123.9421" fill="#16324A"/><rect fill="none" height="471.3542" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="604.1667" x="1058.8542" y="123.9421"/><line style="stroke:#4AA3DF;stroke-width:1.0417;" x1="1058.8542" x2="1663.0208" y1="155.0313" y2="155.0313"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="276.9023" x="1222.4864" y="141.213">Running (worker; end = deadline &#8722; 1 s cleanup reserve)</text></g><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="234.3455" x="329.1667" y="368.2129"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="32.0363" x="339.5833" y="390.6921">No job</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="213.5122" x="339.5833" y="406.1564">Outcome = NONE or last terminal outcome</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="281.9916" x="305.2083" y="532.2754"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.1218" x="315.625" y="554.7546">Rejected, no state change</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="261.1582" x="315.625" y="570.2189">-EBUSY (job pending), -ENOENT (no stored network),</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="233.0943" x="315.625" y="585.6832">-ENODEV (DELIVERY_NOT_POSSIBLE), -EINVAL</text><rect fill="#3A2A12" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#E5A50A;stroke-width:1.0417;" width="270.0297" x="16.6667" y="532.2754"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="158.5815" x="27.0833" y="554.7546">Admitted, waiting for the worker</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="198.6633" x="27.0833" y="570.2189">DeliveryIsPending, Outcome = PENDING</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="249.1964" x="27.0833" y="585.6832">Delivery copy + deadline frozen under ControlLock</text><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="105.5288" x="380.2083" y="231.7546"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="56.5531" x="390.625" y="254.2338">DELIVERED</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="84.6954" x="390.625" y="269.6981">200/201 receipt</text><rect fill="#3A1D22" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="161.8917" x="853.125" y="223.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="141.0583" x="863.5417" y="246.4213">FAILED (DELIVERY_FAILURE)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="139.3463" x="863.5417" y="261.8856">terminal status, Start, fault,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="139.3575" x="863.5417" y="277.3499">attempts or budget used up</text><rect fill="#3A1D22" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E06C75;stroke-width:1.0417;" width="247.0347" x="532.2917" y="231.7546"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="226.2014" x="542.7083" y="254.2338">NO_CLOCK (SERVER_CONNECTION_FAILURE)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="130.2043" x="542.7083" y="269.6981">never frozen, nothing sent</text><g class="entity" data-qualified-name="GMN2" data-source-line="54" id="ent0003"><path d="M606.7708,517.6921 L606.7708,614.5426 A4.1667,4.1667 0 0 0 610.9375,618.7093 L970.9188,618.7093 A4.1667,4.1667 0 0 0 975.0854,614.5426 L975.0854,523.9421 L964.6688,513.5254 L704.3349,513.5254 L192.0553,532.0964 L696.0016,513.5254 L610.9375,513.5254 A4.1667,4.1667 0 0 0 606.7708,517.6921" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M964.6688,513.5254 L964.6688,521.8587 A2.0833,2.0833 0 0 0 966.7521,523.9421 L975.0854,523.9421 L964.6688,513.5254" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="242.1387" x="618.2292" y="537.1012">No deadline transition here (TICKET-222).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="302.5391" x="618.2292" y="553.9714">While Setup, a boot join, its resumption or link recovery</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.0229" x="618.2292" y="570.8415">occupies the worker, the job stays PENDING past its deadline</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="307.8003" x="618.2292" y="587.7116">and blocks the slot. No request is sent after the budget:</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="267.3584" x="618.2292" y="604.5817">runDelivery checks the end before every attempt.</text></g><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="307.784" x="1081.25" y="223.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="32.4951" x="1091.6667" y="246.4213">Freeze</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="286.9507" x="1091.6667" y="261.8856">ObservationIsFrozen := false; build body + condition once</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="248.5138" x="1091.6667" y="277.3499">if a qualifying anchor maps the measurement end</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="334.2478" x="1067.7083" y="360.4004"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="39.1307" x="1078.125" y="382.8796">Attempt</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="313.4145" x="1078.125" y="398.3439">connection setup &#8804; 3 s if not reusable (refreezes if still open),</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="115.9373" x="1078.125" y="413.8082">write and receipt &#8804; 1 s</text><rect fill="#16324A" height="41.6667" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="60.434" x="1067.1875" y="545.2962"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="39.6006" x="1077.6042" y="570.46">Gap 2 s</text><g class="start_entity" data-qualified-name="Running..start.Running" data-source-line="34" id="ent0002"><ellipse cx="1234.8958" cy="170.8171" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="1234.8958,223.9059,1239.0625,214.5309,1234.8958,218.6976,1230.7292,214.5309,1234.8958,223.9059" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1234.8958,185.4568 C1234.8958,195.4119 1234.8958,204.0532 1234.8958,217.6559" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="1234.8958,360.2147,1239.0625,350.8397,1234.8958,355.0064,1230.7292,350.8397,1234.8958,360.2147" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1234.8958,291.7097 C1234.8958,312.5329 1234.8958,333.1173 1234.8958,353.9647" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="52.6733" x="1242.1875" y="330.8512">[time left]</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk5"><polygon fill="#A9B8CA" points="1089.6684,545.037,1090.6914,534.8289,1088.0382,540.0904,1082.7768,537.4372,1089.6684,545.037" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M1110.0601,428.3119 C1103.2604,433.6058 1097.1821,439.7434 1092.1875,446.8