<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="892.7083px" preserveAspectRatio="none" style="width:1005px;height:892px;background:#0B1018;" version="1.1" viewBox="0 0 1005 892" width="1005.2083px" zoomAndPan="magnify"><title>DNS lookup: when can a resolver callback no longer touch the lookup?
(implemented; wifi_dns.c, struct wifi_dns_lookup, owner = SNTP or TLS worker)</title><defs/><g><rect fill="#0B1018" height="892.7083" style="stroke:none;stroke-width:1.0417;" width="1005.2083" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="79.1504" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="785.8561" x="20.8333" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="679.0771" x="74.2228" y="54.2236">DNS lookup: when can a resolver callback no longer touch the lookup?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="762.9395" x="32.2917" y="82.3405">(implemented; wifi_dns.c, struct wifi_dns_lookup, owner = SNTP or TLS worker)</text></g><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="272.5362" x="525.6333" y="187.4837"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.8125" x="536.05" y="209.963">Armed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="173.4528" x="536.05" y="225.4272">generation set, isComplete = false</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="251.7029" x="536.05" y="240.8915">(before submission: inline callbacks are accepted)</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="164.7451" x="225.6333" y="323.9421"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="51.2492" x="236.05" y="346.4213">Submitted</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="143.9117" x="236.05" y="361.8856">isSubmitted = true, identifier</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="94.283" x="287.6125" y="444.7754"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="68.4255" x="298.0291" y="467.2546">Address seen</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="73.4497" x="298.0291" y="482.7189">addressIsValid</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="210.791" x="467.3" y="582.2754"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="47.5901" x="477.7166" y="604.7546">Complete</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="189.9577" x="477.7166" y="620.2189">first terminal result wins: 0, -ENOENT,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="156.6121" x="477.7166" y="635.6832">-ETIMEDOUT, -EHOSTUNREACH</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="223.1222" x="223.55" y="728.6296"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.6726" x="233.9666" y="751.1088">Released</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="202.2888" x="233.9666" y="766.5731">isSubmitted = false; no callback can run</text><g class="start_entity" data-qualified-name=".start." data-source-line="32" id="ent0002"><ellipse cx="662.0916" cy="134.3587" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="41" id="ent0012"><ellipse cx="335.0083" cy="870.8171" fill="none" rx="11.4583" ry="11.4583" style="stroke:#9933CC;stroke-width:1.0417;"/><ellipse cx="335.0083" cy="870.8171" fill="none" rx="6.25" ry="6.25" style="stroke:#9933CC;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="43" id="ent0003"><path d="M465.2166,722.9004 L465.2166,750.5046 L446.6375,754.6712 L465.2166,758.8379 L465.2166,786.0107 A4.1667,4.1667 0 0 0 469.3833,790.1774 L916.9378,790.1774 A4.1667,4.1667 0 0 0 921.1045,786.0107 L921.1045,729.1504 L910.6878,718.7337 L469.3833,718.7337 A4.1667,4.1667 0 0 0 465.2166,722.9004" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M910.6878,718.7337 L910.6878,727.0671 A2.0833,2.0833 0 0 0 912.7712,729.1504 L921.1045,729.1504 L910.6878,718.7337" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="402.6367" x="476.675" y="742.3096">Callbacks run under the resolver lock and are rejected unless the owner's</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="423.5962" x="476.675" y="759.1797">generation is current. Cancel under that lock establishes callback quiescence</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="296.0571" x="476.675" y="776.0498">before the owner reuses the context. No defect found.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="662.0916,187.4476,666.2583,178.0726,662.0916,182.2393,657.925,178.0726,662.0916,187.4476" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M662.0916,148.9984 C662.0916,158.9536 662.0916,167.5948 662.0916,181.1976" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="361.6233,323.865,371.8823,323.8012,366.3695,321.7201,368.4506,316.2073,361.6