<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="975px" preserveAspectRatio="none" style="width:2769px;height:975px;background:#0B1018;" version="1.1" viewBox="0 0 2769 975" width="2769.7917px" zoomAndPan="magnify"><title>WIFI station and scan: which driver event moves each state, and which late events are ignored?
(implemented; wifi.c wifi_connect, wifi_disconnect, wifi_startScan, wifi_cancelScan, wifi_handleEvent)</title><defs/><g><rect fill="#0B1018" height="975" style="stroke:none;stroke-width:1.0417;" width="2769.7917" x="0" y="0"/><g class="title" data-source-line="26"><rect fill="none" height="79.1504" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="1005.3385" x="876.7578" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="922.2209" x="918.3167" y="54.2236">WIFI station and scan: which driver event moves each state, and which late events are ignored?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="982.4219" x="888.2161" y="82.3405">(implemented; wifi.c wifi_connect, wifi_disconnect, wifi_startScan, wifi_cancelScan, wifi_handleEvent)</text></g><!--cluster Station--><g class="cluster" data-qualified-name="Station" data-source-line="27" id="ent0002"><path d="M29.1667,115.6087 L1246.875,115.6087 A4.1667,4.1667 0 0 1 1251.0417,119.7754 L1251.0417,146.698 L25,146.698 L25,119.7754 A4.1667,4.1667 0 0 1 29.1667,115.6087" fill="#16324A"/><rect fill="none" height="848.9583" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="1226.0417" x="25" y="115.6087"/><line style="stroke:#4AA3DF;stroke-width:1.0417;" x1="25" x2="1251.0417" y1="146.698" y2="146.698"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="467.274" x="404.3839" y="132.8796">Station (atomics StationIsActive, ConnectionIsRequested, DisconnectIsPending; k_event bits)</text></g><!--cluster Scan--><g class="cluster" data-qualified-name="Scan" data-source-line="50" id="ent0010"><path d="M1861.4583,115.6087 L2283.3333,115.6087 A4.1667,4.1667 0 0 1 2287.5,119.7754 L2287.5,146.698 L1857.2917,146.698 L1857.2917,119.7754 A4.1667,4.1667 0 0 1 1861.4583,115.6087" fill="#16324A"/><rect fill="none" height="590.625" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="430.2083" x="1857.2917" y="115.6087"/><line style="stroke:#4AA3DF;stroke-width:1.0417;" x1="1857.2917" x2="2287.5" y1="146.698" y2="146.698"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="403.951" x="1870.4203" y="132.8796">Scan (wifi_ScanLock: ScanIsRunning, ScanResultsAreAccepted; SCAN_DONE bit)</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="64" id="ent0003"><path d="M1259.375,219.7754 L1259.375,282.8857 A4.1667,4.1667 0 0 0 1263.5417,287.0524 L1844.6533,287.0524 A4.1667,4.1667 0 0 0 1848.82,282.8857 L1848.82,226.0254 L1838.4033,215.6087 L1263.5417,215.6087 A4.1667,4.1667 0 0 0 1259.375,219.7754" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M1838.4033,215.6087 L1838.4033,223.9421 A2.0833,2.0833 0 0 0 1840.4867,226.0254 L1848.82,226.0254 L1838.4033,215.6087" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="505.2368" x="1270.8333" y="239.1846">Driver events carry no request identity: the Requested and Pending gates are the only filters.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="510.2051" x="1270.8333" y="256.0547">S2 (plausible): an unsolicited disconnect inside the Disconnecting window satisfies the drain;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="557.1533" x="1270.8333" y="272.9248">the real confirmation then fails the new join. Both S1 and S2 depend on unverified ESP-IDF behaviour.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="69" id="ent0006"><path d="M2296.3542,219.7754 L2296.3542,282.8857 A4.1667,4.1667 0 0 0 2300.5208,287.0524 L2753.6418,287.0524 A4.1667,4.1667 0 0 0 2757.8084,282.8857 L2757.8084,226.0254 L2747.3918,215.6087 L2300.5208,215.6087 A4.1667,4.1667 0 0 0 2296.3542,219.7754" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><path d="M2747.3918,215.6087 L2747.3918,223.9421 A2.0833,2.0833 0 0 0 2749.4751,226.0254 L2757.8084,226.0254 L2747.3918,215.6087" fill="#1B2330" style="stroke:#61738A;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="246.8994" x="2307.8125" y="239.1846">wifi_startScan returns -EBUSY while Running.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="429.1626" x="2307.8125" y="256.0547">SCAN_DONE status is ignored here; the pinned ESP32 driver always reports 0,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="379.187" x="2307.8125" y="272.9248">so a failed scan looks like an empty or partial list (driver-side, minor).</text></g><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="152.2125" x="895.8333" y="225.5046"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="906.25" y="247.9838">Idle</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.3792" x="906.25" y="263.4481">Active = 0, Requested = 0</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="177.0762" x="732.2917" y="645.8171"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="70.2494" x="742.7083" y="668.2963">Disconnecting</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="156.2429" x="742.7083" y="683.7606">Pending = 1; caller waits &#8804; 1 s</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="165.271" x="558.8542" y="356.2337"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="34.3191" x="569.2708" y="378.713">Joining</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="131.3792" x="569.2708" y="394.1772">Active = 1, Requested = 1</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="144.4377" x="569.2708" y="409.6415">CONNECTED, FAILED cleared</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="195.0022" x="117.1875" y="517.1712"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5664" x="127.6042" y="539.6505">Online</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="174.1689" x="127.6042" y="555.1147">CONNECTED set (address present)</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="146.2484" x="575" y="517.1712"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="50.5554" x="585.4167" y="539.6505">Join failed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="125.415" x="585.4167" y="555.1147">FAILED set, FailureCause</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="219.2841" x="813.0208" y="766.6504"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="120.816" x="823.4375" y="789.1296">Disconnect unconfirmed</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="198.4507" x="823.4375" y="804.5939">Active = 1, Requested = 0, Pending = 0</text><rect fill="#3A2A12" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#E5A50A;stroke-width:1.0417;" width="206.1584" x="819.7917" y="904.1504"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="173.2402" x="830.2083" y="926.6296">Late failure ignored: Active stays 1</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="185.3251" x="830.2083" y="942.0939">while the driver is idle (S1, plausible)</text><g class="start_entity" data-qualified-name="Station..start.Station" data-source-line="35" id="ent0002"><ellipse cx="971.875" cy="162.4837" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="81.7169" x="2019.7917" y="225.5046"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="2030.2083" y="247.9838">Idle</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="60.8836" x="2030.2083" y="263.4481">Running = 0</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="154.9652" x="1982.8125" y="364.0462"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="1993.2292" y="386.5255">Running</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="134.1319" x="1993.2292" y="401.9897">Running = 1, Accepted = 1</text><rect fill="#16324A" height="67.2262" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="154.9652" x="1870.3125" y="509.3587"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="103.1921" x="1880.7292" y="531.838">Draining after cancel</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="134.1319" x="1880.7292" y="547.3022">Running = 1, Accepted = 0</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="100.6632" x="1880.7292" y="562.7665">late results dropped</text><rect fill="#16324A" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#4AA3DF;stroke-width:1.0417;" width="192.0369" x="1970.8333" y="645.8171"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="26.0834" x="1981.25" y="668.2963">Done</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="171.2036" x="1981.25" y="683.7606">results (Accepted) or -ECANCELED</text><g class="start_entity" data-qualified-name="Scan..start.Scan" data-source-line="55" id="ent0017"><ellipse cx="2060.4167" cy="162.4837" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk3"><polygon fill="#A9B8CA" points="971.875,225.1983,976.0417,215.8233,971.875,219.9899,967.7083,215.8233,971.875,225.1983" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M971.875,177.4131 C971.875,189.7145 971.875,203.1179 971.875,218.9483" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="721.1603,356.1955,731.416,356.4658,725.9738,354.2064,728.2333,348.7642,721.1603,356.1955" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M911.3097,277.6165 C857.8737,299.6988 785.3954,329.6504 726.9365,353.8085" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="133.0811" x="843.75" y="326.6846">wifi_connect [Active = 0]</text></g><g cl