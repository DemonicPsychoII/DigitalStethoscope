 fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="7.4951" x="220.2108" y="728.5238">4</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="7.4951" x="324.3774" y="728.5238">6</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="7.4951" x="428.5441" y="728.5238">8</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="633.1299" y="728.5238">12</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="737.2965" y="728.5238">14</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="789.3799" y="728.5238">15</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="841.4632" y="728.5238">16</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="893.5465" y="728.5238">17</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="945.6299" y="728.5238">18</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="1049.7965" y="728.5238">20</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="1362.2965" y="728.5238">26</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="14.9902" x="1466.4632" y="728.5238">28</text><line style="stroke:#55B2DE;stroke-width:1.0417;stroke-dasharray:4.1667,4.1667;" x1="796.875" x2="796.875" y1="83.3252" y2="703.9063"/><line style="stroke:#55B2DE;stroke-width:1.0417;stroke-dasharray:4.1667,4.1667;" x1="901.0417" x2="901.0417" y1="83.3252" y2="703.9063"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="81.1523" x="805.2083" y="103.776">missing blocks</text><g class="legend" data-source-line="73"><rect fill="none" height="160.6893" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="737.2152" x="401.7049" y="741.6097"/><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="686.912" x="413.1632" y="768.4204">Illustrative subset: P05 proposes 8 s windows updated every 1 s; windows are thinned for readability.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="714.2985" x="413.1632" y="788.1022">Coverage = union of accepted window intervals clipped to the session bounds (Start at 4 s, Stop at 28 s):</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="474.1435" x="413.1632" y="807.784">[4 s, 14 s] + [18 s, 28 s] = 20 s of 24 s = 83 %. Overlaps count once.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="583.49" x="413.1632" y="827.4658">Not window count x window length: 5 accepted x 8 s = 40 s would exceed the session.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="612.0015" x="413.1632" y="847.1476">No window includes missing blocks, so Window D is rejected and the gap stays uncovered.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="660.6506" x="413.1632" y="866.8294">Window A starts before Start; whether such warm-up windows are accepted is open (TICKET-192).</text><text fill="#E6EDF7" font-family="sans-serif" font-size="14.5833" font-weight="bold" lengthAdjust="spacing" textLength="676.8717" x="413.1632" y="886.5112">Validity thresholds (&gt;= 3 valid windows, &gt;= 80 % coverage) are P07 proposals, not accepted values.</text></g><?plantuml-src ZLJVRzem47xFNt5BDQbej2AK7obJDreAMZMfgzHgUwZwu2G7yMhio7QWQDh_laj8m84-J1LLxhxp-VlkplV1fhX4Y3UHqWlFl7APCSsMO5AMg3MN2vWpOT114fopNDYPalQUqT579iqZQZvtOY8MlowqocKoKK9fEEb4GIS8tyzIXU00a_dG2RdMMgqha5r6OSmyowr0-ARMiCpZ5DGSY3uOD8Oh2J5TQ0qmGryhr6o1NxrOoPWR1Fzn6-GNS7LW3_xYajJ2TOckI-Fw2Brnq9iZTEAWaoFqra5lZz2fWqwFq9c3plReTPvm1P5GyQif8xQV-u19LGGuZGNFCamWbwIwvRiLyhnnnwiBo0tu4SwLfgvQfgtlLRKe4HR7c5bCQkzDuVrpzhSo9qtpjcbEc-QiDhUao_onMcO2BVfUJQuEyiQz1iVgkq74eUSUzqkZy7hZWSlKYVV6eIlqG8ElyJV6LM3GFHHFljvX1He4fBBWa0ZwhkO5oqhduB1gv1k-Nnn2GhUe_o6yst7Btb3U7HmsY7nXezfiRb7JGAZCF-pUKQDIlaW5_Im4VR0AWY6SNB0k_S48bfoIqaQf1bNW0cK2aR9MBJsu4o8tLZFBL_IayyYW7S53fm-PLfaYGX12_GmCv5d2I08W4TX00ERp3c8qlZRbKX9CimmQMS8YBhZTd7kmUnLNs-TGB96w85KAu98KhsZlGVroI8gxQQ9YjHauBLy9C0izCEsoH8NH9QAjaGVFfJUW_o_m2Pw3i30By8KkxtP83TtT9PZCy08-diCFuYPOPhQh3EWb8r6-fmcgc6tzRxKfK2viEeB-Ni9RMQOhw1NvroeNLAEt60iDUm5bqhtQMEG9rRVPdpOO1VNwAXfSlmDWSfkCXXUCPHlgXgocZHBNkxI0DArZTw5GarAaeveQJFjxpVJoBCyQdTi9eHjLXX9Ed-uctwTFPy5bjqNfVpB14sebCT1eKYMAFdovWWjO5KYTgmta2plmSRVfMcNwXywm6YXgRnkAnxcxaHBaQCuzcihjRFu3?></g></svg>