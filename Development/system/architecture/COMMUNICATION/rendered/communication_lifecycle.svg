F7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="184.6649" x="473.4375" y="191.0604">boot join, link recovery or setup page</text><rect fill="#2A9FD6" height="82.6904" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="263.1927" x="315.1042" y="437.4919"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="103.6957" x="325.5208" y="459.9711">Listening (CONTROL)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="242.3594" x="325.5208" y="475.4354">no network work: no request, no setup, no SNTP</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="139.7827" x="325.5208" y="490.8997">station association retained</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="205.2429" x="325.5208" y="506.3639">verified TLS connection retained dormant</text><rect fill="#2A9FD6" height="51.7619" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="189.4969" x="377.0833" y="623.4294"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="104.1433" x="387.5" y="645.9086">Finalizing (CONTROL)</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="168.6635" x="387.5" y="661.3729">result frozen; no network work yet</text><rect fill="#2A9FD6" height="82.6904" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="288.5264" x="284.8958" y="765.6169"/><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="38.8957" x="295.3125" y="788.0961">Delivery</text><text fill="#E6EDF7" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="236.1715" x="295.3125" y="803.5604">starts when CONTROL submits the finalized job</text>