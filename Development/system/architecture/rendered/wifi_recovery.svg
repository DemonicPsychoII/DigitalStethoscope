<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="566px" preserveAspectRatio="none" style="width:691px;height:566px;background:#0B1018;" version="1.1" viewBox="0 0 691 566" width="691px" zoomAndPan="magnify"><title>Link-loss recovery</title><defs/><g><rect fill="#0B1018" height="566" style="stroke:none;stroke-width:1;" width="691" x="0" y="0"/><g class="title" data-source-line="25"><text fill="#E6EDF7" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.7236" x="282.2437" y="34.5332">Link-loss recovery</text></g><ellipse cx="302.0374" cy="58.6094" fill="#74D9AE" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#121B28" height="57.7344" rx="5" ry="5" style="stroke:#64B5F6;stroke-width:0.5;" width="208.4155" x="197.8296" y="88.6094"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="188.4155" x="207.8296" y="114.1807">Idle link check finds link lost;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="156.7383" x="207.8296" y="133.0479">(candidate every 2 min)</text><rect fill="#121B28" height="38.8672" rx="5" ry="5" style="stroke:#64B5F6;stroke-width:0.5;" width="235.0537" x="184.5105" y="166.3438"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="215.0537" x="194.5105" y="191.915">Defer active Wi-Fi work until Idle</text><rect fill="#121B28" height="57.7344" rx="5" ry="5" style="stroke:#64B5F6;stroke-width:0.5;" width="174.248" x="214.9133" y="225.2109"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="154.248" x="224.9133" y="250.7822">Reconnect; 4 attempts;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="133.4106" x="224.9133" y="269.6494">5 s between failures</text><polygon fill="#24314A" points="269.9353,302.9453,334.1394,302.9453,346.1394,314.9453,334.1394,326.9453,269.9353,326.9453,257.9353,314.9453,269.9353,302.9453" style="stroke:#C5A1FF;stroke-width:0.5;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="64.2041" x="269.9353" y="321.083">IP ready?</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="23.3423" x="234.593" y="311.6494">yes</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="16.6846" x="346.1394" y="311.6494">no</text><rect fill="#121B28" height="38.8672" rx="5" ry="5" style="stroke:#64B5F6;stroke-width:0.5;" width="115.0024" x="133.4668" y="336.9453"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="95.0024" x="143.4668" y="362.5166">CONNECTED</text><rect fill="#121B28" height="76.6016" rx="5" ry="5" style="stroke:#64B5F6;stroke-width:0.5;" width="289.2749" x="268.4692" y="336.9453"/><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="269.2749" x="278.4692" y="362.5166">ERROR; start setup automatically, once;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="221.7993" x="278.4692" y="381.3838">Scan/cache -&gt; open AP -&gt; portal;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="215.1196" x="278.4692" y="400.251">afterwards only a 2 s hold in Idle</text><polygon fill="#24314A" points="302.0374,419.5469,314.0374,431.5469,302.0374,443.5469,290.0374,431.5469,302.0374,419.5469" style="stroke:#C5A1FF;stroke-width:0.5;"/><ellipse cx="302.0374" cy="474.5469" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="302.0374" cy="474.5469" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#A9B8C