<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="399px" preserveAspectRatio="none" style="width:856px;height:399px;background:#FFFFFF;" version="1.1" viewBox="0 0 856 399" width="856px" zoomAndPan="magnify"><title>Architecture</title><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.4688" x="383.5156" y="24.5332">Architecture</text></g><!--entity layers--><g class="entity" data-qualified-name="layers" data-source-line="17" id="ent0002"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="278.5693" x="6" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3789" x="16" y="75.1426">Layers (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.79" x="16" y="92.752">&#8226; Application orchestrates the work</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.5693" x="16" y="110.3613">&#8226; Services: hardware adapters, C libraries</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4453" x="16" y="127.9707">&#8226; Zephyr drivers are the bottom layer</text></g><!--entity rt--><g class="entity" data-qualified-name="rt" data-source-line="18" id="ent0003"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="196.1006" x="315.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.834" x="325.5" y="75.1426">RTOS threads (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.2939" x="325.5" y="92.752">&#8226; Workers run separately</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.6523" x="325.5" y="110.3613">&#8226; Audio keeps moving</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.1006" x="325.5" y="127.9707">&#8226; Messages coordinate work</text></g><!--entity events--><g class="entity" data-qualified-name="events" data-source-line="19" id="ent0004"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="193.7695" x="578.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.1582" x="588.5" y="75.1426">Events (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.7695" x="588.5" y="92.752">&#8226; Inputs become commands</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.9766" x="588.5" y="110.3613">&#8226; Controller owns settings</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.2734" x="588.5" y="127.9707">&#8226; Workers return results</text></g><!--entity loop--><g class="entity" data-qualified-name="loop" data-source-line="20" id="ent0005"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="185.2109" x="41" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="51" y="201.1426">Superloop</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.2109" x="51" y="218.752">&#8226; One loop runs every task</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.5078" x="51" y="236.3613">&#8226; Simple setup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.9902" x="51" y="253.9707">&#8226; Slow tasks delay audio</text></g><!--entity auto--><g class="entity" data-qualified-name="auto" data-source-line="21" id="ent0006"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="338.4863" x="244.5" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.6758" x="254.5" y="201.1426">AUTOSAR</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.9209" x="254.5" y="218.752">&#8226; Software building blocks for car electronics</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.7822" x="254.5" y="236.3613">&#8226; Choose modules; a tool generates the glue code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="318.4863" x="254.5" y="253.9707">&#8226; Useful for large car systems; too much setup here</text></g><!--entity mpu--><g class="entity" data-qualified-name="mpu" data-source-line="22" id="ent0007"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="249.8174" x="600.5" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.917" x="610.5" y="201.1426">Task isolation (MPU)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.8174" x="610.5" y="218.752">&#8226; Optional addition to threads / layers</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.6592" x="610.5" y="236.3613">&#8226; Keeps task memory separate</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.4453" x="610.5" y="253.9707">&#8226; Requires hardware support</text></g><!--entity ab--><g class="entity" data-qualified-name="ab" data-source-line="30" id="ent0015"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="231.9209" x="297.5" y="302.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.124" x="307.5" y="327.1426">A/B firmware</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.9209" x="307.5" y="344.752">&#8226; Two images; choose one at boot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.6318" x="307.5" y="362.3613">&#8226; Updates / rollback</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.0039" x="307.5" y="379.9707">&#8226; Separate from core / task layout</text></g><?plantuml-src nLNDRXit4BxlKqpYIm8qyAb5q0G67DK6WZHrOTaeq9_3Q3cxIvZBOOQa1Q48a6Vfe_L9EYHNiMBhNkgmqivyy_FDDzIp83ZE20vtd1F4cH9wxEATzG45PuWJ6jvQFyA0BjA1fUSvi2UVuEyEtc5_DmfdRrRiMDw-vP0iUtHdPt1oKOywiHYI8mwlw-dWadqwOlwXdkxpGNAKP0Vi_vVSNnjVfvqZ4EgLiz4TScDemEnIYVaBpWHhz75DOeSksQIOS-adcnIOXRh40HB3XbDYXTeIKFDt3mG__nbt915Uz1D7yY__zFz--GVEGt2sn-8Bh04f9i544T94i6MvQswQzzxs57-42SLiKGZGO4WQy3jOWRCRGR4Kc_Vl5AQTW15xNp8Mxn9kASwLEfu3nlOjmibgTN6nMXtMUdrpjLQC49h75V-cHHMKP0-H2bM9t6xf9XlBS4SK8inyhufhxpzIZ3XgLpth2ArNI6skLY7fM0KNz_fudFkz3rbVRaWTgSnmHc-MfbSw9s7dI82tFcfjAMa1yL7LfEFo-eWwsbZpKyjqf8Pr3YIEERGOLvwW_2gjLvZi867SZyZEGLMXQVFYltQyhGvHjQHS0nPw6lCbpCdbvKzw3ZEUtohnvzSBdeTKHxt9rfcolXl7lKORMA170NAgCc5l-pq74ojRIht9Zk8RGDKaEnZ9quEgHfSBTuOQvZRIa5sDwL16gf7ZBYQQDOBYOSxzrFg2YOHg0vXLxKSQkD5smKPsJT8lFlvwkypkQbb85QwnrQWHzX8xNRJON3zK0HNcOAQPbUQzq9hzcZvbtR3ui0mnXy2IQcbpo7fbV5y-tQBmLtzCrXZoVuaTf_JgJ3NNgUoUl6vIU8BIozEhjGpj6zZold3HBIfwRDDYkZhi9xaggjBun5H0Xw8uVGU3bRbqsWYusJBOkMpK6-ZRpDKNCEcESrhc6amT-IcKhTZe_Rg_IXgLC0YNUr3PEsrSj_-FDjxDLmg_BN7VykO_?></g></svg>