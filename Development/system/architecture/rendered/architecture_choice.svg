<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="399px" preserveAspectRatio="none" style="width:821px;height:399px;background:#FFFFFF;" version="1.1" viewBox="0 0 821 399" width="821px" zoomAndPan="magnify"><title>Architecture</title><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.4688" x="366.0156" y="24.5332">Architecture</text></g><!--entity layers--><g class="entity" data-qualified-name="layers" data-source-line="17" id="ent0002"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.4795" x="16" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3789" x="26" y="75.1426">Layers (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.4795" x="26" y="92.752">&#8226; Application chooses behaviour</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.5215" x="26" y="110.3613">&#8226; Services do the work</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.8936" x="26" y="127.9707">&#8226; Zephyr connects to hardware</text></g><!--entity rt--><g class="entity" data-qualified-name="rt" data-source-line="18" id="ent0003"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="196.1006" x="280.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.834" x="290.5" y="75.1426">RTOS threads (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.2939" x="290.5" y="92.752">&#8226; Workers run separately</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.6523" x="290.5" y="110.3613">&#8226; Audio keeps moving</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.1006" x="290.5" y="127.9707">&#8226; Messages coordinate work</text></g><!--entity events--><g class="entity" data-qualified-name="events" data-source-line="19" id="ent0004"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="193.7695" x="543.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.1582" x="553.5" y="75.1426">Events (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.7695" x="553.5" y="92.752">&#8226; Inputs become commands</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.9766" x="553.5" y="110.3613">&#8226; Controller owns settings</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.2734" x="553.5" y="127.9707">&#8226; Workers return results</text></g><!--entity loop--><g class="entity" data-qualified-name="loop" data-source-line="20" id="ent0005"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="185.2109" x="6" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="16" y="201.1426">Superloop</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.2109" x="16" y="218.752">&#8226; One loop runs every task</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.5078" x="16" y="236.3613">&#8226; Simple setup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.9902" x="16" y="253.9707">&#8226; Slow tasks delay audio</text></g><!--entity auto--><g class="entity" data-qualified-name="auto" data-source-line="21" id="ent0006"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="338.4863" x="209.5" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.6758" x="219.5" y="201.1426">AUTOSAR</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.9209" x="219.5" y="218.752">&#8226; Software building blocks for car electronics</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.7822" x="219.5" y="236.3613">&#8226; Choose modules; a tool generates the glue code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="318.4863" x="219.5" y="253.9707">&#8226; Useful for large car systems; too much setup here</text></g><!--entity mpu--><g class="entity" data-qualified-name="mpu" data-source-line="22" id="ent0007"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="249.8174" x="565.5" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.917" x="575.5" y="201.1426">Task isolation (MPU)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.8174" x="575.5" y="218.752">&#8226; Optional addition to threads / layers</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.6592" x="575.5" y="236.3613">&#8226; Keeps task memory separate</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.4453" x="575.5" y="253.9707">&#8226; Requires hardware support</text></g><!--entity ab--><g class="entity" data-qualified-name="ab" data-source-line="30" id="ent0015"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="231.9209" x="262.5" y="302.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.124" x="272.5" y="327.1426">A/B firmware</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.9209" x="272.5" y="344.752">&#8226; Two images; choose one at boot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.6318" x="272.5" y="362.3613">&#8226; Updates / rollback</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.0039" x="272.5" y="379.9707">&#8226; Separate from core / task layout</text></g><?plantuml-src nLNDRXCn4BxlKmpjfHogda18HPNQa4e8Ib7J2ecVmsGzkslLwp7-QHGX99w5H-D96DlRaZQvunoYUFw_x_FacVFOZmW6rvmYX94YMcp2hROEFOuG1bIyqhQ73asW3KlBesDBDiAF1iwmlUqz9wjcRDY_ViqkQhPeJavWVrwEEB5Nv7Sul2gdWNEsSOVvPJdDputYwAFkiFqljHy6NyIr8V3K2cQzsSH6KOV9n9pp0uu42xHXGLvtJTHHOavzE-WeWSbJ4zb1P5XoZ2oXEYUK-iq_WFVUuvfyW8Dsu43s-LVxvzTlE7NEw1QpBuX1B06MDE2TvkIhYzIyqwtSAuOu4ApOtrRBPtB3siiiragva1iOqAiLUje335aGkUB-R3QVpsQRlLnTNouacITKJplw9Ebpb4yM0cKe8fdrr6rIck6Mo0KO-KuKLUylA0JifSMMXI9j9QIqMRhmSLS7yplvUbhxhNKfPW34aJ978reLgcqcF7WsXZpmoWRfBKPf83pfceGEArz1g0kbFjLAEtfO94VUCBkQuz8Iv5zvz1Bcrn0nJ60lzEY4TIcR9l-5uLLn46f8i0RCy5JaSvhzy_CtSZOhdju8yATNKpntCNC5owIDoizpQRYLR1qBgUY1ZD3gsUhs7eEY485U9KFX650ePmCzMSeqXQAFtgICdQ8QSnEeIwRaDEXxAfd3EaGQ9OF4mvZQeSu50qtImIHYsZ70jOmBEh2faZsu-7WpSNSvFJX0fNGnHdwGsD6anUhwhWWe8mSZZImmtmkjsg_eUv8N51xK324vnpwMraQNP2Myo9zcKlZXbq4hHVQRr_qG3qz4Sut8RkkwIc4hIfQZ5MicxL7OT9-nQ2OLFRL9CqqXUwjMYIemRfboqAOeZiwWqtxCarO0hbSCUimlwdZQ2Y2-W54M3CU9LwSAvKUGNyLIzkVzkgXGGkSvxpb1xwXYNVyVAhtB1mWVjtW_yl8l?></g></svg>