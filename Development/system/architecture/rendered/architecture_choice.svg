<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="399px" preserveAspectRatio="none" style="width:835px;height:399px;background:#FFFFFF;" version="1.1" viewBox="0 0 835 399" width="835px" zoomAndPan="magnify"><metadata>Updated by GPT-6.1-Sol on behalf of Nico running in T3 Code through Codex.</metadata><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="87" x="370.5" y="24.5332">Architecture</text><g id="elem_layers"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="223" x="16" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103" x="26" y="75.1426">Layers (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203" x="26" y="92.752">&#8226; Application chooses behaviour</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141" x="26" y="110.3613">&#8226; Services do the work</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194" x="26" y="127.9707">&#8226; Zephyr connects to hardware</text></g><g id="elem_rt"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="198" x="285.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="295.5" y="75.1426">RTOS threads (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158" x="295.5" y="92.752">&#8226; Workers run separately</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137" x="295.5" y="110.3613">&#8226; Audio keeps moving</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178" x="295.5" y="127.9707">&#8226; Messages coordinate work</text></g><g id="elem_events"><rect fill="#CCEECC" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194" x="552.5" y="50.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103" x="562.5" y="75.1426">Events (chosen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174" x="562.5" y="92.752">&#8226; Inputs become commands</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161" x="562.5" y="110.3613">&#8226; Controller owns settings</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="562.5" y="127.9707">&#8226; Workers return results</text></g><g id="elem_loop"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189" x="6" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65" x="16" y="201.1426">Superloop</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="16" y="218.752">&#8226; One loop runs every task</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91" x="16" y="236.3613">&#8226; Simple setup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153" x="16" y="253.9707">&#8226; Slow tasks delay audio</text></g><g id="elem_auto"><rect fill="#FFDDDD" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="343" x="213" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66" x="223" y="201.1426">AUTOSAR</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="279" x="223" y="218.752">&#8226; Software building blocks for car electronics</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="317" x="223" y="236.3613">&#8226; Choose modules; a tool generates the glue code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="323" x="223" y="253.9707">&#8226; Useful for large car systems; too much setup here</text></g><g id="elem_mpu"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="255" x="574" y="176.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130" x="584" y="201.1426">Task isolation (MPU)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235" x="584" y="218.752">&#8226; Optional addition to threads / layers</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194" x="584" y="236.3613">&#8226; Keeps task memory separate</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182" x="584" y="253.9707">&#8226; Requires hardware support</text></g><g id="elem_ab"><rect fill="#E5E5E5" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="235" x="267" y="302.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79" x="277" y="327.1426">A/B firmware</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215" x="277" y="344.752">&#8226; Two images; choose one at boot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123" x="277" y="362.3613">&#8226; Updates / rollback</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212" x="277" y="379.9707">&#8226; Separate from core / task layout</text></g></g></svg>