<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="889px" preserveAspectRatio="none" style="width:2381px;height:889px;background:#FFFFFF;" version="1.1" viewBox="0 0 2381 889" width="2381px" zoomAndPan="magnify"><title>MVP session and error transitions &#8212; owner decisions 11/12/15/16 October</title><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="494.498" x="684.501" y="24.5332">MVP session and error transitions &#8212; owner decisions 11/12/15/16 October</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="25" id="ent0002"><path d="M599.5,50.6094 L599.5,109.6641 L950.0132,109.6641 L950.0132,60.6094 L940.0132,50.6094 L599.5,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M940.0132,50.6094 L940.0132,60.6094 L950.0132,60.6094 L940.0132,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.1396" x="605.5" y="69.1045">Error latch (red LED) is independent of workflow state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.5132" x="605.5" y="85.4561">Short press in Idle acknowledges it and reruns the check.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6479" x="605.5" y="101.8076">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="5" id="ent0002"><ellipse cx="979" cy="78.1094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="954" y="146.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="954" x2="1004" y1="174.2188" y2="174.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.7998" x="964.6001" y="166.1426">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="905" y="363.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="905" x2="955" y1="390.7188" y2="390.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="918.7139" y="382.6426">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="58.9102" x="1156.5" y="252.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1156.5" x2="1215.4102" y1="280.2188" y2="280.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9102" x="1166.5" y="272.1426">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="76.041" x="422" y="473.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="422" x2="498.041" y1="501.2188" y2="501.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.041" x="432" y="493.1426">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="56.5723" x="1890.5" y="473.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1890.5" x2="1947.0723" y1="501.2188" y2="501.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.5723" x="1900.5" y="493.1426">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0015"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="85.3652" x="249.5" y="579.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="249.5" x2="334.8652" y1="607.2188" y2="607.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3652" x="259.5" y="599.1426">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0019"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="80.7031" x="481.5" y="706.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="481.5" x2="562.2031" y1="734.2188" y2="734.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.7031" x="491.5" y="726.1426">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0021"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="71.3789" x="247.5" y="833.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="247.5" x2="318.8789" y1="861.2188" y2="861.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3789" x="257.5" y="853.1426">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0023"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="111.8135" x="1054" y="833.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1054" x2="1165.8135" y1="861.2188" y2="861.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8135" x="1064" y="853.1426">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="31" id="ent0003"><path d="M874.5,710.1094 L874.5,727.6094 L562.5234,731.6094 L874.5,735.6094 L874.5,752.8125 A0,0 0 0 0 874.5,752.8125 L1081.2261,752.8125 A0,0 0 0 0 1081.2261,752.8125 L1081.2261,720.1094 L1071.2261,710.1094 L874.5,710.1094 A0,0 0 0 0 874.5,710.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1071.2261,710.1094 L1071.2261,720.1094 L1081.2261,720.1094 L1071.2261,710.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4717" x="880.5" y="728.6045">Start = Busy, visible activity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7261" x="880.5" y="744.9561">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="35" id="ent0006"><path d="M337,837.1094 L337,854.6094 L318.5078,858.6094 L337,862.6094 L337,879.8125 A0,0 0 0 0 337,879.8125 L589.2515,879.8125 A0,0 0 0 0 589.2515,879.8125 L589.2515,847.1094 L579.2515,837.1094 L337,837.1094 A0,0 0 0 0 337,837.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M579.2515,837.1094 L579.2515,847.1094 L589.2515,847.1094 L579.2515,837.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2515" x="343" y="855.6045">Same Busy rule during both send paths.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2451" x="343" y="871.9561">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="39" id="ent0009"><path d="M89,685.6094 L89,777.3672 A0,0 0 0 0 89,777.3672 L448.8569,777.3672 A0,0 0 0 0 448.8569,777.3672 L448.8569,695.6094 L438.8569,685.6094 L280.2693,685.6094 L286.5832,630.0023 L272.2693,685.6094 L89,685.6094 A0,0 0 0 0 89,685.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M438.8569,685.6094 L438.8569,695.6094 L448.8569,695.6094 L438.8569,685.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9814" x="95" y="704.1045">Reject mode/context changes with a normal fault.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.2705" x="95" y="720.4561">Keep frozen session identity and current session.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0024" x="95" y="736.8076">Normal Wi-Fi/BPM faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.8569" x="95" y="753.1592">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.9668" x="95" y="769.5107">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="46" id="ent0012"><path d="M1004.5,358.6094 L1004.5,417.6641 A0,0 0 0 0 1004.5,417.6641 L1367.6641,417.6641 A0,0 0 0 0 1367.6641,417.6641 L1367.6641,368.6094 L1357.6641,358.6094 L1190,358.6094 L1186,302.689 L1182,358.6094 L1004.5,358.6094 A0,0 0 0 0 1004.5,358.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1357.6641,358.6094 L1357.6641,368.6094 L1367.6641,368.6094 L1357.6641,358.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.1641" x="1010.5" y="377.1045">Any detected fault that affects audio -&gt; Muted (16 October).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.8379" x="1010.5" y="393.4561">Mute; invalidate incomplete work; block Start.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0342" x="1010.5" y="409.8076">The Error returns at once while the cause is present.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="979,146.5956,983,137.5956,979,141.5956,975,137.5956,979,146.5956" style="stroke:#181818;stroke-width:1;"/><path d="M979,92.4446 C979,105.9914 979,123.0299 979,140.5956" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="919.1168,363.0401,919.5405,353.2004,917.2846,358.3879,912.097,356.1319,919.1168,363.0401" style="stroke:#181818;stroke-width:1;"/><path d="M953.8028,192.7356 C937.5992,207.3841 917.9578,228.7687 909,252.6094 C895.118,289.5556 906.0856,329.9527 916.9181,357.4575" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5552" x="911" y="283.1045">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="1156.2708,260.1682,1150.2483,252.3753,1151.8701,257.7947,1146.4507,259.4166,1156.2708,260.1682" style="stroke:#181818;stroke-width:1;"/><path d="M1004.0203,184.4766 C1036.1588,199.8142 1093.5724,227.5325 1142,252.6094 C1146.6361,255.0101 1146.2351,254.7556 1150.9899,257.32" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8926" x="1108" y="230.1045">startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#181818" points="460.3238,473.5344,465.3307,465.0531,460.8979,468.5675,457.3836,464.1347,460.3238,473.5344" style="stroke:#181818;stroke-width:1;"/><path d="M904.8825,390.0505 C814.5577,393.6547 509.8412,407.7937 477,435.6094 C466.0984,444.8427 462.5373,454.3824 461.0127,467.5741" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7808" x="479" y="451.1045">Start / Heart or Lung</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" id="lnk12"><polygon fill="#181818" points="1890.1077,496.7886,1881.2303,492.5235,1885.1099,496.6404,1880.9931,500.52,1890.1077,496.7886" style="stroke:#181818;stroke-width:1;"/><path d="M955.0033,402.2951 C967.0598,408.0246 981.9301,414.1963 996,417.6094 C1052.9301,431.4195 1204.8633,413.2271 1259,435.6094 C1271.5187,440.7851 1269.4748,450.4493 1282,455.6094 C1338.6813,478.9609 1767.1925,493.1426 1884.1104,496.6107" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="611.3174" x="1284" y="451.1045">long press &gt;= 2 s, or automatically when no Wi-Fi credentials are stored / Idle network lease, open hotspot</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#181818" points="955.245,402.7512,961.6282,410.2515,959.7527,404.9146,965.0896,403.0391,955.245,402.7512" style="stroke:#181818;stroke-width:1;"/><path d="M1916.9514,473.3366 C1914.4423,459.9046 1908.9494,444.2288 1897,435.6094 C1856.3957,406.3204 1044.9256,428.2322 996,417.6094 C981.9737,414.564 972.6398,411.0995 960.6543,405.3473" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.7925" x="1913" y="451.1045">save / store SSID + password in flash, join Wi-Fi</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="dependency" id="lnk14"><polygon fill="#181818" points="955.