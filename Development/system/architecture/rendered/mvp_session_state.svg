247.5205,576.2969 L1257.5205,576.2969 L1247.5205,566.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.3589" x="852" y="583.3638">Reject mode/patient/context changes with a normal fault.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.3472" x="852" y="598.4966">Keep frozen session identity and current session.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.5552" x="852" y="613.6294">Normal Wi-Fi/BPM faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5205" x="852" y="628.7622">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5654" x="852" y="643.895">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="46" id="ent0012"><path d="M2900,351.2969 L2900,406.6953 A0,0 0 0 0 2900,406.6953 L3281.6992,406.6953 A0,0 0 0 0 3281.6992,406.6953 L3281.6992,361.2969 L3271.6992,351.2969 L3011.5833,351.2969 L2785.1505,280.3131 L3003.5833,351.2969 L2900,351.2969 A0,0 0 0 0 2900,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3271.6992,351.2969 L3271.6992,361.2969 L3281.6992,361.2969 L3271.6992,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.6992" x="2906" y="368.3638">Any detected dangerous/essential-function fault -&gt; DA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.7988" x="2906" y="383.4966">Mute; invalidate incomplete work; latch until restart.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.002" x="2906" y="398.6294">A button cannot restore operation.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="2587,141.1011,2591,132.1011,2587,136.1011,2583,132.1011,2587,141.1011" style="stroke:#181818;stroke-width:1;"/><path d="M2587,88.8788 C2587,101.9389 2587,118.0227 2587,135.1011" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="1326.1683,268.2811,1335.4589,271.5498,1331.1524,267.8819,1334.8202,263.5753,1326.1683,268.2811" style="stroke:#181818;stroke-width:1;"/><path d="M2560.7289,169.401 C2394.3803,182.7244 1495.1925,254.7434 1332.1492,267.802" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.6396" x="2062" y="223.3638">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="2756.7173,246.2438,2758.5877,236.5742,2755.5913,241.3723,2750.7932,238.3759,2756.7173,246.2438" style="stroke:#181818;stroke-width:1;"/><path d="M2613.156,167.5668 C2646.336,169.3092 2703.3917,177.1866 2738,209.2969 C2748.3161,218.8683 2752.4518,227.7903 2755.3661,240.398" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.9575" x="2752" y="223.3638">essential functionality fails</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#181818" points="1135.143,353.6287,1139.6964,344.8957,1135.4547,348.6385,1131.7119,344.3968,1135.143,353.6287" style="stroke:#181818;stroke-width:1;"/>