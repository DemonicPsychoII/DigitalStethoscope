238.5205,576.2969 L1248.5205,576.2969 L1238.5205,566.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.3589" x="843" y="583.3638">Reject mode/patient/context changes with a normal fault.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.3472" x="843" y="598.4966">Keep frozen session identity and current session.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.5552" x="843" y="613.6294">Normal Wi-Fi/BPM faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5205" x="843" y="628.7622">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5654" x="843" y="643.895">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="46" id="ent0012"><path d="M2891,351.2969 L2891,406.6953 A0,0 0 0 0 2891,406.6953 L3272.6992,406.6953 A0,0 0 0 0 3272.6992,406.6953 L3272.6992,361.2969 L3262.6992,351.2969 L3002.5833,351.2969 L2776.1505,280.3131 L2994.5833,351.2969 L2891,351.2969 A0,0 0 0 0 2891,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3262.6992,351.2969 L3262.6992,361.2969 L3272.6992,361.2969 L3262.6992,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.6992" x="2897" y="368.3638">Any detected dangerous/essential-function fault -&gt; DA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.7988" x="2897" y="383.4966">Mute; invalidate incomplete work; latch until restart.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.002" x="2897" y="398.6294">A button cannot restore operation.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="2578,141.1011,2582,132.1011,2578,136.1011,2574,132.1011,2578,141.1011" style="stroke:#181818;stroke-width:1;"/><path d="M2578,88.8788 C2578,101.9389 2578,118.0227 2578,135.1011" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="1317.1683,268.2811,1326.4589,271.5498,1322.1524,267.8819,1325.8202,263.5753,1317.1683,268.2811" style="stroke:#181818;stroke-width:1;"/><path d="M2551.7289,169.401 C2385.3803,182.7244 1486.1925,254.7434 1323.1492,267.802" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.6396" x="2053" y="223.3638">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="2747.7173,246.2438,2749.5877,236.5742,2746.5913,241.3723,2741.7932,238.3759,2747.7173,246.2438" style="stroke:#181818;stroke-width:1;"/><path d="M2604.156,167.5668 C2637.336,169.3092 2694.3917,177.1866 2729,209.2969 C2739.3161,218.8683 2743.4518,227.7903 2746.3661,240.398" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.9575" x="2743" y="223.3638">essential functionality fails</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#181818" points="1126.143,353.6287,1130.6964,344.8957,1126.4547,348.6385,1122.7119,344.3968,1126.143,353.6287" style="stroke:#181818;stroke-width:1;"/>