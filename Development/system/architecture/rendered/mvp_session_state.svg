<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="939px" preserveAspectRatio="none" style="width:3647px;height:939px;background:#FFFFFF;" version="1.1" viewBox="0 0 3647 939" width="3647px" zoomAndPan="magnify"><title>MVP session and error transitions &#8212; owner decisions through 19 October</title><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="492.8711" x="1314.8145" y="24.5332">MVP session and error transitions &#8212; owner decisions through 19 October</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="28" id="ent0002"><path d="M6,50.6094 L6,142.3672 L422.9541,142.3672 L422.9541,60.6094 L412.9541,50.6094 L6,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M412.9541,50.6094 L412.9541,60.6094 L422.9541,60.6094 L412.9541,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.1396" x="12" y="69.1045">Error latch (red LED) is independent of workflow state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.3486" x="12" y="85.4561">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.9541" x="12" y="101.8076">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3506" x="12" y="118.1592">Wi-Fi recovery does not require acknowledgement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6479" x="12" y="134.5107">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="5" id="ent0002"><ellipse cx="451.5" cy="94.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="426.5" y="179.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="426.5" x2="476.5" y1="207.2188" y2="207.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.7998" x="437.1001" y="199.1426">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="2243.5" y="285.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="2243.5" x2="2293.5" y1="313.2188" y2="313.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="2257.2139" y="305.1426">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="58.9102" x="596" y="738.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="596" x2="654.9102" y1="766.2188" y2="766.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9102" x="606" y="758.1426">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="76.041" x="1039.5" y="497.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1039.5" x2="1115.541" y1="525.2188" y2="525.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.041" x="1049.5" y="517.1426">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="56.5723" x="1049" y="391.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1049" x2="1105.5723" y1="419.2188" y2="419.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.5723" x="1059" y="411.1426">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="85.3652" x="1840" y="603.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="1840" x2="1925.3652" y1="631.2188" y2="631.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3652" x="1850" y="623.1426">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="80.7031" x="2602" y="738.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="2602" x2="2682.7031" y1="766.2188" y2="766.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.7031" x="2612" y="758.1426">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="71.3789" x="2436" y="878.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="2436" x2="2507.3789" y1="905.7188" y2="905.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3789" x="2446" y="897.6426">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="111.8135" x="3011.5" y="878.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="3011.5" x2="3123.3135" y1="905.7188" y2="905.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8135" x="3021.5" y="897.6426">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="37" id="ent0003"><path d="M2701,742.1094 L2701,759.6094 L2683.3164,763.6094 L2701,767.6094 L2701,784.8125 A0,0 0 0 0 2701,784.8125 L2907.7261,784.8125 A0,0 0 0 0 2907.7261,784.8125 L2907.7261,752.1094 L2897.7261,742.1094 L2701,742.1094 A0,0 0 0 0 2701,742.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2897.7261,742.1094 L2897.7261,752.1094 L2907.7261,752.1094 L2897.7261,742.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4717" x="2707" y="760.6045">Start = Busy, visible activity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7261" x="2707" y="776.9561">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="41" id="ent0006"><path d="M2525.5,881.6094 L2525.5,899.1094 L2507.0078,903.1094 L2525.5,907.1094 L2525.5,924.3125 A0,0 0 0 0 2525.5,924.3125 L2777.7515,924.3125 A0,0 0 0 0 2777.7515,924.3125 L2777.7515,891.6094 L2767.7515,881.6094 L2525.5,881.6094 A0,0 0 0 0 2525.5,881.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2767.7515,881.6094 L2767.7515,891.6094 L2777.7515,891.6094 L2767.7515,881.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2515" x="2531.5" y="900.1045">Same Busy rule during both send paths.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2451" x="2531.5" y="916.4561">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="45" id="ent0009"><path d="M1599,709.6094 L1599,817.7188 A0,0 0 0 0 1599,817.7188 L2166.2349,817.7188 A0,0 0 0 0 2166.2349,817.7188 L2166.2349,719.6094 L2156.2349,709.6094 L1886.5,709.6094 L1882.5,653.6947 L1878.5,709.6094 L1599,709.6094 A0,0 0 0 0 1599,709.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2156.2349,709.6094 L2156.2349,719.6094 L2166.2349,719.6094 L2156.2349,709.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="546.2349" x="1605" y="728.1045">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.5449" x="1605" y="744.4561">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8906" x="1605" y="760.8076">Wi-Fi-only faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7979" x="1605" y="777.1592">Other faults follow catalogue halt/clear rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.8569" x="1605" y="793.5107">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.9668" x="1605" y="809.8623">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="53" id="ent0012"><path d="M427,873.6094 L427,932.6641 A0,0 0 0 0 427,932.6641 L824.4414,932.6641 A0,0 0 0 0 824.4414,932.6641 L824.4414,883.6094 L814.4414,873.6094 L629.5,873.6094 L625.5,788.8751 L621.5,873.6094 L427,873.6094 A0,0 0 0 0 427,873.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M814.4414,873.6094 L814.4414,883.6094 L824.4414,883.6094 L814.4414,873.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.4414" x="433" y="892.1045">Non-Wi-Fi faults halt according to current catalogue (19 October).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.8379" x="433" y="908.4561">Mute; invalidate incomplete work; block Start.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4414" x="433" y="924.8076">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="451.5,179.191,455.5,170.191,451.5,174.191,447.5,170.191,451.5,179.191" style="stroke:#181818;stroke-width:1;"/><path d="M451.5,108.9532 C451.5,125.6167 451.5,151.1209 451.5,173.191" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="2243.3968,308.1725,2234.6401,303.6648,2238.405,307.8868,2234.183,311.6517,2243.3968,308.1725" style="stroke:#181818;stroke-width:1;"/><path d="M476.8388,207.0597 C679.9811,218.687 2035.1623,296.2538 2237.4066,307.8297" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5552" x="1524.5" y="263.1045">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="595.9471,760.1327,587.3511,755.3255,590.9681,759.6749,586.6187,763.2919,595.9471,760.1327" style="stroke:#181818;stroke-width:1;"/><path d="M426.4754,209.8541 C360.2583,221.7903 185.5,258.1652 185.5,309.6094 C185.5,309.6094 185.5,309.6094 185.5,629.6094 C185.5,715.5965 491.3189,750.5137 589.9723,759.5834" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.8398" x="187.5" y="475.1045">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#181818" points="1039.2131,512.7735,1031.3859,506.7956,1034.3494,511.6141,1029.5309,514.5776,1039.2131,512.7735" style="stroke:#181818;stroke-width:1;"/><path d="M2243.4751,311.7917 C2043.6507,313.3053 713.8811,324.4653 685.5,353.6094 C631.1958,409.3735 924.6642,485.4681 1033.3766,511.3822" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7808" x="789.5" y="422.1045">Start / Heart or Lung</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" id="lnk12"><polygon fill="#181818" points="1070.663,391.3737,1073.2002,381.8572,1069.8779,386.4357,1065.2994,383.1134,1070.663,391.3737" style="stroke:#181818;stroke-width:1;"/><path d="M2243.2479,311.5268 C2074.918,311.0959 1120.7324,310.5603 1078.5,353.6094 C1069.0009,363.2922 1067.6681,372.5373 1069.7209,385.4481" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="671.3027" x="1080.5" y="369.1045">long press &gt;= 2 s, or automatically when no Wi-Fi credentials are stored / Idle network lease, scan then open hotspot</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#181818" points="2243.3835,311.7144,2234.3528,307.7841,2238.3837,311.7531,2234.4147,315.7839,2243.3835,311.7144" style="stroke:#1818