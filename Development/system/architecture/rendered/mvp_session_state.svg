entity and current session.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.5552" x="800" y="613.6294">Normal Wi-Fi/BPM faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5205" x="800" y="628.7622">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5654" x="800" y="643.895">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="43" id="ent0012"><path d="M1829,351.2969 L1829,406.6953 A0,0 0 0 0 1829,406.6953 L2210.6992,406.6953 A0,0 0 0 0 2210.6992,406.6953 L2210.6992,361.2969 L2200.6992,351.2969 L1990.3051,351.2969 L1911.2044,292.1406 L1982.3051,351.2969 L1829,351.2969 A0,0 0 0 0 1829,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2200.6992,351.2969 L2200.6992,361.2969 L2210.6992,361.2969 L2200.6992,351.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.6992" x="1835" y="368.3638">Any detected dangerous/essential-function fault -&gt; DA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.7988" x="1835" y="383.4966">Mute; invalidate incomplete work; latch until restart.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.002" x="1835" y="398.6294">A button cannot restore operation.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="1713,141.1011,1717,132.1011,1713,136.1011,1709,132.1011,1713,141.1011" style="stroke:#181818;stroke-width:1;"/><path d="M1713,88.8788 C1713,101.9389 1713,118.0227 1713,135.