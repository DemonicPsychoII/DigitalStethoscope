Error</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="36" id="ent0003"><path d="M2643,725.1094 L2643,742.6094 L2625.3164,746.6094 L2643,750.6094 L2643,767.8125 A0,0 0 0 0 2643,767.8125 L2849.7261,767.8125 A0,0 0 0 0 2849.7261,767.8125 L2849.7261,735.1094 L2839.7261,725.1094 L2643,725.1094 A0,0 0 0 0 2643,725.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2839.7261,725.1094 L2839.7261,735.1094 L2849.7261,735.1094 L2839.7261,725.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4717" x="2649" y="743.6045">Start = Busy, visible activity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7261" x="2649" y="759.9561">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="40" id="ent0006"><path d="M2418.5,864.6094 L2418.5,882.1094 L2400.0078,886.1094 L2418.5,890.1094 L2418.5,907.3125 A0,0 0 0 0 2418.5,907.3125 L2670.7515,907.3125 A0,0 0 0 0 2670.7515,907.3125 L2670.7515,874.6094 L2660.7515,864.6094 L2418.5,864.6094 A0,0 0 0 0 2418.5,864.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2660.7515,864.6094 L2660.7515,874.6094 L2670.7515,874.6094 L2660.7515,864.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2515" x="2424.5" y="883.1045">Same Busy rule during both send paths.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2451" x="2424.5" y="899.4561">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="44" id="ent0009"><path d="M995,692.6094 L995,800.7188 A0,0 0 0 0 995,800.7188 L1562.2349,800.7188 A0,0 0 0 0 1562.2349,800.7188 L1562.2349,702.6094 L1552.2349,692.6094 L1282.5,692.6094 L1278.5,636.6947 L1274.5,692.6094 L995,692.6094 A0,0 0 0 0 995,692.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1552.2349,692.6094 L1552.2349,702.6094 L1562.2349,702.6094 L1552.2349,692.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="546.2349" x="1001" y="711.1045">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.5449" x="1001" y="727.4561">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8906" x="1001" y="743.8076">Wi-Fi-only faults preserve functioning audio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7979" x="1001" y="760.1592">Other faults follow catalogue halt/clear rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.8569" x="1001" y="776.5107">Normal-fault indication is latched separately from workflow;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.9668" x="1001" y="792.8623">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="52" id="ent0012"><path d="M427,856.6094 L427,915.6641 A0,0 0 0 0 427,915.6641 L824.4414,915.6641 A0,0 0 0 0 824.4414,915.6641 L824.4414,866.6094 L814.4414,856.6094 L629.5,856.6094 L625.5,771.8751 L621.5,856.6094 L427,856.6094 A0,0 0 0 0 427,856.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M814.4414,856.6094 L814.4414,866.6094 L824.4414,866.6094 L814.4414,856.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.4414" x="433" y="875.1045">Non-Wi-Fi faults halt according to current catalogue (19 October).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.8379" x="433" y="891.4561">Mute; invalidate incomplete work; block Start.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4414" x="433" y="907.8076">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="451.5,162.5825,455.5,153.5825,451.5,157.5825,447.5,153.5825,451.5,162.5825" style="stroke:#181818;stroke-width:1;"/><path d="M451.5,100.2939 C451.5,115.3998 451.5,136.716 451.5,156.5825" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="2243.3968,291.1725,2234.6401,286.6648,2238.405,290.8868,2234.183,294.6517,2243.3968,291.1725" style="stroke:#181818;stroke-width:1;"/><path d="M476.8388,190.0597 C679.9811,201.687 2035.1623,279.2538 2237.4066,290.8297" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5552" x="1524.5" y="246.1045">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="595.9471,743.1327,587.3511,738.3255,590.9681,742.6749,586.6187,746.2919,595.9471,743.1327" style="stroke:#181818;stroke-width:1;"/><path d="M426.4754,192.8541 C360.2583,204.7903 185.5,241.1652 185.5,292.6094 C185.5,292.6094 185.5,292.6094 185.5,612.6094 C185.5,698.5965 491.3189,733.5137 589.9723,742.5834" fill="none" style="stroke:#181818;st