-function fault -&gt; DA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.7988" x="2374.687" y="383.4966">Mute; invalidate incomplete work; latch until restart.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.002" x="2374.687" y="398.6294">A button cannot restore operation.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="1391.687,141.1011,1395.687,132.1011,1391.687,136.1011,1387.687,132.1011,1391.687,141.1011" style="stroke:#181818;stroke-width:1;"/><path d="M1391.687,88.8788 C1391.687,101.9389 1391.687,118.0227 1391.687,135.1011" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="1239.7721,246.0924,1242.6227,236.6651,1239.1507,241.1312,1234.6847,237.6593,1239.7721,246.0924" style="stroke:#181818;stroke-width:1;"/><path d="M1365.6638,171.0966 C1327.979,177.187 1261.1304,190.4006 1246.687,209.2969 C1238.8399,219.5632 1237.4993,227.9448 1239.0265,240.1389" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.6396" x="1248.687" y="223.3638">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#181818" points="1713.5698,268.8443,1704.9129,264.1477,1708.5854,268.4504,1704.2827,272.1228,1713.5698,268.8443" style="stroke:#181818;stroke-width:1;"/><path d="M1417.7307,173.0785 C1443.8463,179.5441 1484.6703,191.5015 1516.687,209.2969 C1528.2762,215.7383 1527.7434,222.5389 1539.687,228.2969 C1597.8927,256.3578 1668.5904,265.2898 1707.5885,268.3716" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" fon