<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalStethoscope Architecture</title><style>
:root{color-scheme:dark}
html,body{margin:0;background:#11151b!important;color:#e6edf3!important;font-family:system-ui,sans-serif}
main{width:100%;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0;background:#11151b}
button{font:inherit;font-size:14px;border:1px solid #394451;border-radius:7px;padding:9px 12px;background:#1d2530;color:#d9e2ec;cursor:pointer}
button:hover{background:#2b3746}
button[aria-selected=true]{background:#224969;border-color:#71b7ee;color:#fff}
button:focus-visible{outline:2px solid #91cbfa;outline-offset:3px}
figure{position:relative;margin:0;background:#11151b;width:100%;min-height:0}
.viewport{width:100%;height:100%;overflow:hidden}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
img{display:block;width:100%;height:100%;object-fit:contain;filter:invert(.92) hue-rotate(180deg);user-select:none}
.zoom{position:absolute;top:8px;right:12px;display:flex;gap:6px;z-index:2}
.zoom[hidden]{display:none}
.viewport.zoomed{overflow:auto}
.viewport.zoomed .stage{display:block}
.viewport.zoomed img{object-fit:fill;max-width:none}
</style></head><body><!-- Updated by GPT-6.1-Sol on behalf of Nico running in T3 Code through Codex. --><main><nav role="tablist" aria-label="Architecture views"><button type="button" role="tab" id="view-0" aria-controls="diagram-panel" tabindex="0" data-index="0" aria-selected="true">Architecture</button><button type="button" role="tab" id="view-1" aria-controls="diagram-panel" tabindex="-1" data-index="1" aria-selected="false">System context</button><button type="button" role="tab" id="view-2" aria-controls="diagram-panel" tabindex="-1" data-index="2" aria-selected="false">System components</button><button type="button" role="tab" id="view-3" aria-controls="diagram-panel" tabindex="-1" data-index="3" aria-selected="false">Electrical interfaces</button><button type="button" role="tab" id="view-4" aria-controls="diagram-panel" tabindex="-1" data-index="4" aria-selected="false">Software components</button><button type="button" role="tab" id="view-5" aria-controls="diagram-panel" tabindex="-1" data-index="5" aria-selected="false">Threads</button><button type="button" role="tab" id="view-6" aria-controls="diagram-panel" tabindex="-1" data-index="6" aria-selected="false">Listening</button><button type="button" role="tab" id="view-7" aria-controls="diagram-panel" tabindex="-1" data-index="7" aria-selected="false">BPM measurement</button></nav><figure id="diagram-panel" role="tabpanel" aria-labelledby="view-0" tabindex="0"><div class="viewport"><div class="stage"><img id="diagram" src="rendered/architecture_choice.svg" alt="Architecture" draggable="false"></div></div><div class="zoom" hidden aria-label="Flowchart zoom"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="zoom-fit" type="button">Fit</button></div></figure></main><script>const views=[{"src": "rendered/architecture_choice.svg", "title": "Architecture", "flow": false}, {"src": "rendered/system_context.svg", "title": "System context", "flow": false}, {"src": "rendered/system_components.svg", "title": "System components", "flow": false}, {"src": "rendered/electrical_interfaces.svg", "title": "Electrical interfaces", "flow": false}, {"src": "rendered/software_components.svg", "title": "Software components", "flow": false}, {"src": "rendered/runtime_ownership.svg", "title": "Threads", "flow": false}, {"src": "rendered/listening_workflow.svg", "title": "Listening", "flow": true}, {"src": "rendered/measurement_workflow.svg", "title": "BPM measurement", "flow": true}];
const navigation=document.querySelector('nav');
const frame=document.querySelector('figure');
const viewport=document.querySelector('.viewport');
const stage=document.querySelector('.stage');
const diagram=document.getElementById('diagram');
const zoomControls=document.querySelector('.zoom');
let selected=0,zoom=1;
function applyZoom(){
 const allowed=views[selected].flow;
 zoomControls.hidden=!allowed;
 if(!allowed)zoom=1;
 const enlarged=zoom>1;
 viewport.classList.toggle('zoomed',enlarged);
 if(enlarged&&diagram.naturalWidth){
  const fit=Math.min(viewport.clientWidth/diagram.naturalWidth,viewport.clientHeight/diagram.naturalHeight);
  const width=Math.round(diagram.naturalWidth*fit*zoom);
  const height=Math.round(diagram.naturalHeight*fit*zoom);
  stage.style.width=Math.max(viewport.clientWidth,width)+'px';
  stage.style.height=Math.max(viewport.clientHeight,height)+'px';
  diagram.style.width=width+'px';diagram.style.height=height+'px';
 }else{
  stage.style.width='100%';stage.style.height='100%';
  diagram.style.width='100%';diagram.style.height='100%';
  viewport.scrollTop=0;viewport.scrollLeft=0;
 }
 document.getElementById('zoom-out').disabled=zoom<=1;
 document.getElementById('zoom-in').disabled=zoom>=6;
}
function fitDiagram(){
 const embedded=window.self!==window.top;
 frame.style.height=(embedded?620:Math.max(40,window.innerHeight-navigation.getBoundingClientRect().height))+'px';
 applyZoom();
}
document.querySelectorAll('button[data-index]').forEach(button=>button.addEventListener('click',()=>{
 selected=Number(button.dataset.index);zoom=1;
 diagram.src=views[selected].src;diagram.alt=views[selected].title;
 document.querySelectorAll('button[data-index]').forEach(tab=>{
  tab.setAttribute('aria-selected',String(tab===button));
  tab.tabIndex=tab===button?0:-1;
 });
 frame.setAttribute('aria-labelledby',button.id);
 applyZoom();
}));
navigation.addEventListener('keydown',event=>{
 const tabs=Array.from(navigation.querySelectorAll('[role=tab]'));
 const index=tabs.indexOf(event.target);
 if(index<0)return;
 let next;
 if(event.key==='ArrowRight')next=(index+1)%tabs.length;
 else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;
 else if(event.key==='Home')next=0;
 else if(event.key==='End')next=tabs.length-1;
 else return;
 event.preventDefault();tabs[next].focus();tabs[next].click();
});
diagram.addEventListener('load',applyZoom);
document.getElementById('zoom-in').addEventListener('click',()=>{zoom=Math.min(6,zoom*1.5);applyZoom();});
document.getElementById('zoom-out').addEventListener('click',()=>{zoom=Math.max(1,zoom/1.5);applyZoom();});
document.getElementById('zoom-fit').addEventListener('click',()=>{zoom=1;applyZoom();});
viewport.addEventListener('wheel',event=>{
 if(!views[selected].flow||!event.ctrlKey)return;
 event.preventDefault();zoom=Math.max(1,Math.min(6,zoom*(event.deltaY<0?1.2:1/1.2)));applyZoom();
},{passive:false});
fitDiagram();window.addEventListener('resize',fitDiagram);
new ResizeObserver(fitDiagram).observe(navigation);
</script></body></html>
