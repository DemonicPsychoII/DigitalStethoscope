5501 551,736.2848 551,737.0242 C551,742.9391 551,749.1537 551,755.568 C551,768.3966 551,782.0241 551,795.6506 C551,799.0573 551,802.4639 551,805.8579 C551,806.7064 551,801.5541 551,802.4009 " fill="none" id="L0-to-OS" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="551,808.4009,555,799.4009,551,803.4009,547,799.4009,551,808.4009" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71" x="552" y="781.1045">Zephyr APIs</text></g><!--link Audio to DSP--><g id="link_Audio_DSP"><path d="M1453.65,415.1094 C1487.615,415.1094 1516.445,415.1094 1543.6013,415.1094 " fill="none" id="Audio-to-DSP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1549.6013,415.1094,1540.6013,411.1094,1544.6013,415.1094,1540.6013,419.1094,1549.6013,415.1094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="1471.57" y="408.6045">processing / replay</text></g><!--link BPM to DSP--><g id="link_BPM_DSP"><path d="M1046.52,387.3194 C1071.1,348.9994 1121.35,281.6294 1185,254.6094 C1269.07,218.9194 1530.62,190.8394 1596,254.6094 C1602.185,260.6419 1605.6087,273.1663 1607.2459,288.6842 C1608.0645,296.4432 1608.4365,304.9506 1608.4836,313.7691 C1608.4851,314.0447 1608.468,308.3206 1608.4688,308.5967 " fill="none" id="BPM-to-DSP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1608.4871,314.5967,1612.4596,305.5846,1608.4718,309.5967,1604.4597,305.609,1608.4871,314.5967" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48" x="1359" y="227.1045">analysis</text></g><!--link L1 to MON--><!--link L0 to Common--><!--link OS to Tests--><rect fill="#DDDDDD" height="115.6563" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1.0;" width="512" x="869" y="986.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="502" x="874" y="1006.1426">This is the agreed design documented in PR #15, not the current source layout.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="420" x="874" y="1023.752">Calls go downward; upward communication uses message queues.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="407" x="874" y="1041.3613">L2 may also access L0 directly. L2, L1 and L0 may use common.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="422" x="874" y="1058.9707">common has no dependencies; MON observes all layers read-only.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="442" x="874" y="1076.5801">Zephyr owns HAL, DMA and interrupts; there is no project-owned HAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="379" x="874" y="1094.1895">Start on one core; extend only when measurements justify it.</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="284" x="983" y="1125.6465">Created by GPT-6.1-Sol on behalf of Nico running in codex.</text><!--SRC=[dLRjJXj75Fs_Jt45FzeA6qDIgZP8bHn_95OCM1YAr3X2m-vuTyBip6O-85OLgG_H9-oJzCpCsc3J_Yb21k_SptFkFRFVqS1mvdX1TojwDxlg_dHut9rhILhH7Q-ON99Uqhd8DHclb50b2KMvBlZNmym99paDHIaSasGTTvMskMuu_VtdNyHAmn7NwgLxP8QJP2jkY9cy4exdpXkUETsGqtIddTCr5SBWkT0gi_T2DSom6fdgHYkktDoja2iOC5LA_ioaOVazA_b_6zYA5VenbBvaql8isnZHtlHLhBNVD5BaB2IdxwUlRjdJzzuFUyGimN1_zFFuU3oWFp9wgels1bevewNaPg7E00o00A1KCpIg-4BDHKprQD2s2MZM6wCO-Sb_E-xrPA66mZR0ZGu8g1hcj07y2CCYJj7zUhBjDg-ub0k5g4jHUfDwEY3-mAHFNs1SCrNOw1xDis_Re1n7KERSF8YSMo1oV6lRBsiuZYCS9wDVTk7e-qBeXUhdNxom8YJia1GOZZ0y7SfP4wZlWAdGMGmMNRQZl9sTBTH45RpX-C0JffXSMM51jwlGpnVFf70hAjSmmcC72A25kG01Gs8vIcyRJe-tRS-vUzJcddeqVZ-v18-SM