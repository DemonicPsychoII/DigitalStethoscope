<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1177.0833px" preserveAspectRatio="none" style="width:6413px;height:1177px;" version="1.1" viewBox="0 0 6413 1177" width="6413.5417px" zoomAndPan="magnify"><title>MVP session and error transitions (Lung transitions optional)</title><defs><linearGradient id="g1u2did88hbhb50" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#g1u2did88hbhb50)" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="610.9904" x="1846.8486" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="588.0737" x="1858.3069" y="54.2236">MVP session and error transitions (Lung transitions optional)</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="35" id="ent0002"><path d="M16.6667,99.9919 L16.6667,196.8424 A4.1667,4.1667 0 0 0 20.8333,201.0091 L421.4884,201.0091 A4.1667,4.1667 0 0 0 425.6551,196.8424 L425.6551,106.2419 L415.2384,95.8252 L20.8333,95.8252 A4.1667,4.1667 0 0 0 16.6667,99.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M415.2384,95.8252 L415.2384,104.1585 A2.0833,2.0833 0 0 0 417.3218,106.2419 L425.6551,106.2419 L415.2384,95.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="294.8242" x="28.125" y="119.401">Error latch (red LED) is independent of workflow state.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.1943" x="28.125" y="136.2712">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.6968" x="28.125" y="153.1413">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.3521" x="28.125" y="170.0114">Wi-Fi recovery does not require acknowledgement.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.606" x="28.125" y="186.8815">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="455.7292" cy="146.346" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.3569" x="428.6458" y="239.5752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="428.6458" x2="483.0027" y1="275.8728" y2="275.8728"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.1069" x="444.2708" y="262.0544">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="2313.0208" y="365.6169"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2313.0208" x2="2365.1042" y1="401.9145" y2="401.9145"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="2330.0268" y="388.0961">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="62.8276" x="589.0625" y="918.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="589.0625" x2="651.8901" y1="955.0395" y2="955.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5776" x="604.6875" y="941.2211">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="76.3336" x="1193.75" y="617.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1193.75" x2="1270.0836" y1="653.9978" y2="653.9978"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.0836" x="1209.375" y="640.1794">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="60.0749" x="1201.5625" y="491.6585"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1201.5625" x2="1261.6374" y1="527.9561" y2="527.9561"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="28.8249" x="1217.1875" y="514.1378">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="83.4279" x="1568.2292" y="743.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1568.2292" x2="1651.6571" y1="780.0395" y2="780.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="52.1779" x="1583.8542" y="766.2211">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="78.1687" x="3377.0833" y="918.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3377.0833" x2="3455.2521" y1="955.0395" y2="955.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.9187" x="3392.7083" y="941.2211">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="71.522" x="2073.9583" y="1084.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2073.9583" x2="2145.4803" y1="1120.6645" y2="1120.6645"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="2089.5833" y="1106.8461">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="102.4058" x="4193.2292" y="1084.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4193.2292" x2="4295.635" y1="1120.6645" y2="1120.6645"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="71.1558" x="4208.8542" y="1106.8461">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="44" id="ent0003"><path d="M3473.9583,924.471 L3473.9583,943.221 L3455.5013,947.3877 L3473.9583,951.5544 L3473.9583,970.7113 A4.1667,4.1667 0 0 0 3478.125,974.8779 L3678.7923,974.8779 A4.1667,4.1667 0 0 0 3682.959,970.7113 L3682.959,930.721 L3672.5423,920.3044 L3478.125,920.3044 A4.1667,4.1667 0 0 0 3473.9583,924.471" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3672.5423,920.3044 L3672.5423,928.6377 A2.0833,2.0833 0 0 0 3674.6257,930.721 L3682.959,930.721 L3672.5423,920.3044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="154.5288" x="3485.4167" y="943.8802">Start = Busy, visible activity.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="176.709" x="3485.4167" y="960.7503">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="48" id="ent0006"><path d="M2164.5833,1081.2419 L2164.5833,1108.846 L2146.0409,1113.0127 L2164.5833,1117.1794 L2164.5833,1144.3522 A4.1667,4.1667 0 0 0 2168.75,1148.5189 L2444.3197,1148.5189 A4.1667,4.1667 0 0 0 2448.4863,1144.3522 L2448.4863,1087.4919 L2438.0697,1077.0752 L2168.75,1077.0752 A4.1667,4.1667 0 0 0 2164.5833,1081.2419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2438.0697,1077.0752 L2438.0697,1085.4085 A2.0833,2.0833 0 0 0 2440.153,1087.4919 L2448.4863,1087.4919 L2438.0697,1077.0752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6113" x="2176.0417" y="1100.651">Start cancels the delivery on both send paths;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.9077" x="2176.0417" y="1117.5212">the result is lost. Start is never queued.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.9209" x="2176.0417" y="1134.3913">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="53" id="ent0009"><path d="M1260.4167,890.6169 L1260.4167,1004.3376 A4.1667,4.1667 0 0 0 1264.5833,1008.5042 L1793.1193,1008.5042 A4.1667,4.1667 0 0 0 1797.286,1004.3376 L1797.286,896.8669 L1786.8693,886.4502 L1589.0591,886.4502 L1609.5331,801.3817 L1580.7258,886.4502 L1264.5833,886.4502 A4.1667,4.1667 0 0 0 1260.4167,890.6169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1786.8693,886.4502 L1786.8693,894.7835 A2.0833,2.0833 0 0 0 1788.9526,896.8669 L1797.286,896.8669 L1786.8693,886.4502" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="504.5776" x="1271.875" y="910.026">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.1846" x="1271.875" y="926.8962">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.3901" x="1271.875" y="943.7663">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="247.6074" x="1271.875" y="960.6364">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="323.2544" x="1271.875" y="977.5065">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.8291" x="1271.875" y="994.3766">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="61" id="ent0012"><path d="M449.4792,1081.2419 L449.4792,1144.3522 A4.1667,4.1667 0 0 0 453.6458,1148.5189 L787.1257,1148.5189 A4.1667,4.1667 0 0 0 791.2923,1144.3522 L791.2923,1087.4919 L780.8757,1077.0752 L624.4792,1077.0752 L620.3125,976.172 L616.1458,1077.0752 L453.6458,1077.0752 A4.1667,4.1667 0 0 0 449.4792,1081.2419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M780.8757,1077.0752 L780.8757,1085.4085 A2.0833,2.0833 0 0 0 782.959,1087.4919 L791.2923,1087.4919 L780.8757,1077.0752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.8247" x="460.9375" y="1100.651">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.1221" x="460.9375" y="1117.5212">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="309.5215" x="460.9375" y="1134.3913">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="455.7292,239.1208,459.8958,229.7458,455.7292,233.9125,451.5625,229.7458,455.7292,239.1208" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M455.7292,161.1877 C455.7292,179.2143 455.7292,208.0175 455.7292,232.8708" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2312.7909,391.4919,2303.7098,386.7185,2307.5938,391.1498,2303.1625,395.0338,2312.7909,391.4919" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M483.0785,271.0628 C697.2646,285.1602 2096.4093,377.2499 2306.5544,391.0814" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.4263" x="1628.6458" y="336.0677">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="588.8749,940.8302,580.4105,935.0332,583.7529,939.8861,578.9,943.2285,588.8749,940.8302" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M428.5866,269.5433 C360.5274,271.8191 188.0208,287.9685 188.0208,393.221 C188.0208,393.221 188.0208,393.221 188.0208,773.4294 C188.0208,859.8186 483.2507,921.3622 582.7285,939.6973" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="229.4312" x="195.3125" y="588.151">non-Wi-Fi startup 