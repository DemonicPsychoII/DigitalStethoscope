.4583" lengthAdjust="spacing" textLength="49.6826" x="4236.4583" y="903.2033">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="73.3012" x="2784.375" y="1040.2669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2784.375" x2="2857.6762" y1="1075.5127" y2="1075.5127"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="42.0512" x="2800" y="1062.5783">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="106.395" x="4889.5833" y="1040.2669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4889.5833" x2="4995.9783" y1="1075.5127" y2="1075.5127"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="75.145" x="4905.2083" y="1062.5783">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="42" id="ent0003"><path d="M4320.8333,887.1419 L4320.8333,904.8503 L4302.2827,909.0169 L4320.8333,913.1836 L4320.8333,931.0872 A4.1667,4.1667 0 0 0 4325,935.2539 L4527.5411,935.2539 A4.1667,4.1667 0 0 0 4531.7078,931.0872 L4531.7078,893.3919 L4521.2911,882.9753 L4325,882.9753 A4.1667,4.1667 0 0 0 4320.8333,887.1419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M4521.2911,882.9753 L4521.2911,891.3086 A2.0833,2.0833 0 0 0 4523.3744,893.3919 L4531.7078,893.3919 L4521.2911,882.9753" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.2612" x="4332.2917" y="906.368">Start = Busy, visible activity.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="178.5828" x="4332.2917" y="922.0907">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="46" id="ent0006"><path d="M2876.0417,1046.5169 L2876.0417,1064.2253 L2857.5053,1068.3919 L2876.0417,1072.5586 L2876.0417,1090.4622 A4.1667,4.1667 0 0 0 2880.2083,1094.6289 L3126.5238,1094.6289 A4.1667,4.1667 0 0 0 3130.6905,1090.4622 L3130.6905,1052.7669 L3120.2738,1042.3503 L2880.2083,1042.3503 A4.1667,4.1667 0 0 0 2876.0417,1046.5169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3120.2738,1042.3503 L3120.2738,1050.6836 A2.0833,2.0833 0 0 0 3122.3572,1052.7669 L3130.6905,1052.7669 L3120.2738,1042.3503" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3572" x="2887.5" y="1065.743">Same Busy rule during both send paths.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3511" x="2887.5" y="1081.4657">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="50" id="ent0009"><path d="M1414.0625,855.3711 L1414.0625,962.207 A4.1667,4.1667 0 0 0 1418.2292,966.3737 L1967.4133,966.3737 A4.1667,4.1667 0 0 0 1971.58,962.207 L1971.58,861.6211 L1961.1633,851.2044 L1696.875,851.2044 L1692.7083,783.5091 L1688.5417,851.2044 L1418.2292,851.2044 A4.1667,4.1667 0 0 0 1414.0625,855.3711" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1961.1633,851.2044 L1961.1633,859.5378 A2.0833,2.0833 0 0 0 1963.2467,861.6211 L1971.58,861.6211 L1961.1633,851.2044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="525.2258" x="1425.5208" y="874.5972">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="341.8701" x="1425.5208" y="890.3198">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="243.1641" x="1425.5208" y="906.0425">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.9595" x="1425.5208" y="921.7651">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="325.824" x="1425.5208" y="937.4878">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.7373" x="1425.5208" y="953.2104">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="58" id="ent0012"><path d="M465.625,1038.7044 L465.625,1098.3724 A4.1667,4.1667 0 0 0 469.7917,1102.5391 L805.7129,1102.5391 A4.1667,4.1667 0 0 0 809.8796,1098.3724 L809.8796,1044.9544 L799.4629,1034.5378 L641.6667,1034.5378 L637.5,937.4567 L633.3333,1034.5378 L469.7917,1034.5378 A4.1667,4.1667 0 0 0 465.625,1038.7044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M799.4629,1034.5378 L799.4629,1042.8711 A2.0833,2.0833 0 0 0 801.5462,1044.9544 L809.8796,1044.9544 L799.4629,1034.5378" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="288.324" x="477.0833" y="1057.9305">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.8057" x="477.0833" y="1073.6532">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.9629" x="477.0833" y="1089.3758">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="458.3333,231.071,462.5,221.696,458.3333,225.8626,454.1667,221.696,458.3333,231.071" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M458.3333,156.2107 C458.3333,173.7419 458.3333,200.9456 458.3333,224.821" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2289.4412,380.7363,2280.3592,375.9647,2284.2441,380.3952,2279.8135,384.2801,2289.4412,380.7363" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M486.0296,262.3968 C699.5846,276.4103 2075.2529,366.6813 2283.2047,380.327" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.4954" x="1614.5833" y="326.6805">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="605.646,904.2139,596.8687,898.9025,600.4789,903.5596,595.8218,907.1698,605.646,904.2139" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M430.5846,260.6585 C361.9194,262.4563 189.5833,277.4299 189.5833,382.4544 C189.5833,382.4544 189.5833,382.4544 189.5833,756.4128 C189.5833,844.3565 497.1149,890.4705 599.4455,903.4287" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6152" x="196.875" y="574.5972">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="1128.4952,625.463,1138.322,628.4101,1