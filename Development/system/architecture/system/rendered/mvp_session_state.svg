<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1143.75px" preserveAspectRatio="none" style="width:6913px;height:1143px;" version="1.1" viewBox="0 0 6913 1143" width="6913.5417px" zoomAndPan="magnify"><title>MVP session and error transitions (Lung transitions optional)</title><defs><linearGradient id="g1hhx8ev24kric0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#g1hhx8ev24kric0)" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="610.9904" x="2159.8694" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="588.0737" x="2171.3277" y="54.2236">MVP session and error transitions (Lung transitions optional)</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="33" id="ent0002"><path d="M16.6667,99.9919 L16.6667,196.8424 A4.1667,4.1667 0 0 0 20.8333,201.0091 L421.4884,201.0091 A4.1667,4.1667 0 0 0 425.6551,196.8424 L425.6551,106.2419 L415.2384,95.8252 L20.8333,95.8252 A4.1667,4.1667 0 0 0 16.6667,99.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M415.2384,95.8252 L415.2384,104.1585 A2.0833,2.0833 0 0 0 417.3218,106.2419 L425.6551,106.2419 L415.2384,95.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="294.8242" x="28.125" y="119.401">Error latch (red LED) is independent of workflow state.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.1943" x="28.125" y="136.2712">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.6968" x="28.125" y="153.1413">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.3521" x="28.125" y="170.0114">Wi-Fi recovery does not require acknowledgement.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.606" x="28.125" y="186.8815">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="455.7292" cy="146.346" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.3569" x="428.6458" y="239.5752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="428.6458" x2="483.0027" y1="275.8728" y2="275.8728"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.1069" x="444.2708" y="262.0544">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="2290.1042" y="365.6169"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2290.1042" x2="2342.1875" y1="401.9145" y2="401.9145"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="2307.1101" y="388.0961">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="62.8276" x="602.6042" y="902.0752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="602.6042" x2="665.4317" y1="938.3728" y2="938.3728"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5776" x="618.2292" y="924.5544">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="76.3336" x="1050" y="617.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1050" x2="1126.3336" y1="653.9978" y2="653.9978"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.0836" x="1065.625" y="640.1794">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="60.0749" x="1057.8125" y="491.6585"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1057.8125" x2="1117.8874" y1="527.9561" y2="527.9561"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="28.8249" x="1073.4375" y="514.1378">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="83.4279" x="1606.7708" y="743.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1606.7708" x2="1690.1988" y1="780.0395" y2="780.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="52.1779" x="1622.3958" y="766.2211">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="78.1687" x="4162.5" y="902.0752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4162.5" x2="4240.6687" y1="938.3728" y2="938.3728"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdju