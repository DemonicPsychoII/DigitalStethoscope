11.4583" lengthAdjust="spacing" textLength="49.6826" x="3087.5" y="903.2033">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="73.3012" x="2480.2083" y="1040.2669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2480.2083" x2="2553.5095" y1="1075.5127" y2="1075.5127"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="42.0512" x="2495.8333" y="1062.5783">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="106.395" x="3930.2083" y="1040.2669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3930.2083" x2="4036.6033" y1="1075.5127" y2="1075.5127"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="75.145" x="3945.8333" y="1062.5783">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="40" id="ent0003"><path d="M3171.875,887.1419 L3171.875,904.8503 L3153.3244,909.0169 L3171.875,913.1836 L3171.875,931.0872 A4.1667,4.1667 0 0 0 3176.0417,935.2539 L3378.5828,935.2539 A4.1667,4.1667 0 0 0 3382.7494,931.0872 L3382.7494,893.3919 L3372.3328,882.9753 L3176.0417,882.9753 A4.1667,4.1667 0 0 0 3171.875,887.1419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3372.3328,882.9753 L3372.3328,891.3086 A2.0833,2.0833 0 0 0 3374.4161,893.3919 L3382.7494,893.3919 L3372.3328,882.9753" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.2612" x="3183.3333" y="906.368">Start = Busy, visible activity.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="178.5828" x="3183.3333" y="922.0907">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="44" id="ent0006"><path d="M2571.875,1046.5169 L2571.875,1064.2253 L2553.3386,1068.3919 L2571.875,1072.5586 L2571.875,1090.4622 A4.1667,4.1667 0 0 0 2576.0417,1094.6289 L2822.3572,1094.6289 A4.1667,4.1667 0 0 0 2826.5238,1090.4622 L2826.5238,1052.7669 L2816.1072,1042.3503 L2576.0417,1042.3503 A4.1667,4.1667 0 0 0 2571.875,1046.5169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2816.1072,1042.3503 L2816.1072,1050.6836 A2.0833,2.0833 0 0 0 2818.1905,1052.7669 L2826.5238,1052.7669 L2816.1072,1042.3503" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3572" x="2583.3333" y="1065.743">Same Busy rule during both send paths.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3511" x="2583.3333" y="1081.4657">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="48" id="ent0009"><path d="M1445.3125,855.3711 L1445.3125,962.207 A4.1667,4.1667 0 0 0 1449.4792,966.3737 L1998.6633,966.3737 A4.1667,4.1667 0 0 0 2002.83,962.207 L2002.83,861.6211 L1992.4133,851.2044 L1931.695,851.2044 L1962.0755,783.5704 L1923.3617,851.2044 L1449.4792,851.2044 A4.1667,4.1667 0 0 0 1445.3125,855.3711" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1992.4133,851.2044 L1992.4133,859.5378 A2.0833,2.0833 0 0 0 1994.4967,861.6211 L2002.83,861.6211 L1992.4133,851.2044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="525.2258" x="1456.7708" y="874.5972">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="341.8701" x="1456.7708" y="890.3198">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="243.1641" x="1456.7708" y="906.0425">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.9595" x="1456.7708" y="921.7651">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="325.824" x="1456.7708" y="937.4878">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.7373" x="1456.7708" y="953.2104">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="56" id="ent0012"><path d="M1200,1038.7044 L1200,1098.3724 A4.1667,4.1667 0 0 0 1204.1667,1102.5391 L1540.0879,1102.5391 A4.1667,4.1667 0 0 0 1544.2546,1098.3724 L1544.2546,1044.9544 L1533.8379,1034.5378 L1376.0417,1034.5378 L1371.875,937.4567 L1367.7083,1034.5378 L1204.1667,1034.5378 A4.1667,4.1667 0 0 0 1200,1038.7044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1533.8379,1034.5378 L1533.8379,1042.8711 A2.0833,2.0833 0 0 0 1535.9212,1044.9544 L1544.2546,1044.9544 L1533.8379,1034.5378" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="288.324" x="1211.4583" y="1057.9305">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.8057" x="1211.4583" y="1073.6532">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.9629" x="1211.4583" y="1089.3758">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="458.3333,231.071,462.5,221.696,458.3333,225.8626,454.1667,221.696,458.3333,231.071" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M458.3333,156.2107 C458.3333,173.7419 458.3333,200.9456 458.3333,224.821" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2173.6944,380.6137,2164.6331,375.8027,2168.4988,380.2501,2164.0514,384.1157,2173.6944,380.6137" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M486.0424,262.5184 C691.3273,276.8834 1967.1542,366.1608 2167.4596,380.1774" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.4954" x="1542.7083" y="326.6805">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="1339.8972,906.1259,1330.7905,901.4015,1334.6984,905.8118,1330.2881,909.7197,1339.8972,906.1259" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M458.3333,287.6867 C458.3333,312.3847 458.3333,349.8698 458.3333,382.4544 C458.3333,382.4544 458.3333,382.4544 458.3333,756.4128 C458.3333,847.7496 1171.9682,895.9827 1333.6586,905.749" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6152" x="465.625" y="574.5972">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="1333.1