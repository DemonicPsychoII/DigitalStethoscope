<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1193.75px" preserveAspectRatio="none" style="width:6455px;height:1193px;" version="1.1" viewBox="0 0 6455 1193" width="6455.2083px" zoomAndPan="magnify"><title>MVP session and error transitions (Lung transitions optional)</title><defs><linearGradient id="gl4epz5t8u1xy0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#gl4epz5t8u1xy0)" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="610.9904" x="1916.1194" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="588.0737" x="1927.5777" y="54.2236">MVP session and error transitions (Lung transitions optional)</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="37" id="ent0002"><path d="M16.6667,99.9919 L16.6667,196.8424 A4.1667,4.1667 0 0 0 20.8333,201.0091 L421.4884,201.0091 A4.1667,4.1667 0 0 0 425.6551,196.8424 L425.6551,106.2419 L415.2384,95.8252 L20.8333,95.8252 A4.1667,4.1667 0 0 0 16.6667,99.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M415.2384,95.8252 L415.2384,104.1585 A2.0833,2.0833 0 0 0 417.3218,106.2419 L425.6551,106.2419 L415.2384,95.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="294.8242" x="28.125" y="119.401">Error latch (red LED) is independent of workflow state.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.1943" x="28.125" y="136.2712">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="376.6968" x="28.125" y="153.1413">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.3521" x="28.125" y="170.0114">Wi-Fi recovery does not require acknowledgement.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="258.606" x="28.125" y="186.8815">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="455.7292" cy="146.346" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.3569" x="428.6458" y="239.5752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="428.6458" x2="483.0027" y1="275.8728" y2="275.8728"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.1069" x="444.2708" y="262.0544">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="2596.3542" y="365.6169"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2596.3542" x2="2648.4375" y1="401.9145" y2="401.9145"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="2613.3601" y="388.0961">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="62.8276" x="603.6458" y="918.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="603.6458" x2="666.4734" y1="955.0395" y2="955.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5776" x="619.2708" y="941.2211">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="76.3336" x="1363.5417" y="617.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1363.5417" x2="1439.8753" y1="653.9978" y2="653.9978"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.0836" x="1379.1667" y="640.1794">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="60.0749" x="1380.7292" y="491.6585"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1380.7292" x2="1440.804" y1="527.9561" y2="527.9561"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="28.8249" x="1396.3542" y="514.1378">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="83.4279" x="1060.9375" y="743.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1060.9375" x2="1144.3654" y1="780.0395" y2="780.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="52.1779" x="1076.5625" y="766.2211">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0024"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="78.1687" x="3672.9167" y="918.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3672.9167" x2="3751.0854" y1="955.0395" y2="955.0395"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.9187" x="3688.5417" y="941.2211">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0026"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="71.522" x="2844.7917" y="1101.0335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2844.7917" x2="2916.3137" y1="1137.3311" y2="1137.3311"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="2860.4167" y="1123.5128">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0028"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="102.4058" x="4331.7708" y="1101.0335"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4331.7708" x2="4434.1766" y1="1137.3311" y2="1137.3311"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="71.1558" x="4347.3958" y="1123.5128">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="46" id="ent0003"><path d="M3769.7917,924.471 L3769.7917,943.221 L3751.3346,947.3877 L3769.7917,951.5544 L3769.7917,970.7113 A4.1667,4.1667 0 0 0 3773.9583,974.8779 L3974.6257,974.8779 A4.1667,4.1667 0 0 0 3978.7923,970.7113 L3978.7923,930.721 L3968.3757,920.3044 L3773.9583,920.3044 A4.1667,4.1667 0 0 0 3769.7917,924.471" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3968.3757,920.3044 L3968.3757,928.6377 A2.0833,2.0833 0 0 0 3970.459,930.721 L3978.7923,930.721 L3968.3757,920.3044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="154.5288" x="3781.25" y="943.8802">Start = Busy, visible activity.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="176.709" x="3781.25" y="960.7503">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="50" id="ent0006"><path d="M2935.4167,1097.9085 L2935.4167,1125.5127 L2916.8742,1129.6794 L2935.4167,1133.846 L2935.4167,1161.0189 A4.1667,4.1667 0 0 0 2939.5833,1165.1855 L3215.153,1165.1855 A4.1667,4.1667 0 0 0 3219.3197,1161.0189 L3219.3197,1104.1585 L3208.903,1093.7419 L2939.5833,1093.7419 A4.1667,4.1667 0 0 0 2935.4167,1097.9085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3208.903,1093.7419 L3208.903,1102.0752 A2.0833,2.0833 0 0 0 3210.9863,1104.1585 L3219.3197,1104.1585 L3208.903,1093.7419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6113" x="2946.875" y="1117.3177">Start cancels the delivery on both send paths;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.9077" x="2946.875" y="1134.1878">the result is lost. Start is never queued.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.9209" x="2946.875" y="1151.0579">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="55" id="ent0009"><path d="M1072.9167,890.6169 L1072.9167,1004.3376 A4.1667,4.1667 0 0 0 1077.0833,1008.5042 L1605.6193,1008.5042 A4.1667,4.1667 0 0 0 1609.786,1004.3376 L1609.786,896.8669 L1599.3693,886.4502 L1370.375,886.4502 L1144.2783,774.796 L1362.0417,886.4502 L1077.0833,886.4502 A4.1667,4.1667 0 0 0 1072.9167,890.6169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1599.3693,886.4502 L1599.3693,894.7835 A2.0833,2.0833 0 0 0 1601.4526,896.8669 L1609.786,896.8669 L1599.3693,886.4502" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="504.5776" x="1084.375" y="910.026">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.1846" x="1084.375" y="926.8962">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.3901" x="1084.375" y="943.7663">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="247.6074" x="1084.375" y="960.6364">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="323.2544" x="1084.375" y="977.5065">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.8291" x="1084.375" y="994.3766">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="63" id="ent0012"><path d="M464.0625,1081.2419 L464.0625,1178.0924 A4.1667,4.1667 0 0 0 468.2292,1182.2591 L801.709,1182.2591 A4.1667,4.1667 0 0 0 805.8757,1178.0924 L805.8757,1087.4919 L795.459,1077.0752 L639.0625,1077.0752 L634.8958,976.192 L630.7292,1077.0752 L468.2292,1077.0752 A4.1667,4.1667 0 0 0 464.0625,1081.2419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M795.459,1077.0752 L795.459,1085.4085 A2.0833,2.0833 0 0 0 797.5423,1087.4919 L805.8757,1087.4919 L795.459,1077.0752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.8247" x="475.5208" y="1100.651">Non-Wi-Fi faults halt according to current catalogue;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="249.1089" x="475.5208" y="1117.5212">during listening only audio faults halt at once,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="244.6167" x="475.5208" y="1134.3913">other halting faults wait for the manual Stop.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.1221" x="475.5208" y="1151.2614">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="309.5215" x="475.5208" y="1168.1315">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="455.7292,239.1208,459.8958,229.7458,455.7292,233.9125,451.5625,229.7458,455.7292,239.1208" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M455.7292,161.1877 C455.7292,179.2143 455.7292,208.0175 455.7292,232.8708" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2596.335,391.73,2587.2133,387.0347,2591.1352,391.4326,2586.7373,395.3544,2596.335,391.73" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M483.1238,270.83 C716.5448,284.1844 2362.1526,378.3321 2590.0952,391.3731" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.4263" x="1803.6458" y="336.0677">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="603.2769,933.2401,596.5028,925.5353,598.5456,931.0624,593.0185,933.1053,603.2769,933.2401" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M455.7292,297.3244 C455