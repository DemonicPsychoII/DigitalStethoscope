<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1079.1667px" preserveAspectRatio="none" style="width:4627px;height:1079px;" version="1.1" viewBox="0 0 4627 1079" width="4627.0833px" zoomAndPan="magnify"><title>MVP session and error transitions (Lung transitions optional)</title><defs><linearGradient id="g10sz3ccsopi2m0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#g10sz3ccsopi2m0)" height="47.168" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="744.6777" x="1652.9215" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="721.7611" x="1664.3799" y="51.6296">MVP session and error transitions (Lung transitions optional)</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="29" id="ent0002"><path d="M16.6667,96.1263 L16.6667,181.3802 A4.1667,4.1667 0 0 0 20.8333,185.5469 L480.7658,185.5469 A4.1667,4.1667 0 0 0 484.9325,181.3802 L484.9325,102.3763 L474.5158,91.9596 L20.8333,91.9596 A4.1667,4.1667 0 0 0 16.6667,96.1263" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M474.5158,91.9596 L474.5158,100.293 A2.0833,2.0833 0 0 0 476.5991,102.3763 L484.9325,102.3763 L474.5158,91.9596" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="341.2659" x="28.125" y="113.9791">Error latch (red LED) is independent of workflow state.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="431.2561" x="28.125" y="128.5299">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="435.9741" x="28.125" y="143.0806">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="320.0439" x="28.125" y="157.6314">Wi-Fi recovery does not require acknowledgement.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="300.7996" x="28.125" y="172.1822">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="514.5833" cy="136.7513" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="55.0049" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="57.6243" x="485.9375" y="224.2513"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="485.9375" x2="543.5618" y1="258.4229" y2="258.4229"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="26.3743" x="501.5625" y="245.3039">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="55.0049" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.1357" x="2528.125" y="345.0846"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2528.125" x2="2580.2607" y1="379.2562" y2="379.2562"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="20.8857" x="2543.75" y="366.1372">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="55.0049" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="67.2139" x="684.8958" y="854.9805"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="684.8958" x2="752.