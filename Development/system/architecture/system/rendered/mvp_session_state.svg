<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1114.5833px" preserveAspectRatio="none" style="width:3648px;height:1114px;" version="1.1" viewBox="0 0 3648 1114" width="3648.9583px" zoomAndPan="magnify"><title>MVP session and error transitions</title><defs><linearGradient id="gzm65xiu4v75k0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#gzm65xiu4v75k0)" height="49.1211" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="360.9701" x="1382.5358" y="20.8333"/><text fill="#2a9fd6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="338.0534" x="1393.9941" y="53.9185">MVP session and error transitions</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="29" id="ent0002"><path d="M16.6667,98.0794 L16.6667,189.1927 A4.1667,4.1667 0 0 0 20.8333,193.3594 L425.5168,193.3594 A4.1667,4.1667 0 0 0 429.6834,189.1927 L429.6834,104.3294 L419.2668,93.9128 L20.8333,93.9128 A4.1667,4.1667 0 0 0 16.6667,98.0794" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><path d="M419.2668,93.9128 L419.2668,102.2461 A2.0833,2.0833 0 0 0 421.3501,104.3294 L429.6834,104.3294 L419.2668,93.9128" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="300.1343" x="28.125" y="117.3055">Error latch (red LED) is independent of workflow state.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="377.2583" x="28.125" y="133.0282">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="380.7251" x="28.125" y="148.7508">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.0679" x="28.125" y="164.4735">Wi-Fi recovery does not require acknowledgement.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="261.2" x="28.125" y="180.1961">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="458.3333" cy="141.3086" fill="#9933cc" rx="10.4167" ry="10.4167" style="stroke:#55b2de;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="54.8213" x="430.7292" y="231.4128"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="430.7292" x2="485.5504" y1="266.6585" y2="266.6585"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.5713" x="446.3542" y="253.7242">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="52.0833" x="2234.375" y="355.3711"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="2234.375" x2="2286.4583" y1="390.6169" y2="390.6169"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.4743" x="2251.1795" y="377.6825">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="63.0961" x="605.7292" y="880.8919"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="605.7292" x2="668.8253" y1="916.1377" y2="916.1377"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.8461" x="621.3542" y="903.2033">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="77.1169" x="1051.0417" y="603.2878"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="1051.0417" x2="1128.1586" y1="638.5335" y2="638.5335"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.8669" x="1066.6667" y="625.5992">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="61.1827" x="1058.8542" y="479.3294"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="1058.8542" x2="1120.0368" y1="514.5752" y2="514.5752"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="29.9327" x="1074.4792" y="501.6408">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="84.7483" x="1647.3958" y="727.2461"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="1647.3958" x2="1732.1442" y1="762.4919" y2="762.4919"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="53.4983" x="1663.0208" y="749.5575">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="80.9326" x="2597.9167" y="880.8919"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="2597.9167" x2="2678.8493" y1="916.1377" y2="916.1377"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="49.6826" x="2613.5417" y="903.2033">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="73.3012" x="2427.0833" y="1040.2669"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="2427.0833" x2="2500.3845" y1="1075.5127" y2="1075.5127"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="42.0512" x="2442.7083" y="1062.5783">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#2a9fd6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55b2de;stroke-width:1.0417;" width="106.395" x="3010.4167" y="1040.2669"/><line style="stroke:#55b2de;stroke-width:1.0417;" x1="3010.4167" x2="3116.8116" y1="1075.5127" y2="1075.5127"/><text fill="#ffffff" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="75.145" x="3026.0417" y="1062.5783">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="38" id="ent0003"><path d="M2697.9167,887.1419 L2697.9167,904.8503 L2679.366,909.0169 L2697.9167,913.1836 L2697.9167,931.0872 A4.1667,4.1667 0 0 0 2702.0833,935.2539 L2904.6244,935.2539 A4.1667,4.1667 0 0 0 2908.7911,931.0872 L2908.7911,893.3919 L2898.3744,882.9753 L2702.0833,882.9753 A4.1667,4.1667 0 0 0 2697.9167,887.1419" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><path d="M2898.3744,882.9753 L2898.3744,891.3086 A2.0833,2.0833 0 0 0 2900.4578,893.3919 L2908.7911,893.3919 L2898.3744,882.9753" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="155.2612" x="2709.375" y="906.368">Start = Busy, visible activity.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="178.5828" x="2709.375" y="922.0907">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="42" id="ent0006"><path d="M2518.75,1046.5169 L2518.75,1064.2253 L2500.2136,1068.3919 L2518.75,1072.5586 L2518.75,1090.4622 A4.1667,4.1667 0 0 0 2522.9167,1094.6289 L2769.2322,1094.6289 A4.1667,4.1667 0 0 0 2773.3988,1090.4622 L2773.3988,1052.7669 L2762.9822,1042.3503 L2522.9167,1042.3503 A4.1667,4.1667 0 0 0 2518.75,1046.5169" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><path d="M2762.9822,1042.3503 L2762.9822,1050.6836 A2.0833,2.0833 0 0 0 2765.0655,1052.7669 L2773.3988,1052.7669 L2762.9822,1042.3503" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3572" x="2530.2083" y="1065.743">Same Busy rule during both send paths.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3511" x="2530.2083" y="1081.4657">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="46" id="ent0009"><path d="M1410.9375,855.3711 L1410.9375,962.207 A4.1667,4.1667 0 0 0 1415.1042,966.3737 L1964.2883,966.3737 A4.1667,4.1667 0 0 0 1968.455,962.207 L1968.455,861.6211 L1958.0383,851.2044 L1693.75,851.2044 L1689.5833,783.5091 L1685.4167,851.2044 L1415.1042,851.2044 A4.1667,4.1667 0 0 0 1410.9375,855.3711" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><path d="M1958.0383,851.2044 L1958.0383,859.5378 A2.0833,2.0833 0 0 0 1960.1217,861.6211 L1968.455,861.6211 L1958.0383,851.2044" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="525.2258" x="1422.3958" y="874.5972">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="341.8701" x="1422.3958" y="890.3198">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="243.1641" x="1422.3958" y="906.0425">Wi-Fi-only faults preserve functioning audio.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.9595" x="1422.3958" y="921.7651">Other faults follow catalogue halt/clear rules.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="325.824" x="1422.3958" y="937.4878">Normal-fault indication is latched separately from workflow;</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.7373" x="1422.3958" y="953.2104">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="54" id="ent0012"><path d="M465.625,1038.7044 L465.625,1098.3724 A4.1667,4.1667 0 0 0 469.7917,1102.5391 L805.7129,1102.5391 A4.1667,4.1667 0 0 0 809.8796,1098.3724 L809.8796,1044.9544 L799.4629,1034.5378 L641.6667,1034.5378 L637.5,937.4567 L633.3333,1034.5378 L469.7917,1034.5378 A4.1667,4.1667 0 0 0 465.625,1038.7044" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><path d="M799.4629,1034.5378 L799.4629,1042.8711 A2.0833,2.0833 0 0 0 801.5462,1044.9544 L809.8796,1044.9544 L799.4629,1034.5378" fill="#9933cc" style="stroke:#ad5cd6;stroke-width:1.0417;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="288.324" x="477.0833" y="1057.9305">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.8057" x="477.0833" y="1073.6532">Mute; invalidate incomplete work; block Start.</text><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.9629" x="477.0833" y="1089.3758">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2a9fd6" points="458.3333,231.071,462.5,221.696,458.3333,225.8626,454.1667,221.696,458.3333,231.071" style="stroke:#2a9fd6;stroke-width:1.0417;"/><path d="M458.3333,156.2107 C458.3333,173.7419 458.3333,200.9456 458.3333,224.821" fill="none" style="stroke:#2a9fd6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2a9fd6" points="2234.1245,380.6763,2225.052,375.8865,2228.928,380.3248,2224.4897,384.2009,2234.1245,380.6763" style="stroke:#2a9fd6;stroke-width:1.0417;"/><path d="M486.2781,262.4693 C696.6843,276.6991 2023.4614,366.4291 2227.8888,380.2546" fill="none" style="stroke:#2a9fd6;stroke-width:3.125;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.4954" x="1580.2083" y="326.6805">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2a9fd6" points="605.646,904.2139,596.8687,898.9025,600.4789,903.5596,595.8218,907.1698,605.646,904.2139" style="stroke:#2a9fd6;stroke-width:1.0417;"/><path d="M430.5846,260.6585 C361.9194,262.4563 189.5833,277.4299 189.5833,382.4544 C189.5833,382.4544 189.5833,382.4544 189.5833,756.4128 C189.5833,844.3565 497.1149,890.4705 599.4455,903.4287" fill="none" style="stroke:#2a9fd6;stroke-width:3.125;"/><text fill="#ffffff" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6152" x="196.875" y="574.5972">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2a9fd6" points="1050.9716,619.0317,1043.2007,612.3335,1045.9855,617.5265,1040.7925,620.3113,1050.971