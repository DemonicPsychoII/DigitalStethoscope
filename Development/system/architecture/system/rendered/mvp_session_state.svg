eued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="46" id="ent0006"><path d="M2863.0208,1073.4294 L2863.0208,1092.1794 L2843.9209,1096.346 L2863.0208,1100.5127 L2863.0208,1119.6696 A4.1667,4.1667 0 0 0 2867.1875,1123.8363 L3110.5794,1123.8363 A4.1667,4.1667 0 0 0 3114.7461,1119.6696 L3114.7461,1079.6794 L3104.3294,1069.2627 L2867.1875,1069.2627 A4.1667,4.1667 0 0 0 2863.0208,1073.4294" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3104.3294,1069.2627 L3104.3294,1077.596 A2.0833,2.0833 0 0 0 3106.4128,1079.6794 L3114.7461,1079.6794 L3104.3294,1069.2627" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="219.4336" x="2874.4792" y="1092.8385">Same Busy rule during both send paths.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.9209" x="2874.4792" y="1109.7087">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="50" id="ent0009"><path d="M1380.2083,873.9502 L1380.2083,987.6709 A4.1667,4.1667 0 0 0 1384.375,991.8376 L1912.911,991.8376 A4.1667,4.1667 0 0 0 1917.0776,987.6709 L1917.0776,880.2002 L1906.661,869.7835 L1652.6042,869.7835 L1648.4375,801.3637 L1644.2708,869.7835 L1384.375,869.7835 A4.1667,4.1667 0 0 0 1380.2083,873.9502" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1906.661,869.7835 L1906.661,878.1169 A2.0833,2.0833 0 0 0 1908.7443,880.2002 L1917.0776,880.2002 L1906.661,869.7835" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="504.5776" x="1391.6667" y="893.3594">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="339.1846" x="1391.6667" y="910.2295">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.3901" x="1391.6667" y="927.0996">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="247.6074" x="1391.6667" y="943.9697">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="323.2544" x="1391.6667" y="960.8398">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.8291" x="1391.6667" y="977.71">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="58" id="ent0012"><path d="M463.0208,1064.5752 L463.0208,1127.6855 A4.1667,4.1667 0 0 0 467.1875,1131.8522 L800.6673,1131.8522 A4.1667,4.1667 0 0 0 804.834,1127.6855 L804.834,1070.8252 L794.4173,1060.4085 L638.0208,1060.4085 L633.8542,959.5053 L629.6875,1060.4085 L467.1875,1060.4085 A4.1667,4.1667 0 0 0 463.0208,1064.5752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M794.4173,1060.4085 L794.4173,1068.7419 A2.0833,2.0833 0 0 0 796.5007,1070.8252 L804.834,1070.8252 L794.4173,1060.4085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.8247" x="474.4792" y="1083.9844">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.1221" x="474.4792" y="1100.8545">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="309.5215" x="474.4792" y="1117.7246">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="455.7292,239.1208,459.8958,229.7458,455.7292,233.9125,451.5625,229.7458,455.7292,239.1208" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M455.7292,161.1877 C455.7292,179.2143 455.7292,208.0175 455.7292,232.8708" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2289.8911,391.4717,2280.8138,386.691,2284.6943,391.1254,2280.2598,395.0059,2289.8911,391.4717" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M483.1077,271.0869 C695.8004,285.2585 2075.1422,377.1631 2283.6549,391.0562" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.4263" x="1614.0625" y="336.0677">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="602.504,925.6271,593.7854,920.2199,597.3444,924.9162,592.6481,928.4752,602.504,925.6271" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M428.5866,269.5433 C360.5274,271.8191 188.0208,287.9685 188.0208,393.221 C188.0208,393.221 188.0208,393.221 188.0208,773.4294 C188.0208,861.3931 494.8314,910.7928 596.3125,924.7741" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="229.4312" x="195.3125" y="588.151">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="1126.1144,643.9115,1135.6597,647.6717,1131