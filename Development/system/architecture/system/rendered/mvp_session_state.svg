<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1114.5833px" preserveAspectRatio="none" style="width:4633px;height:1114px;" version="1.1" viewBox="0 0 4633 1114" width="4633.3333px" zoomAndPan="magnify"><title>MVP session and error transitions (Lung transitions optional)</title><defs><linearGradient id="g1kx9f3zc6rv6y0" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="5"><rect fill="url(#g1kx9f3zc6rv6y0)" height="49.1211" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="630.6132" x="1634.6934" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="607.6965" x="1646.1517" y="53.9185">MVP session and error transitions (Lung transitions optional)</text></g><g class="entity" data-qualified-name="NormalFaultIndication" data-source-line="31" id="ent0002"><path d="M16.6667,98.0794 L16.6667,189.1927 A4.1667,4.1667 0 0 0 20.8333,193.3594 L425.5168,193.3594 A4.1667,4.1667 0 0 0 429.6834,189.1927 L429.6834,104.3294 L419.2668,93.9128 L20.8333,93.9128 A4.1667,4.1667 0 0 0 16.6667,98.0794" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M419.2668,93.9128 L419.2668,102.2461 A2.0833,2.0833 0 0 0 421.3501,104.3294 L429.6834,104.3294 L419.2668,93.9128" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="300.1343" x="28.125" y="117.3055">Error latch (red LED) is independent of workflow state.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="377.2583" x="28.125" y="133.0282">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="380.7251" x="28.125" y="148.7508">Short press acknowledges where catalogue permits; no implicit retry.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.0679" x="28.125" y="164.4735">Wi-Fi recovery does not require acknowledgement.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="261.2" x="28.125" y="180.1961">Preserve the current workflow; no implicit Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="458.3333" cy="141.3086" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.8213" x="430.7292" y="231.4128"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="430.7292" x2="485.5504" y1="266.6585" y2="266.6585"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.5713" x="446.3542" y="253.7242">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="2173.9583" y="355.3711"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2173.9583" x2="2226.0417" y1="390.6169" y2="390.6169"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.4743" x="2190.7628" y="377.6825">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="56.0791" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="63.0961" x="1331.7708" y="880.8919"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1331.7708" x2=