ngthAdjust="spacing" textLength="55.7755" x="2926.0417" y="876.033">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0024"><rect fill="#2A9FD6" height="55.0049" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="77.8275" x="2594.2708" y="1007.0638"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2594.2708" x2="2672.0983" y1="1041.2354" y2="1041.2354"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.5775" x="2609.8958" y="1028.1164">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0026"><rect fill="#2A9FD6" height="55.0049" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="115.8503" x="3925.5208" y="1007.0638"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3925.5208" x2="4041.3712" y1="1041.2354" y2="1041.2354"/><text fill="#FFFFFF" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="84.6003" x="3941.1458" y="1028.1164">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="38" id="ent0003"><path d="M3016.6667,861.7513 L3016.6667,878.418 L2998.1628,882.5846 L3016.6667,886.7513 L3016.6667,903.3529 A4.1667,4.1667 0 0 0 3020.8333,907.5195 L3247.642,907.5195 A4.1667,4.1667 0 0 0 3251.8087,903.3529 L3251.8087,868.0013 L3241.392,857.5846 L3020.8333,857.5846 A4.1667,4.1667 0 0 0 3016.6667,861.7513" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3241.392,857.5846 L3241.392,865.918 A2.0833,2.0833 0 0 0 3243.4753,868.0013 L3251.8087,868.0013 L3241.392,857.5846" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="181.2866" x="3028.125" y="879.6041">Start = Busy, visible activity.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="202.8503" x="3028.125" y="894.1549">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="42" id="ent0006"><path d="M2691.1458,1013.8346 L2691.1458,1030.5013 L2672.7865,1034.668 L2691.1458,1038.8346 L2691.1458,1055.4362 A4.1667,4.1667 0 0 0 2695.3125,1059.6029 L2970.9676,1059.6029 A4.1667,4.1667 0 0 0 2975.1343,1055.4362 L2975.1343,1020.0846 L2964.7176,1009.668 L2695.3125,1009.668 A4.1667,4.1667 0 0 0 2691.1458,1013.8346" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2964.7176,1009.668 L2964.7176,1018.0013 A2.0833,2.0833 0 0 0 2966.8009,1020.0846 L2975.1343,1020.0846 L2964.7176,1009.668" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6296" x="2702.6042" y="1031.6874">Same Busy rule during both send paths.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6968" x="2702.6042" y="1046.2382">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="46" id="ent0009"><path d="M1536.4583,832.5846 L1536.4583,932.3893 A4.1667,4.1667 0 0 0 1540.625,936.556 L2138.8997,936.556 A4.1667,4.1667 0 0 0 2143.0664,932.3893 L2143.0664,838.8346 L2132.6497,828.418 L1843.75,828.418 L1839.5833,762.883 L1835.4167,828.418 L1540.625,828.418 A4.1667,4.1667 0 0 0 1536.4583,832.5846" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2132.6497,828.418 L2132.6497,836.7513 A2.0833,2.0833 0 0 0 2134.7331,838.8346 L2143.0664,838.8346 L2132.6497,828.418" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="574.3164" x="1547.9167" y="850.4374">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="396.2219" x="1547.9167" y="864.9882">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="276.9165" x="1547.9167" y="879.539">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="282.5684" x="1547.9167" y="894.0898">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="375.5005" x="1547.9167" y="908.6405">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="348.6206" x="1547.9167" y="923.1913">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="54" id="ent0012"><path d="M524.4792,1006.543 L524.4792,1062.6953 A4.1667,4.1667 0 0 0 528.6458,1066.862 L908.4391,1066.862 A4.1667,4.1667 0 0 0 912.6058,1062.6953 L912.6058,1012.793 L902.1891,1002.3763 L722.9167,1002.3763 L718.75,910.4433 L714.5833,1002.3763 L528.6458,1002.3763 A4.1667,4.1667 0 0 0 524.4792,1006.543" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M902.1891,1002.3763 L902.1891,1010.7096 A2.0833,2.0833 0 0 0 904.2725,1012.793 L912.6058,1012.793 L902.1891,1002.3763" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="328.4302" x="535.9375" y="1024.3958">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="288.8794" x="535.9375" y="1038.9465">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="355.835" x="535.9375" y="1053.4973">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="514.5833,223.9147,518.75,214.5397,514.5833,218.7064,510.4167,214.5397,514.5833,223.9147" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M514.5833,151.7486 C514.5833,168.8528 514.5833,194.6475 514.5833,217.6647" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2527.7852,370.1111,2518.6682,365.4066,2522.5857,369.8084,2518.1838,373.7258,2527.7852,370.1111" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M543.4155,254.5758 C773.4016,267.9662 2301.0518,356.9101 2521.5457,369.7479" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="256.3843" x="1723.9583" y="317.1041">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="684.8873,879.1527,675.8681,874.2634,679.6951,878.7441,675.2144,882.5711,684.8873,879.1527" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M485.8181,257.9113 C410.7305,271.8117 214.5833,313.6714 214.5833,371.6471 C214.5833,371.6471 214.5833,371.6471 214.5833,736.2305 C214.5833,834.3821 565.6162,869.7676 678.6566,878.6624" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="261.7737" x="221.875" y="558.7708">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="1184.9833,603.4688,1176.8469,597