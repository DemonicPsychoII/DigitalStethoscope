y="922.0907">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="46" id="ent0006"><path d="M2734.375,1046.5169 L2734.375,1064.2253 L2715.8386,1068.3919 L2734.375,1072.5586 L2734.375,1090.4622 A4.1667,4.1667 0 0 0 2738.5417,1094.6289 L2984.8572,1094.6289 A4.1667,4.1667 0 0 0 2989.0238,1090.4622 L2989.0238,1052.7669 L2978.6072,1042.3503 L2738.5417,1042.3503 A4.1667,4.1667 0 0 0 2734.375,1046.5169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2978.6072,1042.3503 L2978.6072,1050.6836 A2.0833,2.0833 0 0 0 2980.6905,1052.7669 L2989.0238,1052.7669 L2978.6072,1042.3503" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3572" x="2745.8333" y="1065.743">Same Busy rule during both send paths.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="222.3511" x="2745.8333" y="1081.4657">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="50" id="ent0009"><path d="M1363.0208,855.3711 L1363.0208,962.207 A4.1667,4.1667 0 0 0 1367.1875,966.3737 L1916.3717,966.3737 A4.1667,4.1667 0 0 0 1920.5383,962.207 L1920.5383,861.6211 L1910.1217,851.2044 L1645.8333,851.2044 L1641.6667,783.5091 L1637.5,851.2044 L1367.1875,851.2044 A4.1667,4.1667 0 0 0 1363.0208,855.3711" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1910.1217,851.2044 L1910.1217,859.5378 A2.0833,2.0833 0 0 0 1912.205,861.6211 L1920.5383,861.6211 L1910.1217,851.2044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="525.2258" x="1374.4792" y="874.5972">Reject mode/context changes with SESSION_CONTEXT_CHANGE; halt/restart per catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="341.8701" x="1374.4792" y="890.3198">Never apply the rejected identity; invalidate halted acquisition.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="243.1641" x="1374.4792" y="906.0425">Wi-Fi-only faults preserve functioning audio.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="245.9595" x="1374.4792" y="921.7651">Other faults follow catalogue halt/clear rules.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="325.824" x="1374.4792" y="937.4878">Normal-fault indication is latched separately from workflow;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.7373" x="1374.4792" y="953.2104">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="58" id="ent0012"><path d="M465.625,1038.7044 L465.625,1098.3724 A4.1667,4.1667 0 0 0 469.7917,1102.5391 L805.7129,1102.5391 A4.1667,4.1667 0 0 0 809.8796,1098.3724 L809.8796,1044.9544 L799.4629,1034.5378 L641.6667,1034.5378 L637.5,937.4567 L633.3333,1034.5378 L469.7917,1034.5378 A4.1667,4.1667 0 0 0 465.625,1038.7044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M799.4629,1034.5378 L799.4629,1042.8711 A2.0833,2.0833 0 0 0 801.5462,1044.9544 L809.8796,1044.9544 L799.4629,1034.5378" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="288.324" x="477.0833" y="1057.9305">Non-Wi-Fi faults halt according to current catalogue.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="250.8057" x="477.0833" y="1073.6532">Mute; invalidate incomplete work; block Start.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="311.9629" x="477.0833" y="1089.3758">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#2A9FD6" points="458.3333,231.071,462.5,221.696,458.3333,225.8626,454.1667,221.696,458.3333,231.071" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M458.3333,156.2107 C458.3333,173.7419 458.3333,200.9456 458.3333,224.821" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#2A9FD6" points="2289.4412,380.7363,2280.3592,375.9647,2284.2441,380.3952,2279.8135,384.2801,2289.4412,380.7363" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M486.0296,262.3968 C699.5846,276.4103 2075.2529,366.6813 2283.2047,380.327" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="226.4954" x="1614.5833" y="326.6805">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#2A9FD6" points="605.646,904.2139,596.8687,898.9025,600.4789,903.5596,595.8218,907.1698,605.646,904.2139" style="stroke:#2A9FD6;stroke-width:1.0417;"/><path d="M430.5846,260.6585 C361.9194,262.4563 189.5833,277.4299 189.5833,382.4544 C189.5833,382.4544 189.5833,382.4544 189.5833,756.4128 C189.5833,844.3565 497.1149,890.4705 599.4455,903.4287" fill="none" style="stroke:#2A9FD6;stroke-width:3.125;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.6152" x="196.875" y="574.5972">non-Wi-Fi startup check fails / Error, mute</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk10"><polygon fill="#2A9FD6" points="1128.4952,625.463,1