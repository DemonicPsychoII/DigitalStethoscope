<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1337.5px" preserveAspectRatio="none" style="width:6444px;height:1337px;background:#0B1018;" version="1.1" viewBox="0 0 6444 1337" width="6444.7917px" zoomAndPan="magnify"><title>Session and error transitions</title><defs/><g><rect fill="#0B1018" height="1337.5" style="stroke:none;stroke-width:1.0417;" width="6444.7917" x="0" y="0"/><g class="title" data-source-line="11"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="304.4108" x="2213.4196" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="281.4941" x="2224.8779" y="54.2236">Session and error transitions</text></g><g class="entity" data-qualified-name="ErrorIndication" data-source-line="43" id="ent0002"><path d="M16.6667,99.9919 L16.6667,196.8424 A4.1667,4.1667 0 0 0 20.8333,201.0091 L418.986,201.0091 A4.1667,4.1667 0 0 0 423.1527,196.8424 L423.1527,106.2419 L412.736,95.8252 L20.8333,95.8252 A4.1667,4.1667 0 0 0 16.6667,99.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M412.736,95.8252 L412.736,104.1585 A2.0833,2.0833 0 0 0 414.8193,106.2419 L423.1527,106.2419 L412.736,95.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="294.8242" x="28.125" y="119.401">Error latch (red LED) is independent of workflow state.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.1943" x="28.125" y="136.2712">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.9995" x="28.125" y="153.1413">Short press acknowledges non-restart faults; no implicit retry.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.3521" x="28.125" y="170.0114">Wi-Fi recovery does not require acknowledgement.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="366.7358" x="28.125" y="186.8815">Acknowledgement keeps the current workflow and causes no Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="12" id="ent0002"><ellipse cx="452.0833" cy="146.346" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.3569" x="425" y="239.5752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="425" x2="479.3569" y1="275.8728" y2="275.8728"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.1069" x="440.625" y="262.0544">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="3128.125" y="365.6169"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3128.125" x2="3180.2083" y1="401.9145" y2="401.9145"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="3145.1309" y="388.0961">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="62.8276" x="640.625" y="1117.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="640.625" x2="703.4526" y1="1153.9978" y2="1153.9978"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5776" x="656.25" y="1140.1794">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="76.3336" x="1622.3958" y="634.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1622.3958" x2="1698.7295" y1="670.6645" y2="670.6645"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.0836" x="1638.0208" y="656.8461">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="60.0749" x="1614.5833" y="508.3252"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1614.5833" x2="1674.6582" y1="544.6228" y2="544.6228"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="28.8249" x="1630.2083" y="530.8044">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="83.4279" x="1382.2917" y="760.4085"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1382.2917" x2="1465.7196" y1="796.7061" y2="796.7061"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="52.1779" x="1397.9167" y="782.8878">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="78.1687" x="3756.7708" y="943.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="3756.7708" x2="3834.9396" y1="980.0395" y2="980.0395"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.9187" x="3772.3958" y="966.2211">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0026"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="71.522" x="2941.1458" y="1117.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2941.1458" x2="3012.6678" y1="1153.9978" y2="1153.9978"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="2956.7708" y="1140.1794">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0028"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="102.4058" x="4619.7917" y="1117.7002"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4619.7917" x2="4722.1975" y1="1153.9978" y2="1153.9978"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="71.1558" x="4635.4167" y="1140.1794">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="52" id="ent0003"><path d="M3853.6458,949.471 L3853.6458,968.221 L3835.1888,972.3877 L3853.6458,976.5544 L3853.6458,995.7113 A4.1667,4.1667 0 0 0 3857.8125,999.8779 L4058.4798,999.8779 A4.1667,4.1667 0 0 0 4062.6465,995.7113 L4062.6465,955.721 L4052.2298,945.3044 L3857.8125,945.3044 A4.1667,4.1667 0 0 0 3853.6458,949.471" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M4052.2298,945.3044 L4052.2298,953.6377 A2.0833,2.0833 0 0 0 4054.3132,955.721 L4062.6465,955.721 L4052.2298,945.3044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="154.5288" x="3865.1042" y="968.8802">Start = Busy, visible activity.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="176.709" x="3865.1042" y="985.7503">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="56" id="ent0006"><path d="M3031.7708,1114.5752 L3031.7708,1142.1794 L3013.2284,1146.346 L3031.7708,1150.5127 L3031.7708,1177.6855 A4.1667,4.1667 0 0 0 3035.9375,1181.8522 L3311.5072,1181.8522 A4.1667,4.1667 0 0 0 3315.6738,1177.6855 L3315.6738,1120.8252 L3305.2572,1110.4085 L3035.9375,1110.4085 A4.1667,4.1667 0 0 0 3031.7708,1114.5752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3305.2572,1110.4085 L3305.2572,1118.7419 A2.0833,2.0833 0 0 0 3307.3405,1120.8252 L3315.6738,1120.8252 L3305.2572,1110.4085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6113" x="3043.2292" y="1133.9844">Start cancels the delivery on both send paths;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.9077" x="3043.2292" y="1150.8545">the result is lost. Start is never queued.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.9209" x="3043.2292" y="1167.7246">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="61" id="ent0009"><path d="M1415.1042,907.2835 L1415.1042,1037.8743 A4.1667,4.1667 0 0 0 1419.2708,1042.041 L1890.9953,1042.041 A4.1667,4.1667 0 0 0 1895.1619,1037.8743 L1895.1619,913.5335 L1884.7453,903.1169 L1572.2428,903.1169 L1459.5844,818.0191 L1563.9094,903.1169 L1419.2708,903.1169 A4.1667,4.1667 0 0 0 1415.1042,907.2835" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1884.7453,903.1169 L1884.7453,911.4502 A2.0833,2.0833 0 0 0 1886.8286,913.5335 L1895.1619,913.5335 L1884.7453,903.1169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="372.937" x="1426.5625" y="926.6927">A session context change is latched silently and listening continues;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="445.3003" x="1426.5625" y="943.5628">after the manual Stop the device halts, discards the result and requires a restart.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="447.7661" x="1426.5625" y="960.4329">The device never applies the rejected identity and invalidates a halted acquisition.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.3901" x="1426.5625" y="977.3031">Wi-Fi-only faults preserve functioning audio.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="211.6699" x="1426.5625" y="994.1732">Audio faults halt listening immediately.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.2856" x="1426.5625" y="1011.0433">The error indication is latched separately from workflow;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.8291" x="1426.5625" y="1027.9134">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="70" id="ent0012"><path d="M479.6875,1224.9919 L479.6875,1321.8424 A4.1667,4.1667 0 0 0 483.8542,1326.0091 L859.5459,1326.0091 A4.1667,4.1667 0 0 0 863.7126,1321.8424 L863.7126,1231.2419 L853.2959,1220.8252 L676.0417,1220.8252 L671.875,1175.1292 L667.7083,1220.8252 L483.8542,1220.8252 A4.1667,4.1667 0 0 0 479.6875,1224.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M853.2959,1220.8252 L853.2959,1229.1585 A2.0833,2.0833 0 0 0 855.3792,1231.2419 L863.7126,1231.2419 L853.2959,1220.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="113.8306" x="491.1458" y="1244.401">Non-Wi-Fi faults halt;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="249.1089" x="491.1458" y="1261.2712">during listening only audio faults halt at once,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="244.6167" x="491.1458" y="1278.1413">other halting faults wait for the manual Stop.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="351.7334" x="491.1458" y="1295.0114">The device mutes, invalidates incomplete work and blocks Start.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="309.5215" x="491.1458" y="1311.8815">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="452.0833,239.1208,456.25,229.7458,452.0833,233.9125,447.9167,229.7458,452.0833,239.1208" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M452.0833,161.1877 C452.0833,179.2143 452.0833,208.0175 452.0833,232.8708" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#A9B8CA" points="3128.0503,392.0229,3118.8761,387.431,3122.8475,391.7843,3118.4942,395.7556,3128.0503,392.0229" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M479.2652,270.5097 C744.5492,282.6796 2861.5522,379.7973 3121.8069,391.7365" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.4263" x="2131.25" y="336.0677">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#A9B8CA" points="640.3842,1136.7683,632.639,1130.0405,635.4039,1135.2441,630.2003,1138.0