<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1227.0833px" preserveAspectRatio="none" style="width:6246px;height:1227px;background:#0B1018;" version="1.1" viewBox="0 0 6246 1227" width="6246.875px" zoomAndPan="magnify"><title>Session and error transitions</title><defs/><g><rect fill="#0B1018" height="1227.0833" style="stroke:none;stroke-width:1.0417;" width="6246.875" x="0" y="0"/><g class="title" data-source-line="11"><rect fill="none" height="51.0335" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="304.4108" x="2062.8988" y="20.8333"/><text fill="#E6EDF7" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="281.4941" x="2074.3571" y="54.2236">Session and error transitions</text></g><g class="entity" data-qualified-name="ErrorIndication" data-source-line="42" id="ent0002"><path d="M16.6667,99.9919 L16.6667,196.8424 A4.1667,4.1667 0 0 0 20.8333,201.0091 L418.986,201.0091 A4.1667,4.1667 0 0 0 423.1527,196.8424 L423.1527,106.2419 L412.736,95.8252 L20.8333,95.8252 A4.1667,4.1667 0 0 0 16.6667,99.9919" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M412.736,95.8252 L412.736,104.1585 A2.0833,2.0833 0 0 0 414.8193,106.2419 L423.1527,106.2419 L412.736,95.8252" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="294.8242" x="28.125" y="119.401">Error latch (red LED) is independent of workflow state.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="374.1943" x="28.125" y="136.2712">Several errors: LEDs show the highest priority, then the first latched.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="336.9995" x="28.125" y="153.1413">Short press acknowledges non-restart faults; no implicit retry.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="273.3521" x="28.125" y="170.0114">Wi-Fi recovery does not require acknowledgement.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="366.7358" x="28.125" y="186.8815">Acknowledgement keeps the current workflow and causes no Start.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="12" id="ent0002"><ellipse cx="452.0833" cy="146.346" fill="#9933CC" rx="10.4167" ry="10.4167" style="stroke:#55B2DE;stroke-width:1.0417;"/></g><g class="entity" data-qualified-name="Boot" id="ent0003"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="54.3569" x="425" y="239.5752"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="425" x2="479.3569" y1="275.8728" y2="275.8728"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="23.1069" x="440.625" y="262.0544">Boot</text></g><g class="entity" data-qualified-name="Idle" id="ent0005"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="52.0833" x="2321.875" y="365.6169"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2321.875" x2="2373.9583" y1="401.9145" y2="401.9145"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="18.0715" x="2338.8809" y="388.0961">Idle</text></g><g class="entity" data-qualified-name="Muted" id="ent0007"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="62.8276" x="613.5417" y="943.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="613.5417" x2="676.3692" y1="980.0395" y2="980.0395"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="31.5776" x="629.1667" y="966.2211">Muted</text></g><g class="entity" data-qualified-name="Listening" id="ent0009"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="76.3336" x="1167.1875" y="634.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1167.1875" x2="1243.5211" y1="670.6645" y2="670.6645"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="45.0836" x="1182.8125" y="656.8461">Listening</text></g><g class="entity" data-qualified-name="Portal" id="ent0011"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="60.0749" x="1159.375" y="508.3252"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1159.375" x2="1219.4499" y1="544.6228" y2="544.6228"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="28.8249" x="1175" y="530.8044">Portal</text></g><g class="entity" data-qualified-name="Measuring" id="ent0016"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="83.4279" x="1221.875" y="760.4085"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="1221.875" x2="1305.3029" y1="796.7061" y2="796.7061"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="52.1779" x="1237.5" y="782.8878">Measuring</text></g><g class="entity" data-qualified-name="Analysing" id="ent0022"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="78.1687" x="2864.0625" y="943.7419"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2864.0625" x2="2942.2312" y1="980.0395" y2="980.0395"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="46.9187" x="2879.6875" y="966.2211">Analysing</text></g><g class="entity" data-qualified-name="Sending" id="ent0025"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="71.522" x="2280.7292" y="1134.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="2280.7292" x2="2352.2512" y1="1170.6645" y2="1170.6645"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="40.272" x="2296.3542" y="1156.8461">Sending</text></g><g class="entity" data-qualified-name="ReportingError" id="ent0027"><rect fill="#2A9FD6" height="57.1309" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="102.4058" x="4318.75" y="1134.3669"/><line style="stroke:#55B2DE;stroke-width:1.0417;" x1="4318.75" x2="4421.1558" y1="1170.6645" y2="1170.6645"/><text fill="#0B1018" font-family="sans-serif" font-size="11.4583" lengthAdjust="spacing" textLength="71.1558" x="4334.375" y="1156.8461">ReportingError</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="51" id="ent0003"><path d="M2960.9375,949.471 L2960.9375,968.221 L2942.4805,972.3877 L2960.9375,976.5544 L2960.9375,995.7113 A4.1667,4.1667 0 0 0 2965.1042,999.8779 L3165.7715,999.8779 A4.1667,4.1667 0 0 0 3169.9382,995.7113 L3169.9382,955.721 L3159.5215,945.3044 L2965.1042,945.3044 A4.1667,4.1667 0 0 0 2960.9375,949.471" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M3159.5215,945.3044 L3159.5215,953.6377 A2.0833,2.0833 0 0 0 3161.6048,955.721 L3169.9382,955.721 L3159.5215,945.3044" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="154.5288" x="2972.3958" y="968.8802">Start = Busy, visible activity.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="176.709" x="2972.3958" y="985.7503">No cancellation or queued Start.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="55" id="ent0006"><path d="M2371.3542,1131.2419 L2371.3542,1158.846 L2352.8117,1163.0127 L2371.3542,1167.1794 L2371.3542,1194.3522 A4.1667,4.1667 0 0 0 2375.5208,1198.5189 L2651.0905,1198.5189 A4.1667,4.1667 0 0 0 2655.2572,1194.3522 L2655.2572,1137.4919 L2644.8405,1127.0752 L2375.5208,1127.0752 A4.1667,4.1667 0 0 0 2371.3542,1131.2419" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M2644.8405,1127.0752 L2644.8405,1135.4085 A2.0833,2.0833 0 0 0 2646.9238,1137.4919 L2655.2572,1137.4919 L2644.8405,1127.0752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.6113" x="2382.8125" y="1150.651">Start cancels the delivery on both send paths;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="217.9077" x="2382.8125" y="1167.5212">the result is lost. Start is never queued.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="218.9209" x="2382.8125" y="1184.3913">Exclusive network lease; audio stopped.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="60" id="ent0009"><path d="M931.7708,907.2835 L931.7708,1037.8743 A4.1667,4.1667 0 0 0 935.9375,1042.041 L1407.6619,1042.041 A4.1667,4.1667 0 0 0 1411.8286,1037.8743 L1411.8286,913.5335 L1401.4119,903.1169 L1381.6474,903.1169 L1305.3652,792.9305 L1373.3141,903.1169 L935.9375,903.1169 A4.1667,4.1667 0 0 0 931.7708,907.2835" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M1401.4119,903.1169 L1401.4119,911.4502 A2.0833,2.0833 0 0 0 1403.4953,913.5335 L1411.8286,913.5335 L1401.4119,903.1169" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="372.937" x="943.2292" y="926.6927">A session context change is latched silently and listening continues;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="445.3003" x="943.2292" y="943.5628">after the manual Stop the device halts, discards the result and requires a restart.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="447.7661" x="943.2292" y="960.4329">The device never applies the rejected identity and invalidates a halted acquisition.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="237.3901" x="943.2292" y="977.3031">Wi-Fi-only faults preserve functioning audio.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="211.6699" x="943.2292" y="994.1732">Audio faults halt listening immediately.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="305.2856" x="943.2292" y="1011.0433">The error indication is latched separately from workflow;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="299.8291" x="943.2292" y="1027.9134">acknowledgement does not change an active workflow.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="69" id="ent0012"><path d="M452.6042,1114.5752 L452.6042,1211.4258 A4.1667,4.1667 0 0 0 456.7708,1215.5924 L832.4626,1215.5924 A4.1667,4.1667 0 0 0 836.6292,1211.4258 L836.6292,1120.8252 L826.2126,1110.4085 L648.9583,1110.4085 L644.7917,1001.2493 L640.625,1110.4085 L456.7708,1110.4085 A4.1667,4.1667 0 0 0 452.6042,1114.5752" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><path d="M826.2126,1110.4085 L826.2126,1118.7419 A2.0833,2.0833 0 0 0 828.2959,1120.8252 L836.6292,1120.8252 L826.2126,1110.4085" fill="#9933CC" style="stroke:#AD5CD6;stroke-width:1.0417;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="113.8306" x="464.0625" y="1133.9844">Non-Wi-Fi faults halt;</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="249.1089" x="464.0625" y="1150.8545">during listening only audio faults halt at once,</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="244.6167" x="464.0625" y="1167.7246">other halting faults wait for the manual Stop.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="351.7334" x="464.0625" y="1184.5947">The device mutes, invalidates incomplete work and blocks Start.</text><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="309.5215" x="464.0625" y="1201.4648">Restart-required faults cannot be cleared by short press.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#A9B8CA" points="452.0833,239.1208,456.25,229.7458,452.0833,233.9125,447.9167,229.7458,452.0833,239.1208" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M452.0833,161.1877 C452.0833,179.2143 452.0833,208.0175 452.0833,232.8708" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#A9B8CA" points="2321.778,391.512,2312.6948,386.7425,2316.5808,391.1721,2312.1511,395.0581,2321.778,391.512" style="stroke:#A9B8CA;stroke-width:1.0417;"/><path d="M479.2477,271.0388 C693.717,285.0618 2104.9486,377.3347 2315.5413,391.1042" fill="none" style="stroke:#A9B8CA;stroke-width:3.125;"/><text fill="#E6EDF7" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="224.4263" x="1632.2917" y="336.0677">software-observable startup checks pass</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#A9B8CA" points="613.4008,959.0051,606.4679,951.4429,608.6253,956.9263,603.1419,959.0837,613.4008,959.0051" style="