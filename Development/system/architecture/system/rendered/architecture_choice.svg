ly="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="136.1938" x="32.2917" y="253.7638">Superloop (not selected)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="333.02" x="32.2917" y="269.4865">&#8226; S04 project assessment: unsuitable for this audio workflow</text></g><!--entity auto--><g class="entity" data-qualified-name="auto" data-source-line="22" id="ent0006"><rect fill="#492A34" height="62.6953" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="323.291" x="400" y="225.1628"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="139.6301" x="415.625" y="253.7638">AUTOSAR (not selected)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="292.041" x="415.625" y="269.4865">&#8226; S04 project assessment: setup effort outside scope</text></g><!--entity mpu--><g class="entity" data-qualified-name="mpu" data-source-line="23" id="ent0007"><rect fill="#273241" height="62.6953" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="282.9956" x="741.6667" y="225.1628"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="132.0068" x="757.2917" y="253.7638">Task isolation (optional)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="251.7456" x="757.2917" y="269.4865">&#8226; S04 project option, not an MVP requirement</text></g><!--entity ab--><g class="entity" data-qualified-name="ab" data-source-line="31" id="ent0015"><rect fill="#273241" height="62.6953" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="285.8032" x="418.75" y="325.1628"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="71.5393" x="434.375" y="353.7638">A/B firmware</text><text fill="#FFFFFF" font-family="sans-serif" font-si