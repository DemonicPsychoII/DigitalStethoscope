<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:882px;height:442px;background:#0B1018;" width="882.292px" height="442.708px" viewBox="0 0 882 442" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="882.292" height="442.708" fill="#0B1018" style="stroke:none;"/><g class="title" data-source-line="19"><rect x="360.678" y="20.833" width="158.852" height="36.751" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="366.928" y="46.421" fill="#E6EDF7" font-size="20.833" textLength="146.352" font-weight="700">Architecture</text></g><!--entity layers--><g class="entity" data-qualified-name="layers" id="ent0001" data-source-line="21"><rect x="39.583" y="81.543" width="282.992" height="79.036" fill="#1C4036" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="50" y="103.562" fill="#E6EDF7" font-size="12.5" textLength="41.364">Layers</text><text x="50" y="118.113" fill="#E6EDF7" font-size="12.5" textLength="222.461">• Application orchestrates the work</text><text x="50" y="132.664" fill="#E6EDF7" font-size="12.5" textLength="262.158">• Services: hardware adapters, C libraries</text><text x="50" y="147.215" fill="#E6EDF7" font-size="12.5" textLength="236.719">• Zephyr drivers are the bottom layer</text></g><!--entity rt--><g class="entity" data-qualified-name="rt" id="ent0002" data-source-line="22"><rect x="357.813" y="81.543" width="198.562" height="79.036" fill="#1C4036" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="368.229" y="103.562" fill="#E6EDF7" font-size="12.5" textLength="85.828">RTOS threads</text><text x="368.229" y="118.113" fill="#E6EDF7" font-size="12.5" textLength="158.063">• Workers run separately</text><text x="368.229" y="132.664" fill="#E6EDF7" font-size="12.5" textLength="138.44">• Audio keeps moving</text><text x="368.229" y="147.215" fill="#E6EDF7" font-size="12.5" textLength="177.728">• Messages coordinate work</text></g><!--entity events--><g class="entity" data-qualified-name="events" id="ent0003" data-source-line="23"><rect x="603.125" y="81.543" width="197.921" height="79.036" fill="#1C4036" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="613.542" y="103.562" fill="#E6EDF7" font-size="12.5" textLength="42.322">Events</text><text x="613.542" y="118.113" fill="#E6EDF7" font-size="12.5" textLength="177.087">• Inputs become commands</text><text x="613.542" y="132.664" fill="#E6EDF7" font-size="12.5" textLength="163.208">• Controller owns settings</text><text x="613.542" y="147.215" fill="#E6EDF7" font-size="12.5" textLength="151.886">• Workers return results</text></g><!--entity loop--><g class="entity" data-qualified-name="loop" id="ent0004" data-source-line="24"><rect x="16.667" y="198.21" width="297.976" height="49.935" fill="#492A34" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="220.229" fill="#E6EDF7" font-size="12.5" textLength="131.555">Superloop (not used)</text><text x="27.083" y="234.78" fill="#E6EDF7" font-size="12.5" textLength="277.142">• Unsuitable for concurrent audio streaming</text></g><!--entity auto--><g class="entity" data-qualified-name="auto" id="ent0005" data-source-line="25"><rect x="333.333" y="198.21" width="248.14" height="49.935" fill="#492A34" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="343.75" y="220.229" fill="#E6EDF7" font-size="12.5" textLength="128.577">AUTOSAR (not used)</text><text x="343.75" y="234.78" fill="#E6EDF7" font-size="12.5" textLength="227.307">• Setup effort exceeds device scope</text></g><!--entity mpu--><g class="entity" data-qualified-name="mpu" id="ent0006" data-source-line="26"><rect x="600" y="198.21" width="260.659" height="49.935" fill="#273241" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="610.417" y="220.229" fill="#E6EDF7" font-size="12.5" textLength="150.116">Task isolation (optional)</text><text x="610.417" y="234.78" fill="#E6EDF7" font-size="12.5" textLength="239.825">• Optional memory-domain protection</text></g><!--entity ab--><g class="entity" data-qualified-name="ab" id="ent0014" data-source-line="34"><rect x="401.563" y="285.71" width="111.275" height="49.935" fill="#273241" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="411.979" y="307.729" fill="#E6EDF7" font-size="12.5" textLength="81.213">A/B firmware</text><text x="411.979" y="322.28" fill="#E6EDF7" font-size="12.5" textLength="90.442">• Not included</text></g><g class="legend" data-source-line="36"><rect x="305.018" y="356.543" width="270.172" height="63.428" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="311.268" y="376.33" fill="#E6EDF7" font-size="14.583" textLength="257.672">Green = used architecture pattern.</text><text x="311.268" y="393.305" fill="#E6EDF7" font-size="14.583" textLength="201.938">Red = alternative not used.</text><text x="311.268" y="410.281" fill="#E6EDF7" font-size="14.583" textLength="210.718">Grey = optional or excluded.</text></g><?plantuml-src nLJRRXD137tVhp3DIv5eQPge5zHMIYj0ID1AJIiaBW_U7ISPPNPcv9bDY10ItyAdyILuTZTfqkITfyskxNFiS-oyY1Cg2Of5xdYSlV2CunB1uC9L4K994IrcOQgjHyOImWILcsixXX6QG6kH78lfc5rbrOqpZg5pb7UFkcTh6Of6M9dupjdOfj09gT7fMig0sStR89xdPyKwT-5AxopP23ypkDwakxXmFcfdqLnTGUVuj7VSxqgIOqMy8-6aUzexmmnMlMo6XRYl-jclDNBag4TO_1VkrU33k304J8MuCZQqMzjR53-7QCEGM8-ogAFK3BYOw2Y55LCMdOVe87SnEYdL2L3uioU1zpxYWZXyitz__u61zqONc5B02Gw5o1WfWAmEp1rFcpIXc-c2mXkO8AivCW4gz55mNi4D69qpigOMz0lvoO91iPv90gJi1DVsP1Bz7c1eVWNeT8l-KUzalSNxXxkXr32XQZ4_IoyfcIiBWP8maSoY7Q9Isi6Ko0SetKmskFd-YKB0iGnJE35CMocfPwh9EUuYVZkJHqlvmVeg1iX9ufICAj4ksxaHCzWPGmnkReEq5AFmFc-Mn1ChZo3-XPgMQe9TrCFA4nid_krR5w4Af5usS8ysL3fYBbwFv7eAPukAEHLXFRbuHbWAVQDgWkZqpu-nrr_77poAg8FxBVIXDEc1HW8TWNuKH2h8pYM