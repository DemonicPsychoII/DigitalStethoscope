<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="530.2083px" preserveAspectRatio="none" style="width:1035px;height:530px;" version="1.1" viewBox="0 0 1035 530" width="1035.4167px" zoomAndPan="magnify"><title>Architecture</title><defs><linearGradient id="g9fuc3tx73zv60" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#555555"/></linearGradient></defs><g><g class="title" data-source-line="16"><rect fill="url(#g9fuc3tx73zv60)" height="49.1211" rx="4.1667" ry="4.1667" style="stroke:#777777;stroke-width:1.0417;" width="145.638" x="444.3685" y="20.8333"/><text fill="#2A9FD6" font-family="sans-serif" font-size="20.8333" font-weight="bold" lengthAdjust="spacing" textLength="122.7214" x="455.8268" y="53.9185">Architecture</text></g><!--entity layers--><g class="entity" data-qualified-name="layers" data-source-line="18" id="ent0002"><rect fill="#1C4036" height="94.1406" rx="4.1667" ry="4.1667" style="stroke:#55B2DE;stroke-width:1.0417;" width="262.1155" x="126.0417" y="93.9128"/><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="89.624" x="141.6667" y="122.5138">Layers (chosen)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="192.6697" x="141.6667" y="138.2365">&#8226; Application orchestrates the work</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="230.8655" x="141.6667" y="153.9591">&#8226; Services: hardware adapters, C libraries</text><text fill="#FFFFFF" font-family="sans-serif" font-size="12.5" lengthAdjust="spacing" textLength="203.0762" x="141.6667" y="169.6818">&#8226; Zephyr drivers are the bottom layer</text></g><!--entity rt--><g class="entity" data-qualified-name="rt" data-source-line="19" id="ent0003"><rect fill="#1C4036" heigh