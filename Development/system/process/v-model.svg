<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Digital stethoscope development V-model</title>
  <desc id="description">Requirements and design become implementation on the left. Unit and component tests, integration, system verification and manual acceptance build evidence on the right. Dashed lines connect each test level with its design basis.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#94b5df"/></marker>
  </defs>
  <rect width="960" height="540" rx="12" fill="#101824"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="35" fill="#9ac4fb" font-size="17">Define and implement</text>
    <text x="740" y="35" fill="#8fe0c2" font-size="17">Verify and accept</text>
    <path d="M160 114 480 448 800 114" fill="none" stroke="#94b5df" stroke-width="3" marker-end="url(#arrow)"/>
    <g stroke="#50647d" stroke-dasharray="6 5">
      <path d="M305 88H655"/><path d="M345 178H615"/><path d="M385 268H575"/><path d="M425 358H535"/>
    </g>
    <g fill="#1b304b" stroke="#679bdc">
      <rect x="15" y="58" width="290" height="60" rx="8"/>
      <rect x="55" y="148" width="290" height="60" rx="8"/>
      <rect x="95" y="238" width="290" height="60" rx="8"/>
      <rect x="135" y="328" width="290" height="60" rx="8"/>
    </g>
    <g fill="#183b34" stroke="#62c4a3">
      <rect x="655" y="58" width="290" height="60" rx="8"/>
      <rect x="615" y="148" width="290" height="60" rx="8"/>
      <rect x="575" y="238" width="290" height="60" rx="8"/>
      <rect x="535" y="328" width="290" height="60" rx="8"/>
    </g>
    <rect x="310" y="428" width="340" height="64" rx="8" fill="#372a4c" stroke="#b697da"/>
    <g fill="#edf4ff" font-size="18" font-weight="bold">
      <text x="160" y="82">User needs and scope</text><text x="200" y="172">System requirements</text>
      <text x="240" y="262">Architecture</text><text x="280" y="352">Detailed design</text>
      <text x="800" y="82">Final system acceptance</text><text x="760" y="172">System verification</text>
      <text x="720" y="262">Integration tests</text><text x="680" y="352">Unit / component tests</text>
      <text x="480" y="453">Implementation</text>
    </g>
    <g fill="#c2d1e4" font-size="14">
      <text x="160" y="103">Purpose, operator and system boundary</text><text x="200" y="193">Required behavior and pass criteria</text>
      <text x="240" y="283">System and component responsibilities</text><text x="280" y="373">Interfaces, states and failure behavior</text>
      <text x="800" y="103">Manual runs and human sign-off</text><text x="760" y="193">Complete device against requirements</text>
      <text x="720" y="283">Connected production components</text><text x="680" y="373">Includes deterministic L2 scenarios</text>
      <text x="480" y="477">Agreed interfaces → L2 logic → L1 services</text>
      <text x="480" y="523">Dashed lines connect verification with its test basis. Findings can return work to an earlier step.</text>
    </g>
  </g>
</svg>
