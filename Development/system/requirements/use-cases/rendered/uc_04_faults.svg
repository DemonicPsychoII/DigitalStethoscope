<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="569px" preserveAspectRatio="none" style="width:950px;height:569px;background:#FFFFFF;" version="1.1" viewBox="0 0 950 569" width="950px" zoomAndPan="magnify"><title>F4 Handle faults (REQ-13, REQ-14)</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="227.7598" x="359.6885" y="34.7383">F4 Handle faults (REQ-13, REQ-14)</text></g><ellipse cx="480.0684" cy="59.8945" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="68.5859" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.4219" x="339.3574" y="89.8945"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.2266" x="349.3574" y="112.5273">Detect fault; log cause;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.625" x="349.3574" y="128.7227">Show catalogue context and counted red code,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.4219" x="349.3574" y="144.918">after the manual Stop if it occurred while listening</text><polygon fill="#F1F1F1" points="98.0151,178.4805,173.8013,178.4805,185.8013,190.4805,173.8013,202.4805,98.0151,202.4805,86.0151,190.4805,98.0151,178.4805" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="139.9082" y="214.0605">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="75.7861" x="98.0151" y="194.6377">Wi-Fi-only fault?</text><rect fill="#F1F1F1" height="52.3906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.8164" x="11" y="237.3262"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.8164" x="21" y="259.959">Preserve working audio; permit offline Start;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1523" x="21" y="276.1543">Run selected retry/setup/offline recovery</text><polygon fill="#F1F1F1" points="358.6035,178.4805,415.709,178.4805,427.709,190.4805,415.709,202.4805,358.6035,202.4805,346.6035,190.4805,358.6035,178.4805" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="391.1563" y="214.0605">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="57.1055" x="358.6035" y="194.6377">Audio fault?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="11.8594" x="427.709" y="187.2148">no</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212.6797" x="280.8164" y="237.3262"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.6797" x="290.8164" y="259.959">Halt at once; mute; block every input</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.0742" x="305.6191" y="308.5215"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.0742" x="315.6191" y="331.1543">Restart; run startup checks</text><rect fill="#F1F1F1" height="52.3906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.2383" x="579.8242" y="218.1919"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.2383" x="589.8242" y="240.8247">While listening: continue until the manual Stop,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.6055" x="589.8242" y="257.02">then discard the result</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.9141" x="566.9863" y="305.5825"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.9141" x="576.9863" y="328.2153">Halt active workflow; mute/cancel audio; block Start</text><polygon fill="#F1F1F1" points="648.271,364.7168,779.6157,364.7168,791.6157,376.7168,779.6157,388.7168,648.271,388.7168,636.271,376.7168,648.271,364.7168" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.3447" x="648.271" y="380.874">Catalogue requires restart?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="620.0073" y="373.4512">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="11.8594" x="791.6157" y="373.4512">no</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.0742" x="523.4961" y="398.7168"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.0742" x="533.4961" y="421.3496">Restart; run startup checks</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.5664" x="706.5703" y="398.7168"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.5664" x="716.5703" y="421.3496">Short press acknowledges; return to Idle</text><polygon fill="#F1F1F1" points="713.9434,440.9121,725.9434,452.9121,713.9434,464.9121,701.9434,452.9121,713.9434,440.9121" style="stroke:#181818;stroke-width:0.5;"/><path d="M15.2676,494.9121 L15.2676,557.5469 L449.0684,557.5469 L449.0684,504.9121 L439.0684,494.9121 