<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="608px" preserveAspectRatio="none" style="width:1039px;height:608px;background:#FFFFFF;" version="1.1" viewBox="0 0 1039 608" width="1039px" zoomAndPan="magnify"><title>F4 Handle faults (REQ-13, REQ-14)</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="227.7598" x="404.585" y="34.7383">F4 Handle faults (REQ-13, REQ-14)</text></g><ellipse cx="533.9746" cy="59.8945" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="138.6289" x="464.6602" y="89.8945"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.6289" x="474.6602" y="112.5273">Detect fault; log cause</text><polygon fill="#F1F1F1" points="105.9194,146.0898,181.7056,146.0898,193.7056,158.0898,181.7056,170.0898,105.9194,170.0898,93.9194,158.0898,105.9194,146.0898" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="147.8125" y="181.6699">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="75.7861" x="105.9194" y="162.2471">Wi-Fi-only fault?</text><rect fill="#F1F1F1" height="52.3906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.8164" x="18.9043" y="204.9355"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.8164" x="28.9043" y="227.5684">Preserve working audio; permit offline Start;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1523" x="28.9043" y="243.7637">Run selected retry/setup/offline recovery</text><rect fill="#F1F1F1" height="52.3906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="265.625" x="11" y="292.3262"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.625" x="21" y="314.959">Show catalogue context and counted red code;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.8555" x="21" y="331.1543">while listening only after the manual Stop</text><polygon fill="#F1F1F1" points="420.4141,146.0898,477.5195,146.0898,489.5195,158.0898,477.5195,170.0898,420.4141,170.0898,408.4141,158.0898,420.4141,146.0898" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="452.9668" y="181.6699">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="57.1055" x="420.4141" y="162.2471">Audio fault?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="11.8594" x="489.5195" y="154.8242">no</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212.6797" x="342.627" y="204.9355"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.6797" x="352.627" y="227.5684">Halt at once; mute; block every input</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="304.6836" x="296.625" y="276.1309"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.6836" x="306.625" y="298.7637">Show catalogue context and counted red code at once</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.0742" x="367.4297" y="347.3262"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.0742" x="377.4297" y="369.959">Restart; run startup checks</text><rect fill="#F1F1F1" height="52.3906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.2383" x="669.6172" y="185.8013"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.2383" x="679.6172" y="208.4341">While listening: continue until the manual Stop,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.6055" x="679.6172" y="224.6294">then discard the result</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.0273" x="672.7227" y="273.1919"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.0273" x="682.7227" y="295.8247">Show catalogue context and counted red code</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.9141" x="656.7793" y="344.3872"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.9141" x="666.7793" y="367.02">Halt active workflow; mute/cancel audio; block Start</text><polygon fill="#F1F1F1" points="738.064,403.5215,869.4087,403.5215,881.4087,415.5215,869.4087,427.5215,738.064,427.5215,726.064,415.5215,738.064,403.5215" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.3447" x="738.064" y="419.6787">Catalogue requires restart?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.2637" x="709.8003" y="412.2559">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="11.8594" x="881.4087" y="412.2559">no</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.0742" x="613.2891" y="437.5215"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.0742" x="623.2891" y="460.1543">Restart; run startup checks</text><rect fill="#F1F1F1" height="36.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.5664" x="796.3633" y="437.5215"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.5664" x="806.3633" y="460.1543">Short press acknowledges; return to Idle</text><polygon fill="#F1F1F1" points="803.7363,479.7168,815.7363,491.7168,803.7363,503.7168,791.7363,491.7168,803.7363,479.7168" style="stroke:#181818;stroke-width:0.5;"/><path d="M69.1738,533.7168 L69.1738,596.3516 L502.9746,596.3516 L502.9746,543.7168 L492.9746,533.7168 L69.1738,533.7168" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M492.9746,533.7168 L492.9746,543.7168 L502.9746,543.7168 L492.9746,533.7168" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.626" x="75.1738" y="552.4023">Acknowledgement never starts listening or manually retries setup.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.8008" x="75.1738" y="569.9473">Wi-Fi setup retry: 2 s hold in Idle; automatic recovery remains automatic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.8184" x="75.1738" y="587.4922">Wi-Fi save failure retains connection with unsaved credentials.</text><ellipse cx="533.9746" cy="565.0342" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="533.9746" cy="565.0342" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="533.9746" x2="533.9746" y1="69.8945" y2="89.8945"/><polygon fill="#181818" points="529.9746,79.8945,533.9746,89.