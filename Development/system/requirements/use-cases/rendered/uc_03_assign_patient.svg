<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="572px" preserveAspectRatio="none" style="width:628px;height:572px;background:#FFFFFF;" version="1.1" viewBox="0 0 628 572" width="628px" zoomAndPan="magnify"><title>F3 Assign a patient through the hotspot (REQ-11, REQ-12)</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="460.5713" x="82.3472" y="32.9951">F3 Assign a patient through the hotspot (REQ-11, REQ-12)</text></g><ellipse cx="407.6062" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="361.0918" x="227.0603" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="341.0918" x="237.0603" y="108.4355">Operator long-presses the button (at least 2 s) while idle</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285.2129" x="264.9998" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.2129" x="274.9998" y="162.4043">Device opens a password-protected hotspot</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="337.1211" x="239.0457" y="195.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="317.1211" x="249.0457" y="216.373">Operator connects with a phone and opens the page</text><polygon fill="#F1F1F1" points="322.2542,249.2031,492.9583,249.2031,504.9583,261.2031,492.9583,273.2031,322.2542,273.2031,310.2542,261.2031,322.2542,249.2031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="170.7041" x="322.2542" y="265.0112">Patient chosen and confirmed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="291.2458" y="258.6089">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="96.7441" x="504.9583" y="258.6089">cancel or timeout</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="287.4336" x="96.3774" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.4336" x="106.3774" y="304.3418">Device stores the patient on the FHIR server</text><polygon fill="#F1F1F1" points="151.8499,337.1719,328.3386,337.1719,340.3386,349.1719,328.3386,361.1719,151.8499,361.1719,139.8499,349.1719,151.8499,337.1719" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.4888" x="151.8499" y="352.98">Stored and read back correctly?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="120.8416" y="346.5776">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="340.3386" y="346.5776">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.2031" x="11" y="371.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.2031" x="21" y="392.3105">Later results go to this patient</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.7676" x="233.2031" y="371.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.7676" x="243.2031" y="392.3105">Device stays unassigned and shows error</text><polygon fill="#F1F1F1" points="240.0942,411.1406,252.0942,423.1406,240.0942,435.1406,228.0942,423.1406,240.0942,411.1406" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.2949" x="532.9707" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.2949" x="542.9707" y="304.3418">No change</text><polygon fill="#F1F1F1" points="407.6062,441.1406,419.6062,453.1406,407.6062,465.1406,395.6062,453.1406,407.6062,441.1406" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278.873" x="268.1697" y="485.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.873" x="278.1697" y="506.2793">Device closes the hotspot and rejoins Wi-Fi</text><ellipse cx="407.6062" cy="550.1094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="407.6062" cy="550.1094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="407.6062" x2="407.6062" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="403.6062,77.2969,407.6062,87.2969,411.6062,77.2969,407.6062,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="407.6062" x2="407.6062" y1="121.2656" y2="141.2656"/><polygon fill="#181818" points="403.6062,131.2656,407.6062,141.2656,411.6062,131.2656,407.6062,135.2656" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="407.6062" x2="407.6062" y1="175.2344" y2="195.2344"/><polygon fill="#181818" points="403.6062,185.2344,407.6062,195.2344,411.6062,185.2344,407.6062,189.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="139.8499" x2="112.1016" y1="349.1719" y