" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.9575" x="165.5872" y="522.4971">Device registered before?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="141.3518" y="515.5791">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="303.5447" y="515.5791">yes</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.7285" x="11" y="539.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.7285" x="21" y="562.4531">Device registers on the FHIR server</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.3945" x="21" y="577.5469">and saves its device-id</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.0781" x="241.7285" y="539.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.0781" x="251.7285" y="562.4531">Device reuses its saved device-id</text><polygon fill="#F1F1F1" points="228.5659,596.1836,240.5659,608.1836,228.5659,620.1836,216.5659,608.1836,228.5659,596.1836" style="stroke:#181818;stroke-width:0.5;"/><path d="M718.5352,505.9961 L718.5352,523.3477 L698.5352,527.3477 L718.5352,531.3477 L718.5352,548.6992 A0,0 0 0 0 718.5352,548.6992 L912.9531,548.6992 A0,0 0 0 0 912.9531,548.6992 L912.9531,515.9961 L902.9531,505.9961 L718.5352,505.9961 A0,0 0 0 0 718.5352,505.9961" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M902.9531,505.9961 L902.9531,515.9961 L912.9531,515.9961 L902.9531,505.9961" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.41