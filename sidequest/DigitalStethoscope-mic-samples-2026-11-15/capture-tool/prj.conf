CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
# Two 15 s clips of 720 kB each; the default heap of 1 MB holds only one.
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152

CONFIG_GPIO=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_SERIAL=y
CONFIG_CRC=y

# The UART carries binary audio frames; log lines would corrupt them.
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
# main busy-waits on the UART; the receive thread (priority 2) must preempt it.
CONFIG_MAIN_THREAD_PRIORITY=7
