name: Mandatory quality gates

on:
  pull_request:
    branches: [integration]
    # `labeled` exists for the `firmware` label; jobs skip every other label below.
    types: [opened, synchronize, reopened, labeled]
  # Post-merge: re-run the gates on the merged result. A red run here makes
  # post-merge-revert.yml open a revert PR for the merge.
  push:
    branches: [integration]
  schedule:
    # Daily integration firmware for Personal Cloud, off the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # An unrelated label event gets its own group so it cannot cancel a real run.
  group: >-
    quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number
    || format('{0}-{1}', github.event_name, github.ref) }}${{ github.event.action == 'labeled'
    && github.event.label.name != 'firmware' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: Development/system/coding/bringup-zephyr
  BOARD: esp32s3_devkitc/esp32s3/procpu

jobs:
  static:
    # A skipped check under the required name would replace this commit's real result,
    # so ignored label events report under a different name.
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'firmware' && 'Quality / Static Checks (label ignored)' || 'Quality / Static Checks' }}
    if: github.event.action != 'labeled' || github.event.label.name == 'firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the daily skip: reads earlier runs of this workflow.
      actions: read
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
      # Same-repository builds for Personal Cloud: labelled PRs, the daily schedule (unless
      # integration is unchanged; the firmware job then never queues a homelab VM), dispatch.
      # Post-merge pushes verify only; the daily/dispatch builds publish integration firmware.
      publish: ${{ (github.event_name != 'pull_request' && github.event_name != 'push' && steps.daily.outputs.build != 'false') || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'firmware')) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip an unchanged daily firmware build
        id: daily
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Development/system/testing/ci/daily_build.py
      - name: Detect firmware changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 Development/system/testing/ci/firmware_changes.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            Development/system/testing/ci/requirements-ci.txt
            Development/system/coding/bringup-zephyr/tools/requirements.txt
      - run: python -m pip install --require-hashes -r Development/system/testing/ci/requirements-ci.txt
      - name: Run static repository checks
        run: python Development/system/testing/ci/run_ci.py static
      - name: Install host evaluation dependencies
        run: python -m pip install --require-hashes -r Development/system/coding/bringup-zephyr/tools/requirements.txt
      - name: Test DSP and FHIR readback
        run: python -m pytest -q Development/system/coding/bringup-zephyr/tests/host
      - name: Run required QC evaluation
        run: python Development/system/testing/ci/run_ci.py qc
      - name: Test the agent merge gate
        run: python -m unittest discover -s .github/agent-gate -v
  firmware:
    name: Zephyr / Firmware Build
    needs: static
    if: needs.static.outputs.firmware == 'true' || needs.static.outputs.publish == 'true'
    # Forks always use GitHub; each trusted run/attempt gets a separate homelab label.
    # The repository variable retains the explicit hosted maintenance override.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || vars.ZEPHYR_RUNNER_LABELS || format('["homelab-zephyr-{0}-{1}"]', github.run_id, github.run_attempt)) }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      FIRMWARE_PUBLISH: ${{ needs.static.outputs.publish }}
      # Build identity for the boot banner and manifest (run_ci.py / firmware_release.py).
      # PRs name their head commit; the checkout is GitHub's merge of it into the base.
      STETHO_BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name == 'integration' && 'integration' || format('branch/{0}', github.ref_name) }}
      STETHO_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Load toolchain pins
        # toolchain.json is the one source of the pins for setup, CI and the benchmark.
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json
          pins = json.load(open("Development/system/testing/ci/toolchain.json"))
          print(f"ZEPHYR_REVISION={pins['zephyr_revision']}")
          print(f"ZEPHYR_SDK_VERSION={pins['sdk_version']}")
          print(f"WEST_VERSION={pins['west_version']}")
          PY
      - name: Reuse the guest's pinned Zephyr toolchain
        run: |
          # Each homelab job gets its own disposable VM; this workspace is never shared
          # with another job. Hosted fallback runners simply provision from scratch.
          cache=/opt/zephyr-workspace
          if [[ -d "$cache/zephyr-sdk-$ZEPHYR_SDK_VERSION" ]] \
            && [[ "$(git -C "$cache/zephyr" rev-parse HEAD)" == "$ZEPHYR_REVISION" ]] \
            && [[ "$("$cache/.venv/bin/west" --version)" == "West version: v$WEST_VERSION" ]]; then
            ln -s "$cache" "$GITHUB_WORKSPACE/.ci-workspace"
            echo 'Reusing the prepared guest toolchain for these exact pins.'
          else
            echo 'No matching prepared guest toolchain; provisioning from scratch.'
          fi
      - name: Provision pinned Zephyr workspace
        run: bash Development/system/testing/ci/setup_zephyr.sh
      - name: Pristine firmware build
        run: .ci-workspace/.venv/bin/python Development/system/testing/ci/run_ci.py build
      - name: Test audio recovery and application logic
        run: |
          export ZEPHYR_BASE="$GITHUB_WORKSPACE/.ci-workspace/zephyr"
          export PATH="$GITHUB_WORKSPACE/.ci-workspace/.venv/bin:$PATH"
          west build --pristine=always -b native_sim/native/64 "$APP_DIR/tests/logic" -d build-logic
          build-logic/zephyr/zephyr.exe
      # Last, so only fully tested builds are offered. The guest never holds a cloud
      # credential: the homelab's firmware sync downloads this artifact instead.
      - name: Upload firmware for Personal Cloud
        if: env.FIRMWARE_PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-build-${{ github.run_attempt }}
          path: artifacts/firmware-release/
          retention-days: 3
          if-no-files-found: error
