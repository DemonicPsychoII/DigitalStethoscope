name: Mandatory quality gates

on:
  pull_request:
    branches: [integration]

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZEPHYR_REVISION: 357467a011cd2557a1a3f0b4be83d817c4addc9b
  ZEPHYR_SDK_VERSION: 1.0.1
  WEST_VERSION: 1.5.0
  APP_DIR: software/evaluation/firmware
  BOARD: esp32s3_devkitc/esp32s3/procpu

jobs:
  static:
    name: Quality / Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect firmware changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/firmware_changes.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            tools/ci/requirements-ci.txt
            software/evaluation/firmware/tools/requirements.txt
      - run: python -m pip install --require-hashes -r tools/ci/requirements-ci.txt
      - name: Run static repository checks
        run: python tools/ci/run_ci.py static
      - name: Install host evaluation dependencies
        run: python -m pip install --require-hashes -r software/evaluation/firmware/tools/requirements.txt
      - name: Test repository layout contracts
        run: python -m pytest -q tools/ci/tests/test_repository_layout.py
      - name: Test DSP and FHIR readback
        run: python -m pytest -q software/evaluation/firmware/tests/host
      - name: Run required QC evaluation
        run: python tools/ci/run_ci.py qc
  firmware:
    name: Zephyr / Firmware Build
    needs: static
    if: needs.static.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision pinned Zephyr workspace
        run: bash tools/toolchain/setup_zephyr.sh
      - name: Pristine firmware build
        run: .ci-workspace/.venv/bin/python tools/ci/run_ci.py build
      - name: Test audio recovery and application logic
        run: |
          export ZEPHYR_BASE="$GITHUB_WORKSPACE/.ci-workspace/zephyr"
          export PATH="$GITHUB_WORKSPACE/.ci-workspace/.venv/bin:$PATH"
          west build --pristine=always -b native_sim/native/64 "$APP_DIR/tests/logic" -d build-logic
          build-logic/zephyr/zephyr.exe
