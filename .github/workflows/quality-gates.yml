name: Mandatory quality gates

on:
  pull_request:
    branches: [integration, test/v-model-from-start, 'replay/**']
    # `labeled` exists for the `firmware` label; jobs skip every other label below.
    types: [opened, synchronize, reopened, labeled]
  # Post-merge: re-run the gates on the merged result. A red run here makes
  # post-merge-revert.yml open a revert PR for the merge.
  push:
    branches: [integration, test/v-model-from-start]
  schedule:
    # Daily integration firmware for Personal Cloud, off the hour.
    - cron: '17 3 * * *'
    # Weekly pristine verification even when integration is unchanged.
    - cron: '47 4 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Run every verification suite with pristine builds
        type: boolean
        default: true

concurrency:
  # An unrelated label event gets its own group so it cannot cancel a real run.
  group: >-
    quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number
    || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}${{ github.event.action == 'labeled'
    && github.event.label.name != 'firmware' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BOARD: esp32s3_devkitc/esp32s3/procpu

jobs:
  plan:
    name: CI / Select Checks
    if: github.event.action != 'labeled' || github.event.label.name == 'firmware'
    # Lightweight routing only; static suites and builds stay in disposable VMs.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      application: ${{ steps.changes.outputs.application }}
      docs: ${{ steps.changes.outputs.docs }}
      reuse: ${{ steps.reuse.outputs.run }}
      application_host: ${{ steps.changes.outputs.application_host }}
      tooling: ${{ steps.changes.outputs.tooling }}
      gate: ${{ steps.changes.outputs.gate }}
      daily: ${{ steps.daily.outputs.build || 'true' }}
      publish: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'integration' && steps.daily.outputs.build != 'false') || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'firmware')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip an unchanged daily firmware build
        id: daily
        if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Development/system/testing/ci/daily_build.py
      - name: Find an exact verified integration artifact
        id: reuse
        if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && steps.daily.outputs.build != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Development/system/testing/ci/release_reuse.py find
      - name: Select checks from changed inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FULL: ${{ (github.event_name == 'schedule' && github.event.schedule == '47 4 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
          # Integration pushes verify a complete bundle for later exact-commit reuse.
          CI_RETAIN: ${{ github.event_name == 'push' && github.ref_name == 'integration' }}
          CI_PUBLISH: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'integration' && steps.daily.outputs.build != 'false') || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'firmware')) }}
          CI_DAILY: ${{ github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' }}
          REUSE: ${{ steps.reuse.outputs.run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            BASE_SHA="$(git merge-base origin/integration "$HEAD_SHA")"
            export BASE_SHA
          fi
          python3 Development/system/testing/ci/firmware_changes.py
  static:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'firmware' && 'Quality / Static Checks (label ignored)' || 'Quality / Static Checks' }}
    needs: plan
    if: always() && !cancelled() && needs.plan.result != 'skipped' && (needs.plan.result != 'success' || needs.plan.outputs.daily != 'false')
    runs-on: homelab-stethoscope-static-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    env:
      APPLICATION: ${{ needs.plan.outputs.application }}
      APPLICATION_HOST: ${{ needs.plan.outputs.application_host }}
      TOOLING: ${{ needs.plan.outputs.tooling }}
      GATE: ${{ needs.plan.outputs.gate }}
      DOCS: ${{ needs.plan.outputs.docs }}
      DAILY: ${{ needs.plan.outputs.daily }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Require successful check selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the prepared Python environment
        id: prepared
        run: |
          if python3 Development/system/testing/ci/prepared_env.py check static /opt/stethoscope-ci; then
            echo /opt/stethoscope-ci/.venv/bin >> "$GITHUB_PATH"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Prepared environment missing or changed; installing the checked-out pins.'
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.prepared.outputs.ready != 'true'
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            Development/system/testing/ci/requirements-ci.txt
            Development/system/testing/ci/requirements-host.txt
      - run: python -m pip install --require-hashes -r Development/system/testing/ci/requirements-ci.txt
        if: steps.prepared.outputs.ready != 'true'
      - name: Install pinned workflow validators
        run: python Development/system/testing/ci/validation_tools.py
      - name: Record verification identity
        run: python Development/system/testing/ci/ci_evidence.py
      - name: Validate maintained documentation
        if: needs.plan.outputs.docs == 'true'
        run: python Development/system/testing/ci/validate_docs.py
      - name: Validate manual execution records
        run: python Development/system/testing/ci/manual_test_records.py
      - name: Run static repository checks
        run: python Development/system/testing/ci/run_ci.py static
      - name: Test build tooling
        if: needs.plan.outputs.tooling == 'true'
        run: python -m unittest discover -s Development/system/testing/ci -p 'test_*.py'
      - name: Install application host dependencies
        if: needs.plan.outputs.application_host == 'true' && steps.prepared.outputs.ready != 'true'
        run: python -m pip install --require-hashes -r Development/system/testing/ci/requirements-host.txt
      - name: Test application unit, L2 and integration host scenarios
        if: needs.plan.outputs.application_host == 'true'
        env:
          STETHO_SANITIZERS: 'true'
        run: python -m pytest -q -o junit_family=xunit1 --junitxml=artifacts/ci/application-host.xml Development/system/coding/app/tests/host
      - name: Report application scenario results
        if: always() && !cancelled() && needs.plan.outputs.application_host == 'true'
        run: python Development/system/testing/ci/application_host_results.py artifacts/ci/application-host.xml
      - name: Measure production host coverage
        if: needs.plan.outputs.application_host == 'true'
        env:
          STETHO_SANITIZERS: 'false'
          STETHO_COVERAGE_DIRECTORY: ${{ github.workspace }}/artifacts/ci/host-coverage
        run: python -m pytest -q -o junit_family=xunit1 --junitxml=artifacts/ci/application-coverage.xml Development/system/coding/app/tests/host
      - name: Report production line and branch coverage
        if: always() && !cancelled() && needs.plan.outputs.application_host == 'true'
        run: python Development/system/testing/ci/host_coverage.py artifacts/ci/host-coverage
      - name: Test the agent merge gate
        if: needs.plan.outputs.gate == 'true'
        run: python -m unittest discover -s .github/agent-gate -v
      - name: Retain static verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-evidence-${{ github.run_attempt }}
          path: |
            artifacts/ci/
          retention-days: 14
          if-no-files-found: warn
  firmware:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'firmware' && 'Zephyr / Firmware Build (label ignored)' || 'Zephyr / Firmware Build' }}
    needs: [plan, static]
    if: always() && !cancelled() && needs.plan.result != 'skipped'
    runs-on: ${{ needs.static.result == 'success' && (needs.plan.outputs.daily != 'false' && needs.plan.outputs.application == 'true') && format('homelab-zephyr-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      HEAVY_REQUIRED: ${{ needs.static.result == 'success' && (needs.plan.outputs.daily != 'false' && needs.plan.outputs.application == 'true') }}
      APPLICATION: ${{ needs.plan.outputs.application }}
      APPLICATION_HOST: ${{ needs.plan.outputs.application_host }}
      TOOLING: ${{ needs.plan.outputs.tooling }}
      GATE: ${{ needs.plan.outputs.gate }}
      DOCS: ${{ needs.plan.outputs.docs }}
      DAILY: ${{ needs.plan.outputs.daily }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      REUSE: ${{ needs.plan.outputs.reuse }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CACHE_DISABLED: ${{ (github.event_name == 'schedule' && github.event.schedule == '47 4 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
      STETHO_BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name == 'integration' && 'integration' || format('branch/{0}', github.ref_name) }}
      STETHO_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load toolchain pins
        if: env.HEAVY_REQUIRED == 'true'
        run: |
          python3 - >> "$GITHUB_ENV" <<'PYTHON'
          import json
          pins = json.load(open("Development/system/testing/ci/toolchain.json"))
          print(f"ZEPHYR_REVISION={pins['zephyr_revision']}")
          print(f"ZEPHYR_SDK_VERSION={pins['sdk_version']}")
          print(f"WEST_VERSION={pins['west_version']}")
          PYTHON
      - name: Validate the prepared Zephyr toolchain
        if: env.HEAVY_REQUIRED == 'true'
        id: prepared
        run: |
          if [[ -d /opt/zephyr-workspace ]]; then
            ln -s /opt/zephyr-workspace "$GITHUB_WORKSPACE/.ci-workspace"
          fi
          if python3 Development/system/testing/ci/prepared_env.py check zephyr /opt/zephyr-workspace; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Provision pinned Zephyr workspace
        if: env.HEAVY_REQUIRED == 'true' && (steps.prepared.outputs.ready != 'true')
        run: bash Development/system/testing/ci/setup_zephyr.sh
      - name: Install the pinned compiler cache
        if: env.HEAVY_REQUIRED == 'true'
        run: |
          python3 Development/system/testing/ci/compiler_cache.py
          # ccache treats even an empty CCACHE_DISABLE value as enabled.
          if [[ "$CACHE_DISABLED" == true ]]; then echo 'CCACHE_DISABLE=1' >> "$GITHUB_ENV"; fi
      - name: Restore previously verified compiler outputs
        id: compiler-cache
        if: env.HEAVY_REQUIRED == 'true' && env.CACHE_DISABLED != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Development/system/testing/ci/toolchain.json', 'Development/system/testing/ci/compiler_cache.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('Development/system/testing/ci/toolchain.json', 'Development/system/testing/ci/compiler_cache.json') }}-
      - name: Reset compiler-cache statistics
        if: env.HEAVY_REQUIRED == 'true'
        run: ccache --zero-stats
      - name: Record verification identity
        if: env.HEAVY_REQUIRED == 'true'
        run: .ci-workspace/.venv/bin/python Development/system/testing/ci/ci_evidence.py
      - name: Pristine firmware build
        if: env.HEAVY_REQUIRED == 'true'
        run: .ci-workspace/.venv/bin/python Development/system/testing/ci/run_ci.py build --application
      - name: Retain compiler-cache statistics
        if: env.HEAVY_REQUIRED == 'true' && always()
        run: |
          mkdir -p artifacts/ci
          ccache --show-stats > artifacts/ci/ccache.txt
      - name: Save verified integration compiler outputs
        if: env.HEAVY_REQUIRED == 'true' && success() && github.event_name == 'push' && github.ref_name == 'integration' && env.CACHE_DISABLED != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain application build evidence
        if: env.HEAVY_REQUIRED == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zephyr-evidence-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/ci/
            artifacts/build-times/
            artifacts/firmware/
            artifacts/firmware-release/manifest.json
            build-*/CMakeCache.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Retain verified integration firmware for exact-commit promotion
        if: env.HEAVY_REQUIRED == 'true' && (github.event_name == 'push' && github.ref_name == 'integration' && needs.plan.outputs.application == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-firmware-${{ github.run_attempt }}
          path: artifacts/firmware-release/
          retention-days: 8
          if-no-files-found: error
      - name: Verify source run, identity, complete profiles and checksums
        if: needs.static.result == 'success' && env.HEAVY_REQUIRED != 'true' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.reuse != '' && needs.plan.outputs.daily == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.plan.outputs.reuse }}
        run: python3 Development/system/testing/ci/release_reuse.py download --run "$SOURCE_RUN"
      - name: Upload firmware for Personal Cloud
        if: needs.static.result == 'success' && needs.plan.outputs.publish == 'true' && (env.HEAVY_REQUIRED == 'true' || (needs.plan.outputs.reuse != '' && needs.plan.outputs.daily == 'true'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-build-${{ github.run_attempt }}
          path: artifacts/firmware-release/
          retention-days: 8
          if-no-files-found: error
      - name: Account for every selected verification result
        if: always() && !cancelled()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          HEAVY_RESULT: ${{ env.HEAVY_REQUIRED == 'true' && job.status || 'skipped' }}
        run: python3 Development/system/testing/ci/ci_results.py --plan "$PLAN_RESULT" --static "$STATIC_RESULT" --heavy "$HEAVY_RESULT"
