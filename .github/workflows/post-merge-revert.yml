name: Post-merge revert

# When the quality gates fail on `integration` after a merge, open a `git revert -m 1` PR for that
# merge and notify the owner. The PR is NOT merged here: a flaky failure is closed by re-running the
# failed job; a real one is merged through agent-gate, which verifies the revert is a pure inverse
# of the merge and waives the agent review (CI must still pass on the revert).
#
# Runs from the default branch's copy of this file (workflow_run), checks out only integration —
# trusted, already-merged code — and never executes PR branch code.
#
# GITHUB_TOKEN anti-recursion: a branch pushed and a PR opened with GITHUB_TOKEN trigger no
# workflows, so the script dispatches quality-gates.yml on the revert branch (its check runs land on
# the branch head, under the required names) and agent-gate.yml for the PR. Opening the PR needs the
# repository setting "Allow GitHub Actions to create pull requests" (apply-merge-policy.sh sets it).

on:
  workflow_run:
    workflows: ["Mandatory quality gates"]
    types: [completed]
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: post-merge-revert-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  revert:
    name: open-revert-pr
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # push the revert/<sha7> branch
      pull-requests: write  # open the PR, comment on the original
      actions: write        # dispatch quality-gates.yml and agent-gate.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Open the revert PR
        id: revert
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          AGENT_HARNESS: github-actions
          AGENT_MODEL: post-merge-revert
          AGENT_SESSION: run-${{ github.run_id }}-${{ github.run_attempt }}
          REVERT_DISPATCH_WORKFLOWS: quality-gates.yml
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$(git rev-list --parents -n1 "$MERGE_SHA" | wc -w)" -ne 3 ]]; then
            echo "$MERGE_SHA is not a merge commit; nothing to revert automatically."
            exit 0
          fi
          set +e
          out="$(bash .github/agent-gate/revert-last-merge.sh "$MERGE_SHA" \
            --reason "quality gates failed on integration after this merge: $RUN_URL" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "url=$(tail -n1 <<<"$out")" >> "$GITHUB_OUTPUT"
      - name: Notify the owner on the original PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RC: ${{ steps.revert.outputs.rc }}
          URL: ${{ steps.revert.outputs.url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/pulls" --jq '.[0].number // empty' || true)"
          if [[ "$RC" == 0 ]]; then
            msg="@$OWNER quality gates failed on \`integration\` after this merge (${RUN_URL}). Revert PR: ${URL}. If the failure is a flake, re-run the failed job and close the revert."
          else
            msg="@$OWNER quality gates failed on \`integration\` after this merge (${RUN_URL}) and the automatic revert could not be opened (exit ${RC:-?}; a conflicting revert needs a hand revert: \`git revert -m 1 ${MERGE_SHA}\`)."
          fi
          if [[ -n "$pr" ]]; then
            gh pr comment "$pr" --body "$msg"
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/comments" -f body="$msg" >/dev/null
          fi
