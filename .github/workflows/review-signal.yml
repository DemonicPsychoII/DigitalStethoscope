name: Review signal

# An unprivileged review event wakes the trusted default-branch gate via workflow_run.
# No PR code is checked out and no write token is requested, including for fork PRs.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
jobs:
  signal:
    # A submitted comment review with an empty body is how GitHub records a reply in a review
    # thread. A person's reply carries no decision or verdict marker and the gate ignores it when
    # classifying threads; a new thread it opens is still enforced by required conversation
    # resolution. CodeRabbit replies still signal: they can turn a minor finding into a blocking one.
    if: >-
      vars.CI_NATIVE_REVIEW != 'true' && github.event.pull_request.base.ref == 'integration'
      && !(github.event.action == 'submitted' && github.event.review.state == 'commented' && !github.event.review.body
           && github.event.review.user.type != 'Bot')
    name: Review event received
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: 'true'
