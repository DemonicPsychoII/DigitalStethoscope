name: Agent Gate

# Publishes the REQUIRED commit status `agent-gate` on a PR's head SHA: an agent may merge its own
# PR once this is green. Green needs a review for normal changes and explicit owner approval (the
# `approved` label or an owner-approval record) for features and policy changes. The policy itself
# lives in .github/agent-gate/agent_gate.py (unit-tested); this file only decides WHEN to re-evaluate.
#
# Why a commit status and not this job's own check run: `issue_comment`, `workflow_run` and
# `workflow_dispatch` runs execute in the context of the default branch, so their check runs land
# on the default branch's commit, not the PR. Only an explicit status on the PR head SHA can be a
# required check for every trigger. The job is deliberately NOT named `agent-gate`, so its own
# check run can never be mistaken for the verdict. The ruleset pins the status to the GitHub
# Actions app, so a personal token cannot forge it.
#
# Why these triggers:
#   pull_request_target  push / body edit / draft toggle / label change. `_target` runs THIS file
#                        and the gate script from the base branch, so a PR cannot weaken its own
#                        gate. PR code is never checked out or executed (only fetched as git
#                        objects to verify a pure revert), which is what makes `_target` safe.
#   issue_comment        an `agent-review` verdict, an `owner-approval` / `owner-question` /
#                        `owner-answer` record, or `/agent-gate`.
#   workflow_run         CI finished, so "pending: CI running" can become green.
#   workflow_dispatch    manual / automation re-run (`-f pr=<n>` or `-f pr=all`). The GITHUB_TOKEN
#                        anti-recursion rule suppresses every event above when the actor is
#                        GITHUB_TOKEN (e.g. an auto-opened revert PR), but not dispatch.
# Review-thread resolution emits no Actions event: comment `/agent-gate` after resolving. The
# ruleset's "require conversation resolution" enforces it at merge time regardless.
#
# Every run reads LIVE PR state, never the event payload, and judges the PR as it is now.
#
# Two jobs: `resolve` names the PR(s) an event concerns (workflow_run carries only a head SHA), so
# `evaluate` can key its concurrency group on the PR number for EVERY trigger. Evaluations of one
# PR therefore never overlap, and an older run can never publish over a newer one.

on:
  pull_request_target:
    branches: [integration]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Mandatory quality gates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate, or 'all' for every open PR"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: agent-gate-resolve
    # issue_comment fires for every issue and PR comment: only PR comments that can change the
    # verdict are worth a runner. Dispatch only from the default branch, so a branch copy of this
    # workflow cannot be dispatched to publish a verdict.
    if: >-
      (github.event_name == 'pull_request_target')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && (contains(github.event.comment.body, 'agent-review') || contains(github.event.comment.body, 'owner-')
              || contains(github.event.comment.body, '/agent-gate')))
      || (github.event_name == 'workflow_run'
          && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'))
      || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read   # map a workflow_run head SHA to its open PR(s)
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      - name: Check out the gate from the default branch (never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Resolve the PR number(s) for this event
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GATE_PR: ${{ inputs.pr }}
        run: python3 .github/agent-gate/agent_gate.py --resolve

  evaluate:
    name: agent-gate-evaluate
    needs: resolve
    if: needs.resolve.outputs.prs != '[]' && needs.resolve.outputs.prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    # One evaluation per PR at a time, whatever the trigger; a queued newer run supersedes an older
    # queued one, and because every run reads live state, the newest is always the right one to keep.
    concurrency:
      group: agent-gate-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # fetch PR objects for revert verification
      checks: read          # read CI check runs on the head SHA
      statuses: write       # publish the agent-gate status
      pull-requests: write  # read review threads, files and labels; keep one sticky report comment
      issues: read          # label events: who applied the owner-approval label
    steps:
      - name: Check out the gate from the default branch (never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Evaluate and publish the agent-gate status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GATE_PR: ${{ matrix.pr }}
        run: python3 .github/agent-gate/agent_gate.py
